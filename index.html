  {t:"자기주식",s:"취득 시 자본에서 차감(원가법). 처분손익은 자본거래이므로 당기손익 아님 — 자기주식처분이익/손실.",p:"==자기주식 처분손실은 처분이익과 먼저 상계== 후 잔액을 이익잉여금에서 차감. 소각은 자본금 감소."},
  {t:"무상증자·주식배당·주식분할",s:"세 경우 모두 자본 총액 불변. 무상증자·주식배당은 자본금 증가, 주식분할은 자본금 불변.",p:"==주식분할은 액면가 감소·주식수 증가, 자본금 동일==. 주식배당은 이익잉여금→자본금."},
  {t:"이익잉여금 처분",s:"이익준비금은 금전배당액의 1/10 이상을 자본금 1/2에 달할 때까지 적립.",p:"==주식배당은 이익준비금 적립 대상 아님==(금전배당만). 처분 확정은 주총 결의일 회계연도."}
 ]},
 {name:"수익인식",cards:[
  {t:"수익인식 5단계",s:"계약 식별→수행의무 식별→거래가격 산정→수행의무에 배분→수행의무 이행 시 수익 인식.",p:"==거래가격 배분은 개별판매가격 비율==. 할인액은 관측 증거 없으면 모든 수행의무에 비례 배분."},
  {t:"변동대가",s:"기댓값 또는 가능성 높은 금액으로 추정하되, 유의적 환원 가능성이 매우 낮은 범위까지만 포함(제약).",p:"==반품권 있는 판매==: 예상 반품분은 수익 제외하고 환불부채·반환재고자산 인식."},
  {t:"본인 vs 대리인",s:"고객에게 이전 전 재화·용역을 통제하면 본인(총액 수익), 아니면 대리인(수수료 순액).",p:"==재고위험·가격결정권·주된 책임==이 판단 지표. 위탁판매 수탁자는 대리인."},
  {t:"보증의 구분",s:"확신유형 보증은 충당부채, 용역유형 보증(별도 구매 가능·추가 서비스)은 별도 수행의무.",p:"==고객이 보증을 별도 구매할 수 있으면 용역유형==으로 거래가격 배분해 이연."},
  {t:"기간에 걸친 이행",s:"고객이 동시에 효익 소비, 자산 통제, 대체용도 없고 지급청구권 있으면 진행률로 수익 인식.",p:"==진행률 측정 불가 시 발생원가 범위 내 수익== 인식(회수 가능 조건). 라이선스는 접근권(기간) vs 사용권(시점)."}
 ]},
 {name:"리스",cards:[
  {t:"리스이용자 단일모형",s:"모든 리스에 사용권자산과 리스부채 인식(단기·소액자산 예외). 리스부채=리스료 현재가치.",p:"==리스료에는 고정리스료·지수연동 변동리스료·잔존가치보증 예상지급액·행사확실한 매수선택권== 포함. 사용량 변동리스료는 제외."},
  {t:"사용권자산 측정",s:"리스부채+리스개시일 전 지급 리스료+리스개설직접원가+복구원가.",p:"==리스개설직접원가는 사용권자산에 가산==. 감가상각은 리스기간과 내용연수 중 짧은 기간(소유권 이전 시 내용연수)."},
  {t:"리스제공자 분류",s:"위험·보상 대부분 이전 시 금융리스, 아니면 운용리스. 소유권 이전·염가매수선택권·리스기간 대부분·현재가치 대부분 등이 지표.",p:"==판매형리스는 매출·매출원가 인식==. 리스개설직접원가는 판매형리스에서 비용처리(제조자·판매자)."},
  {t:"판매후리스",s:"이전이 판매(기준서 1115호)에 해당하면 보유 권리 부분만큼 차익 인식 제한. 판매 아니면 금융약정.",p:"==판매후리스 차익은 이전된 권리 부분만 인식==. 공정가치 초과 대가는 추가금융."}
 ]},
 {name:"법인세회계·주당이익",cards:[
  {t:"일시적차이",s:"자산·부채 장부금액과 세무기준액의 차이. 가산할 일시적차이→이연법인세부채, 차감할→이연법인세자산.",p:"==이연법인세자산은 미래 과세소득 실현가능성 높을 때만== 인식. 영구적차이는 이연법인세 없음."},
  {t:"적용세율과 표시",s:"차이 소멸 시점의 예상 세율(제정·실질적 제정) 적용. 이연법인세는 항상 비유동, 할인하지 않음.",p:"==자본에 직접 인식된 항목의 법인세는 자본에==, OCI 항목은 OCI에서 차감. 법인세비용=당기법인세±이연법인세 변동."},
  {t:"기본주당이익",s:"(당기순이익−우선주배당)/가중평균유통보통주식수. 누적적 우선주는 배당결의와 무관하게 차감.",p:"==무상증자·주식배당·주식분할은 기초 발행으로 소급== 조정. 자기주식은 취득일부터 차감."},
  {t:"희석주당이익",s:"잠재적보통주 전환 가정. 전환사채는 세후이자 가산·주식수 가산, 옵션은 자기주식법.",p:"==희석효과가 없는(반희석) 잠재적보통주는 제외==. 여러 개일 때 희석효과 큰 순서로 단계별 판단."}
 ]},
 {name:"현금흐름표·회계변경",cards:[
  {t:"활동 구분",s:"영업·투자·재무. 이자수입·배당수입·이자지급은 영업 또는 투자/재무 선택, 배당지급은 영업 또는 재무.",p:"==법인세 납부는 원칙 영업활동==. 현물출자·전환 등 비현금거래는 주석 공시, 표에서 제외."},
  {t:"간접법 조정",s:"당기순이익에서 비현금손익(감가상각·손상·처분손익) 가감, 영업 관련 자산·부채 증감 가감.",p:"==유형자산처분이익은 차감==(투자활동으로 이동), 매출채권 증가는 차감, 매입채무 증가는 가산."},
  {t:"회계정책 변경",s:"소급적용: 비교재무제표 재작성, 기초 이익잉여금 수정. 새 기준서 도입이나 더 신뢰성 있는 정보 제공 시만 허용.",p:"==정책변경과 추정변경 구분 불가 시 추정변경==(전진법). 감가상각방법·내용연수·잔존가치 변경은 추정변경."},
  {t:"오류수정",s:"중요한 전기오류는 소급재작성. 실무적으로 불가능하면 가능한 가장 이른 기간부터.",p:"==재고 기말오류는 자동조정오류==(2기 후 상쇄). 감가상각 누락은 비자동조정 — 기초 이익잉여금 수정."}
 ]},
 {name:"연결·지분법·기타",cards:[
  {t:"사업결합과 영업권",s:"영업권=이전대가−취득 순자산 공정가치(비지배지분 포함 시 조정). 음수이면 염가매수차익(당기이익).",p:"==취득관련원가는 비용==, 지분발행원가는 자본 차감. 비지배지분은 공정가치 또는 순자산 비례 지분 선택."},
  {t:"지분법",s:"유의적 영향력(20% 이상 추정) 시 적용. 취득 후 피투자자 순이익×지분율을 지분법이익, 배당은 투자주식 차감.",p:"==내부거래 미실현이익은 지분율만큼 제거==(상향·하향 모두). 순자산 공정가치 차이는 감가상각 조정."},
  {t:"확정급여제도",s:"확정급여채무 현재가치−사외적립자산 공정가치=순확정급여부채. 재측정요소는 OCI, 재분류 없음.",p:"==근무원가·순이자는 당기손익, 재측정요소(보험수리적손익·자산수익 차이)는 OCI==."},
  {t:"주식기준보상",s:"주식결제형은 부여일 공정가치로 측정해 가득기간에 배분, 후속 재측정 없음. 현금결제형은 매기 재측정.",p:"==비시장조건 미달 시 누적비용 조정==, 시장조건(주가)은 미달해도 비용 인식 유지."}
 ]}
]},
{id:"ca",name:"원가회계",chapters:[
 {name:"원가의 개념과 흐름",cards:[
  {t:"원가의 분류",s:"제조/비제조, 직접/간접, 변동/고정, 통제가능/불능. 매몰원가는 의사결정 무관, 기회원가는 포기한 대안의 최대효익.",p:"==기본원가=DM+DL, 가공원가=DL+OH==. 직접노무비는 두 분류에 모두 포함."},
  {t:"원가흐름 등식",s:"기초+당기투입=기말+대체. 원재료→재공품→제품→매출원가 각 단계에 동일 적용.",p:"==당기제품제조원가=기초재공품+당기총제조원가−기말재공품==. 역산 문제는 T계정을 그려라."},
  {t:"준변동·준고정원가",s:"준변동원가는 고정+변동(전기요금), 준고정(계단)원가는 일정 조업도 구간마다 증가.",p:"고저점법은 ==최고·최저 조업도(원가 아님)==로 변동비율 추정. 계산 함정."}
 ]},
 {name:"개별원가·부문별원가",cards:[
  {t:"제조간접비 예정배부",s:"예정배부율=예산OH/예정조업도. 배부차이=실제OH−예정배부액(과소배부 시 실제가 더 큼).",p:"==과소배부액 조정 시 매출원가 증가==. 비례배분법은 재공품·제품·매출원가 기말잔액(또는 배부액) 비율."},
  {t:"보조부문 원가배분",s:"직접배분법(보조부문 간 무시), 단계배분법(순서 중요), 상호배분법(연립방정식).",p:"==단계배분법은 배분 순서에 따라 결과 달라짐==. 상호배분법이 가장 정확. 이중배분율법은 변동·고정 분리."},
  {t:"정상원가계산",s:"DM·DL 실제, OH는 예정배부. 배부차이는 기말에 조정.",p:"==실제원가계산과의 차이는 OH 배부시점==. 표준원가는 세 요소 모두 표준."}
 ]},
 {name:"종합원가계산",cards:[
  {t:"완성품환산량",s:"물량×완성도. 재료비(투입시점)와 가공비(진행도)의 완성도가 다르므로 별도 계산.",p:"==FIFO는 기초재공품의 당기 완성분만 당기 환산량==에 포함, 평균법은 기초재공품 전부 포함."},
  {t:"평균법 vs 선입선출법",s:"평균법은 기초재공품원가+당기원가를 합쳐 단위원가 계산. FIFO는 당기원가만으로 당기 단위원가.",p:"==FIFO 환산량 = 평균법 환산량 − 기초재공품 환산량==. 기초재공품 없으면 두 방법 동일."},
  {t:"공손",s:"정상공손은 합격품(검사시점 통과 물량)에 배분, 비정상공손은 당기손실.",p:"==정상공손 허용량은 검사시점을 통과한 합격품 기준==. 기말재공품이 검사시점 미통과면 배분 제외."},
  {t:"결합원가 배분",s:"물량기준·분리점 판매가치·순실현가치(NRV)·균등이익률법. 부산물은 원칙 NRV로 결합원가 차감.",p:"==추가가공 의사결정은 결합원가 무관==(매몰원가). 증분수익 vs 추가가공원가만 비교."}
 ]},
 {name:"활동기준원가계산",cards:[
  {t:"ABC의 원가동인",s:"활동별로 원가집합 후 원가동인으로 제품에 배부. 단위·배치·제품·설비수준 활동으로 계층화.",p:"==전통적 배부는 소량·복잡 제품 원가를 과소, 대량 제품을 과대== 계산 — ABC 도입 시 반전."},
  {t:"활동 계층",s:"단위수준(기계시간), 배치수준(작업준비), 제품수준(설계), 설비수준(공장 관리).",p:"==설비수준 원가는 원가동인이 없어 임의배부==. 배치수준은 생산량이 아닌 배치 수에 비례."}
 ]},
 {name:"변동원가계산과 CVP",cards:[
  {t:"전부 vs 변동원가계산",s:"고정제조간접비를 전부원가는 제품원가(재고화), 변동원가는 기간비용 처리.",p:"==이익차이=고정OH배부율×(기말재고−기초재고)==. 생산>판매면 전부원가 이익이 크다."},
  {t:"초변동원가계산",s:"직접재료비만 제품원가, 나머지는 모두 기간비용. 재고 축적 유인 최소화.",p:"==재고 증가 시 이익: 전부 > 변동 > 초변동== 순서."},
  {t:"손익분기점",s:"BEP 수량=고정원가/단위당 공헌이익, BEP 매출액=고정원가/공헌이익률. 목표이익은 분자에 가산.",p:"==세후 목표이익은 세전으로 환산==(÷(1−t)) 후 계산. 법인세는 BEP 자체에는 영향 없음."},
  {t:"안전한계와 영업레버리지",s:"안전한계율=(매출−BEP매출)/매출. 영업레버리지도=공헌이익/영업이익=1/안전한계율.",p:"==고정원가 비중 클수록 DOL 크고 이익변동성 큼==. 매출 x% 증가 시 이익은 DOL×x% 증가."},
  {t:"복수제품 CVP",s:"매출배합이 일정하다고 가정. 가중평균 공헌이익(률)로 BEP 계산 후 배합비율로 배분.",p:"==배합 변동 시 BEP 변함==. 공헌이익률 높은 제품 비중 증가 시 BEP 하락."}
 ]},
 {name:"표준원가계산",cards:[
  {t:"직접재료비 차이",s:"가격차이=(AP−SP)×AQ, 능률(수량)차이=(AQ−SQ)×SP. 가격차이는 구입시점 또는 사용시점 분리 가능.",p:"==구입시점 가격차이 분리 시 AQ는 구입량==, 능률차이는 사용량 기준. 두 AQ가 다른 문제 주의."},
  {t:"변동제조간접비 차이",s:"소비차이=실제OH−AQ×SP, 능률차이=(AQ−SQ)×SP. 노무비 차이와 구조 동일.",p:"==변동OH 능률차이는 배부기준(노동시간)의 능률==에서 발생. 직접노무비 능률차이와 방향 일치."},
  {t:"고정제조간접비 차이",s:"예산차이=실제−예산(고정), 조업도차이=예산−배부액(SQ×SP). 능률차이는 존재하지 않음.",p:"==조업도차이는 기준조업도와 표준허용조업도 차이==. 실제조업도 기준 아님 — 3분법·4분법 구분 문제."},
  {t:"원가차이 조정",s:"매출원가조정법 또는 비례배분법. 비정상 차이가 크면 비례배분.",p:"==재료비 가격차이(구입시점)는 원재료 재고에도 배분==. 다른 차이는 재공품·제품·매출원가."}
 ]},
 {name:"관련원가와 의사결정",cards:[
  {t:"특별주문 수락",s:"유휴생산능력 있으면 증분수익>증분원가 시 수락. 없으면 기존판매 포기분 공헌이익(기회원가) 가산.",p:"==고정원가는 변동 없으면 무관==. 정규시장 가격 영향, 추가 고정비, 기회원가 유무를 확인."},
  {t:"자가제조 vs 외부구입",s:"자가제조 회피가능원가(변동비+회피가능고정비)+유휴설비 기회원가와 구입원가 비교.",p:"==회피불능 고정원가는 무관원가==. 유휴설비 임대수익은 외부구입 측 효익."},
  {t:"제품라인 폐지",s:"폐지 시 사라지는 공헌이익 vs 회피가능고정원가 비교. 공통고정비 배부액은 무관.",p:"==공헌이익>회피가능고정비면 유지==. 부문 영업손실만 보고 폐지하면 오답."},
  {t:"제약자원 배분",s:"제약자원 단위당 공헌이익이 큰 제품부터 우선 생산.",p:"==단위당 공헌이익 아닌 제약자원 단위당 공헌이익==으로 순위. 복수 제약이면 선형계획법."},
  {t:"대체가격",s:"최소대체가격(공급부문)=단위당 변동원가+기회원가. 최대대체가격(수요부문)=외부구입가격.",p:"==유휴설비 있으면 기회원가 0==이므로 최소대체가격=변동원가. 협상범위 안에 있어야 대체 성립."}
 ]},
 {name:"예산·성과평가",cards:[
  {t:"종합예산 순서",s:"판매예산→생산예산→재료구입예산→노무비·OH예산→매출원가·현금예산→예산재무제표.",p:"==생산량=판매량+기말제품−기초제품==, 재료구입량=사용량+기말재료−기초재료. 두 단계 연쇄 계산."},
  {t:"변동예산",s:"실제 조업도 기준으로 조정한 예산. 고정예산차이=변동예산차이+매출조업도차이.",p:"==매출조업도차이는 (실제수량−예산수량)×예산 단위당 공헌이익==. 고정원가는 조업도차이 없음."},
  {t:"투자중심점 성과평가",s:"ROI=영업이익/투자액, 잔여이익=영업이익−투자액×최저요구수익률, EVA=세후영업이익−투하자본×WACC.",p:"==ROI는 투자 회피 유인(준최적화) 문제==, 잔여이익이 목표일치성 우수. 규모 다른 부문 비교는 ROI."},
  {t:"균형성과표",s:"재무·고객·내부프로세스·학습성장 4관점. 비재무지표를 선행지표로 활용.",p:"==학습과 성장→내부프로세스→고객→재무==의 인과관계 순서."}
 ]},
 {name:"기타 관리회계",cards:[
  {t:"품질원가",s:"예방·평가(통제원가)와 내부실패·외부실패(실패원가). 통제원가 증가 시 실패원가 감소.",p:"==외부실패원가(보증·반품·이미지손실)가 가장 큼==. 재작업은 내부실패, 검사는 평가원가."},
  {t:"학습곡선",s:"누적생산량 2배 시 단위당 평균시간이 일정률로 감소. 누적평균시간모형과 증분단위시간모형.",p:"==80% 학습곡선: 누적량 2배마다 누적평균시간 80%==. 4배면 64%."},
  {t:"목표원가·카이젠",s:"목표원가=목표판매가−목표이익, 설계단계에서 원가절감. 카이젠은 제조단계 지속적 개선.",p:"==원가의 대부분은 설계단계에서 확정==(고착)되므로 목표원가계산이 효과적."}
 ]}
]},
{id:"tx",name:"세법",chapters:[
 {name:"국세기본법 총칙·납세의무",cards:[
  {t:"기간과 기한",s:"기간 계산은 민법 준용. 기한이 공휴일·토요일·근로자의날이면 다음날. 우편신고는 통신일부인 기준.",p:"==전자신고는 국세정보통신망에 입력된 때== 신고된 것. 우편은 발송주의, 전자는 도달 시점."},
  {t:"납세의무 성립시기",s:"소득세·법인세·부가세는 과세기간 끝나는 때. 상속세는 상속개시, 증여세는 재산취득, 원천징수는 지급하는 때.",p:"==부가세 예정신고분은 예정신고기간 끝나는 때==, 인지세는 문서 작성 시, 종부세는 과세기준일(6.1)."},
  {t:"납세의무 확정",s:"신고납세(소득·법인·부가·개별소비 등)는 신고 시 확정. 정부부과(상속·증여·종부세 원칙)는 결정 시 확정.",p:"==원천징수 소득세·인지세는 성립과 동시에 자동확정==. 종부세는 납세자가 신고 선택 가능."},
  {t:"제2차 납세의무",s:"청산인(분배재산 한도), 출자자(무한책임사원·과점주주 50% 초과), 법인(주주 체납, 무한책임사원·과점주주), 사업양수인(양수재산 한도).",p:"==사업양수인 2차 납세의무는 양도일 이전 확정된 국세== + 양수한 재산가액 한도. 과점주주는 지분비율만큼."},
  {t:"국세우선권",s:"국세는 원칙적으로 다른 채권에 우선. 예외: 법정기일 전 설정된 저당권 등, 소액임차보증금, 최종 3월 임금·재해보상금.",p:"==법정기일: 신고분은 신고일, 고지분은 고지서 발송일==. 당해세(상속·증여·종부세)는 설정일 관계없이 우선(2023년부터 임차보증금 예외)."}
 ]},
 {name:"국세기본법 부과·징수·불복",cards:[
  {t:"부과제척기간",s:"일반 5년, 무신고 7년, 사기 등 부정행위 10년(역외거래 15년). 상속·증여세는 10년/15년.",p:"==제척기간 만료 후 부과 불가==, 중단·정지 없음. 소멸시효(징수권, 5년·5억 이상 10년)는 중단·정지 있음."},
  {t:"수정신고·기한후신고·경정청구",s:"수정신고는 과소신고 시 제척기간 내. 기한후신고는 무신고자. 경정청구는 법정신고기한 후 5년 이내(후발적 사유 3개월).",p:"==경정청구는 확정력 없음==(세무서장이 2개월 내 결정). 기한후신고는 세무서장 결정으로 확정."},
  {t:"가산세 감면",s:"수정신고: 1개월 내 90%, 3개월 75%, 6개월 50%, 1년 30%, 1년6개월 20%, 2년 10%. 기한후신고: 1개월 50%, 3개월 30%, 6개월 20%.",p:"==과소·무신고 가산세만 감면==, 납부지연가산세는 감면 대상 아님. 세무조사 통지 후 신고는 감면 배제."},
  {t:"조세불복 절차",s:"이의신청(선택)→심사청구(국세청) 또는 심판청구(조세심판원) 또는 감사원 심사청구→행정소송. 각 90일 이내.",p:"==행정소송은 심사·심판 전치 필수==. 심판청구는 불이익변경금지 적용, 결정은 90일 이내."},
  {t:"세무조사 원칙",s:"재조사 금지(예외: 조세탈루 명백한 자료, 거래상대방 조사 필요 등). 사전통지 15일 전. 조사기간 20일 원칙(중소규모).",p:"==납세자권리헌장 교부==, 세무대리인 조력권, 조사결과 통지 후 과세전적부심사 30일."}
 ]},
 {name:"국세징수법·조세범처벌법",cards:[
  {t:"납부고지와 독촉",s:"납부고지서는 납부기한 30일 전(예외 있음). 체납 시 10일 이내 독촉장 발급, 독촉기한 20일.",p:"==독촉은 소멸시효 중단사유==. 납부기한 전 징수(납기전징수) 사유: 강제집행·파산·경매 등."},
  {t:"압류와 매각",s:"독촉기한 경과 시 압류. 압류금지재산(생계 필수품, 급여 일부 등). 매각은 공매 원칙, 낙찰자 매각결정 후 잔대금.",p:"==교부청구·참가압류==: 이미 강제징수 진행 중인 재산에 대해 배분 요구. 급여는 월 250만원 등 압류 제한."},
  {t:"조세범처벌법 조세포탈",s:"사기 기타 부정한 행위로 포탈 시 2년 이하 징역 또는 포탈세액 2배 이하 벌금(포탈액 큰 경우 가중).",p:"==단순 무신고·과소신고는 부정행위 아님==. 이중장부, 거짓증빙, 장부 파기 등이 부정행위."}
 ]},
 {name:"법인세법 총칙·익금",cards:[
  {t:"납세의무자와 사업연도",s:"내국법인은 국내외 모든 소득, 외국법인은 국내원천소득. 사업연도는 정관 등에 따르되 1년 초과 불가.",p:"==비영리법인은 수익사업소득만 과세==. 사업연도 변경은 종료일부터 3개월 내 신고, 미신고 시 변경 전 유지."},
  {t:"익금 항목",s:"자산 양도금액, 자산수증이익, 채무면제이익, 손금산입된 금액의 환입, 자산 임대료, 특수관계인 거래 시가차익 등.",p:"==이월결손금 보전에 충당한 자산수증이익·채무면제이익은 익금불산입==. 결손금 순서 무관하게 충당 가능."},
  {t:"익금불산입 항목",s:"주식발행액면초과액, 감자차익, 합병·분할차익, 이월익금, 자산평가차익(원칙), 부가세 매출세액, 국세환급가산금.",p:"==자기주식처분이익은 익금(회계와 차이)==. 감자차익은 익금불산입 — 자본거래 판단 문제 빈출."},
  {t:"수입배당금 익금불산입",s:"내국법인이 받은 배당은 지분율에 따라 일정률 익금불산입(지분 50% 이상 100%, 20% 이상 80%, 20% 미만 30%).",p:"==배당기준일 전 3개월 이내 취득 주식은 제외==. 차입금 이자 중 해당분 차감."},
  {t:"소득처분",s:"사외유출: 귀속에 따라 배당(주주)·상여(임직원)·기타소득(그 외)·기타사외유출. 사내유보: 유보/△유보. 기타.",p:"==귀속 불분명 시 대표자 상여==. 기업업무추진비 한도초과·기부금 한도초과·벌금은 기타사외유출."}
 ]},
 {name:"법인세법 손금",cards:[
  {t:"인건비",s:"임원 상여는 급여지급기준(정관·주총·이사회) 내만 손금. 임원 퇴직금은 정관 규정액 또는 총급여 10%×근속연수.",p:"==이익처분에 의한 상여는 손금불산입==. 임원 퇴직금 한도 초과액은 상여 처분."},
  {t:"감가상각",s:"결산조정 원칙(임의상각). 건축물은 정액법, 기타 유형자산은 정률·정액 선택(무신고 시 정률). 상각범위액 초과분 손금불산입.",p:"==시부인 계산: 회사계상액 vs 상각범위액==, 초과분 유보, 부족분은 전기 초과액 범위 내 추인. 즉시상각의제 주의."},
  {t:"기업업무추진비(접대비)",s:"한도=기본금액(1,200만원, 중소기업 3,600만원)+수입금액×적용률(100억 이하 0.3%, 500억 이하 0.2%, 초과 0.03%).",p:"==건당 3만원 초과 시 적격증빙 없으면 전액 손금불산입==(경조사비 20만원). 한도초과액은 기타사외유출."},
  {t:"기부금",s:"특례기부금 한도 50%, 일반기부금 10%(사회적기업 20%). 한도초과액 10년 이월. 비지정기부금은 전액 손금불산입.",p:"==현물기부: 특례·일반(특수관계 없음)은 장부가액, 그 외는 시가==. 기부금은 지출 시점 손금(어음은 결제일)."},
  {t:"대손금과 대손충당금",s:"충당금 한도=채권잔액×max(1%, 대손실적률). 대손 사유(신고조정: 소멸시효 완성 등, 결산조정: 회수불능 등).",p:"==특수관계인 업무무관 가지급금은 대손 불가·충당금 설정 대상 제외==. 소멸시효 완성 채권은 신고조정 대손."},
  {t:"지급이자 손금불산입 순서",s:"채권자불분명 사채이자→비실명 채권·증권이자→건설자금이자→업무무관자산 등 관련 지급이자.",p:"==채권자불분명·비실명 이자는 대표자 상여==(원천징수분은 기타사외유출). 업무무관자산 이자는 기타사외유출."}
 ]},
 {name:"법인세법 세액계산·기타",cards:[
  {t:"자산·부채 평가",s:"재고자산은 신고한 방법(무신고 시 선입선출, 매매목적 부동산 개별법). 유가증권은 원가법(총평균·이동평균).",p:"==평가방법 임의변경 시 FIFO와 당초 방법 중 큰 금액==. 유가증권 평가손익은 원칙 불인정."},
  {t:"부당행위계산 부인",s:"특수관계인과의 거래로 조세 부당 감소 시 시가 기준 재계산. 시가와 거래가 차이 3억 이상 또는 시가 5% 이상.",p:"==특수관계 판단은 행위 당시 기준==. 인정이자는 가지급금×이자율(가중평균 또는 당좌대출이자율)."},
  {t:"이월결손금과 세율",s:"결손금 15년 이월(2020년 이후 발생). 공제한도는 각 사업연도 소득 80%(중소기업 100%). 세율 9·19·21·24%.",p:"==중소기업은 결손금 소급공제 가능==(직전 사업연도 법인세 한도). 이월결손금은 먼저 발생분부터 공제."},
  {t:"신고와 납부",s:"사업연도 종료일 말일부터 3개월 이내 신고. 중간예납은 6개월 초과 법인, 직전 실적 또는 가결산 기준.",p:"==납부세액 1천만원 초과 시 1개월 분납==(중소 2개월). 외부감사 대상은 1개월 연장 가능."},
  {t:"최저한세",s:"각종 감면 후 세액이 과세표준×최저한세율(일반 10~17%, 중소 7%) 미만이면 그 금액까지 감면 배제.",p:"==외국납부세액공제·재해손실세액공제는 최저한세 적용 대상 아님==. 적용 순서 문제 반복."}
 ]},
 {name:"소득세법 총칙·종합소득",cards:[
  {t:"거주자 판정",s:"국내 주소 또는 183일 이상 거소. 거주자는 전세계 소득, 비거주자는 국내원천소득만 과세.",p:"==국외근무 공무원·해외현지법인 파견 임직원은 거주자 의제==. 과세기간은 1.1~12.31, 변경 불가."},
  {t:"금융소득 종합과세",s:"이자+배당 합계 2천만원 초과 시 종합과세. 2천만원 이하는 14% 분리과세(원천징수)로 종결.",p:"==Gross-up: 내국법인 배당(법인세 과세소득)에 10% 가산==, 2천만원 초과분에만 적용. 비영업대금이익 원천징수 25%."},
  {t:"사업소득",s:"사업소득금액=총수입금액−필요경비. 부동산임대소득도 사업소득. 결손금은 다른 소득과 통산(부동산임대 결손금은 제외).",p:"==주택임대 2천만원 이하는 분리과세 선택 가능==. 사업소득 대표자 급여는 필요경비 불산입(법인세와 차이)."},
  {t:"근로소득",s:"총급여−근로소득공제=근로소득금액. 비과세: 식대 월 20만원, 자가운전보조금 월 20만원, 출산·보육수당 등.",p:"==일용근로자는 일 15만원 공제 후 6% 원천징수로 분리과세==. 연말정산은 다음해 2월분 급여 지급 시."},
  {t:"기타소득",s:"일시적 인적용역·강연료·원고료 등은 필요경비 60% 의제. 기타소득금액 300만원 이하 분리과세 선택.",p:"==원천징수 20%(복권 3억 초과 30%)==. 계약금이 위약금으로 대체된 경우 원천징수 없음. 뇌물·알선수재는 무조건 종합과세."},
  {t:"연금소득",s:"공적연금은 종합과세. 사적연금(연금저축·퇴직연금)은 1,500만원 이하 분리과세 선택(3~5%), 초과 시 종합과세 또는 15% 분리 선택.",p:"==연금계좌 세액공제 한도 900만원==(연금저축 600만원). 중도해지는 기타소득 15%."}
 ]},
 {name:"소득세법 공제·세액·양도",cards:[
  {t:"인적공제",s:"기본공제 1인 150만원(연소득금액 100만원 이하, 근로소득만 있으면 총급여 500만원). 추가공제: 경로 100만원(70세), 장애인 200만원, 부녀자 50만원, 한부모 100만원.",p:"==직계존속 나이 60세, 직계비속 20세 이하==. 장애인은 나이 요건 없음. 부녀자와 한부모 중복 시 한부모."},
  {t:"세액공제",s:"근로소득세액공제, 자녀세액공제(8세 이상), 연금계좌, 보험료(12%), 의료비(15%, 총급여 3% 초과분), 교육비(15%), 기부금(15%/30%).",p:"==의료비는 나이·소득 요건 없이== 공제 가능. 교육비는 나이 요건 없음, 소득 요건은 있음."},
  {t:"세율과 신고",s:"6~45% 8단계 초과누진. 확정신고 5.1~5.31. 성실신고확인대상은 6.30까지.",p:"==분리과세 소득은 확정신고 대상 아님==. 근로소득만 있는 자는 연말정산으로 종결."},
  {t:"양도소득 과세대상",s:"부동산·부동산에 관한 권리·주식(대주주·비상장)·기타자산(특정주식, 영업권 등)·파생상품.",p:"==사업용 고정자산과 함께 양도하는 영업권은 양도소득==, 별도 양도는 기타소득. 소액주주 상장주식 장내 양도는 비과세."},
  {t:"양도차익 계산",s:"양도가액−취득가액(실지거래가 원칙)−필요경비=양도차익. 장기보유특별공제(3년 이상 6%~30%, 1세대1주택 최대 80%)−기본공제 250만원.",p:"==취득가액 불분명 시 매매사례가액→감정가액→환산취득가액== 순. 환산 시 필요경비는 개산공제."},
  {t:"1세대1주택 비과세",s:"2년 이상 보유(조정대상지역 취득은 2년 거주). 고가주택은 12억 초과분 과세. 일시적 2주택 3년 이내 종전주택 양도.",p:"==양도일 현재 1세대 1주택== 판정. 예정신고는 양도일 속하는 달 말일부터 2개월 이내."}
 ]},
 {name:"부가가치세 총칙·과세거래",cards:[
  {t:"납세의무자",s:"사업상 독립적으로 재화·용역을 공급하는 자(영리목적 불문). 국가·지자체도 납세의무 있음.",p:"==면세사업자는 부가세 납세의무 없음==. 신탁재산 관련 거래는 수탁자가 납세의무자."},
  {t:"과세기간과 사업자등록",s:"1기(1.1~6.30), 2기(7.1~12.31), 예정신고기간 각 3개월. 사업개시일부터 20일 내 등록.",p:"==등록 전 매입세액은 불공제==, 단 공급시기 속한 과세기간 끝난 후 20일 내 등록 시 그 기간 내 매입분 공제."},
  {t:"재화의 공급의제",s:"자가공급(면세전용·비영업용 소형승용차·판매목적 타사업장 반출), 개인적 공급, 사업상 증여, 폐업 시 잔존재화.",p:"==매입세액 불공제된 재화는 공급의제 제외==. 견본품·광고선전용 무상제공은 사업상 증여 아님."},
  {t:"재화 공급시기",s:"현금·외상: 인도되는 때. 장기할부·완성도·중간지급조건부: 대가 각 부분을 받기로 한 때. 수출: 선적일. 위탁판매: 수탁자 공급일.",p:"==공급시기 전 세금계산서 발급 후 7일 내 대가 수령 시 발급일이 공급시기==. 반환조건부는 조건 성취일."},
  {t:"용역 공급시기",s:"역무 제공 완료 또는 시설물 이용 시. 완성도·중간지급·장기할부·계속적 공급은 대가 각 부분 받기로 한 때.",p:"==부동산 임대 간주임대료는 예정·확정 신고기간 종료일==. 무상 용역은 원칙 과세 안 함(특수관계인 부동산 임대 제외)."}
 ]},
 {name:"부가가치세 영세율·면세·세액",cards:[
  {t:"영세율",s:"수출재화, 국외제공용역, 외국항행용역 등. 매출세액 0, 매입세액 공제·환급 가능(완전면세).",p:"==내국신용장·구매확인서에 의한 공급도 영세율==. 영세율 사업자도 신고의무 있음."},
  {t:"면세",s:"기초생활필수품(미가공식료품·수돗물), 의료·교육·금융보험·토지·주택임대·인적용역·도서신문 등. 매입세액 불공제(부분면세).",p:"==면세포기 가능 대상: 영세율 적용 재화·학술연구단체 공급 등==, 포기 후 3년간 면세 불가. 미용·성형 의료는 과세."},
  {t:"과세표준",s:"금전 대가 → 그 금전, 금전 외 → 자기가 공급한 재화 시가. 특수관계인 부당 저가 → 시가. 포함 X: 매출에누리·환입·할인, 연체이자, 국고보조금.",p:"==대손금·판매장려금(금전)·하자보증금은 과세표준에서 차감하지 않음==. 장려금을 재화로 주면 사업상 증여."},
  {t:"매입세액 불공제",s:"세금계산서 미수취·부실기재, 사업무관, 비영업용 소형승용차 구입·유지, 기업업무추진비, 면세사업 관련, 토지 관련 자본적 지출.",p:"==공급시기 후 확정신고기한 내 발급받은 세금계산서는 공제(가산세 있음)==. 9인승 이상·화물차·경차는 공제 가능."},
  {t:"대손세액공제",s:"공급 후 대손 확정 시 대손금액×10/110을 매출세액에서 차감. 공급일부터 10년 지난 날 속하는 과세기간 확정신고기한까지.",p:"==예정신고 시 공제 불가, 확정신고에서만==. 공급받은 자는 대손처분받은 세액을 매입세액에서 차감."},
  {t:"간이과세",s:"직전연도 공급대가 1억 400만원 미만 개인. 납부세액=공급대가×업종별 부가가치율×10%. 4,800만원 미만 납부의무 면제.",p:"==간이과세자는 환급 없음==, 세금계산서 발급 의무(4,800만원 이상). 부동산임대·유흥주점은 4,800만원 기준."}
 ]},
 {name:"세금계산서·신고납부",cards:[
  {t:"세금계산서 발급",s:"공급시기에 발급 원칙. 월합계 세금계산서는 다음달 10일까지. 법인·직전연도 공급가액 8천만원 이상 개인은 전자세금계산서 의무.",p:"==필요적 기재사항: 공급자 등록번호·성명, 공급받는 자 등록번호, 공급가액과 세액, 작성연월일==. 누락 시 매입세액 불공제."},
  {t:"신고·납부와 환급",s:"예정신고·확정신고 각 종료 후 25일 이내. 일반환급 30일, 조기환급(영세율·시설투자·재무개선) 15일.",p:"==개인 일반과세자는 예정신고 없이 예정고지==(직전 납부세액 1/2, 50만원 미만 생략). 조기환급은 예정·확정·월별 신고 가능."},
  {t:"가산세",s:"세금계산서 미발급 2%, 지연발급 1%, 부실기재 1%, 전자발급 미전송 0.5%(지연 0.3%). 매출처별합계표 미제출 0.5%.",p:"==가공세금계산서(실물거래 없음) 3%==, 위장(타인명의) 2%. 중복적용 배제 규정 확인."}
 ]}
]},
{id:"pf",name:"재정학",chapters:[
 {name:"후생경제학과 시장실패",cards:[
  {t:"파레토 효율 조건",s:"교환의 효율(MRS 동일), 생산의 효율(MRTS 동일), 종합적 효율(MRS=MRT). 세 조건 모두 충족 시 파레토 최적.",p:"==파레토 효율은 분배의 공평성과 무관==. 효용가능곡선 위 모든 점이 효율적."},
  {t:"후생경제학 기본정리",s:"제1정리: 완전경쟁 균형은 파레토 효율. 제2정리: 초기부존 재분배로 원하는 파레토 효율 배분을 시장으로 달성 가능.",p:"==제2정리는 정액세(lump-sum)로 재분배 가능함을 전제==. 효율과 공평의 분리 가능성."},
  {t:"시장실패 원인",s:"공공재, 외부성, 불완전경쟁(자연독점), 정보 비대칭(역선택·도덕적 해이), 불완전 정보.",p:"==소득분배 불공평은 시장실패가 아님==(시장이 효율적이어도 발생). 정부실패와 구분."},
  {t:"사회후생함수",s:"공리주의(효용 합), 롤스(최소 효용 극대화), 평등주의, 내쉬. 무차별곡선 형태로 구분.",p:"==롤스 사회무차별곡선은 L자형==, 공리주의는 직선(−1 기울기). 애로우 불가능성 정리: 5조건 동시 만족 불가."}
 ]},
 {name:"공공재",cards:[
  {t:"공공재의 특성",s:"비경합성(추가 소비 한계비용 0)과 비배제성. 순수공공재는 둘 다, 클럽재는 배제 가능·비경합, 공유자원은 경합·비배제.",p:"==비배제성이 무임승차의 원인==, 비경합성은 배제가 비효율적인 이유. 둘을 구분해서 묻는다."},
  {t:"사무엘슨 조건",s:"공공재 최적 공급: ΣMRS=MRT(개별 한계편익 합=한계비용). 사적재는 MRS=MRT.",p:"==공공재 수요곡선은 개별 수요의 수직 합==, 사적재는 수평 합."},
  {t:"린달 균형",s:"각 개인이 한계편익만큼 조세 부담(린달가격)에 동의하면 효율적 공급 달성. 선호 표출이 진실해야 성립.",p:"==린달 모형은 무임승차 가능성으로 실현 곤란==. 조세가격이 개인마다 다름."},
  {t:"선호표출 메커니즘",s:"클라크-그로브즈 조세: 자신의 선호 표출이 타인에게 미치는 순효과만큼 과세해 진실표출 유도.",p:"==클라크세는 예산 균형 보장 안 됨==(잉여 발생), 담합에 취약."}
 ]},
 {name:"외부성",cards:[
  {t:"외부성과 자원배분",s:"외부불경제(생산 과다), 외부경제(생산 과소). 사회적 한계비용=사적 한계비용+외부 한계비용.",p:"==최적 오염 수준은 0이 아님== — 한계저감비용=한계피해 지점. 금전적 외부성은 시장실패 아님."},
  {t:"피구세와 보조금",s:"피구세=최적 생산량에서 외부 한계비용. 외부경제는 보조금. 세율은 사회적 최적점 기준.",p:"==피구세는 시장 균형점이 아닌 최적점의 외부한계비용==으로 설정. 피구보조금은 진입 유발 문제."},
  {t:"코즈 정리",s:"재산권이 명확하고 거래비용이 없으면 당사자 협상으로 효율적 해결. 재산권 귀속과 무관하게 효율 달성.",p:"==재산권 귀속에 따라 소득분배는 달라짐==, 자원배분(효율)은 동일. 거래비용·다수 당사자 시 한계."},
  {t:"직접규제 vs 경제적 유인",s:"오염배출권 거래제는 한계저감비용이 낮은 기업이 많이 감축 → 총비용 최소. 직접규제는 비용 비효율.",p:"==배출권 거래와 피구세는 모두 한계저감비용 균등화==, 배출권은 총량 확실·가격 불확실, 세금은 반대."}
 ]},
 {name:"공공선택이론",cards:[
  {t:"중위투표자 정리",s:"단봉선호·1차원 쟁점에서 다수결 결과는 중위투표자의 선호. 극단 선호는 무시됨.",p:"==중위투표자 결과는 효율적 공급을 보장하지 않음==. 다봉선호가 있으면 투표의 역설 발생 가능."},
  {t:"투표의 역설",s:"콩도르세 역설: 다수결이 이행성 위반(순환). 의제 순서 조작(agenda control)이 결과 좌우.",p:"==보르다 투표는 무관한 대안의 영향을 받음==. 만장일치는 현상유지 편향."},
  {t:"관료와 지대추구",s:"니스카넨: 관료는 예산 극대화 → 공공재 과다공급. 지대추구는 특혜를 위한 로비로 자원 낭비.",p:"==니스카넨 모형에서 공급량은 효율 수준의 2배==(총편익=총비용점). 로그롤링은 표거래로 과다지출."},
  {t:"정부실패",s:"불완전 정보, 정치적 유인, 관료 비효율, 파생적 외부성, 규제 포획.",p:"==정부실패가 있어도 시장실패 교정 정당성이 사라지는 건 아님==. 최선 vs 차선 비교."}
 ]},
 {name:"조세의 원칙과 귀착",cards:[
  {t:"조세원칙",s:"편익원칙(받는 만큼 부담)과 능력원칙(수평적·수직적 공평). 애덤 스미스 4원칙, 바그너 원칙.",p:"==수평적 공평: 같은 능력 같은 부담==, 수직적: 큰 능력 더 큰 부담. 능력 척도로 소득·소비·재산."},
  {t:"조세귀착의 원리",s:"법적 귀착≠경제적 귀착. 탄력성이 낮은 쪽이 더 많이 부담. 과세 대상(공급자/수요자)과 무관하게 결과 동일.",p:"==공급 완전탄력 → 소비자 전부 부담==, 수요 완전비탄력 → 소비자 전부 부담. 종량세·종가세 귀착 동일 조건."},
  {t:"독점시장 조세 귀착",s:"독점에서 종량세는 가격을 세액보다 적게(선형수요) 또는 많이(일정탄력성 수요) 상승시킬 수 있음.",p:"==일정 탄력성 수요곡선에서는 가격이 세액 이상 상승== 가능(과잉전가)."},
  {t:"하버거 법인세 귀착",s:"일반균형: 법인부문 자본 과세 → 자본이 비법인부문으로 이동 → 경제 전체 자본 수익률 하락.",p:"==장기적으로 법인세는 모든 자본 소유자가 부담==(생산요소 대체탄력성·수요탄력성에 따라 노동에도 전가)."}
 ]},
 {name:"초과부담과 최적조세",cards:[
  {t:"초과부담",s:"조세로 인한 후생 손실 중 세수를 초과하는 부분. ≈½×t²×탄력성×가격×수량. 세율 제곱에 비례.",p:"==세율 2배 → 초과부담 4배==. 탄력성 클수록 초과부담 큼. 정액세는 초과부담 0."},
  {t:"램지 규칙",s:"세수 일정 시 초과부담 최소화: 각 재화 보상수요량 감소율 동일. 역탄력성 규칙: 탄력성 낮은 재화에 높은 세율.",p:"==역탄력성 규칙은 효율성만 고려==, 필수재 중과로 공평성 저해. 재화 간 독립 가정."},
  {t:"최적소득세",s:"에지워스: 완전균등(한계세율 100%). 머리스: 최고소득자 한계세율 0, 비선형 최적세율은 낮게. 스턴: 선형소득세 최적세율.",p:"==머리스 모형에서 최고소득 한계세율 0==인 이유: 그 이상 세율은 세수 없이 노동유인만 저해."},
  {t:"콜렛-헤이그 규칙",s:"여가와 보완적인 재화에 높은 세율 부과 → 여가에 과세하는 효과로 초과부담 감소.",p:"==여가와 보완재 중과, 대체재 경과==. 램지 규칙의 여가 관련 확장."}
 ]},
 {name:"소득세·소비세·법인세 이론",cards:[
  {t:"소득의 정의",s:"헤이그-사이먼스: 소득=소비+순자산 증가. 미실현 이득·귀속소득·이전소득도 포함.",p:"==포괄적 소득세는 저축에 이중과세== 논란 → 지출세(소비세) 주장의 근거."},
  {t:"소득세와 노동공급",s:"비례소득세는 대체효과(여가↑)와 소득효과(노동↑) 상충. 누진세는 대체효과가 상대적으로 커 노동 감소 가능.",p:"==정액세는 소득효과만==(노동 증가). 후방굴절 노동공급곡선 구간에서는 과세로 노동 증가."},
  {t:"이자소득세와 저축",s:"이자소득 과세는 대체효과(저축↓)와 소득효과(저축↑) 상충 → 이론적으로 불확정.",p:"==소득세는 이자소득세 포함으로 저축 이중과세==, 소비세는 저축 중립적."},
  {t:"소비세",s:"부가가치세는 최종소비자 부담, 다단계 거래 중립. 소비세는 역진적(소득 대비). 개별소비세는 사치재·외부성 교정.",p:"==부가세는 생산 단계 수와 무관==(누적효과 없음), 거래세는 수직통합 유인."},
  {t:"법인세 이론",s:"법인세 존재 근거: 법인실체설(독립 납세능력) vs 법인의제설(이중과세 → 통합 필요). 통합방식: 배당세액공제, 완전통합.",p:"==우리나라 배당세액공제(Gross-up)는 부분통합==. 법인세는 투자·자금조달(부채 편향)에 왜곡."}
 ]},
 {name:"재정지출·공채·지방재정",cards:[
  {t:"비용편익분석",s:"NPV(순현재가치)가 기본 기준. IRR·B/C 비율은 규모·상호배타 사업에서 오류 가능.",p:"==사회적 할인율 낮을수록 장기 사업 유리==. B/C 비율은 비용을 편익 차감으로 처리 시 값 달라짐."},
  {t:"공채의 부담",s:"러너: 내국채는 미래세대 부담 없음(이전). 부캐넌: 상환 시 납세자가 부담. 모딜리아니: 자본축적 감소로 미래세대 부담.",p:"==리카도 대등정리: 공채=조세==, 합리적 기대·유산 동기 전제. 성립 시 재정정책 효과 없음."},
  {t:"재정정책과 구축효과",s:"정부지출 증가 → 이자율 상승 → 민간투자 감소. 화폐수요 이자율탄력성 클수록 구축효과 작음.",p:"==고전학파: 완전구축==, 케인즈: 유동성함정에서 구축효과 0."},
  {t:"티부 가설",s:"주민이 발로 투표: 선호에 맞는 지방정부로 이동 → 지방공공재 효율 공급. 완전이동성·다수 지자체·외부성 없음 등 전제.",p:"==티부 모형은 중앙집권보다 분권을 지지==, 소득별 거주분리 문제 발생."},
  {t:"정부간 보조금",s:"정액(무조건)보조금은 소득효과만, 정률(조건부)보조금은 가격효과 → 해당 공공재 지출 더 증가.",p:"==끈끈이 효과: 보조금이 주민 소득증가보다 지출을 더 늘림==. 외부성 있는 공공재는 정률보조 정당."}
 ]},
 {name:"사회보장과 소득재분배",cards:[
  {t:"공적연금 방식",s:"적립방식(자기 부담 축적, 인플레 취약)과 부과방식(현세대 부담, 인구구조 취약). 부과방식 수익률=인구증가율+임금상승률.",p:"==부과방식은 도입 세대에 이득==, 고령화 시 지속 곤란. 적립방식은 저축 증가 효과."},
  {t:"사회보험의 근거",s:"역선택(민간보험 시장 실패), 도덕적 해이, 온정적 간섭, 근시안적 행동. 강제가입으로 역선택 해결.",p:"==건강보험 본인부담금은 도덕적 해이 완화== 수단. 실업보험은 구직기간 연장 효과."},
  {t:"소득재분배 정책",s:"현금 vs 현물 급여(현금이 수혜자 효용 높음, 현물은 온정적 간섭·낙인). 부의 소득세(NIT): 급여=보장소득−t×소득.",p:"==NIT 한계세율이 높으면 노동유인 저해==. 근로장려세제(EITC)는 저소득 구간 노동유인 강화."},
  {t:"불평등 지표",s:"로렌츠곡선, 지니계수(0~1), 십분위분배율(하위 40%/상위 20%, 클수록 평등), 앳킨슨 지수.",p:"==로렌츠곡선 교차 시 지니계수로 비교 불가 시 앳킨슨==. 십분위분배율은 값이 클수록 평등."}
 ]}
]},
{id:"cl",name:"상법(회사편)",chapters:[
 {name:"회사법 총설",cards:[
  {t:"회사의 종류와 특징",s:"합명(무한책임사원), 합자(무한+유한), 유한책임회사, 주식회사, 유한회사 5종. 모두 법인.",p:"==합명·합자회사는 사원 2인 이상 필요==, 주식·유한·유한책임회사는 1인 설립 가능."},
  {t:"법인격 부인",s:"회사 형태가 남용된 경우 특정 사안에서 법인격을 부인하고 배후 주주에게 책임. 회사 존재 자체는 유지.",p:"==법인격 부인은 해당 법률관계에 한정==, 회사 해산·설립무효와 다름. 판례로 인정."},
  {t:"회사의 능력",s:"권리능력은 정관 목적 범위 내(판례는 넓게 해석). 다른 회사의 무한책임사원 불가.",p:"==회사는 정관 목적과 관련 있으면 기부·보증 가능==. 청산 중 회사는 청산 목적 범위 내 능력."},
  {t:"회사의 조직변경",s:"합명↔합자, 주식↔유한·유한책임 사이만 가능. 총사원 동의 또는 총주주 동의 필요.",p:"==주식회사→유한회사 변경 시 사채 전액 상환 필요==. 조직변경은 법인격 동일성 유지."}
 ]},
 {name:"주식회사 설립",cards:[
  {t:"정관 절대적 기재사항",s:"목적, 상호, 발행예정주식총수, 1주 금액(액면), 설립 시 발행주식수, 본점소재지, 공고방법, 발기인 성명·주민번호·주소.",p:"==하나라도 누락 시 정관 무효==. 자본금 총액은 절대적 기재사항 아님. 무액면주식 발행 시 1주 금액 기재 불요."},
  {t:"변태설립사항",s:"발기인 특별이익, 현물출자, 재산인수, 설립비용·발기인 보수. 정관에 기재해야 효력(상대적 기재사항).",p:"==현물출자·재산인수는 법원 선임 검사인 조사==(공인된 감정인 감정으로 대체 가능). 소액·상장주식은 조사 면제."},
  {t:"발기설립 vs 모집설립",s:"발기설립은 발기인이 전부 인수, 이사·감사는 발기인 의결권 과반수. 모집설립은 창립총회에서 선임.",p:"==모집설립 인수인은 납입 지체 시 실권절차==(2주 이상 기간 최고). 발기설립은 실권절차 없음."},
  {t:"발기인의 책임",s:"인수·납입담보책임(무과실, 총주주 동의로도 면제 불가), 손해배상책임(과실). 회사 불성립 시 연대책임.",p:"==납입담보책임은 발기인 전원 연대·무과실==. 설립무효 판결은 장래효, 제소기간 2년."},
  {t:"자본금과 주식",s:"자본금은 발행주식 액면총액(무액면은 발행가 1/2 이상 이사회 결정액). 최저자본금 제도 폐지. 액면 100원 이상.",p:"==발행예정주식총수 범위 내 이사회가 신주 발행== 가능. 액면·무액면 혼용 불가."}
 ]},
 {name:"주식과 주주",cards:[
  {t:"주식의 종류",s:"이익배당·의결권·상환·전환에 관한 종류주식. 의결권 없는 주식은 발행주식총수 1/4 초과 불가.",p:"==상환주식은 이익으로만 상환==, 전환주식은 전환 후 주식이 남음. 종류주주총회는 정관변경 등 손해 시 필요."},
  {t:"주식양도 자유와 제한",s:"양도 자유 원칙. 정관으로 이사회 승인 요건 가능(승인 거부 시 상대방 지정·매수 청구). 권리주·주권발행 전 양도 제한.",p:"==주권발행 전 주식 양도는 6개월 경과 후 회사에 대항 가능==. 정관 외 방법(계약)의 양도제한은 회사에 무효."},
  {t:"자기주식",s:"배당가능이익 범위 내 취득 가능(주총 결의, 이사회로 정할 수 있음). 특정목적 취득(합병·단주 등)은 제한 없음.",p:"==자기주식은 의결권 없음==, 처분은 이사회 결정. 취득 시 배당가능이익 부족 예상 시 이사 배상책임."},
  {t:"주주명부·명의개서",s:"명의개서 후 회사에 대항. 기준일은 3개월 내. 주주명부 폐쇄기간 3개월 이내.",p:"==명의개서 미필주주는 회사에 권리 주장 불가==, 회사도 명부상 주주가 아닌 실질주주의 권리행사를 인정할 수 없음(2017년 전원합의체)."},
  {t:"주식의 소각·병합·분할",s:"소각은 자본금 감소 절차 또는 이익소각(자기주식 소각). 분할은 주총 특별결의, 액면 100원 하한.",p:"==주식병합은 자본금 감소 수단==, 채권자보호절차·단주 처리. 액면분할은 자본금 불변."}
 ]},
 {name:"주주총회",cards:[
  {t:"소집",s:"이사회 결의로 대표이사 소집. 2주 전 통지(전자통지 가능). 소수주주(3%) 소집청구 → 법원 허가로 직접 소집.",p:"==총주주 동의 시 통지 절차 생략 가능==. 자본금 10억 미만 회사는 10일 전 통지, 총주주 동의로 서면결의."},
  {t:"결의요건",s:"보통결의: 출석 과반+발행주식총수 1/4. 특별결의: 출석 2/3+발행주식총수 1/3. 특수결의: 총주주 동의.",p:"==특별결의 사항: 정관변경, 영업양도, 자본금감소, 해산, 합병, 이사해임, 주식분할 등==. 이사 선임은 보통결의."},
  {t:"의결권 행사",s:"1주 1의결권. 대리행사·서면투표(정관)·전자투표(이사회). 특별이해관계인 의결권 배제. 상호주(10% 초과) 의결권 없음.",p:"==감사 선임 시 3% 초과 주식 의결권 제한==. 집중투표는 정관으로 배제 가능."},
  {t:"결의의 하자",s:"취소: 절차·내용의 법령·정관 위반, 2개월 내 소. 무효: 내용의 법령 위반, 기간 제한 없음. 부존재: 중대한 하자.",p:"==취소소송은 주주·이사·감사만 제소==, 무효·부존재는 누구나. 판결은 대세효·소급효."},
  {t:"반대주주 주식매수청구권",s:"영업양도·합병·분할합병·주식교환 등 특별결의 반대 주주. 총회 전 서면 반대, 총회 후 20일 내 청구.",p:"==회사는 청구일부터 2개월 내 매수==, 가격은 협의→법원. 간이·소규모 합병 시 소규모 쪽은 청구권 없음."}
 ]},
 {name:"이사·이사회·대표이사",cards:[
  {t:"이사의 선임·해임",s:"3인 이상(자본금 10억 미만 1~2인), 임기 3년 이내. 해임은 특별결의, 정당 사유 없이 해임 시 손해배상.",p:"==소수주주(3%)는 해임 부결 시 1개월 내 법원에 해임 청구==. 사외이사 상장회사 1/4 이상."},
  {t:"이사의 의무",s:"선관주의·충실의무, 경업금지(이사회 승인, 개입권), 자기거래(이사회 2/3 승인, 사전), 회사기회유용 금지.",p:"==자기거래는 주요주주·특수관계인 포함==, 이사회 승인 없는 거래는 회사와의 관계에서 무효(선의 3자 대항 불가)."},
  {t:"이사의 책임",s:"회사에 대한 손해배상(과실책임, 총주주 동의로 면제, 정관으로 보수 6배 한도 감경). 제3자에 대한 책임(악의·중과실).",p:"==경영판단원칙 인정==. 이사회 결의 찬성 이사는 연대, 의사록 이의 미기재 시 찬성 추정."},
  {t:"대표소송",s:"1%(상장 0.01%·6개월 보유) 주주가 회사에 서면 청구 후 30일 내 미제소 시 직접 제소. 다중대표소송 인정(모회사 주주).",p:"==대표소송 제기 후 주식 보유 감소해도 유지==(0이 되면 불가). 승소 시 회사에 소송비용 청구."},
  {t:"대표이사와 표현대표이사",s:"대표이사는 회사 영업 재판상·재판외 포괄대표권. 사장·부사장 등 명칭 사용 허용 시 표현대표이사 책임.",p:"==공동대표 시 1인의 단독행위는 무효==, 수동대표는 각자 가능. 대표권 남용은 상대방 악의 시 무효."}
 ]},
 {name:"감사·감사위원회",cards:[
  {t:"감사의 선임과 지위",s:"주총 보통결의, 3% 초과 의결권 제한. 임기: 취임 후 3년 내 최종 결산기 정기총회 종결 시. 자본금 10억 미만은 임의.",p:"==감사는 이사·지배인 등 겸직 불가==. 해임은 특별결의, 감사는 주총에서 해임 의견 진술권."},
  {t:"감사의 권한",s:"업무·회계 감사, 이사회 출석·의견진술, 이사 위법행위 유지청구, 회사-이사 소송 시 회사 대표, 자회사 조사권.",p:"==감사가 이사회 소집청구·직접 소집 가능==. 감사보고서는 주총 1주 전 제출."},
  {t:"감사위원회",s:"3인 이상 이사, 사외이사 2/3 이상. 설치 시 감사 둘 수 없음. 상장(자산 2조 이상) 의무.",p:"==감사위원 분리선출==(상장 대규모): 1인 이상 다른 이사와 분리하여 선임, 3% 룰 적용."}
 ]},
 {name:"신주발행·사채·회계",cards:[
  {t:"신주발행",s:"이사회 결의(정관으로 주총 가능). 주주 신주인수권 원칙, 제3자배정은 정관 근거+경영상 목적(신기술·재무구조 개선).",p:"==신주인수권 침해 발행은 발행무효 사유==(6개월 내 소, 판결 장래효). 납입기일 다음날 주주 됨."},
  {t:"신주발행 관련 책임",s:"불공정 가액 인수인은 차액 지급 책임(통모). 이사 인수담보책임. 신주발행유지청구권(주주, 사전).",p:"==현저히 불공정한 발행가액으로 통모 인수 시 차액 지급==(회사에 대해). 대표소송 대상."},
  {t:"사채",s:"이사회 결의(정관으로 대표이사 위임 가능). 사채권자집회, 사채관리회사. 전환사채·신주인수권부사채는 주주 우선.",p:"==CB·BW 제3자 발행은 정관 근거·경영상 목적== 필요(신주와 동일). 전환 청구 시 회사 승낙 불요(형성권)."},
  {t:"준비금과 배당",s:"이익준비금(금전배당 1/10, 자본금 1/2까지), 자본준비금. 배당가능이익=순자산−자본금−준비금−미실현이익. 준비금 1.5배 초과분 감액 가능.",p:"==중간배당은 정관 근거·이사회 결의, 연 1회==. 주식배당은 배당가능이익 1/2 한도(비상장). 현물배당은 정관 근거."},
  {t:"회계장부열람권",s:"3%(상장 0.1%·6개월) 주주는 이유를 붙인 서면으로 청구. 회사는 부당함 증명해야 거부 가능.",p:"==재무제표는 단독주주도 열람 가능==(비치 의무). 회계장부·서류는 소수주주권."}
 ]},
 {name:"자본금감소·합병·분할·해산",cards:[
  {t:"자본금 감소",s:"특별결의+채권자보호절차(1개월 이상 이의기간). 결손보전 목적 감자는 보통결의·채권자보호 불요.",p:"==감자무효의 소: 6개월 내==, 판결은 대세효이며 소급효 있음(합병·설립무효와 달리 장래효 아님). 액면감소·주식병합·소각 방법."},

(function(){
  const INTL={"name": "국제조세조정법", "cards": [{"t": "이전가격세제", "s": "국외특수관계인과의 거래가격이 정상가격과 다르면 정상가격으로 과세소득을 재계산. 정상가격 산출: 비교가능 제3자 가격법, 재판매가격법, 원가가산법, 거래순이익률법, 이익분할법 중 가장 합리적인 방법.", "p": "==정상가격 사전승인(APA)==: 과세당국과 미리 산출방법을 합의하면 그 기간 조정 없음. 이전가격 조정으로 늘어난 소득은 ==배당·출자 등으로 소득처분==(반환 시 제외).", "e": "해외 자회사에 물건을 시장가보다 싸게 팔면 국내 이익이 줄어 세금이 줄어요. 그래서 세법은 '남남끼리라면 얼마에 팔았을까'(정상가격)로 다시 계산해 과세해요. 방법이 여러 개인데 우선순위 없이 가장 합리적인 걸 고르고, 불확실하면 미리 국세청과 합의(APA)할 수 있어요.\n예시: 국내 본사가 원가 80인 제품을 독립 거래처에는 100에 팔면서 미국 자회사에는 85에 판매 → 정상가격 100으로 보아 15만큼 익금산입. 자회사가 그 15를 돌려주지 않으면 배당 처분(원천징수). 5년 APA를 받아두면 그 기간 이 문제로 조정받지 않아요."}, {"t": "과소자본세제", "s": "국외지배주주(50% 이상 등)로부터 빌린 돈이 그 주주 출자금액의 2배(금융업 6배)를 초과하면 초과분에 대한 이자·할인료는 손금불산입하고 배당으로 처분.", "p": "==국외지배주주가 보증한 제3자 차입금도 포함==. 초과 이자는 ==배당 소득처분==(국외지배주주 배당). 내국법인이 정상적 차입조건임을 입증하면 적용 배제.", "e": "해외 모회사가 자회사에 출자 대신 돈을 빌려주면 이자는 손금이라 세금이 줄어요(배당은 손금 아님). 이걸 막으려고 '출자금의 2배까지만 차입금으로 인정'하고 넘는 부분의 이자는 비용으로 안 봐줘요.\n예시: 미국 모회사가 한국 자회사에 출자 100억, 대여 300억(이자 5%). 한도 200억 초과분 100억의 이자 5억은 손금불산입 + 모회사 배당 처분(배당 원천징수). 모회사가 보증 서고 은행에서 빌린 돈도 합산해서 계산해요."}, {"t": "특정외국법인 유보소득 배당간주(CFC)", "s": "조세피난처(법인 실제부담세율이 15% 이하) 자회사에 내국인이 10% 이상 출자하고 그 법인이 이익을 배당하지 않고 쌓아두면, 유보소득 중 내국인 몫을 배당받은 것으로 간주해 과세.", "p": "==실제 사업(사무소·종업원 두고 제조·판매 등)을 하는 법인은 적용 제외==. 나중에 실제 배당받으면 ==이미 과세된 부분은 익금불산입==.", "e": "세금이 거의 없는 나라에 페이퍼컴퍼니를 두고 이익을 쌓아두면 국내 과세를 무한정 미룰 수 있어요. 그래서 배당을 안 해도 '배당한 것으로 본다'고 해서 매년 과세해요. 단 그 나라에서 진짜 공장을 돌리고 있으면 적용 안 해요.\n예시: 한국 법인이 케이맨 자회사(세율 0%) 지분 60% 보유, 자회사 당기 유보소득 100억 → 60억을 배당받은 것으로 간주해 익금산입. 3년 뒤 실제 배당 60억을 받으면 이미 과세됐으니 익금불산입. 케이맨에 사무실·직원을 두고 실제 무역업을 하면 적용 제외."}, {"t": "해외금융계좌 신고", "s": "거주자·내국법인이 보유한 해외금융계좌 잔액 합계가 해당 연도 매월 말일 중 어느 하루라도 5억원을 초과하면 다음 해 6월에 신고. 미신고·과소신고 시 과태료(20% 이하), 50억원 초과 미신고는 형사처벌·명단공개.", "p": "==예금·주식·가상자산·보험 등 모든 금융계좌== 포함. 해외 사업장을 둔 사업자의 사업용 계좌도 포함. 수정신고·기한후신고 시 과태료 감경.", "e": "해외 계좌에 돈을 숨기지 못하게 '가지고 있다'는 사실 자체를 신고하게 해요. 세금을 내는 게 아니라 신고만 하는 건데, 안 하면 잔액의 최대 20% 과태료. 월말 기준으로 한 번이라도 5억을 넘으면 대상이에요.\n예시: 미국 증권계좌 3억 + 싱가포르 예금 2.5억 = 5.5억이 7월 31일에 있었다면(다른 달은 4억) → 다음 해 6월 30일까지 신고. 신고 안 하면 과태료 최대 1.1억. 60억 미신고면 형사처벌 + 인적사항 공개."}, {"t": "글로벌최저한세(필라2)", "s": "연결매출 7.5억 유로 이상 다국적기업그룹이 어느 국가에서 15% 미만 실효세율로 과세되면, 그 부족분(추가세액)을 최종모회사 소재국 등에서 과세. 소득산입규칙(IIR)과 소득산입보완규칙(UTPR).", "p": "==2024년 사업연도부터 시행==(UTPR은 2025년). 국가별 실효세율 = 조정대상조세 / 글로벌최저한세소득. 적격 국내추가세액(QDMTT)으로 원천지국이 먼저 걷을 수 있음.", "e": "큰 다국적기업이 세율 낮은 나라로 이익을 옮겨도 소용없게, 어느 나라에서든 최소 15%는 내게 만든 국제 합의예요. 자회사가 있는 나라 세율이 10%면 부족한 5%를 모회사 나라(한국)에서 추가로 걷어요.\n예시: 한국 모회사 그룹(매출 10억 유로), 헝가리 자회사 이익 1,000억에 세금 90억(실효세율 9%) → 15%에 부족한 6%인 60억을 한국이 추가 과세(IIR). 헝가리가 자국 최저한세(QDMTT)로 60억을 먼저 걷으면 한국 추가세액은 0."}, {"t": "상호합의절차와 조세조약", "s": "조세조약 상대국의 과세로 이중과세가 생기면 납세자가 국세청에 상호합의절차(MAP)를 신청, 양국 권한당국이 협의. 합의되면 그에 따라 경정. 상호합의 진행 중 제척기간·불복기간 특례.", "p": "==조세조약은 국내법보다 우선==(특별법). 상호합의 신청은 과세사실을 안 날부터 3년 내. 합의 기간 중 ==납부기한 연장·징수유예== 가능.", "e": "미국이 우리 회사 미국 지점 소득을 과세하고 한국도 같은 소득을 과세하면 이중과세예요. 이때 납세자가 국세청에 '두 나라가 협의해달라'고 신청하는 게 상호합의절차. 두 나라가 합의하면 그대로 세금을 고쳐요.\n예시: 미국 국세청이 이전가격 조정으로 미국 자회사 소득 100억을 늘림 → 한국 본사 소득은 그대로라 100억이 양국에서 과세됨 → 본사가 한국 국세청에 MAP 신청 → 양국 합의로 한국 소득 100억 감액 경정. 합의 중에는 한국 세금 납부를 미룰 수 있어요."}]};
  const AL={"id": "al", "name": "행정소송법", "chapters": [{"name": "행정소송 총설", "cards": [{"t": "행정소송의 종류", "s": "항고소송(취소·무효등확인·부작위위법확인), 당사자소송(공법상 법률관계), 민중소송(선거소송 등, 법률에 규정된 경우만), 기관소송(기관 간 권한 다툼, 법률 규정 시). 항고소송이 실무의 중심.", "p": "==법정외 항고소송(의무이행소송·예방적 금지소송)은 판례가 인정하지 않음==. 헌법재판소 관할 사항(권한쟁의)은 기관소송에서 제외.", "e": "행정소송은 '행정청의 처분에 불만'(항고소송)과 '공법상 권리관계 자체를 다툼'(당사자소송)이 핵심이고, 민중·기관소송은 법률이 특별히 허용할 때만 가능해요. 우리 법원은 '허가를 내주라고 명령해달라'(의무이행소송)는 형태를 인정하지 않아요.\n예시: 영업정지처분 취소 → 항고소송(취소소송). 공무원 봉급 지급 청구 → 당사자소송. 주민이 지자체장의 위법한 재무행위를 다투는 주민소송 → 민중소송(지방자치법 근거). 건축허가를 거부당했을 때 '허가하라'는 판결은 못 받고 '거부처분 취소'만 가능."}, {"t": "행정심판 전치주의", "s": "취소소송은 행정심판을 거치지 않고 바로 제기할 수 있음이 원칙(임의적 전치). 예외적으로 법률이 필요적 전치를 규정한 경우(국세, 공무원 징계, 운전면허 등)에는 심판을 거쳐야 함.", "p": "필요적 전치라도 ==동종사건 기각재결, 심판 후 처분변경, 긴급한 손해 등에는 예외==. 무효확인소송·당사자소송에는 전치주의 적용 없음. 전치 요건은 ==사실심 변론종결 시까지 충족==하면 됨.", "e": "원칙적으로 행정심판을 안 거치고 바로 소송할 수 있어요. 하지만 세금(국세기본법), 공무원 징계(소청), 운전면허(행정심판) 같은 분야는 법률이 '심판 먼저'라고 정해놔서 반드시 거쳐야 해요. 이 과목이 세무사 시험에 있는 이유이기도 해요.\n예시: 음식점 영업정지 → 바로 행정법원에 취소소송 가능. 종합소득세 부과 → 심사·심판청구 없이 소 제기하면 각하. 단 같은 내용으로 이미 기각재결을 받은 다른 사건이 있으면 심판 생략 가능. 무효확인소송으로 다투면 전치 불요."}, {"t": "행정소송과 행정심판의 비교", "s": "행정심판은 행정기관(행정심판위원회)이, 행정소송은 법원이 판단. 심판은 위법뿐 아니라 부당도 심사, 의무이행심판 있음, 청구기간 90일/180일. 소송은 위법만, 제소기간 90일/1년.", "p": "행정심판은 ==적법성 + 합목적성==까지, 소송은 ==적법성만==. 심판에는 ==의무이행심판==이 있으나 소송에는 없음. 심판 재결에도 기속력·불이익변경금지.", "e": "행정심판은 행정부 내부의 자기 검토라 '위법은 아니지만 부당하다'(재량이 지나침)는 이유로도 취소해줄 수 있고, '허가를 내주라'는 재결도 가능해요. 법원은 위법 여부만 보고, 허가를 직접 명령하지도 않아요.\n예시: 영업정지 3개월이 법에 어긋나진 않지만 너무 가혹한 경우 → 행정심판에서 '부당'으로 1개월로 감경 가능, 소송에서는 재량권 일탈·남용(위법)이어야 취소. 건축허가 거부 → 심판에서는 '허가하라'(의무이행재결), 소송에서는 '거부처분 취소'."}]}, {"name": "취소소송의 대상(처분성)", "cards": [{"t": "처분의 개념", "s": "처분 = 행정청이 행하는 구체적 사실에 관한 법집행으로서의 공권력 행사 또는 그 거부와 그 밖에 이에 준하는 행정작용. 국민의 권리·의무에 직접 영향을 미쳐야 함.", "p": "==행정지도·내부 의사결정·단순 통지·법령 자체==는 처분 아님. ==권력적 사실행위(강제격리, 단수조치)==는 처분. 실체가 처분이면 명칭(안내·회신)과 무관.", "e": "취소소송으로 다툴 수 있는 건 '처분'뿐이에요. 국민의 권리·의무를 직접 바꾸는 공권력 행위여야 하고, 권유·안내·내부 결정처럼 직접 효과가 없는 건 아니에요. 반대로 강제로 물을 끊거나 격리하는 것처럼 물리적 행위여도 권력적이면 처분이에요.\n예시: 세무서의 세금 부과 통지 → 처분. 세무서가 '자진 납부하시면 좋겠습니다' 안내 → 행정지도, 처분 아님. 시청이 무허가 건물의 수도를 끊음 → 권력적 사실행위, 처분. 국무회의 의결 자체 → 내부행위, 처분 아님(그에 따른 대외적 조치가 처분)."}, {"t": "거부처분과 신청권", "s": "신청에 대한 거부가 처분이 되려면 신청인에게 법규상 또는 조리상 신청권이 있어야 함. 신청권은 추상적 권리로 충분하고 실제 인용될 권리가 있는지는 본안 문제.", "p": "==신청권 없는 자에 대한 거부는 처분 아님(각하)==. 거부 후 ==재신청·재거부==도 새로운 처분(신청권 있으면). 반복된 거부는 각각 제소기간 진행.", "e": "내가 '허가해달라'고 신청했는데 거부당했을 때, 그 거부를 취소소송으로 다투려면 애초에 내게 '신청할 권리'가 있어야 해요. 법에 신청 절차가 있거나 상식상 신청할 수 있는 지위면 충분하고, 허가받을 자격이 진짜 있는지는 재판 본안에서 따져요.\n예시: 건축법상 건축허가 신청권이 있는 토지 소유자의 허가 신청 거부 → 처분. 이웃 주민이 '옆집 건축허가를 취소해달라'고 신청했다가 거부 → 주민에겐 취소 신청권이 없어 처분 아님(각하). 거부당한 뒤 사정이 바뀌어 다시 신청·거부 → 새 처분, 새로 90일."}, {"t": "원처분주의와 재결", "s": "처분에 대한 행정심판 재결이 있어도 취소소송 대상은 원칙적으로 원처분(원처분주의). 재결 자체를 다투려면 재결에 고유한 위법(주체·절차·형식·내용상 재결만의 하자)이 있어야 함.", "p": "==인용재결로 원처분이 취소되어 제3자가 불이익==을 받으면 그 제3자는 재결을 다툼(재결 고유의 위법). 재결주의를 택한 법률(감사원 변상판정 등)은 재결이 대상.", "e": "행정심판에서 졌다고 '재결을 취소해달라'고 소송하면 안 돼요. 원래 처분을 대상으로 해야 해요. 재결 자체를 다툴 수 있는 건 재결 절차나 내용에 재결만의 새로운 잘못이 있을 때뿐. 예외적으로 법이 '재결을 다투라'고 정한 분야(재결주의)가 있어요.\n예시: 영업정지 처분 → 심판 기각재결 → 소송 대상은 영업정지 처분(피고 시장). 심판위원회가 위원 정족수 미달로 재결 → 재결 고유의 하자, 재결 취소소송 가능. A의 건축허가를 B가 심판으로 취소시킴(인용재결) → A는 재결 취소소송."}, {"t": "처분성이 문제되는 사례", "s": "처분 O: 조세부과, 영업정지, 토지수용재결, 공무원 징계, 국공립대 입학거부, 어업권 면허 거부. 처분 X: 행정규칙·훈령(원칙), 공무원 전보 내신, 소득금액변동통지(원천징수의무자에게는 O), 병역 신체등급 판정(처분 O).", "p": "==소득금액변동통지는 원천징수의무자인 법인에게는 처분==(2006 전합), 소득자 개인에게는 처분 아님. ==건축신고 반려==는 처분(2010 전합). 일반처분(도로 통행금지)도 처분.", "e": "시험은 '이게 처분인가' 사례로 나와요. 기준은 국민의 권리·의무에 직접 법적 영향이 있는지. 특히 세무사 시험에서는 소득금액변동통지가 단골: 법인에게는 원천징수 의무가 생기니 처분, 그 소득을 받은 개인에게는 직접 의무가 안 생기니 처분 아님.\n예시: 세무서가 법인에 '대표자 상여 1억 소득금액변동통지' → 법인은 그 통지를 대상으로 취소소송 가능(원천징수 의무 발생). 대표자 개인은 그 통지를 다투지 못하고 나중에 자기 소득세 부과처분을 다툼. 건축신고를 구청이 반려 → 처분(2010년 판례 변경으로 인정)."}]}, {"name": "원고적격과 소의 이익", "cards": [{"t": "원고적격 — 법률상 이익", "s": "취소소송은 처분의 취소를 구할 법률상 이익이 있는 자가 제기. 처분의 직접 상대방은 당연히 인정. 제3자는 근거 법규·관련 법규가 개별적·직접적·구체적 이익을 보호하는 경우에 인정(법률상 보호이익설).", "p": "==반사적 이익·사실상 이익만으로는 부정==. 근거법규뿐 아니라 ==관련 법규·환경영향평가법 등==으로 보호범위 확장. 단체는 구성원 이익만으로는 원고적격 없음.", "e": "처분을 받은 사람은 당연히 소송할 수 있지만, 옆에서 영향을 받는 제3자는 '법이 내 이익을 보호하려고 만든 규정'이 있어야 해요. 그냥 영업이 잘됐는데 경쟁자가 생겨 손해라는 정도(반사적 이익)로는 안 돼요.\n예시: 공장 설립허가 → 인근 주민이 환경영향평가 대상 지역 안이면 원고적격 O(환경 이익을 법이 보호). 대형마트 허가 → 인근 소상공인 단체 → 단체 자체의 이익이 아니라 회원 이익이므로 원고적격 X. 담배소매인 지정 거리제한 위반 지정 → 기존 소매인 원고적격 O."}, {"t": "경업자·경원자·인근주민 소송", "s": "경업자: 허가업(자유업)은 원칙 부정, 특허업(면허 수 제한)은 긍정. 경원자(하나의 허가를 두고 경쟁): 자기 신청 거부와 타인 허가 모두 다툴 수 있음. 인근주민: 환경·거리 관련 법규가 이익 보호 시 긍정.", "p": "==특허업(버스노선·화물운송·담배소매인)== 기존 업자 원고적격 O, ==일반 허가업(음식점·목욕탕)==은 X. 경원자는 ==타인 허가 취소소송에서 자기 신청이 인용될 가능성 없으면 소익 부정==.", "e": "경쟁자가 새로 허가받았을 때 기존 업자가 다툴 수 있나? 누구나 할 수 있는 영업(음식점)이면 손님 뺏기는 건 반사적 이익이라 못 다퉈요. 법이 숫자를 제한하는 영업(버스 노선, 담배 소매)이면 그 제한이 기존 업자를 보호하니 다툴 수 있어요. 자리 하나를 두고 경쟁(경원)하면 서로 다툴 수 있어요.\n예시: 옆에 새 목욕탕 허가 → 기존 목욕탕 원고적격 X. 같은 노선 시외버스 면허 추가 → 기존 업자 O. 주유소 부지 하나에 A·B가 신청, A에게 허가 → B는 A 허가 취소소송 가능(단 B 자신이 요건 미달로 어차피 안 될 상황이면 소익 X)."}, {"t": "협의의 소익(권리보호 필요)", "s": "처분 효력이 기간 경과·집행 완료 등으로 소멸해도 취소로 회복되는 법률상 이익이 있으면 소익 인정. 가중처벌 규정, 제재 전력 기록, 복직·보수 청구 등이 근거.", "p": "==영업정지 기간 만료 후에도 가중처벌 규정(시행규칙 포함)이 있으면 소익 O==(2006 전합). ==처분이 취소·철회되면 소익 X==. 위법한 처분 반복 위험만으로는 부정.", "e": "영업정지 1개월이 이미 끝났는데도 취소소송을 계속할 실익이 있나? 나중에 또 걸리면 '전에 정지받은 전력'이 있어 더 무거운 처벌을 받는다면(가중처벌), 지금 취소해둘 이익이 있어요. 반대로 행정청이 처분을 스스로 취소했으면 다툴 게 없어요.\n예시: 음식점 영업정지 15일(이미 종료). 식품위생법 시행규칙에 '1년 내 재위반 시 1개월'이라는 가중 규정 → 소익 O. 대학교수 재임용 거부 → 임기 만료 후에도 재임용 심사를 다시 받을 이익 O. 파면처분 후 정년이 지났어도 → 보수·퇴직금 차액 청구 이익 O."}, {"t": "소송 참가와 피고적격", "s": "피고는 처분을 한 행정청(권한 위임 시 수임청, 권한 승계 시 승계청, 폐지 시 사무 승계청). 피고 잘못 지정 시 원고 신청으로 경정 가능(1심 사실심 변론종결 전). 제3자와 다른 행정청은 소송참가 가능.", "p": "==대통령 처분의 피고는 소속 장관==, 국회의장·대법원장 처분은 사무총장·법원행정처장. 합의제기관(공정위, 토지수용위원회)은 ==기관 자체==가 피고. 피고경정은 ==법원 허가==로, 처음 제소 시에 소 제기한 것으로 봄.", "e": "소송 상대방은 '처분을 한 행정청'이에요(국가나 지자체가 아님). 위임받은 기관이 했으면 그 기관, 권한이 다른 곳으로 옮겨갔으면 새 기관. 피고를 잘못 적어도 각하 당하지 않고 법원 허가로 바꿀 수 있고, 제소기간은 처음 낸 날로 계산해요.\n예시: 세무서장이 부과한 소득세 → 피고는 그 세무서장(국세청장이나 국가가 아님). 구청장에게 위임된 영업정지 → 피고 구청장(시장 아님). 공정거래위원회 과징금 → 피고 공정거래위원회. 피고를 국가로 잘못 적음 → 경정 신청으로 세무서장으로 변경."}]}, {"name": "제소기간·관할·소의 변경", "cards": [{"t": "제소기간", "s": "처분이 있음을 안 날부터 90일(불변기간), 처분이 있은 날부터 1년(정당한 사유 있으면 예외). 행정심판을 거친 경우 재결서 정본 송달일부터 90일, 재결 있은 날부터 1년. 둘 중 하나라도 지나면 부적법.", "p": "'안 날'은 ==처분이 있음을 현실적으로 안 날==(통지 수령 시 추정). ==무효확인소송·부작위위법확인소송(심판 안 거친 경우)에는 제소기간 없음==. 불변기간이라 법원이 연장 불가, 소송행위 추후보완만 가능.", "e": "처분을 알고 나서 90일, 몰랐더라도 처분 후 1년 안에 소를 내야 해요. 90일은 '불변기간'이라 법원도 늘려주지 않아요. 행정심판을 거쳤으면 재결서를 받은 날부터 90일. 무효확인소송은 기간 제한이 없어서, 90일을 넘긴 사람들이 '무효'를 주장하며 소송하는 이유예요.\n예시: 3월 2일 부과처분 통지 수령 → 5월 31일까지 취소소송. 심판청구 후 8월 10일 재결서 송달 → 11월 8일까지. 통지가 잘못 배달되어 1년 2개월 만에 알았다면 → '있은 날 1년' 초과이지만 정당한 사유로 허용 가능. 3년 지나서 발견 → 무효사유면 무효확인소송."}, {"t": "관할과 심급", "s": "1심은 피고 소재지 행정법원(없는 지역은 지방법원 본원). 토지수용 등 부동산 관련은 부동산 소재지 법원도 가능. 중앙행정기관이 피고면 대법원 소재지 행정법원(서울)에도 제기 가능. 3심제(행정법원 → 고등법원 → 대법원).", "p": "관할 위반 시 ==각하가 아니라 관할법원으로 이송==. 항고소송을 민사법원에 잘못 제기해도 이송. ==행정사건 관할은 전속관할이 아니라== 합의관할 불가는 아님(단 심급관할은 전속).", "e": "행정소송 1심은 행정법원(서울)이나 지방법원(지방)이에요. 상대가 중앙부처면 서울행정법원에도 낼 수 있어요. 법원을 잘못 골라도 각하가 아니라 맞는 법원으로 옮겨줘요(이송). 제소기간도 처음 낸 날 기준으로 지켜져요.\n예시: 부산 세무서장 처분 → 부산지방법원(행정부). 국세청장 처분 → 세종(피고 소재지) 또는 서울행정법원. 경기도 토지수용 → 피고 토지수용위원회 소재지 또는 토지 소재지 법원. 민사법원에 잘못 냈으면 행정법원으로 이송, 제소기간은 지킨 것으로."}, {"t": "소의 변경과 관련청구 병합", "s": "소의 종류 변경(취소 → 무효확인, 항고 → 당사자소송): 사실심 변론종결 전 법원 허가. 처분변경으로 인한 소 변경: 변경 안 날부터 60일 내. 관련청구(손해배상·부당이득 등)는 취소소송에 병합 가능, 이송도 가능.", "p": "==소 변경 허가 시 처음 소 제기 시에 새 소를 낸 것으로 봄==(제소기간 이익 유지). 관련청구 병합은 ==본체인 취소소송이 적법해야== 가능. 병합된 민사청구도 행정법원이 심리.", "e": "소송 도중에 청구를 바꾸거나 다른 청구를 붙일 수 있어요. 취소소송을 무효확인소송으로 바꾸거나 반대로도 되고, 처분이 중간에 바뀌면 60일 내에 바뀐 처분으로 대상을 바꿔요. 세금 취소소송에 '이미 낸 세금 돌려달라'(부당이득반환)를 함께 묶을 수도 있어요.\n예시: 취소소송 진행 중 제소기간 도과 문제가 드러남 → 무효확인소송으로 변경(허가), 원래 낸 날에 낸 것으로 봄. 영업정지 3개월이 소송 중 2개월로 감경 → 60일 내 감경된 처분으로 소 변경. 부과처분 취소 + 기납부세액 반환청구를 한 소송에서 병합."}, {"t": "집행정지", "s": "취소소송 제기는 처분 효력·집행을 막지 않음(집행부정지 원칙). 회복하기 어려운 손해 예방을 위한 긴급한 필요가 있고 공공복리에 중대한 영향이 없으면 법원이 집행정지 결정(적극 요건 2, 소극 요건 2). 본안 이유 없음이 명백하면 불가.", "p": "==거부처분에는 집행정지 불가==(정지해도 신청 상태로 돌아갈 뿐). 집행정지는 ==본안소송 계속 중==이어야. 결정에 ==기속력== 있음, 즉시항고 가능(정지 효력에 영향 없음). 처분 효력정지는 집행·절차 정지로 목적 달성 못 할 때만.", "e": "소송을 내도 처분은 그대로 집행돼요(영업정지는 그대로 진행). 그래서 판결까지 기다리면 회복 못 할 손해가 생길 때 법원에 '일단 멈춰달라'고 신청하는 게 집행정지. 돈으로 메울 수 있는 손해는 대개 인정 안 되고, 거부처분은 정지해봤자 허가가 되는 게 아니라서 못 해요.\n예시: 병원 폐쇄명령 취소소송 + 집행정지 신청 → 폐쇄되면 환자 이탈로 회복 곤란 → 인용. 세금 부과처분 → 돈이면 나중에 돌려받을 수 있으니 원칙 기각(단 경영 파탄 우려 시 예외). 건축허가 거부 → 집행정지 불가. 정지 결정 후 행정청이 집행하면 기속력 위반."}]}, {"name": "심리와 처분사유", "cards": [{"t": "심리의 원칙", "s": "변론주의 원칙에 직권탐지주의 가미: 법원은 필요시 직권으로 증거조사·사실탐지 가능하나 당사자가 주장하지 않은 사실을 판단 근거로 삼는 데는 한계(기록에 나타난 사항). 행정심판 기록 제출명령 가능.", "p": "==직권심리는 보충적==(당사자 주장 범위 벗어난 새 청구 불가). 소송요건(제소기간·원고적격)은 ==직권조사사항==. 불고불리 원칙: 청구 범위 넘어 판결 불가.", "e": "행정소송은 공익도 걸려 있어 법원이 당사자가 안 낸 증거도 스스로 찾아볼 수 있어요. 하지만 당사자가 청구하지 않은 처분까지 취소할 순 없어요. 제소기간이나 원고적격 같은 요건은 누가 주장하지 않아도 법원이 알아서 살펴요.\n예시: 원고가 부과처분의 절차 위법만 주장했는데 법원이 기록상 드러난 세액 계산 오류를 직권으로 판단 → 가능. 원고가 A처분만 취소 청구했는데 법원이 관련 B처분까지 취소 → 불고불리 위반. 피고가 제소기간 도과를 주장 안 해도 법원이 직권으로 각하."}, {"t": "처분사유의 추가·변경", "s": "소송 중 행정청이 처분 당시 근거로 삼지 않은 새 사유를 추가·변경하는 것은 당초 사유와 기본적 사실관계가 동일한 범위에서만 허용. 동일성은 구체적 사실을 법률적으로 평가하기 전 사회적 사실관계 기준.", "p": "==단순한 법적 근거 조문 추가·정정은 허용==(사실관계 동일). ==새로운 사실을 근거로 한 사유 추가는 불허==(원고 방어권 침해). 처분 후 발생한 사실은 기준시 문제로 별도.", "e": "행정청이 '이 이유로 거부했다'고 해놓고, 소송에서 지게 생기니 '사실 다른 이유도 있었다'고 바꾸면 원고가 방어할 수 없어요. 그래서 원래 사유와 같은 사실에서 나온 것만 추가할 수 있어요. 조문을 잘못 적은 걸 고치는 정도는 OK.\n예시: '주차장 부족'으로 건축허가 거부 → 소송에서 '도로 폭 미달'을 추가 → 다른 사실이라 불허. '식품위생법 44조 위반'을 '같은 사실에 대해 45조 위반'으로 정정 → 허용. 세금 부과 사유를 '가공경비'에서 '같은 거래에 대한 특수관계인 부당행위'로 → 동일 거래 사실이면 허용 경향."}, {"t": "위법판단의 기준시와 입증책임", "s": "처분의 위법 여부는 처분 당시의 사실·법령 상태를 기준으로 판단(처분시설). 처분 후 법령 개정·사정 변경은 고려 안 함. 입증책임은 원칙적으로 처분의 적법성을 행정청이, 예외·감면 사유는 원고가 입증.", "p": "==과세처분 취소소송에서 과세요건 사실은 과세관청이 입증==, 필요경비 등 납세자에게 유리한 사실은 납세자 측이 입증(경험칙상). 부작위위법확인소송은 ==판결시 기준==. 재량행위는 일탈·남용을 원고가 입증.", "e": "처분이 위법한지는 '처분한 그 시점' 기준이에요. 나중에 법이 바뀌어 지금은 허용되는 행위라도 처분 당시 금지였으면 적법. 누가 증명하나: 원칙은 행정청이 처분이 적법함을 증명하지만, 세금에서 '이런 경비를 썼다'처럼 납세자만 아는 사실은 납세자가 증명해요.\n예시: 2025년 영업정지 처분 후 2026년 법 개정으로 해당 행위 허용 → 처분은 2025년 법 기준으로 적법. 세무서가 '매출 누락 1억'을 주장하면 세무서가 입증. 납세자가 '접대비 3천만원 지출'을 주장하면 납세자가 영수증으로 입증. 재량권 남용은 원고가 입증."}, {"t": "위법성 승계와 하자의 승계", "s": "선행처분의 하자를 후행처분 취소소송에서 다툴 수 있는지. 원칙: 선행처분이 무효가 아닌 한 불가(각각 별개 처분). 예외: 선·후행처분이 결합해 하나의 법률효과를 목적으로 하면 승계, 또는 선행처분 불복기간 도과가 수인한도를 넘는 경우.", "p": "==과세처분 → 강제징수(압류)==: 별개 효과, 승계 X. ==대집행 계고 → 통지 → 실행 → 비용징수==: 동일 효과, 승계 O. ==개별공시지가 → 양도세 부과==: 원칙 별개이나 예측·수인 가능성 없으면 승계 O(판례).", "e": "앞 처분에 문제가 있는데 그때 다투지 않고 기간을 넘겼다면, 뒤에 이어지는 처분을 다툴 때 앞 처분의 잘못을 끌어올 수 있나? 원칙은 안 돼요(앞 처분은 확정). 예외로 두 처분이 한 세트일 때(대집행 절차)나 앞 처분을 알 수 없어 다툴 기회가 없었을 때는 가능해요.\n예시: 소득세 부과처분을 안 다투다가 압류가 들어오자 '부과가 잘못됐다' → 승계 X(부과 자체를 다퉜어야). 대집행 계고의 하자를 비용납부명령 단계에서 주장 → 승계 O. 개별공시지가가 잘못됐는데 통지받은 적 없어 몰랐고 그걸 기초로 양도세가 부과됨 → 양도세 소송에서 공시지가 하자 주장 가능."}]}, {"name": "판결", "cards": [{"t": "판결의 종류와 사정판결", "s": "각하(소송요건 흠결), 기각(청구 이유 없음), 인용(취소·일부취소·변경). 사정판결: 처분이 위법하지만 취소가 현저히 공공복리에 적합하지 않을 때 청구를 기각하되 주문에 처분의 위법을 명시, 원고는 손해배상·제해시설 등 청구 가능.", "p": "사정판결은 ==취소소송에만==(무효확인소송 X). ==소송비용은 피고 부담==. 위법 판단 기준시는 처분시, 사정판결 필요 여부는 ==판결시== 기준. 법원 직권으로도 가능.", "e": "처분이 위법하지만 취소하면 오히려 공익에 큰 해가 될 때(이미 댐이 완공됨), 법원이 '위법은 맞지만 취소는 안 한다'고 기각하는 게 사정판결이에요. 대신 판결문에 위법하다고 써주고, 원고는 그걸 근거로 손해배상을 받을 수 있어요. 무효는 애초에 효력이 없는 거라 사정판결이 안 돼요.\n예시: 절차 하자 있는 택지개발 승인, 소송 중 아파트 수천 세대 입주 완료 → 취소하면 사회적 혼란 → 사정판결(청구 기각, 주문에 '승인은 위법'). 원고는 국가배상 청구. 소송비용은 이긴 피고가 부담. 무효확인소송에서는 사정판결 불가."}, {"t": "판결의 효력 — 기속력", "s": "인용판결은 당사자인 행정청과 관계 행정청을 기속. 내용: ① 반복금지(같은 사유로 같은 처분 불가) ② 재처분의무(거부처분 취소 시 판결 취지에 따라 다시 처분) ③ 원상회복의무. 판결 이유 중 위법사유 판단에도 미침.", "p": "==다른 사유(기본적 사실관계 다른)로 다시 거부하는 것은 기속력 위반 아님==. 기속력 위반 처분은 ==무효==. 절차 하자로 취소된 경우 ==절차를 보완해 같은 내용 재처분 가능==. 기각판결에는 기속력 없음.", "e": "원고가 이기면 행정청은 그 판결에 묶여요. 같은 이유로 같은 처분을 또 하면 무효이고, 거부처분이 취소됐으면 판결 취지대로 다시 심사해야 해요. 단 '다른 이유'로 다시 거부하는 건 가능하고, 절차만 잘못이었으면 절차를 고쳐 같은 처분을 할 수 있어요.\n예시: '경관 훼손' 사유 건축허가 거부가 취소됨 → 구청이 같은 사유로 재거부 → 무효. '도로 미접' 새 사유로 재거부 → 가능(다시 소송해야). 청문 없이 한 영업정지가 절차 위법으로 취소됨 → 청문 거친 뒤 같은 영업정지 → 적법. 원고가 진 기각판결은 행정청이 처분을 스스로 취소해도 무방."}, {"t": "판결의 효력 — 형성력·기판력·제3자효", "s": "형성력: 취소판결 확정으로 처분은 별도 행위 없이 소급하여 효력 상실. 제3자에게도 효력(대세효) → 제3자 소송참가·재심청구 제도. 기판력: 확정판결의 판단은 후소에서 다시 다툴 수 없음(당사자와 후소 법원 기속).", "p": "==취소판결의 기판력은 국가배상소송에 미침==(위법성 판단 동일, 다수 판례). 기각판결 후 ==같은 처분의 무효확인소송은 기판력에 저촉==. 제3자 재심은 확정 안 날부터 30일, 판결 확정 후 1년 내.", "e": "취소판결이 확정되면 처분은 처음부터 없었던 게 돼요(형성력). 행정청이 따로 취소 조치를 안 해도요. 이 효력은 소송에 참여 안 한 제3자에게도 미치니, 자기도 모르게 불이익을 받은 제3자는 뒤늦게 재심을 청구할 수 있어요. 기판력은 같은 다툼을 반복 못 하게 하는 효력.\n예시: B의 건축허가가 A의 소송으로 취소 확정 → B는 소송에 없었어도 허가 소멸(제3자효). B가 소송 사실을 몰랐고 자기 책임이 아니면 안 날부터 30일 내 재심. 부과처분 취소소송에서 원고 패소 확정 → 같은 처분이 무효라는 소송은 기판력 때문에 불가."}, {"t": "재처분의무와 간접강제", "s": "거부처분 취소판결·부작위위법확인판결 확정 후 행정청이 상당한 기간 내 재처분하지 않으면, 1심 법원이 원고 신청으로 기간을 정해 이행을 명하고 불이행 시 손해배상(간접강제금)을 명함. 결정은 변론 없이 가능, 집행권원.", "p": "간접강제는 ==거부처분 취소·부작위위법확인 판결==에만(적극적 처분 취소는 X). ==다른 사유로 재거부하면 재처분한 것==이므로 간접강제 불가. 배상금은 ==심리적 강제 수단==, 기간 도과 후 재처분하면 추가 배상금 추심 불가(판례).", "e": "거부처분이 취소됐는데 행정청이 다시 처분을 안 하고 버티면, 법원이 '언제까지 처분하라, 안 하면 하루에 얼마씩 물어라'고 명령할 수 있어요. 단 행정청이 '다른 이유'로 다시 거부했다면 어쨌든 처분은 한 거라 간접강제는 안 돼요. 배상금은 압박 수단이라 늦게라도 처분하면 그 후 금액은 못 받아요.\n예시: 허가 거부 취소판결 확정 후 6개월 무응답 → 원고가 1심 법원에 간접강제 신청 → '30일 내 처분, 지연 시 일 10만원'. 구청이 45일째 새 사유로 재거부 → 15일분 150만원은 이미 발생했지만 판례상 처분 후에는 추심 불가. 영업정지 취소판결 → 간접강제 대상 아님(취소로 목적 달성)."}]}, {"name": "무효등확인·부작위위법확인소송", "cards": [{"t": "무효등확인소송", "s": "처분의 무효·유효·존재·부존재 확인을 구하는 소송. 제소기간·행정심판 전치 적용 없음. 무효사유는 하자가 중대하고 명백해야(중대명백설). 즉시확정의 이익(보충성)은 요구되지 않음(2008 전합).", "p": "==취소소송 제기기간 내에 무효사유로 취소소송을 낼 수도==(무효를 선언하는 의미의 취소판결). ==무효확인소송에 취소청구가 포함==된 것으로 보아, 제소기간 준수 시 취소사유만 있어도 취소 가능. 사정판결·집행정지 중 ==집행정지는 준용==, 사정판결은 X.", "e": "하자가 너무 커서 처분이 애초에 효력이 없다고 다투는 소송이에요. 기간 제한과 심판 전치가 없어 취소소송 기간을 놓친 사람이 자주 이용해요. 대신 '중대하고 명백한' 하자여야 하니 이기기 어려워요. 예전엔 민사소송처럼 '다른 구제수단이 없어야' 했는데 2008년 판례 변경으로 그 요건이 사라졌어요.\n예시: 세무서가 이미 사망한 사람에게 부과처분 → 중대·명백 → 무효. 세액 계산 일부 오류 → 취소사유일 뿐 무효 아님, 90일 넘기면 다툴 수 없음. 세금을 이미 냈어도 부당이득반환 민사소송 대신 바로 무효확인소송 가능(보충성 불요)."}, {"t": "부작위위법확인소송", "s": "신청에 대해 행정청이 상당한 기간 내 아무 응답(처분)도 하지 않는 부작위가 위법함을 확인. 요건: 법규상·조리상 신청권, 상당한 기간 경과, 응답의무 존재, 처분 부존재. 심판 거친 경우 제소기간 적용, 안 거치면 없음.", "p": "==판결은 응답의무만 발생==(원고가 원하는 내용의 처분 의무 X, 거부해도 이행). 위법 판단 기준시는 ==판결시==. 소송 중 처분이 있으면 ==소익 소멸(각하)==. 신청권 없으면 각하.", "e": "허가 신청을 했는데 행정청이 가타부타 답이 없을 때, '답을 안 하는 게 위법'이라는 확인을 받는 소송이에요. 이겨도 행정청은 '뭐라도 답하면' 되고, 거부해도 판결 이행이에요. 그래서 실효성은 약하고, 거부처분이 나오면 그때 취소소송으로 다퉈요.\n예시: 3월 건축허가 신청, 12월까지 무응답 → 부작위위법확인소송 → 인용 → 구청이 '거부' 처분 → 재처분의무 이행(원고는 거부처분 취소소송으로). 소송 중 구청이 허가 → 소익 없어 각하. 이웃이 '옆집 허가 취소해달라'고 신청 후 무응답 → 신청권 없어 각하."}, {"t": "당사자소송", "s": "행정청의 처분 등을 원인으로 하는 법률관계나 공법상 법률관계에 관한 소송으로 그 법률관계의 한쪽 당사자(국가·공공단체 등)를 피고로 함. 형식적 당사자소송(토지수용 보상금 증감)과 실질적 당사자소송(공무원 지위확인, 공법상 계약).", "p": "피고는 ==행정청이 아니라 국가·지자체·공공단체==. 제소기간 원칙 없음(법률 규정 시 예외). ==처분 자체를 다투면 항고소송==, 처분 결과 생긴 권리관계를 다투면 당사자소송. 가집행선고 가능(국가 상대는 제한 없음, 2022 헌재).", "e": "처분을 취소해달라는 게 아니라 '나는 공무원이다', '보상금은 얼마여야 한다'처럼 공법상 권리관계 자체를 다투는 소송이에요. 상대는 처분청이 아니라 국가·지자체예요. 보상금 증액 소송은 형식은 당사자소송이지만 실질은 재결을 다투는 특수한 형태예요.\n예시: 토지수용 보상금 1억 재결이 적다 → 사업시행자를 피고로 보상금 증액 청구(형식적 당사자소송). 국립대 교수 임용 무효 주장 → 임용처분 무효확인은 항고소송, 교수 지위 확인은 국가 상대 당사자소송. 공무원 봉급·퇴직금 지급 청구 → 당사자소송. 부가세 환급세액 지급 청구도 당사자소송(2013 전합)."}, {"t": "항고소송 유형 비교 정리", "s": "취소·무효확인·부작위위법확인의 제소기간, 전치주의, 사정판결, 집행정지, 간접강제 적용 여부를 비교. 취소: 모두 O. 무효확인: 제소기간·전치·사정판결 X, 집행정지 O, 간접강제 X. 부작위: 제소기간(심판 시)·전치 O, 사정판결·집행정지 X, 간접강제 O.", "p": "==집행정지: 취소·무효확인 O, 부작위 X==. ==간접강제: 취소(거부처분)·부작위 O, 무효확인 X==(판례). ==사정판결: 취소만==. 제3자효·기속력은 세 소송 모두.", "e": "세 항고소송에 어떤 제도가 붙는지 표로 외우는 문제가 단골이에요. 논리로 기억하세요: 집행정지는 '멈출 처분'이 있어야 하니 부작위엔 없음. 간접강제는 '다시 처분하라'는 의무가 있는 거부처분 취소와 부작위에만. 사정판결은 '위법하지만 유지'인데 무효는 유지할 효력이 없으니 불가.\n예시: 영업정지(적극 처분) 취소소송 → 집행정지 O, 간접강제 X. 허가 거부처분 취소 → 집행정지 X(거부라서), 간접강제 O. 부과처분 무효확인 → 제소기간 없음, 집행정지 신청 가능, 사정판결 불가. 허가 신청 무응답 → 부작위위법확인, 판결 후 무응답 시 간접강제."}]}]};
  const EXTRA={"fa-2": [{"t": "감가상각방법 비교", "s": "정액법(매년 동일), 정률법(기초장부금액×상각률, 초기 큼), 연수합계법(잔여연수/연수합계, 초기 큼), 생산량비례법(사용량 비례). 잔존가치는 정률법 외에는 상각기준액에서 차감.", "p": "==기중 취득은 월할 상각==. 정률법은 ==취득원가(장부금액)에 상각률==을 곱하고 잔존가치를 빼지 않음. 초기 상각비: 정률 ≥ 연수합계 > 정액.", "e": "같은 기계라도 어떤 방법으로 나누느냐에 따라 매년 비용이 달라요. 정액법은 똑같이, 정률법과 연수합계법은 초기에 많이. 시험은 기중에 샀을 때 월할 계산과, 정률법에서 잔존가치를 빼지 않는다는 점을 자주 물어요.\n예시: 취득원가 1,000, 잔존가치 100, 내용연수 3년, 7월 1일 취득. 정액법 1년차 = (1,000−100)/3 × 6/12 = 150. 연수합계법 1년차 = 900 × 3/6 × 6/12 = 225. 정률법(상각률 50%) 1년차 = 1,000 × 50% × 6/12 = 250, 2년차 = (1,000−250) × 50% = 375."}], "fa-4": [{"t": "거래원가 처리", "s": "금융자산 취득 시 수수료 등 거래원가는 FVPL은 당기비용, AC·FVOCI는 취득원가에 가산. 금융부채 발행비용은 발행금액에서 차감(유효이자율 재계산).", "p": "==FVPL 거래원가만 비용==, 나머지는 자산 가산. 처분 시 거래원가는 모든 범주에서 처분손익에 반영(처분금액에서 차감).", "e": "주식이나 채권을 살 때 낸 수수료를 어떻게 하느냐. 시가로 매기 평가하는 FVPL은 어차피 바로 평가되니 수수료를 비용으로 떨어뜨리고, 원가 기반인 AC와 FVOCI는 취득원가에 넣어요.\n예시: 주식 1,000 매입 + 수수료 10. FVPL 지정 → 자산 1,000, 비용 10. 기말 시가 1,050 → 평가이익 50. 같은 주식을 FVOCI 지정 → 자산 1,010, 기말 OCI 40. 두 경우 총 손익 효과(40)는 같지만 당기손익과 OCI 구성이 달라요."}], "fa-6": [{"t": "우선주 배당 배분", "s": "누적적 우선주는 밀린 배당(연체배당)을 먼저 받음. 참가적 우선주는 보통주가 우선주 배당률만큼 받은 뒤 남은 배당을 함께 나눔(완전참가) 또는 상한까지(부분참가). 비참가적은 정해진 배당률만.", "p": "배분 순서: ==① 우선주 연체배당 ② 우선주 당기배당 ③ 보통주 동률배당 ④ 잔여를 참가비율로==. 비누적·비참가면 ②만.", "e": "배당금 총액이 정해지면 우선주와 보통주가 얼마씩 가져가는지 계산하는 문제예요. 누적적이면 못 받은 과거분부터, 참가적이면 기본 배당 후 남은 돈도 같이 나눠요. 순서대로 차감해가면 돼요.\n예시: 배당 총액 2,000. 우선주 자본금 5,000(배당률 5%, 누적적·완전참가, 1년 연체), 보통주 자본금 10,000. ① 연체 250 ② 당기 250 ③ 보통주 5% 500 ④ 잔여 1,000을 5,000:10,000으로 → 우선주 333, 보통주 667. 우선주 합계 833, 보통주 1,167."}], "fa-7": [{"t": "고객충성제도(포인트)", "s": "판매 시 부여한 포인트는 별도 수행의무. 거래가격을 재화와 포인트의 개별판매가격(사용 예상률 반영) 비율로 배분해 포인트분은 계약부채로 이연, 사용될 때(또는 사용 비율만큼) 수익 인식.", "p": "포인트 개별판매가격 = ==포인트당 가치 × 부여 포인트 × 예상 사용률==. 예상 사용률이 바뀌면 ==누적 기준으로 수익 조정==(추정 변경).", "e": "10만원어치 사면 1,000포인트를 주는 제도. 손님이 나중에 포인트로 물건을 가져가니 그만큼은 '아직 안 판 것'이에요. 그래서 판매 시 10만원 중 일부를 포인트 몫으로 떼어 부채로 두고, 포인트가 쓰일 때 수익으로 돌려요.\n예시: 매출 100,000, 포인트 1,000개(1개 = 1원), 예상 사용률 80% → 포인트 개별판매가 800. 배분: 재화 100,000×100,000/100,800 = 99,206, 포인트 794(계약부채). 1년차 400포인트 사용 → 794 × 400/800 = 397 수익. 2년차 사용률 예상이 90%로 바뀌고 누적 700 사용 → 누적 수익 794×700/900 = 617, 당기 220."}, {"t": "계약자산·계약부채·수취채권", "s": "수취채권은 대가를 받을 무조건적 권리(시간만 지나면 됨). 계약자산은 수행은 했으나 대가 청구가 다른 조건(다른 수행의무 이행 등)에 달린 권리. 계약부채는 대가를 먼저 받았거나 받을 권리가 생겼는데 아직 이행 안 한 의무.", "p": "==청구권이 시간 경과에만 달려 있으면 수취채권, 추가 이행에 달려 있으면 계약자산==. 계약부채는 선수금 성격. 같은 계약의 계약자산·부채는 순액 표시.", "e": "물건은 넘겼는데 돈 받을 권리가 조건부인지 확정인지에 따라 이름이 달라요. 청구서만 보내면 되는 상태면 수취채권, '두 번째 물건까지 넘겨야 돈 준다'면 계약자산. 돈을 먼저 받았으면 계약부채(선수금).\n예시: 제품 A(500)와 B(500)를 묶어 1,000에 계약, 대가는 둘 다 인도 후 청구 가능. A만 인도 → 수익 500, 계약자산 500(B 인도 조건). B 인도 → 수익 500, 계약자산 → 수취채권 1,000. 반대로 계약금 300을 먼저 받았으면 계약부채 300, A 인도 시 수익 500 인식하며 계약부채 300 제거 + 계약자산 200."}], "fa-8": [{"t": "리스기간 판단", "s": "리스기간 = 해지불능기간 + 연장선택권 행사가 상당히 확실한 기간 + 종료선택권을 행사하지 않을 것이 상당히 확실한 기간. 판단은 리스개시일에 하고 유의적 사건 발생 시 재검토.", "p": "==연장·종료 옵션의 행사 여부는 경제적 유인(개량 투자, 이전 비용)==으로 판단. 리스기간 변경 시 ==리스부채 재측정(수정 할인율)==, 사용권자산 조정.", "e": "계약서에 3년이라고 써 있어도 '2년 더 연장할 수 있음' 옵션을 거의 확실히 쓸 거면 리스기간은 5년이에요. 그 판단은 '옵션을 안 쓰면 손해 볼 것들'(인테리어에 큰돈을 들임, 이전 비용)이 있는지로 해요.\n예시: 매장 3년 리스 + 2년 연장옵션. 인테리어에 5억을 투자했고 5년은 써야 회수 가능 → 연장이 상당히 확실 → 리스기간 5년으로 리스부채 계산. 2년차에 사업 축소로 연장 안 하기로 → 리스기간 3년으로 변경, 남은 리스료 현재가치로 부채 재측정하고 차이를 사용권자산에서 조정."}], "fa-9": [{"t": "법인세비용 계산 순서", "s": "① 회계이익에서 세무조정으로 과세소득 → 당기법인세 ② 기말 일시적차이 × 세율 = 기말 이연법인세 자산·부채 ③ 기초와의 차이가 이연법인세비용(수익) ④ 법인세비용 = 당기법인세 + 이연법인세 변동. 자본·OCI 귀속분은 제외.", "p": "==영구적차이는 과세소득에는 영향, 이연법인세에는 무관==. 유효세율 = 법인세비용 / 회계이익, 영구적차이 있으면 법정세율과 달라짐. 세율 변경 시 기초 이연법인세 재계산분도 당기 손익.", "e": "법인세 문제는 순서대로 풀면 돼요. 먼저 낼 세금(당기법인세), 그다음 기말에 있어야 할 이연법인세 잔액, 기초 잔액과 비교해 변동분을 더하거나 빼요. 영구적차이(접대비 초과 등)는 세금은 늘리지만 이연법인세와는 무관해요.\n예시: 회계이익 1,000, 접대비 한도초과 100(영구), 감가상각 한도초과 200(일시적, 기말 누적 300, 기초 100), 세율 20%. 과세소득 1,300 → 당기법인세 260. 기말 이연법인세자산 60, 기초 20 → 변동 +40(이연법인세수익). 법인세비용 = 260 − 40 = 220. 유효세율 22%(영구적차이 때문에 20%보다 높음)."}], "fa-10": [{"t": "직접법 현금흐름 계산", "s": "고객으로부터 유입 = 매출 + 기초매출채권 − 기말매출채권(대손·선수금 조정). 공급자 지급 = 매출원가 + 기말재고 − 기초재고 + 기초매입채무 − 기말매입채무. 이자·법인세 지급도 발생액에 미지급 증감 조정.", "p": "==매출채권 대손상각·제각은 현금과 무관==하므로 조정. 감가상각비는 매출원가에 포함되었다면 공급자 지급액 계산에서 제외. 선수금 증가는 유입 가산.", "e": "발생주의 숫자(매출, 매출원가)를 실제 현금으로 바꾸는 계산이에요. 매출채권이 늘었다면 그만큼 아직 못 받았으니 빼고, 재고가 늘었으면 그만큼 더 사느라 돈이 나갔으니 더해요. T계정을 그리면 실수가 줄어요.\n예시: 매출 10,000, 기초 매출채권 1,500, 기말 2,000, 당기 대손 제각 100 → 현금유입 = 10,000 + 1,500 − 2,000 − 100 = 9,400. 매출원가 6,000, 기초재고 800, 기말 1,000, 기초 매입채무 600, 기말 900 → 매입 6,200, 지급 = 6,200 + 600 − 900 = 5,900."}], "fa-11": [{"t": "외화환산", "s": "외화거래는 거래일 환율로 기록. 기말에 화폐성 항목(현금·채권·채무)은 마감환율로 환산하고 환산손익은 당기손익. 비화폐성 항목은 역사적 환율(원가) 또는 공정가치 측정일 환율(공정가치).", "p": "==화폐성 = 확정된 화폐단위로 받거나 줄 것==(매출채권, 차입금, 사채). 재고·유형자산·선급금·선수금은 비화폐성. 외화 FVOCI 채무상품 환산차이는 당기손익, 지분상품은 OCI.", "e": "달러로 거래하면 원화 장부에 환율을 곱해 적는데, 환율이 바뀌면 달러 채권·채무의 원화 가치도 바뀌어요. 이런 '돈 받을·줄 것'(화폐성)만 기말에 다시 환산하고, 이미 산 재고나 기계(비화폐성)는 산 날 환율로 그대로 둬요.\n예시: 10/1 $100 외상매출(환율 1,300) → 매출채권 130,000. 12/31 환율 1,350 → 채권 135,000, 외환차익 5,000(당기손익). 같은 날 $100에 산 기계(비화폐성)는 130,000 그대로. 1/20 회수 시 환율 1,320 → 132,000 수령, 외환차손 3,000."}, {"t": "매각예정비유동자산과 중단영업", "s": "매각 가능성이 매우 높고 1년 내 매각 예상되면 매각예정으로 분류: 감가상각 중단, 장부금액과 순공정가치 중 낮은 금액으로 측정, 유동자산으로 별도 표시. 중단영업 손익은 세후 단일 금액으로 별도 표시.", "p": "==매각예정 분류 후 감가상각 중지==. 순공정가치 하락 시 손상, 회복 시 ==누적 손상 범위 내 환입==. 중단영업 요건: 별도 주요 사업계열·지역이거나 매각 목적 취득 종속기업.", "e": "공장이나 사업부를 팔기로 확정하면 그건 더 이상 '사용할 자산'이 아니라 '팔 물건'이에요. 그래서 감가상각을 멈추고, 팔면 받을 값(순공정가치)이 장부보다 낮으면 그 값으로 낮춰요. 사업 전체를 접는 거면 그 손익을 따로 '중단영업손익'으로 보여줘요.\n예시: 장부 1,000 건물(연 상각 100)을 7/1 매각예정 분류, 순공정가치 850 → 손상 150, 하반기 상각 없음. 12/31 순공정가치 920 → 70 환입(150 한도). 별도 사업부 매각이면 그 사업부 수익·비용·매각손익을 세후 합산해 '중단영업이익'으로 한 줄 표시."}], "ca-2": [{"t": "연속공정과 전공정원가", "s": "2공정 이상이면 앞 공정의 완성품원가가 다음 공정에 전공정원가로 투입(공정 시작 시 100%). 후속 공정은 전공정원가·재료비·가공비 세 요소로 환산량 계산.", "p": "==전공정원가는 항상 공정 초에 전량 투입==된 재료처럼 완성도 100%. 제2공정 기말재공품에도 전공정원가는 전액 배분.", "e": "1공정에서 만든 반제품이 2공정으로 넘어가면, 2공정 입장에서는 '1공정에서 온 원가'가 시작부터 붙어 있는 재료나 마찬가지예요. 그래서 2공정 완성품환산량 계산 때 전공정원가는 100%로 봐요.\n예시: 1공정 완성품 1,000개 원가 50,000이 2공정으로 이전. 2공정 완성 800, 기말재공품 200(가공비 50%). 전공정원가 환산량 = 800 + 200 = 1,000(단위 50). 2공정 가공비 27,000, 환산량 900 → 단위 30. 기말재공품 = 200×50 + 100×30 = 13,000."}], "ca-3": [{"t": "고객수익성 분석", "s": "ABC를 고객별로 적용: 주문처리·배송·반품·특별요구 활동원가를 고객별 원가동인으로 배부해 고객별 영업이익 산출. 매출이 큰 고객이 서비스 비용 때문에 저수익일 수 있음.", "p": "==매출 규모 ≠ 수익성==. 소량·잦은 주문·반품 많은 고객은 배치수준 원가가 커서 이익률 낮음. 개선책: 최소주문량, 서비스 요금 부과, 거래 조건 조정.", "e": "매출 1위 고객이 사실 손해 보는 고객일 수 있어요. 주문을 잘게 자주 하고 반품이 많으면 주문 처리·배송 비용이 매출총이익을 다 먹어요. 고객별로 활동원가를 붙여 계산해보면 드러나요.\n예시: 고객 A 매출 10,000(매출총이익 3,000), 주문 100회(회당 20), 배송 100회(회당 15), 반품 20회(회당 50) → 활동원가 4,500 → 영업손실 1,500. 고객 B 매출 6,000(총이익 1,800), 주문 5회, 배송 5회, 반품 0 → 활동원가 175 → 영업이익 1,625. B가 더 좋은 고객."}], "ca-4": [{"t": "현금흐름분기점", "s": "고정원가 중 현금 지출이 없는 항목(감가상각비 등)을 제외한 현금고정원가만 회수하는 판매량. 현금BEP = (고정원가 − 비현금고정원가) / 단위당 공헌이익. 법인세 고려 시 세금 효과 조정.", "p": "==현금BEP < 회계BEP==(감가상각비만큼 낮음). 법인세 있으면 감가상각비의 절세효과(감가상각비 × 세율)만큼 현금유출이 더 줄어듦.", "e": "회계상 손익분기점에는 감가상각비가 들어 있지만, 감가상각비는 실제로 돈이 나가는 게 아니에요. 그래서 '당장 현금이 마이너스가 안 되는 판매량'은 그보다 낮아요. 세금이 있으면 감가상각비가 세금을 줄여주는 효과까지 넣어요.\n예시: 고정원가 100,000(감가상각비 20,000 포함), 단위당 공헌이익 40. 회계BEP 2,500개. 현금BEP = 80,000/40 = 2,000개. 세율 30% 고려: 현금유출 = 80,000 − 20,000×30%(절세) = 74,000, 세후 공헌이익 28 → 현금BEP ≈ 2,643개."}], "ca-5": [{"t": "매출차이 분석", "s": "매출가격차이 = (실제가격 − 예산가격) × 실제수량. 매출조업도차이 = (실제수량 − 예산수량) × 예산 단위당 공헌이익. 복수제품이면 조업도차이를 매출배합차이(배합 변화)와 매출수량차이(총량 변화)로 분해.", "p": "==매출조업도차이는 공헌이익 기준==(판매가 기준 아님). 매출배합차이 = (실제배합 − 예산배합) × 실제총수량 × 예산 단위공헌이익. 매출수량차이는 총수량 차이 × 예산 가중평균 공헌이익.", "e": "예산보다 이익이 적을 때 '가격을 못 받아서'인지 '덜 팔아서'인지, 덜 팔았다면 '전체가 줄어서'인지 '이익 좋은 제품 비중이 줄어서'인지 나눠 보는 거예요. 원가차이와 구조가 같고 공헌이익으로 계산하는 게 포인트.\n예시: 제품 A 예산 100개(공헌이익 30), B 200개(공헌이익 10). 실제 A 90개, B 240개(총 330, 예산 300). 매출수량차이 = 30개 × 가중평균(100×30+200×10)/300 = 30×16.67 = 500 유리. 배합차이: 실제배합 A 27.3%(예산 33.3%) → A (0.273−0.333)×330×30 = −594, B (0.727−0.667)×330×10 = +198 → 396 불리."}], "ca-6": [{"t": "불확실성하 의사결정", "s": "각 대안의 성과를 확률로 가중한 기대가치로 비교. 완전정보의 기대가치(EVPI) = 완전정보 하 기대가치 − 기존 최선 대안 기대가치 = 정보에 지불할 최대금액. 불완전정보는 사후확률로 계산.", "p": "==EVPI는 정보 구입비 상한==. 기대가치 극대화는 위험중립 가정. 후회 최소화·맥시민 등은 위험회피 기준.", "e": "내년 수요가 좋을지 나쁠지 모를 때 어떤 설비를 고를까? 각 시나리오 확률로 가중평균(기대가치)해서 큰 걸 고르고, '내년 수요를 정확히 알려주는 정보'가 있다면 얼마까지 낼 수 있나(EVPI)를 계산해요.\n예시: 대형설비 이익: 호황(60%) 500, 불황(40%) −100 → 기대 260. 소형설비: 호황 200, 불황 150 → 기대 180. 대형 선택(260). 완전정보가 있으면 호황엔 대형(500), 불황엔 소형(150) → 0.6×500 + 0.4×150 = 360. EVPI = 360 − 260 = 100 → 시장조사비 100까지 지불 가능."}], "ca-7": [{"t": "현금예산", "s": "기초현금 + 현금유입(매출 회수: 당월·익월 회수율, 기초 매출채권) − 현금유출(매입대금 지급 시점, 인건비, OH 중 현금항목, 설비투자, 세금) = 기말현금. 최소보유액 미달 시 차입, 초과 시 상환.", "p": "==감가상각비는 현금예산에서 제외==. 매출 회수는 판매월 기준 회수율로 월별 배분, 매입 지급도 지급조건 반영. 이자는 차입 시점 이후 계산.", "e": "이익이 나도 돈이 없으면 부도예요. 그래서 월별로 실제 들어오고 나가는 현금을 예측해요. 외상매출은 '판 달에 40%, 다음 달 60%'처럼 회수 시점으로 나누고, 감가상각비처럼 돈이 안 나가는 비용은 빼요.\n예시: 3월 매출 10,000, 4월 12,000. 회수: 당월 40%, 익월 60%. 4월 유입 = 12,000×40% + 10,000×60% = 10,800. 4월 매입 7,000(당월 50%, 익월 50%), 3월 매입 6,000 → 4월 지급 3,500 + 3,000 = 6,500. 인건비 2,000, OH 1,500(감가상각 500 포함 → 현금 1,000). 기초현금 1,000 → 기말 = 1,000 + 10,800 − 6,500 − 2,000 − 1,000 = 2,300."}], "tx-0": [{"t": "납세의무의 승계", "s": "법인이 합병으로 소멸하면 합병법인이 세금·가산금·체납처분비를 승계. 상속인은 상속받은 재산 한도 내에서 피상속인의 국세를 승계(상속인이 여럿이면 상속분 비율, 연대납부의무).", "p": "상속인은 ==상속받은 재산 한도==, 합병법인은 ==한도 없이== 전부 승계. 상속포기자는 승계 없음(단 피상속인이 받은 보험금 등은 상속재산으로 봄).", "e": "세금 낼 사람이 죽거나 회사가 합병으로 없어지면 세금도 따라가요. 회사 합병은 새 회사가 전부 떠안고, 상속은 물려받은 재산만큼만 책임져요(빚이 재산보다 많으면 상속포기로 벗어남).\n예시: 아버지 체납 소득세 5억, 상속재산 3억을 두 자녀가 1:1 상속 → 각 1.5억 한도로 승계, 서로 연대. 상속포기하면 승계 없음. 단 아버지가 납세의무 성립 후 사망보험금 2억을 자녀에게 남겼다면 그 2억은 상속재산으로 보아 한도에 포함(회피 방지)."}], "tx-1": [{"t": "국세환급금과 환급가산금", "s": "잘못 낸 세금·초과납부액은 국세환급금으로 결정 후 30일 내 지급. 납부일 다음날부터 지급일까지 환급가산금(이자) 가산. 체납 국세가 있으면 먼저 충당(납세자 동의 없이도 가능한 경우와 동의 필요한 경우 구분).", "p": "충당 순서: ==체납 국세·강제징수비 → 납부고지된 국세(동의 필요 없음) → 납세자가 동의하면 신고 국세==. 환급청구권 소멸시효 5년. 경정청구로 인한 환급도 환급가산금 O.", "e": "세금을 더 냈으면 돌려받는데 이자(환급가산금)도 붙어요. 단 다른 체납 세금이 있으면 돌려주지 않고 거기에 먼저 충당해요. 환급받을 권리도 5년 지나면 사라져요.\n예시: 2025.5.31 소득세 1,000만원 납부, 경정청구로 300만원 환급 결정(2026.4.1) → 2025.6.1~지급일까지 환급가산금(연 이자율 적용) 가산. 이 사람에게 체납 부가세 200만원이 있으면 200만원은 충당하고 100만원+가산금만 지급."}], "tx-3": [{"t": "의제배당", "s": "실제 배당은 아니지만 배당으로 보는 것: 감자·퇴사·탈퇴로 받는 금액이 취득가액을 초과하는 부분, 해산 시 잔여재산 분배액 초과분, 합병·분할 대가 초과분, 잉여금의 자본전입(무상주). 단 주식발행초과금·감자차익 등 자본준비금의 자본전입은 의제배당 아님.", "p": "==자본준비금(주식발행초과금 등)의 자본전입은 의제배당 X==, 이익준비금·기타 이익잉여금 전입은 O. 자기주식 보유 상태에서 자본준비금 전입 시 ==다른 주주 지분 증가분은 의제배당==.", "e": "회사에서 배당이란 이름 없이 돈이나 주식이 나가도 실질이 이익 분배면 배당으로 과세해요. 감자로 받은 돈이 주식 산 값보다 많으면 그 차이, 이익잉여금으로 무상주를 주면 그 액면가액이 배당이에요. 주식발행초과금으로 준 무상주는 원래 주주 돈이라 배당이 아니에요.\n예시: 주주가 5,000원에 취득한 주식을 회사가 감자하며 8,000원 지급 → 3,000원 의제배당. 이익준비금 1억으로 무상증자(액면 500원 × 20만주) → 각 주주에게 액면 기준 배당(20% 주주면 2,000만원). 주식발행초과금 1억으로 무상증자 → 의제배당 없음."}], "tx-4": [{"t": "업무용승용차 관련비용", "s": "법인의 업무용승용차(개별소비세 과세 대상 승용차)는 임직원 전용보험 가입이 손금 요건. 운행기록부로 업무사용비율 입증, 미작성 시 연 1,500만원까지만 업무사용 인정. 감가상각은 5년 정액법 강제, 연 800만원 한도(초과분 이월).", "p": "==전용보험 미가입 시 전액 손금불산입==(부분 인정 규정 있음). 감가상각비 한도 800만원, 처분손실도 연 800만원 한도 이월. 리스·렌트 차량은 리스료 중 감가상각비 상당액에 한도 적용.", "e": "회사 차를 개인처럼 쓰면서 비용 처리하는 걸 막는 규정이에요. 임직원만 운전하는 보험에 들어야 하고, 운행일지를 안 쓰면 연 1,500만원까지만 비용. 비싼 차를 사서 한 번에 상각하지 못하게 감가상각도 연 800만원으로 묶어요.\n예시: 1.5억 승용차, 전용보험 가입, 운행기록부 없음, 연 관련비용(감가상각 3,000만원 + 유류·보험 700만원 = 3,700만원) → 1,500만원만 업무사용 인정, 2,200만원 손금불산입(상여). 운행기록부로 업무비율 90% 입증 시 3,330만원 인정하되 감가상각비는 800만원 한도 → 초과분 이월."}, {"t": "퇴직급여충당금과 퇴직연금", "s": "퇴직급여충당금 손금한도 = min(총급여 × 5%, 퇴직급여추계액 × 0% − 기설정액…)이라 사실상 한도 0(2016년부터). 대신 확정기여형(DC) 퇴직연금 부담금은 전액 손금, 확정급여형(DB) 사외적립액은 퇴직연금충당금으로 손금(추계액 한도).", "p": "==DC형 납입액은 납입 시 전액 손금==(충당금 불요). DB형은 ==퇴직연금충당금 신고조정 가능==, 한도 = 추계액 − 기말 퇴직급여충당금 잔액. 회계상 퇴직급여충당부채 설정액은 손금불산입(유보).", "e": "회사가 장부에 '나중에 줄 퇴직금'을 비용으로 쌓아도 세법은 인정 안 해요(한도 0). 실제로 퇴직연금에 돈을 넣어야 손금이에요. DC형은 넣는 즉시 비용, DB형은 사외에 적립한 금액을 추계액 한도로 손금.\n예시: 회계상 퇴직급여 2억 설정(충당부채) → 세법 손금불산입 2억(유보). 같은 해 DB형 퇴직연금에 1.5억 납입, 퇴직급여추계액 5억, 기존 충당금 0 → 퇴직연금충당금 1.5억 신고조정 손금(△유보). DC형이면 납입액 1.5억 그대로 손금이고 추계액 계산 불필요."}], "tx-5": [{"t": "외국납부세액공제", "s": "국외원천소득에 외국에서 낸 법인세는 세액공제(또는 손금산입 선택). 공제한도 = 산출세액 × 국외원천소득/과세표준(국가별 한도). 한도 초과분 10년 이월, 이월 후 미공제분은 손금산입 가능.", "p": "==국가별 한도 방식==. 간접외국납부세액(외국 자회사 지분 10% 이상, 배당에 대응하는 법인세)도 공제 대상이며 익금에 가산. 한도 초과액 ==10년 이월==.", "e": "해외에서 번 소득에 부. 본점이 부산 지점(판매목적 직매장)에 상품 반출 → 원칙 공급의제로 세금계산서 발급, 총괄납부 사업자면 공급의제 배제."}], "tx-9": [{"t": "공통매입세액 안분과 재계산", "s": "과세·면세 겸영 사업자의 공통매입세액은 면세공급가액 비율로 불공제. 예정신고 시 예정기간 비율, 확정신고 시 과세기간 전체 비율로 정산. 면세비율 5% 미만이고 공통매입세액 500만원 미만이면 전액 공제. 감가상각자산은 이후 과세기간에 면세비율 5% 이상 변동 시 재계산.", "p": "==안분기준 순서: 총공급가액 비율 → 매입가액 비율 → 예정공급가액 → 예정사용면적==(공급가액 없을 때). 재계산: 건물 10년, 기타 2년 동안 ==과세기간마다 5% 체감==한 잔존율 적용.", "e": "과세 물건과 면세 물건을 같이 파는 가게(슈퍼: 과자는 과세, 쌀은 면세)가 공통으로 쓰는 매입(전기료, 매장 인테리어)은 면세 매출 비율만큼 공제를 못 받아요. 건물 같은 큰 자산은 나중에 면세 비율이 크게 바뀌면 다시 계산해요.\n예시: 과세공급 6억, 면세공급 4억, 공통매입세액 1,000만원 → 면세비율 40%, 불공제 400만원. 다음 해 면세비율 50%로 변동(10%p ≥ 5%), 건물 매입세액 5,000만원(1과세기간 경과, 잔존율 95%) → 추가 불공제 5,000 × 10% × 95% = 475만원. 면세비율 3%, 공통매입세액 300만원이면 전액 공제."}], "pf-0": [{"t": "정보 비대칭", "s": "역선택: 거래 전 정보 부족으로 나쁜 상품·위험한 가입자만 남음(중고차 레몬시장, 보험). 도덕적 해이: 거래 후 행동을 감시 못 해 태만·위험 증가(보험 가입 후 부주의). 해결: 신호(학력·보증), 선별(공제·자기부담), 강제가입, 평판.", "p": "==역선택은 계약 전, 도덕적 해이는 계약 후== 문제. 사회보험 강제가입은 역선택 대책, 본인부담금·공제액은 도덕적 해이 대책. 신호는 정보를 가진 쪽이, 선별은 없는 쪽이 하는 행동.", "e": "한쪽만 정보를 아는 거래는 시장이 망가져요. 중고차 판매자만 차 상태를 알면 좋은 차는 안 팔려 나쁜 차만 남고(역선택), 보험에 들면 조심을 덜 해요(도덕적 해이). 그래서 보증서, 자기부담금, 강제가입 같은 장치가 필요해요.\n예시: 건강보험을 자유가입으로 두면 아픈 사람만 가입 → 보험료 상승 → 건강한 사람 이탈(역선택) → 전 국민 강제가입으로 해결. 자동차보험 가입 후 난폭운전(도덕적 해이) → 자기부담금·할증으로 억제. 좋은 중고차 판매자가 무상보증 제공 → 신호."}], "pf-1": [{"t": "공유자원의 비극과 클럽재", "s": "공유자원(경합성 O, 배제성 X): 각자 최대로 쓰려 해 남용·고갈(공유지의 비극). 해결: 재산권 부여(사유화), 이용 할당·허가제, 세금. 클럽재(비경합·배제 가능): 회원제로 공급 가능, 혼잡 발생 시 최적 규모 존재(부캐넌).", "p": "==공유지의 비극은 외부성 문제==(내 사용이 남의 몫을 줄임). 클럽재는 ==혼잡비용 = 추가 회원의 한계편익==에서 최적 회원 수. 공유자원은 사적재보다 과다 소비, 공공재는 과소 공급.", "e": "바다 물고기나 공용 목초지는 막을 수 없지만 쓰면 줄어드니(공유자원) 모두 먼저 쓰려다 고갈돼요. 어업권을 나눠주거나 어획량을 할당하면 해결. 골프장이나 유료 도로처럼 회원만 쓰게 할 수 있는 건(클럽재) 회원이 너무 많으면 붐비니 적정 인원이 있어요.\n예시: 마을 공동 목초지에 각자 소를 늘림 → 풀 고갈 → 목초지를 나눠 사유화하면 각자 관리(재산권). 아파트 헬스장 회원 100명까진 쾌적, 그 이상은 혼잡 → 혼잡으로 인한 불편이 추가 회원 회비 수입과 같아지는 점이 최적 규모."}], "pf-4": [{"t": "조세의 분류와 세율 구조", "s": "직접세(납세자=담세자, 소득세·법인세) vs 간접세(전가 예정, 부가세·개별소비세). 비례세(세율 일정), 누진세(소득 증가 시 평균세율 상승), 역진세(평균세율 하락). 누진 여부는 한계세율이 아니라 평균세율 변화로 판단.", "p": "==누진세 판단 기준은 평균세율==: 한계세율 일정해도 면세점이 있으면 누진(선형누진세). 한계세율 > 평균세율이면 누진. 간접세는 소득 대비 역진적.", "e": "세금을 나누는 두 축. 누가 부담하나(직접/간접)와 소득이 늘 때 세 부담률이 어떻게 변하나(비례/누진/역진). 헷갈리는 포인트는 '누진'의 기준이 평균세율이라는 것 — 세율이 20%로 일정해도 기본공제가 있으면 소득이 늘수록 평균세율이 올라 누진세예요.\n예시: 세금 = (소득 − 1,000) × 20%. 소득 2,000 → 세금 200, 평균세율 10%. 소득 5,000 → 800, 16%. 한계세율은 20%로 일정하지만 평균세율이 오르니 누진. 부가세 10%는 비례세이지만 소득 대비로 보면 저소득층 부담률이 높아 역진적."}], "pf-5": [{"t": "생산효율성 정리(다이아몬드-멀리스)", "s": "최적 조세 하에서는 생산 부문의 효율성이 유지되어야 하므로 중간재·생산요소에는 과세하지 말고 최종소비재에만 과세해야 한다. 조건: 순수이윤이 없거나 100% 과세 가능, 모든 최종재에 과세 가능.", "p": "==중간재 과세 X, 최종재 과세 O==. 부가가치세(전단계세액공제)가 이 원리에 부합 — 생산단계 세금이 공제되어 생산 결정을 왜곡하지 않음. 관세·원자재세는 이 정리에 반함.", "e": "세금은 생산 과정을 건드리지 말고 마지막 소비 단계에서만 걷으라는 정리예요. 원자재나 기계에 세금을 매기면 기업이 비효율적인 생산 방식을 택하게 되고, 그 손실은 소비 단계에서 걷어도 될 세수를 더 비싸게 걷는 꼴이에요.\n예시: 철강에 세금을 매기면 자동차 회사가 철 대신 알루미늄을 비효율적으로 더 씀(생산 왜곡). 대신 자동차에만 세금을 매기면 생산 방식은 최적 유지. 부가세는 각 단계 세금을 공제해주니 실질적으로 최종소비에만 과세 → 이 정리에 맞음."}], "pf-6": [{"t": "부가가치세의 유형과 계산방식", "s": "유형: GNP형(투자재 매입세액 불공제), 소득형(감가상각분만 공제), 소비형(투자재 매입세액 전액 즉시 공제, 우리나라). 계산: 전단계세액공제법(매출세액 − 매입세액, 세금계산서 기반)과 전단계거래액공제법(부가가치×세율).", "p": "==소비형은 투자 중립적==(투자재 이중과세 없음). 전단계세액공제법은 ==면세가 중간단계에 있으면 누적효과== 발생. 세율 인상 시 소비형 부가세는 저축·투자에 중립.", "e": "부가세를 '무엇에' 매기느냐로 세 유형이 있는데, 기계를 살 때 낸 세금을 바로 다 돌려주는 소비형이 투자를 안 막아서 대부분 나라가 써요. 계산은 매출세액에서 매입세액을 빼는 방식이라 세금계산서가 핵심이에요.\n예시: 기계 1억 구입(매입세액 1,000만원). 소비형: 즉시 전액 공제. 소득형: 매년 감가상각분(10년이면 100만원)만 공제. GNP형: 공제 없음. 중간 단계 면세(농산물 → 면세 도매 → 과세 식당)면 도매상이 낸 매입세액을 식당이 공제 못 받아 누적효과."}], "pf-7": [{"t": "재정의 3대 기능(머스그레이브)", "s": "자원배분 기능(시장실패 교정: 공공재 공급, 외부성 조정), 소득분배 기능(누진세·이전지출로 형평), 경제안정 기능(재정정책으로 경기 조절). 기능별로 담당 정부 수준이 다르다는 논의(오츠).", "p": "==분배·안정 기능은 중앙정부==, 자원배분(지방공공재)은 지방정부가 적합(오츠의 분권화 정리). 지방정부의 재분배는 부자 이탈로 실패, 안정화는 지역 간 누출로 효과 미미.", "e": "정부가 돈을 걷고 쓰는 이유를 세 가지로 정리한 게 머스그레이브예요. 시장이 못 하는 걸 하고(자원배분), 격차를 줄이고(분배), 경기를 조절(안정). 이 중 분배와 안정은 중앙정부가, 지역 공공재는 지방정부가 맡는 게 효율적이에요.\n예시: 국방·환경규제(자원배분), 기초연금·누진소득세(분배), 불황기 추경(안정). 서울시가 독자적으로 부자 증세로 재분배 → 부자가 경기도로 이사(티부) → 실패. 지방정부 경기부양 → 소비가 다른 지역 제품으로 새어나가 효과 작음. 그래서 중앙 담당."}], "cl-1": [{"t": "가장납입(견금)", "s": "발기인이 돈을 빌려 주금을 납입하고 설립등기 직후 인출해 갚는 것. 판례는 납입 자체는 유효(회사 성립)로 보되, 발기인·이사는 인출금 상당의 회사에 대한 반환의무·손해배상책임과 형사책임(납입가장죄)을 짐.", "p": "==가장납입도 주금납입으로서 유효==(판례, 주주 지위 인정). 인출한 자는 ==회사에 대한 채무(가지급금)==. 납입금보관증명서를 발급한 은행은 증명한 금액에 대해 회사에 책임.", "e": "자본금 요건을 맞추려고 잠깐 빌린 돈을 넣었다 바로 빼는 걸 가장납입이라 해요. 판례는 '어쨌든 돈이 들어왔다 나간 것'이니 회사 설립과 주주 지위는 유효하다고 보고, 대신 빼간 사람이 회사에 그 돈을 갚아야 하고 형사처벌도 받아요.\n예시: A가 사채 1억을 빌려 자본금으로 납입, 등기 후 인출해 상환 → 회사 설립 유효, A는 주주. 회사는 A에게 1억 반환 청구 가능(회계상 가지급금), A는 납입가장죄. 세법상으로는 대표이사 가지급금이라 인정이자 익금산입과 지급이자 손금불산입."}], "cl-2": [{"t": "주식매수선택권(스톡옵션)", "s": "회사 임직원(이사·감사·피용자)에게 미리 정한 가격으로 신주 인수 또는 자기주식 매수할 권리를 부여. 정관 근거 + 주총 특별결의, 발행주식총수 10%(상장 15%) 한도. 부여 후 2년 이상 재임·재직해야 행사 가능. 양도 불가.", "p": "==10% 이상 대주주·주요주주 등에게는 부여 불가==. 행사 요건 2년 재직은 ==본인 귀책사유 아닌 퇴임 시에도 유지==(정관 규정 시). 행사가격은 실질가액과 액면 이상.", "e": "직원에게 '2년 후 지금 가격으로 주식을 살 수 있는 권리'를 주는 제도예요. 주가가 오르면 차익을 얻으니 동기부여가 돼요. 대주주에게는 못 주고, 발행주식의 10%까지만, 주총 특별결의로 부여하고 최소 2년은 다녀야 행사할 수 있어요.\n예시: 발행주식 100만주 회사가 개발팀장에게 5만주(5%) 행사가 1만원 옵션 부여(특별결의). 2년 후 주가 3만원 → 행사해 2만원 × 5만주 = 10억 차익(근로소득 과세). 1년 만에 자발적 퇴사 → 행사 불가. 지분 15% 대주주에게 부여 → 무효."}], "cl-3": [{"t": "주주제안권", "s": "3% 이상(상장 1% 또는 0.5%·6개월) 주주가 주총일 6주 전까지 서면·전자로 안건(의제) 또는 구체적 결의안(의안)을 제안. 이사회는 법령·정관 위반 등 사유 없으면 안건으로 상정하고, 제안자 요청 시 총회에서 설명 기회 부여.", "p": "==거부 사유: 법령·정관 위반, 이미 부결된 안건 3년 내 재제안(10% 미만 찬성), 개인 고충 등==. 부당 거부 시 ==결의 취소 사유==. 제안 기한은 총회일 6주 전(정기총회는 전년도 총회일 기준).", "e": "소수주주도 주총 안건을 올릴 수 있어요. 3% 이상 지분으로 총회 6주 전에 제안하면 이사회는 원칙적으로 안건에 넣어야 해요. 정당한 이유 없이 빼면 그 총회 결의를 취소할 수 있는 하자가 돼요.\n예시: 3.5% 주주가 정기총회 6주 전 '사외이사 후보 갑 선임' 의안 제안 → 이사회는 총회 안건에 포함, 통지서에 기재. 작년에 5% 찬성으로 부결된 같은 안건을 올해 다시 제안 → 3년 내 재제안이라 거부 가능. 제안 기한 넘겨 4주 전 제안 → 거부 가능."}], "cl-4": [{"t": "이사회 결의방법", "s": "이사 과반수 출석, 출석 이사 과반수 찬성(정관으로 가중 가능, 완화 불가). 특별이해관계 있는 이사는 의결권 없음(출석 이사 수에서 제외). 화상회의 가능, 서면결의·대리 출석 불가. 의사록 작성·기명날인, 주주 열람권.", "p": "==이사회 결의는 대리·서면 불가==(주총과 반대). 화상회의 가능하나 ==음성만도 가능==. 정족수 미달 결의는 무효(소 제기 기간 없음). 이사회 소집은 각 이사, 1주 전 통지(단축 가능), 전원 동의 시 생략.", "e": "이사회는 이사들이 직접 모여(화상 포함) 과반이 출석하고 그 과반이 찬성해야 해요. 주주총회와 달리 대리인을 보내거나 서면으로 투표할 수 없어요. 자기 이해가 걸린 이사(자기거래 승인 안건의 당사자)는 표를 못 던져요.\n예시: 이사 7명 → 4명 출석 → 3명 찬성이면 가결. 이사 A의 자기거래 승인 안건 → A 제외한 6명 기준, 4명 출석 3명 찬성 → 가결(자기거래는 2/3 필요하므로 실제로는 출석 이사 2/3). 이사 B가 위임장으로 C에게 대리 출석 시킴 → 무효, 정족수에서 제외."}], "cl-6": [{"t": "준비금의 자본전입과 재무제표 승인", "s": "법정준비금(이익준비금·자본준비금)의 자본금 전입(무상증자)은 이사회 결의(정관으로 주총 가능), 신주는 주주에게 지분 비율로 배정. 재무제표는 이사회 작성·감사 감사 후 주총 승인(요건 충족 시 이사회 승인 가능). 승인 후 2년 내 다른 결의 없으면 이사·감사 책임 해제(부정행위 제외).", "p": "자본전입은 ==이사회 결의가 원칙==. 재무제표 주총 승인 후 ==2년 경과 시 책임해제==, 단 ==부정행위는 해제 안 됨==. 이사회 승인으로 재무제표 확정하려면 외부감사인 적정의견 + 감사 전원 동의.", "e": "준비금을 자본금으로 옮기며 주주에게 공짜 주식을 주는 게 무상증자인데, 이사회만으로 할 수 있어요. 재무제표는 주총에서 승인받고, 그 후 2년간 문제 제기가 없으면 이사·감사가 그 해 업무에 대해 책임을 벗어요(횡령 같은 부정행위는 예외).\n예시: 자본준비금 10억을 자본전입 → 이사회 결의로 액면 500원 주식 200만주를 주주 지분대로 배정. 2026년 3월 주총에서 2025년 재무제표 승인 → 2028년 3월까지 주주가 책임을 묻지 않으면 2025년 업무 관련 이사 책임 해제. 단 2025년 분식회계가 2029년에 드러나면 부정행위라 책임 추궁 가능."}]};
