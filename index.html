<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세무사 1차 핵심개념</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16213A">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#F3F5F8; --surface:#FFFFFF; --ink:#16213A; --muted:#66728A; --line:#DCE1EA;
    --marker:#FFE45C; --marker-deep:#E8C400; --again:#C8553D; --ok:#1F7A5C;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--marker-deep);outline-offset:2px}
  mark{background:linear-gradient(transparent 28%,var(--marker) 28%,var(--marker) 92%,transparent 92%);color:inherit;padding:0 2px;border-radius:2px}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  /* header */
  .top{padding:18px 18px 10px}
  .top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .top .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 18px 12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab small{font-weight:500;opacity:.75;margin-left:4px}

  /* chapter list */
  .list{padding:4px 18px 24px}
  .list .head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
  .list .head h2{font-size:17px;font-weight:800}
  .list .head button{font-size:13px;color:var(--again);font-weight:600}
  .ch{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .ch .n{font-size:13px;color:var(--muted);width:22px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .ch .name{flex:1;font-size:15px;font-weight:600}
  .ch .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ch .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--marker-deep);border-radius:0 0 0 var(--radius)}
  .ch{position:relative;overflow:hidden}
  .ch.done .name::after{content:" ✓";color:var(--ok)}
  .ch.cur{border-color:var(--ink)}
  .note{font-size:12px;color:var(--muted);padding:6px 2px 0;line-height:1.5}

  /* card view */
  .study{display:flex;flex-direction:column;flex:1}
  .crumb{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
  .crumb button{font-size:15px;font-weight:600;color:var(--muted);padding:4px 0}
  .crumb .where{font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .prog{height:4px;background:var(--line);margin:0 18px;border-radius:2px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--marker-deep);transition:width .2s}
  @media (prefers-reduced-motion:reduce){.prog i{transition:none}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:14px 18px;padding:22px 20px 20px;flex:1}
  .card .ch-name{font-size:13px;color:var(--muted);margin-bottom:8px}
  .card h3{font-size:24px;font-weight:800;letter-spacing:-.015em;line-height:1.3;margin-bottom:14px}
  .card .s{font-size:16px;line-height:1.7;margin-bottom:18px}
  .card .pt{border-top:1px solid var(--line);padding-top:14px}
  .card .pt .lbl{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .card .pt p{font-size:15px;line-height:1.75}
  .card .state{margin-top:14px;font-size:13px;font-weight:600}
  .card .state.ok{color:var(--ok)} .card .state.again{color:var(--again)}

  /* bottom actions */
  .acts{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:10px 18px calc(14px + env(safe-area-inset-bottom))}
  .acts .row{display:flex;gap:8px}
  .acts .nav{flex:0 0 52px;height:54px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);font-size:20px}
  .acts .nav:disabled{opacity:.35}
  .acts .again{flex:1;height:54px;border-radius:var(--radius);border:1.5px solid var(--again);color:var(--again);font-weight:700;font-size:15px;background:var(--surface)}
  .acts .ok{flex:1.4;height:54px;border-radius:var(--radius);background:var(--ink);color:#fff;font-weight:700;font-size:15px}
  .acts .ok:active,.acts .again:active{transform:scale(.98)}

  .end{padding:40px 24px;text-align:center}
  .end h3{font-size:20px;font-weight:800;margin-bottom:8px}
  .end p{color:var(--muted);font-size:14px;margin-bottom:20px}
  .end button{padding:12px 20px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;margin:4px}
  .end button.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
  .hidden{display:none}

  /* 쉬운 설명 */
  .easy{margin-top:14px}
  .easy .tg{width:100%;text-align:left;padding:11px 14px;border-radius:12px;background:var(--marker);color:var(--ink);font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .easy .tg span:last-child{font-weight:600;font-size:12px;opacity:.7}
  .easy .body{display:none;margin-top:10px;padding:14px;border:1.5px solid var(--marker);border-radius:12px;background:#FFFBE0;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:keep-all}
  .easy.open .body{display:block}
  .sheet .easy .body{background:#FFFBE0}

  /* 오늘의 학습지 */
  .daily{margin:4px 18px 14px;background:var(--ink);color:#fff;border-radius:18px;padding:16px 16px 14px}
  .daily .dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .daily .dh h2{font-size:16px;font-weight:800}
  .daily .dh .streak{font-size:13px;opacity:.85}
  .daily .dh .streak b{font-size:18px;color:var(--marker);margin-right:2px}
  .daily .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}
  .daily .task:first-of-type{border-top:0}
  .daily .task .ck{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .daily .task.done .ck{background:var(--marker);border-color:var(--marker);color:var(--ink)}
  .daily .task .tt{flex:1;font-size:14px;font-weight:600}
  .daily .task .tt small{display:block;font-weight:500;opacity:.7;font-size:12px}
  .daily .task .go{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700;color:#fff}
  .daily .task.done .go{opacity:.5}
  .daily .cal{display:flex;gap:5px;margin-top:12px;justify-content:space-between}
  .daily .cal i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.15)}
  .daily .cal i.on{background:var(--marker)}
  .daily .cal i.today{outline:2px solid rgba(255,255,255,.6);outline-offset:1px}
  .daily .alldone{margin-top:10px;font-size:13px;color:var(--marker);font-weight:700}

  /* 키워드 링크 + 바텀시트 */
  .kw{color:var(--ink);font-weight:700;border-bottom:2px dotted var(--ink);cursor:pointer;padding-bottom:1px}
  .w{cursor:pointer;border-radius:4px;padding:1px 0}
  .w:active{background:var(--line)}
  .kw .w{padding:0}
  .sheet-bg{position:fixed;inset:0;background:rgba(22,33,58,.45);z-index:50;display:flex;align-items:flex-end}
  .sheet{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet .from{font-size:12px;color:var(--muted);margin-bottom:4px}
  .sheet h4{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:10px;line-height:1.3}
  .sheet .s{font-size:15px;line-height:1.7;margin-bottom:10px}
  .sheet .p{font-size:14.5px;line-height:1.7;color:var(--ink);padding-top:10px;border-top:1px solid var(--line)}
  .sheet .ai{font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  .sheet .ai.wait{color:var(--muted)}
  .sheet .row{display:flex;gap:8px;margin-top:16px}
  .sheet .row button{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--surface)}
  .sheet .row button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sheet .row button:disabled{opacity:.5}

  /* 질문 패널 */
  .ask{margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
  .ask .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .ask .chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);background:var(--bg)}
  .ask .in{display:flex;gap:6px}
  .ask textarea{flex:1;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;resize:none;min-height:44px;max-height:120px;background:var(--bg);color:var(--ink)}
  .ask textarea:focus{outline:none;border-color:var(--ink)}
  .ask .send{flex:0 0 64px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
  .ask .send:disabled{background:var(--line);color:var(--muted)}
  .ask .log{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-bottom:70px}
  .ask .msg{font-size:14.5px;line-height:1.7;padding:10px 13px;border-radius:12px;white-space:pre-wrap;word-break:keep-all}
  .ask .msg.u{background:var(--marker);align-self:flex-end;max-width:85%;border-bottom-right-radius:4px}
  .ask .msg.a{background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
  .ask .msg.a.err{color:var(--again)}
  .ask .msg.a.wait{color:var(--muted)}

  /* chapter row: main + quiz button */
  .chrow{display:flex;gap:6px;margin-bottom:8px}
  .chrow .ch{margin:0;flex:1}
  .chrow .qz{flex:0 0 64px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
  .chrow .qz b{font-size:15px;color:var(--ink)}
  .chrow .qz.good b{color:var(--ok)} .chrow .qz.bad b{color:var(--again)}
  .list .head .tools{display:flex;gap:12px}
  .list .head .tools button{font-size:13px;font-weight:600;color:var(--ink)}
  .list .head .tools button.rv{color:var(--again)}

  /* quiz */
  .q{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:14px 18px;padding:20px}
  .q .kind{font-size:13px;color:var(--muted);margin-bottom:8px}
  .q .body{font-size:17px;line-height:1.7;font-weight:600;margin-bottom:16px}
  .q .body .blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--marker-deep);background:var(--marker);height:1.1em;vertical-align:-3px;border-radius:2px 2px 0 0}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:15px;line-height:1.5;display:flex;gap:10px}
  .opt .k{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-top:1px}
  .opt.right{border-color:var(--ok);background:#EAF6F0} .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--again);background:#FBEDEA} .opt.wrong .k{background:var(--again);border-color:var(--again);color:#fff}
  .opt:disabled{opacity:1}
  .expl{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:14px;line-height:1.7}
  .expl b{display:block;font-size:15px;margin-bottom:4px}
  .expl .verdict{font-weight:700;margin-bottom:6px}
  .expl .verdict.ok{color:var(--ok)} .expl .verdict.no{color:var(--again)}
  .acts .single{width:100%;height:54px;border-radius:var(--radius);background:var(--ink);color:#fff;font-weight:700;font-size:15px}
  .acts .single:disabled{background:var(--line);color:var(--muted)}

  .score{padding:28px 18px 8px;text-align:center}
  .score .big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .score .big small{font-size:20px;color:var(--muted);font-weight:600}
  .score p{color:var(--muted);font-size:14px;margin-top:6px}
  .wrongs{padding:8px 18px 24px}
  .wrongs h4{font-size:14px;font-weight:700;margin:12px 0 8px}
  .wrongs .w{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14px;line-height:1.6}
  .wrongs .w b{display:block;font-size:15px}
  .wrongs .w span{color:var(--muted)}

  /* 학습 계획 */
  .planlink{margin-left:8px;font-size:12px;font-weight:700;color:var(--marker);padding:2px 0}
  .plan-hero{margin:4px 18px 12px;background:var(--ink);color:#fff;border-radius:18px;padding:16px}
  .plan-hero .dd{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .plan-hero .meta{font-size:13px;opacity:.85;margin-top:4px}
  .plan-hero .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}
  .plan-hero .bar i{display:block;height:100%;background:var(--marker)}
  .plan-hero .hset{font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);color:#fff;white-space:nowrap}
  .seg{display:flex;margin:0 18px 12px;background:var(--line);border-radius:12px;padding:3px}
  .seg button{flex:1;padding:9px 0;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .pbody{padding:0 18px 40px}
  .datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .datenav>button{width:40px;height:40px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px}
  .datenav b{font-size:17px}
  .datenav .tl{font-size:12px;font-weight:700;color:var(--again);padding:2px 0}
  .wkban{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;line-height:1.65}
  .wkban b{font-size:14px}
  .wkban .lb{display:inline-block;min-width:38px;font-weight:700;color:var(--muted);font-size:12px}
  .wkban .note{margin-top:6px;padding:8px 10px;background:#FFFBE0;border-radius:10px;font-size:13px;color:var(--ink)}
  .ptask{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .ptask .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin-top:1px;background:var(--surface)}
  .ptask.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
  .ptask.info .ck{border-style:dashed}
  .ptask.exempt{opacity:.45}
  .ptask .tm{font-size:12px;color:var(--muted);font-weight:600}
  .ptask .tt{font-size:15px;font-weight:700;line-height:1.4}
  .ptask .ss{font-size:13px;color:var(--muted);line-height:1.5;margin-top:2px}
  .ptask .go{flex:0 0 auto;padding:7px 11px;border-radius:999px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;align-self:center}
  .ptask.done .go{background:var(--line);color:var(--muted)}
  .busy{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--line);font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
  .busy.on{border-style:solid;border-color:var(--again);color:var(--again)}
  .pb{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 2px}
  .pb i{display:block;height:100%;background:var(--marker-deep)}
  .pbn{font-size:12px;color:var(--muted)}
  .wrow{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px}
  .wrow.today{border-color:var(--ink)}
  .wrow .dt{flex:0 0 46px;font-size:13px;color:var(--muted);line-height:1.3}
  .wrow .dt b{display:block;font-size:15px;color:var(--ink)}
  .wrow .tx{flex:1;font-size:14px;font-weight:600;line-height:1.4;min-width:0}
  .wrow .st{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted)}
  .wrow .st.ok{color:var(--ok)}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .mcard.cur{border-color:var(--ink)}
  .mcard h4{font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
  .mcard h4 small{font-size:12px;color:var(--muted);font-weight:600}
  .mcard .t{font-size:14px;font-weight:600;margin-top:4px}
  .mcard .g{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55}
  .mcard .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .mcard .chip{padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);text-align:center;line-height:1.35;background:var(--bg)}
  .mcard .chip small{display:block;font-weight:500;font-size:11px}
  .mcard .chip.buf{border-style:dashed}
  .mcard .chip.now{border-color:var(--ink);color:var(--ink);background:#fff}
  .mcard .chip.ok{background:#EAF6F0;border-color:var(--ok);color:var(--ok)}
  .phase{font-size:13px;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .phase b{font-size:14px}

</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
window.EXPLAIN=window.EXPLAIN||{};Object.assign(window.EXPLAIN,{
"fa-0-0":"회계정보가 쓸모 있으려면 두 가지가 반드시 필요해요. 하나는 의사결정에 관련이 있어야 하고(목적적합성), 다른 하나는 실제 모습을 그대로 보여줘야 해요(표현충실성). 비교가능성·검증가능성·적시성·이해가능성은 있으면 더 좋은 '보강' 특성이라, 이 넷이 아무리 좋아도 앞의 둘이 없으면 소용없어요.\n\n예시: 어떤 회사가 매출을 아주 빨리(적시성) 아주 알기 쉽게(이해가능성) 공시했는데 숫자가 부풀려져 있다면(표현충실성 없음) 유용한 정보가 아니에요.",
"fa-0-1":"자산은 '내가 통제하는 경제적자원', 부채는 '남에게 자원을 넘겨야 하는 현재의무'예요. 옛날 정의에는 '미래 효익이 유입될 가능성이 높아야 자산'이라는 조건이 있었는데, 개정 개념체계에서는 이 확률 요건을 정의에서 빼고 '인식할지'를 따로 판단해요.\n\n예시: 소송에서 이길 가능성이 30%인 손해배상청구권도 정의상으로는 자산이에요. 다만 30%라는 불확실성 때문에 재무제표에 '인식'하지는 않을 수 있어요.",
"fa-0-2":"자산을 얼마로 적을지 정하는 기준이에요. 역사적원가는 살 때 가격, 현행가치는 지금 기준 가치예요. 현행가치 중 공정가치는 '시장 참여자가 얼마에 사줄까', 사용가치는 '우리 회사가 이걸 써서 얼마를 벌까'라서 같은 자산이라도 숫자가 달라요.\n\n예시: 중고 기계의 시장 가격이 1억(공정가치)인데, 우리 공장에서만 쓸 수 있는 특수 기계라 앞으로 현금흐름 현재가치가 3억(사용가치)일 수 있어요. 사용가치는 회사마다 다르고, 공정가치는 누가 계산해도 같아요.",
"fa-0-3":"이익을 재려면 먼저 '얼마를 유지해야 본전인가'를 정해야 해요. 재무자본유지는 돈(금액)을 기준으로, 실물자본유지는 생산능력(물건)을 기준으로 봐요. 실물자본유지에서는 물가가 올라서 자산 가격이 오른 부분을 이익이 아니라 자본유지조정(자본)으로 처리해요.\n\n예시: 100원에 산 재고를 150원에 팔았는데 같은 재고를 다시 사려면 120원이에요. 재무자본유지 이익은 50원, 실물자본유지 이익은 30원이고 나머지 20원은 자본유지조정이에요.",
"fa-1-0":"재고자산 원가에는 '그 재고를 판매 가능한 상태로 만드는 데 든 돈'만 넣어요. 사는 값, 관세, 운반비, 가공비는 포함하고, 창고에 그냥 쌓아두는 비용이나 판매비, 비정상적으로 낭비된 원가는 그때그때 비용으로 처리해요.\n\n예시: 원재료 1,000원에 사서 운반비 100원, 창고 보관료 50원, 매입할인 30원을 받았다면 재고 원가는 1,000+100−30=1,070원이고 보관료 50원은 비용이에요. 단, 와인 숙성처럼 생산 과정에 필요한 보관은 원가에 넣어요.",
"fa-1-1":"물건이 섞여 있으면 뭘 먼저 팔았는지 알 수 없으니 가정을 세워요. 선입선출(FIFO)은 먼저 산 게 먼저 나갔다고 보고, 가중평균은 섞어서 평균 단가로 계산해요. 후입선출(LIFO)은 IFRS에서 금지예요.\n\n예시: 1월에 10개를 100원, 2월에 10개를 120원에 샀고 15개를 팔았어요. FIFO면 매출원가 10×100+5×120=1,600원, 기말재고 5×120=600원. 평균법이면 단가 110원이라 매출원가 1,650원, 기말재고 550원. 물가가 오르면 FIFO가 기말재고를 더 크게, 이익도 더 크게 만들어요.",
"fa-1-2":"기말에 재고 값이 원가보다 떨어졌으면 낮은 금액(순실현가능가치)으로 줄여 적어요. 팔았을 때 받을 돈에서 완성비용과 판매비용을 뺀 게 순실현가능가치예요. 줄인 만큼은 평가손실로 매출원가에 들어가고, 나중에 값이 회복되면 예전에 줄인 만큼까지만 되돌려요.\n\n예시: 원가 1,000원 제품의 예상 판매가가 900원, 판매비가 50원이면 NRV는 850원이라 150원 평가손실. 다음 기에 판매가가 1,200원으로 올라도 원가 1,000원까지만, 즉 150원만 환입해요.",
"fa-1-3":"장부에는 100개인데 창고에 95개뿐이면 5개 없어진 건 감모손실(수량 문제)이고, 남은 95개의 값이 떨어진 건 평가손실(단가 문제)이에요. 반드시 감모를 먼저 계산하고, 실제 남은 수량에 저가법을 적용해요.\n\n예시: 장부 100개×단가 100원, 실제 95개, NRV 90원. 감모손실 5개×100원=500원, 평가손실 95개×(100−90)=950원. 감모 중 정상적인 부분은 매출원가, 도난 같은 비정상 부분은 영업외비용이에요.",
"fa-1-4":"화재로 재고가 타버렸거나 실사를 못 했을 때 기말재고를 '추정'하는 방법이에요. 매출총이익률법은 매출에 이익률을 적용해 매출원가를 역산하고, 소매재고법은 판매가 기준 재고에 원가율을 곱해요. 저가기준 소매재고법은 원가율을 계산할 때 순인하액을 분모에서 빼서 원가율을 낮게 만들어요.\n\n예시: 매출 1,000원, 매출총이익률 30%면 매출원가 700원. 기초재고 200원+매입 800원=1,000원에서 700원을 빼면 기말재고 300원이에요.",

"fa-2-2":"공장을 짓는 데 1년 넘게 걸리면 그동안 빌린 돈의 이자를 비용이 아니라 공장 원가에 넣을 수 있어요(자본화). 그 공사 때문에 빌린 특정차입금은 이자에서 잠깐 예치해 번 이자수익을 빼고 자본화하고, 일반차입금은 평균 이자율을 지출액에 곱하되 실제 낸 이자를 넘을 수 없어요.\n\n예시: 특정차입금 이자 100원, 일시 예치수익 10원, 일반차입금 자본화 계산액 60원, 실제 일반차입금 이자 50원이면 자본화액은 (100−10)+50=140원. 일반차입금은 50원 한도예요.",

"fa-3-0":"신기술 개발 지출은 앞부분(연구)과 뒷부분(개발)으로 나눠요. 연구단계는 아직 뭐가 될지 모르니 전액 비용, 개발단계는 기술적으로 완성 가능하고 팔 의도와 능력이 있는 등 6가지 조건을 채운 시점부터 자산이에요. 둘을 구분 못 하면 전부 연구단계로 봐서 비용 처리해요.\n\n예시: 1~6월 연구비 300원, 7월부터 조건 충족해 개발비 500원 지출. 무형자산은 500원만이고, 300원은 나중에 조건을 채웠다고 소급해서 자산으로 바꿀 수 없어요.",
"fa-3-1":"회사가 스스로 키운 브랜드, 고객 목록, 영업권은 아무리 가치가 커도 자산으로 못 적어요. 원가를 믿을 만하게 측정할 수 없고 회사 전체 사업과 구분이 안 되기 때문이에요. 반면 다른 회사를 인수하면서 얻은 브랜드는 대가를 치렀으니 자산으로 인식해요.\n\n예시: A사가 10년간 광고비 100억을 써서 유명 브랜드를 만들었어도 자산은 0. 그런데 B사가 A사를 사면서 브랜드 가치 50억을 평가했다면 B사 장부에는 브랜드 50억이 올라가요.",
"fa-3-2":"무형자산도 정해진 기간 동안 나눠 비용 처리(상각)하는데, 잔존가치는 원칙적으로 0이에요. 특허처럼 내용연수가 정해진 건 상각하고, 언제까지 쓸지 모르는 비한정 내용연수 자산과 영업권은 상각하지 않는 대신 매년 손상검사를 해요.\n\n예시: 10년짜리 특허 1,000원은 매년 100원 상각. 영업권 500원은 상각 없이 매년 회수가능액을 재보고, 떨어졌으면 손상차손만 인식해요.",
"fa-3-3":"직접 쓰는 건물은 유형자산, 임대료나 시세차익 목적으로 가진 건물은 투자부동산이에요. 투자부동산은 원가모형과 공정가치모형 중 하나를 골라 전체에 똑같이 적용해요. 공정가치모형을 고르면 감가상각을 안 하고 매년 시가 변동을 당기손익으로 잡아요.\n\n예시: 임대용 건물 1,000원이 연말에 1,100원이 됐어요. 공정가치모형이면 감가상각 없이 평가이익 100원을 당기손익으로. 유형자산 재평가모형이었다면 기타포괄손익이었을 텐데, 투자부동산은 당기손익이라는 게 차이예요.",
"fa-4-0":"금융자산을 세 바구니(AC·FVOCI·FVPL)로 나누는 기준은 두 가지예요. 회사가 이 자산을 어떻게 굴릴 건지(사업모형)와 현금흐름이 원금·이자뿐인지(SPPI)예요. 만기까지 이자만 받을 채권은 AC, 이자도 받고 팔기도 할 채권은 FVOCI, 나머지는 FVPL이에요. 주식은 배당이 원금·이자가 아니라 원칙 FVPL이고, 단기매매가 아니면 FVOCI를 선택할 수 있어요.\n\n예시: 만기 보유 목적 국채는 AC. 삼성전자 주식은 FVPL이 원칙이고, 장기 보유라면 FVOCI 선택 가능(한번 고르면 취소 불가).",
"fa-4-1":"주식을 FVOCI로 지정하면 값이 오르내려도 당기손익이 아니라 기타포괄손익으로 쌓여요. 팔 때도 그 누적액을 당기손익으로 옮기지 않고 이익잉여금으로 바로 넘겨요. 즉 이 주식으로는 처분이익이 손익계산서에 영원히 안 나타나요. 배당금만 당기손익이에요.\n\n예시: 1,000원에 산 주식이 1,500원이 돼서 OCI 500원 쌓임. 1,500원에 팔면 처분이익 0, OCI 500원을 이익잉여금으로 대체. 같은 상황에서 채무상품 FVOCI였다면 500원이 당기손익으로 재분류돼요.",
"fa-4-2":"채권을 AC로 분류하면 유효이자율로 이자수익만 인식해요. FVOCI 채권은 이자수익과 손상은 AC와 똑같이 계산하고, 그 결과 나온 상각후원가와 공정가치의 차이만 OCI로 넣어요. 그래서 당기순이익은 AC와 FVOCI가 항상 같고, 팔 때 OCI를 당기손익으로 재분류하니 처분손익까지 합치면 결국 같아져요.\n\n예시: 상각후원가 950원, 공정가치 980원인 채권. AC면 장부 950원. FVOCI면 장부 980원에 OCI 30원. 두 경우 모두 당기 이자수익은 동일해요.",
"fa-4-3":"돈을 떼일 것에 대비해 미리 손실을 잡는 방법이에요. 신용위험이 크게 나빠지지 않았으면 앞으로 12개월 안에 부도날 확률만큼(12개월 기대손실), 크게 나빠졌으면 만기까지 전체 기간의 손실을 잡아요. 매출채권은 계산이 번거로우니 처음부터 전체기간 기대손실을 쓰는 간편법이 허용돼요.\n\n예시: 채권 1,000원, 12개월 부도확률 2%, 부도 시 손실률 50%면 기대손실 10원. 이미 부도가 난 채권은 총장부금액이 아니라 손실 뺀 상각후원가에 유효이자율을 곱해 이자수익을 계산해요.",
"fa-4-4":"금융자산을 장부에서 지우려면 현금흐름 받을 권리가 사라졌거나, 위험과 보상이 대부분 넘어갔어야 해요. 매출채권을 팔았는데 거래처가 못 갚으면 내가 물어주기로 했다면 위험이 아직 나한테 있으니 '판 게' 아니라 '채권 담보로 돈 빌린 것'으로 회계처리해요.\n\n예시: 매출채권 1,000원을 팩토링 회사에 950원에 넘김. 상환청구권 없음이면 채권 제거, 손실 50원. 상환청구권 있음이면 채권은 그대로 두고 차입금 950원을 인식해요.",
"fa-5-0":"사채를 액면보다 싸게(할인) 발행하면 그 차이는 만기까지 추가로 갚아야 할 이자예요. 유효이자율법은 매년 기초 장부금액에 유효이자율을 곱해 이자비용을 잡고, 실제 지급한 액면이자와의 차이만큼 장부금액을 키워가요. 그래서 할인발행이면 이자비용과 장부금액이 매년 늘어나요.\n\n예시: 액면 1,000원, 액면이자 5%, 유효이자율 8%, 발행가 920원. 1년차 이자비용 920×8%=73.6원, 지급 50원, 장부 943.6원. 2년차 이자비용 943.6×8%=75.5원으로 커져요.",
"fa-5-1":"사채를 발행하면서 든 수수료(발행비)는 비용이 아니라 받은 돈에서 빼요. 받은 돈이 줄어드니 실제 부담하는 이자율(유효이자율)은 시장이자율보다 높아져요. 발행 시점 장부금액은 '발행가−발행비'예요.\n\n예시: 시장이자율 8%로 계산한 발행가 920원, 발행비 20원이면 순수령액 900원. 이 900원을 기준으로 다시 계산한 유효이자율은 8%보다 높은 8.5% 정도가 돼요.",
"fa-5-2":"사채를 만기 전에 갚으면 '갚은 돈'과 '그날 장부금액'의 차이가 상환손익이에요. 이자지급일 사이에 갚으면 그때까지 쌓인 미지급이자를 먼저 떼고 원금 부분끼리 비교해야 해요. 시장이자율이 오르면 사채 가격이 떨어져 싸게 갚을 수 있으니 상환이익이 나요.\n\n예시: 장부금액 950원인 사채를 930원에 상환하면 상환이익 20원. 7월 1일 상환이라 반년치 이자 25원이 포함된 955원을 줬다면, 25원은 이자비용이고 원금 930원 대 장부 950원으로 이익 20원.",
"fa-5-3":"전환사채는 '채권'과 '주식으로 바꿀 권리'가 붙어 있어요. 발행 시 전환권이 없는 일반사채였다면 얼마였을지(현재가치)를 부채로, 나머지를 전환권대가(자본)로 나눠요. 만기까지 전환 안 하면 더 주는 상환할증금은 부채에 포함해요. 전환하면 손익 없이 그때 부채 장부금액을 자본으로 옮겨요.\n\n예시: 발행가 1,000원, 일반사채 현재가치 930원이면 부채 930원, 전환권대가 70원. 신주인수권부사채는 권리 행사 후에도 사채가 그대로 남는다는 게 전환사채와 다른 점이에요.",
"fa-6-0":"'아직 안 줬지만 줘야 할 게 거의 확실한 돈'을 부채로 미리 잡는 게 충당부채예요. 조건은 셋이에요. 과거 사건으로 지금 의무가 있고, 돈이 나갈 가능성이 높고, 금액을 믿을 만하게 추정할 수 있어야 해요. 내년에 적자가 예상된다는 건 지금 의무가 아니라서 충당부채가 아니에요.\n\n예시: 판매한 제품의 무상수리 예상액 100원은 충당부채. 손해 보는 계약(손실부담계약)은 계약을 깨는 위약금과 이행 손실 중 작은 금액으로 인식해요.",
"fa-6-1":"돈이 나갈지 아직 불확실한 의무는 우발부채라서 장부에 안 적고 주석에만 써요. 가능성이 희박하면 주석도 생략해요. 받을 돈이 생길지 모르는 우발자산은 인식하지 않고, 거의 확실해질 때 비로소 자산으로 잡아요. 보험사가 대신 물어주는 건 거의 확실할 때만 별도 자산이에요.\n\n예시: 소송에서 질 가능성 30%면 우발부채로 주석 공시. 이길 가능성 90%라도 판결 전이면 우발자산이라 주석만, 판결 확정 후 자산 인식.",
"fa-6-2":"회사가 자기 주식을 사면 자산이 아니라 자본에서 빼요(자본의 마이너스). 다시 팔아서 이익이 나도 당기이익이 아니라 자기주식처분이익(자본)이에요. 손실이 나면 먼저 예전 처분이익과 상계하고 남는 건 이익잉여금에서 빼요. 소각하면 자본금이 줄어요.\n\n예시: 자기주식 100원에 취득(자본 −100). 120원에 처분하면 자기주식처분이익 20원(자본). 80원에 처분하면 손실 20원, 기존 처분이익이 15원이면 15원 상계 후 5원은 이익잉여금 차감.",
"fa-6-3":"셋 다 주식 수는 늘지만 회사에 돈이 들어오지 않아서 자본 총액은 그대로예요. 무상증자는 자본잉여금·법정적립금을 자본금으로, 주식배당은 이익잉여금을 자본금으로 옮기니 자본금은 늘어요. 주식분할은 액면가를 쪼개는 거라 자본금도 그대로예요.\n\n예시: 자본금 1,000원(100주×10원). 10% 주식배당이면 자본금 1,100원, 이익잉여금 −100원, 총자본 동일. 1주를 2주로 분할하면 200주×5원=1,000원으로 자본금 불변.",
"fa-6-4":"번 돈(이익잉여금)을 배당하거나 적립하는 걸 처분이라 해요. 현금배당을 하면 그 10분의 1 이상을 이익준비금으로 쌓아야 하고, 자본금의 절반이 될 때까지만 의무예요. 주식배당은 돈이 안 나가니 이익준비금 적립 대상이 아니에요. 처분은 주주총회에서 확정되므로 확정된 연도에 반영해요.\n\n예시: 현금배당 200원, 주식배당 100원이면 이익준비금 최소 20원(현금배당분만). 자본금 1,000원이면 준비금이 500원에 달할 때까지 적립해요.",
"fa-7-0":"수익을 언제 얼마나 잡을지 다섯 단계로 정해요. 계약을 찾고, 그 안에서 약속(수행의무)을 나누고, 총 가격을 정하고, 약속별로 가격을 나누고, 약속을 지킨 시점에 수익을 인식해요. 가격은 각 약속을 따로 팔았을 때 가격(개별판매가격) 비율로 나눠요.\n\n예시: 휴대폰(개별판매가 800)과 1년 통신서비스(개별판매가 400)를 묶어 1,080원에 팔았어요. 휴대폰에 720원(인도 시 수익), 서비스에 360원(1년간 나눠 수익)을 배분해요.",
"fa-7-1":"할인, 리베이트, 성과급처럼 나중에 얼마가 될지 확실하지 않은 대가예요. 여러 경우가 있으면 기댓값, 둘 중 하나면 가능성 높은 금액으로 추정하되, 나중에 크게 줄어들 가능성이 높은 금액은 수익에 넣지 않아요(제약). 반품될 수 있는 판매는 반품 예상분을 수익에서 빼고 환불부채와 돌려받을 재고를 따로 잡아요.\n\n예시: 100개 판매(개당 100원), 반품 예상 5개. 수익 9,500원, 환불부채 500원, 반환재고자산 5개분 원가.",
"fa-7-2":"내가 물건을 직접 파는 본인이면 판 금액 전부가 수익이고, 남의 물건을 중개만 하는 대리인이면 수수료만 수익이에요. 판단 기준은 고객에게 넘기기 전에 내가 그 물건을 통제했는지예요. 재고 위험을 지는지, 가격을 정할 수 있는지, 주된 책임이 나한테 있는지를 봐요.\n\n예시: 오픈마켓이 판매자 물건 10,000원짜리를 중개하고 수수료 1,000원을 받으면 수익은 1,000원. 직접 사서 재고로 두고 파는 쇼핑몰이면 10,000원이 수익이고 매출원가가 따로 있어요.",
"fa-7-3":"제품 보증에는 두 종류가 있어요. '불량이면 고쳐준다'는 확신유형은 별도 상품이 아니라 판매에 딸린 약속이라 충당부채로 잡아요. 고객이 돈 내고 따로 살 수 있거나 추가 서비스가 포함된 용역유형은 별도 수행의무라 거래가격 일부를 떼어 보증기간 동안 수익으로 인식해요.\n\n예시: TV 1,000원에 1년 무상보증(확신)과 2년 연장보증 100원(용역). 무상보증은 예상 수리비를 충당부채로, 연장보증 100원은 2년간 나눠 수익.",
"fa-7-4":"수익을 한 시점에 잡을지, 기간에 걸쳐 잡을지의 문제예요. 고객이 서비스를 받는 동시에 소비하거나, 고객 자산을 만들어주거나, 다른 데 못 쓰는 맞춤 자산이고 중간에 그만둬도 대가를 청구할 수 있으면 진행률에 따라 수익을 나눠 인식해요. 진행률을 못 재면 원가 회수 범위까지만 수익으로 잡아요.\n\n예시: 3년짜리 건물 공사 계약 3,000원, 1년차 원가 진행률 30%면 1년차 수익 900원. 라이선스는 기간 내내 접근하는 권리면 기간에 걸쳐, 특정 시점에 넘기는 사용권이면 그 시점에 인식.",
"fa-8-0":"리스이용자는 빌린 자산을 마치 산 것처럼 사용권자산과 리스부채를 둘 다 잡아요(단, 12개월 이하 단기나 소액자산은 예외). 리스부채는 앞으로 낼 리스료의 현재가치예요. 리스료에는 고정 리스료, 물가지수 연동 리스료, 잔존가치보증으로 낼 것 같은 금액, 행사할 게 거의 확실한 매수선택권 가격이 들어가요. 매출액에 연동되는 변동리스료는 안 들어가요.\n\n예시: 연 100원씩 5년, 할인율 5%면 리스부채 약 433원. 매장 매출 1%를 추가로 내는 조건은 리스부채에 넣지 않고 발생할 때 비용.",
"fa-8-1":"사용권자산은 리스부채에 몇 가지를 더해서 계산해요. 리스 시작 전에 미리 낸 리스료, 리스 계약을 맺느라 든 직접원가(중개수수료), 나중에 원상복구할 비용 추정치를 더해요. 감가상각은 리스기간과 자산 내용연수 중 짧은 기간으로 하고, 소유권이 넘어오는 리스면 내용연수로 해요.\n\n예시: 리스부채 433원, 선급리스료 20원, 중개수수료 10원, 복구비 현재가치 7원이면 사용권자산 470원. 리스기간 5년, 내용연수 8년이면 5년 상각.",
"fa-8-2":"리스제공자(빌려주는 쪽)는 위험과 보상이 대부분 넘어갔으면 금융리스(사실상 판매), 아니면 운용리스(단순 임대)로 나눠요. 소유권 이전, 헐값 매수선택권, 리스기간이 내용연수 대부분, 리스료 현재가치가 공정가치 대부분이면 금융리스 신호예요. 제조업체가 자기 제품을 금융리스로 주면 판매형리스라 매출과 매출원가를 인식해요.\n\n예시: 자동차 회사가 원가 800원 차량을 리스료 현재가치 1,000원으로 5년 금융리스 → 매출 1,000, 매출원가 800. 이때 리스개설직접원가는 자산화 못 하고 비용.",
"fa-8-3":"내 건물을 팔고 바로 다시 빌리는 거래예요. 먼저 그 '판매'가 수익기준서상 진짜 판매인지 봐요. 진짜 판매면 팔았지만 계속 쓰는 부분(사용권)에 해당하는 이익은 인식하지 않고, 실제로 넘어간 권리 부분만큼만 처분이익을 잡아요. 판매가 아니면 건물은 그대로 두고 받은 돈을 차입금으로 처리해요.\n\n예시: 장부 600원, 공정가치 1,000원 건물을 팔고 리스백. 사용권 비율이 40%면 총 이익 400원 중 60%인 240원만 인식. 공정가치보다 비싸게 받은 부분은 추가 차입금이에요.",
"fa-9-0":"회계상 자산·부채 금액과 세법상 금액이 다를 때 그 차이가 나중에 세금을 늘리거나 줄여요. 미래에 세금을 더 내게 만드는 차이(가산할)는 이연법인세부채, 덜 내게 만드는 차이(차감할)는 이연법인세자산이에요. 자산은 미래에 낼 세금이 충분히 있을 때만 잡아요. 접대비 한도초과처럼 영원히 안 돌아오는 차이(영구적차이)는 이연법인세가 없어요.\n\n예시: 회계 감가상각 300원, 세법 200원 한도라 100원 손금불산입(유보). 이 100원은 나중에 손금이 되니 차감할 일시적차이, 세율 20%면 이연법인세자산 20원.",
"fa-9-1":"이연법인세는 지금 세율이 아니라 그 차이가 풀리는 시점에 적용될 세율로 계산해요. 항상 비유동으로 표시하고 할인하지 않아요. 법인세비용은 올해 낼 세금(당기법인세)에 이연법인세 변동을 더하거나 뺀 값이에요. 재평가잉여금처럼 자본이나 OCI에 직접 잡힌 항목의 세금 효과는 손익이 아니라 그 항목에서 빼요.\n\n예시: 당기법인세 100원, 이연법인세자산이 20원에서 30원으로 증가하면 법인세비용 90원. 재평가잉여금 300원에 세율 20%면 OCI에서 60원을 차감하고 이연법인세부채 60원.",
"fa-9-2":"보통주 1주당 얼마 벌었는지예요. 분자는 당기순이익에서 우선주 배당을 뺀 값(누적적 우선주는 배당 결의와 상관없이 뺌), 분모는 기간 중 유통된 보통주 수를 날짜로 가중평균한 값이에요. 무상증자·주식배당·주식분할은 돈이 안 들어왔으니 연초부터 있었던 것처럼 소급하고, 자기주식은 산 날부터 빼요.\n\n예시: 순이익 1,000원, 우선주배당 100원. 기초 100주, 7월 1일 유상증자 100주면 가중평균 150주라 EPS=900/150=6원. 만약 7월 1일 무상증자였다면 기초부터 200주로 봐서 4.5원.",
"fa-9-3":"전환사채나 스톡옵션이 전부 주식으로 바뀌었다고 가정해 EPS를 다시 계산한 게 희석EPS예요. 전환사채는 이자비용이 안 나갔을 테니 세후이자를 분자에 더하고 전환 주식수를 분모에 더해요. 옵션은 행사대금으로 자기주식을 샀다고 가정해 순증가 주식수만 더해요(자기주식법). 계산해서 오히려 EPS가 커지는(반희석) 건 제외해요.\n\n예시: 기본EPS 6원. 전환사채 세후이자 60원, 전환 시 30주 추가면 (900+60)/(150+30)=5.33원. 여러 개면 희석효과 큰 것부터 차례로 넣어요.",
"fa-10-0":"현금 움직임을 영업·투자·재무 셋으로 나눠요. 이자 받은 것, 배당 받은 것, 이자 낸 것은 영업으로 하거나 투자·재무로 하거나 회사가 선택할 수 있고, 배당 준 것은 영업 또는 재무예요. 법인세는 원칙 영업이에요. 현물출자나 사채의 주식 전환처럼 현금이 안 오간 거래는 표에 안 넣고 주석에 써요.\n\n예시: 기계 구입 현금 500원은 투자, 차입 300원은 재무, 이자지급 20원은 영업(선택 시 재무). 기계를 주식 주고 받았다면 현금흐름표 제외.",
"fa-10-1":"당기순이익에서 출발해 실제 현금 움직임으로 고쳐가는 방법이에요. 현금이 안 나간 비용(감가상각비)은 더하고, 투자활동에 속하는 처분이익은 빼요. 매출채권이 늘었으면 그만큼 현금을 못 받은 거라 빼고, 매입채무가 늘었으면 아직 안 낸 거라 더해요.\n\n예시: 순이익 1,000원, 감가상각비 200원, 유형자산처분이익 50원, 매출채권 증가 100원, 매입채무 증가 80원이면 영업현금흐름=1,000+200−50−100+80=1,130원.",

"fa-11-0":"다른 회사를 살 때 낸 돈이 그 회사 순자산 공정가치보다 크면 그 차이가 영업권이에요. 반대로 싸게 샀으면 염가매수차익으로 당기이익이에요. 인수 과정의 자문수수료는 비용이고, 주식 발행비는 자본에서 빼요. 지분을 100% 안 샀을 때 비지배지분은 공정가치 또는 순자산 비례 지분 중 선택할 수 있고, 선택에 따라 영업권이 달라져요.\n\n예시: 순자산 공정가치 800원인 회사를 1,000원에 100% 인수하면 영업권 200원. 700원에 샀다면 염가매수차익 100원.",
"fa-11-1":"다른 회사 지분을 20% 이상 가져서 경영에 영향력이 있으면 지분법이에요. 그 회사가 이익을 내면 내 지분율만큼 지분법이익으로 잡고 투자주식 장부금액을 키우고, 배당을 받으면 투자주식에서 빼요. 나와 그 회사 사이 거래에서 아직 외부에 안 팔린 이익은 내 지분율만큼 제거해요.\n\n예시: 30% 지분, 피투자회사 순이익 1,000원, 배당 200원. 지분법이익 300원, 투자주식 +300−60(배당 200×30%)=+240원. 내가 판 재고가 아직 그 회사 창고에 있고 이익이 100원이면 30원 제거.",

"ca-0-0":"원가는 보는 목적에 따라 여러 방식으로 나눠요. 제품에 직접 붙일 수 있으면 직접원가(재료비·노무비), 여럿이 나눠 쓰면 간접원가(공장 전기료)예요. 생산량 따라 변하면 변동원가, 안 변하면 고정원가예요. 이미 써서 되돌릴 수 없는 매몰원가는 의사결정에서 무시하고, 다른 선택을 포기해서 놓친 이익(기회원가)은 고려해요.\n\n예시: 빵집에서 밀가루는 직접재료비, 제빵사 급여는 직접노무비, 오븐 전기료는 제조간접비. 기본원가=밀가루+제빵사, 가공원가=제빵사+전기료.",
"ca-0-1":"원가는 원재료→재공품→제품→매출원가 순서로 흘러가고, 각 계정마다 '기초+들어온 것=기말+나간 것'이 성립해요. 문제에서 빈칸 하나를 주고 역산시키는 경우가 많아서 T계정을 그려서 푸는 게 가장 안전해요.\n\n예시: 기초재공품 100, 당기총제조원가 900, 기말재공품 150이면 당기제품제조원가=100+900−150=850. 기초제품 200, 기말제품 250이면 매출원가=200+850−250=800.",
"ca-0-2":"준변동원가는 기본요금+사용량 요금처럼 고정 부분과 변동 부분이 섞인 원가예요. 준고정원가는 감독자 1명이 10명까지 관리하다가 11명째부터 1명 더 필요해지는 것처럼 계단식으로 뛰어요. 고저점법은 조업도(생산량)가 가장 높은 달과 가장 낮은 달 두 점으로 변동비율을 구하는데, 원가가 가장 높은 달이 아니라는 게 함정이에요.\n\n예시: 3월 생산 100개 원가 5,000원, 8월 생산 200개 원가 8,000원이면 단위당 변동비=(8,000−5,000)/(200−100)=30원, 고정비=5,000−30×100=2,000원.",
"ca-1-0":"제조간접비는 연말이 돼야 실제 금액을 알 수 있어서, 연초에 예산으로 배부율을 미리 정해두고 그때그때 붙여요. 연말에 실제와 비교해 예정배부액이 실제보다 적으면 과소배부, 많으면 과대배부예요. 그 차이는 매출원가에서 한꺼번에 조정하거나(매출원가조정법), 재공품·제품·매출원가에 비례해서 나눠요.\n\n예시: 예산OH 120,000원, 예정 기계시간 10,000시간 → 배부율 12원. 실제 9,000시간이면 배부액 108,000원, 실제OH가 115,000원이면 과소배부 7,000원 → 매출원가에 가산.",
"ca-1-1":"전력부·수선부처럼 제품을 직접 안 만드는 보조부문 원가를 제조부문에 나눠주는 방법이에요. 직접배분법은 보조부문끼리 주고받은 건 무시하고 제조부문에만 배분해요. 단계배분법은 순서를 정해 한 번씩만 배분하니 순서에 따라 결과가 달라져요. 상호배분법은 서로 주고받은 것까지 연립방정식으로 풀어 가장 정확해요.\n\n예시: 전력부가 수선부에 20%, 수선부가 전력부에 10% 용역을 줄 때, 직접배분법은 이 20%·10%를 무시하고 제조부문 비율로만 나눠요.",
"ca-1-2":"직접재료비와 직접노무비는 실제 금액을 쓰고, 제조간접비만 예정배부율로 붙이는 방식이에요. 실제원가계산은 셋 다 실제, 표준원가계산은 셋 다 표준을 써요. 정상원가계산은 연말까지 기다리지 않고 제품 원가를 바로 계산할 수 있다는 게 장점이고, 대신 배부차이 조정이 필요해요.\n\n예시: 작업 #101에 재료비 500원(실제), 노무비 300원(실제), OH는 기계 20시간×예정배부율 12원=240원 → 정상원가 1,040원.",
"ca-2-0":"공정 중간에 있는 미완성품을 완성품 몇 개에 해당하는지로 바꾼 수치예요. 재료는 보통 공정 시작할 때 다 넣으니 완성도 100%, 가공비(노무비+OH)는 진행된 만큼만이라 따로 계산해요. 평균법은 기초재공품도 당기에 다 만든 것처럼 전부 포함하고, FIFO는 기초재공품 중 당기에 추가로 작업한 부분만 넣어요.\n\n예시: 완성품 800개, 기말재공품 200개(가공비 완성도 50%). 평균법 가공비 환산량=800+200×50%=900개. 기초재공품 100개(완성도 40%)가 있었다면 FIFO는 900−100×40%=860개.",
"ca-2-1":"평균법은 기초재공품에 이미 들어간 원가와 당기 원가를 합쳐서 하나의 평균 단가로 계산해요. FIFO는 기초재공품은 먼저 완성시켜 그 원가를 따로 넘기고, 당기 투입 원가만으로 당기 단위원가를 구해요. 그래서 FIFO 환산량은 평균법 환산량에서 기초재공품 환산량을 뺀 값이고, 기초재공품이 없으면 두 방법 결과가 같아요.\n\n예시: 평균법 환산량 900개, 기초재공품 환산량 40개면 FIFO 환산량 860개. 물가가 오르는 시기에 FIFO 단위원가가 당기 실제 원가를 더 잘 반영해요.",
"ca-2-2":"불량품(공손)은 정상적으로 생길 수밖에 없는 정도면 정상공손이라 합격품 원가에 얹고, 그 이상은 비정상공손이라 당기 손실이에요. 정상공손 허용량은 검사시점을 통과한 물량을 기준으로 계산해요. 기말재공품이 아직 검사시점 전이면 공손 원가를 배분받지 않아요.\n\n예시: 검사시점 완성도 50%, 정상공손 합격품의 5%. 완성품 800개, 기말재공품 200개(완성도 70%, 검사 통과)면 합격품 1,000개, 정상공손 50개. 기말재공품 완성도가 30%였다면 합격품은 800개뿐.",
"ca-2-3":"원유를 정제하면 휘발유·경유가 같이 나오듯 한 공정에서 여러 제품이 나올 때, 분리되기 전까지 든 결합원가를 제품별로 나누는 방법이에요. 물량(리터), 분리점 판매가치, 순실현가치(NRV), 균등이익률법이 있어요. 중요한 건 '추가로 가공할까' 결정할 때는 결합원가가 이미 든 매몰원가라 무시하고, 추가가공 후 늘어나는 수익과 추가가공원가만 비교한다는 거예요.\n\n예시: 제품A 분리점 판매가 500원, 추가가공비 200원 들여 800원에 팔 수 있으면 증분이익 100원이라 추가가공. 결합원가 배분액이 얼마든 상관없어요.",
"ca-3-0":"제조간접비를 기계시간 같은 한 가지 기준으로 뭉뚱그려 배부하지 않고, 활동(작업준비·검사·설계)별로 모아 각 활동을 일으키는 원인(원가동인)으로 배부해요. 전통적 방식은 대량생산 제품에 원가를 많이 씌우고 소량·복잡한 제품에 적게 씌우는 왜곡이 있는데, ABC를 쓰면 이게 뒤집혀요.\n\n예시: 작업준비 원가 100,000원을 준비횟수로 배부. 대량제품은 10,000개 생산에 준비 2회, 소량제품은 500개에 준비 8회면 소량제품이 80,000원을 부담해 단위당 원가가 훨씬 커져요.",
"ca-3-1":"활동을 어떤 단위로 발생하는지에 따라 4층으로 나눠요. 단위수준은 제품 1개마다(기계가동), 배치수준은 한 묶음마다(작업준비·검사), 제품수준은 제품 종류마다(설계·금형), 설비수준은 공장 전체(건물 관리)예요. 배치수준 원가는 생산량이 아니라 배치 횟수에 비례하고, 설비수준 원가는 마땅한 원가동인이 없어서 임의로 배부해요.\n\n예시: 작업준비 1회 5,000원. 1,000개를 1배치로 만들면 개당 5원, 10배치로 만들면 개당 50원. 생산량은 같아도 배치 수가 원가를 결정해요.",
"ca-4-0":"고정제조간접비(공장 임차료 등)를 제품 원가에 넣느냐(전부원가) 그해 비용으로 털어내느냐(변동원가)의 차이예요. 전부원가계산에서는 안 팔린 재고에 고정비가 묻어 자산으로 남으니, 생산이 판매보다 많으면 전부원가 이익이 더 커요. 두 이익의 차이는 고정OH 배부율×재고 변동량이에요.\n\n예시: 고정OH 100,000원, 생산 1,000개(개당 100원), 판매 800개. 전부원가는 200개×100원=20,000원이 재고에 남아 변동원가계산보다 이익이 20,000원 커요.",
"ca-4-1":"직접재료비만 제품 원가로 보고 노무비·제조간접비를 전부 그해 비용으로 처리하는 극단적 방법이에요. 재고를 쌓아도 재료비 외에는 자산으로 안 남으니 경영자가 이익을 부풀리려고 과잉생산할 유인이 사라져요. 재고가 늘어날 때 이익은 전부원가 > 변동원가 > 초변동원가 순이에요.\n\n예시: 생산 1,000개, 판매 800개, 개당 재료비 50원·노무비 30원·변동OH 20원, 고정OH 100,000원. 재고 200개에 남는 원가: 전부 200×200=40,000, 변동 200×100=20,000, 초변동 200×50=10,000.",
"ca-4-2":"이익도 손실도 없는 판매량이에요. 팔 때마다 남는 공헌이익(판매가−변동비)으로 고정비를 다 갚는 지점이라 BEP 수량=고정비÷단위당 공헌이익이에요. 목표이익이 있으면 고정비에 더해서 계산하고, 세후 목표이익은 (1−세율)로 나눠 세전으로 바꾼 뒤 계산해요. 법인세 자체는 이익이 0인 BEP에 영향이 없어요.\n\n예시: 판매가 100원, 변동비 60원, 고정비 200,000원 → BEP 5,000개. 세후 목표이익 80,000원, 세율 20%면 세전 100,000원 필요 → (200,000+100,000)/40=7,500개.",
"ca-4-3":"안전한계는 지금 매출이 BEP보다 얼마나 여유 있는지, 영업레버리지도(DOL)는 매출이 1% 변하면 이익이 몇 % 변하는지예요. DOL=공헌이익÷영업이익이고, 안전한계율의 역수와 같아요. 고정비 비중이 크면 DOL이 커서 매출이 조금만 변해도 이익이 크게 흔들려요.\n\n예시: 매출 1,000, 변동비 600, 고정비 300이면 공헌이익 400, 영업이익 100, DOL 4. 매출이 10% 늘면 이익은 40% 늘어 140. 안전한계율은 1/4=25%, 즉 BEP 매출은 750.",
"ca-4-4":"제품이 여러 개면 판매 비율(매출배합)이 일정하다고 가정하고 가중평균 공헌이익으로 BEP를 구해요. 그다음 배합 비율대로 제품별 수량을 나눠요. 공헌이익률이 높은 제품 비중이 늘면 평균 공헌이익이 커져서 BEP가 낮아져요.\n\n예시: A(공헌이익 30원)와 B(공헌이익 10원)를 1:3으로 팔고 고정비 60,000원. 묶음 1개 공헌이익=30+30=60원 → 1,000묶음 → A 1,000개, B 3,000개.",
"ca-5-0":"재료를 표준보다 비싸게 샀는지(가격차이)와 표준보다 많이 썼는지(능률차이)를 나눠요. 가격차이=(실제단가−표준단가)×실제수량, 능률차이=(실제수량−표준수량)×표준단가예요. 가격차이를 구입 시점에 분리하면 실제수량은 구입량이고, 능률차이는 사용량으로 계산해서 두 수량이 달라질 수 있어요.\n\n예시: 표준 개당 2kg×10원. 실제 1,000개 생산, 2,200kg 사용, 구입 3,000kg을 kg당 11원. 사용시점 가격차이=(11−10)×2,200=2,200 불리, 구입시점이면 (11−10)×3,000=3,000 불리. 능률차이=(2,200−2,000)×10=2,000 불리.",
"ca-5-1":"변동제조간접비도 노무비처럼 두 조각으로 나눠요. 소비차이는 실제 발생액과 실제시간에 표준배부율을 곱한 값의 차이, 능률차이는 실제시간과 표준허용시간의 차이에 배부율을 곱한 거예요. 변동OH가 보통 노동시간 기준으로 배부되니 능률차이는 노무비 능률차이와 같은 방향으로 나와요.\n\n예시: 표준 시간당 5원, 개당 2시간. 실제 1,000개, 2,100시간, 실제 변동OH 11,000원. 소비차이=11,000−2,100×5=500 불리, 능률차이=(2,100−2,000)×5=500 불리.",
"ca-5-2":"고정OH는 생산량과 무관하게 일정하니 능률차이가 없어요. 대신 예산차이(실제−예산)와 조업도차이(예산−배부액)가 있어요. 조업도차이는 배부율을 정할 때 쓴 기준조업도와 실제 생산에 허용되는 표준조업도가 달라서 생기고, 실제조업도와는 상관없어요. 3분법·4분법은 변동·고정OH 차이를 몇 개로 묶어 보여주느냐의 차이예요.\n\n예시: 고정OH 예산 100,000원, 기준조업도 10,000시간 → 배부율 10원. 표준허용시간 9,000시간, 실제 발생 103,000원. 예산차이 3,000 불리, 조업도차이=100,000−90,000=10,000 불리.",
"ca-5-3":"표준원가로 장부를 적으면 실제와의 차이가 남는데, 연말에 이걸 매출원가에 몰아넣거나(매출원가조정법) 재공품·제품·매출원가에 비례해서 나눠요(비례배분법). 차이가 크거나 비정상적이면 비례배분이 원칙이에요. 구입시점에 분리한 재료 가격차이는 아직 안 쓴 원재료에도 배분해요.\n\n예시: 불리한 차이 10,000원, 기말 재공품 20%·제품 30%·매출원가 50%면 각각 2,000·3,000·5,000원 가산. 매출원가조정법이면 10,000 전액 매출원가에.",
"ca-6-0":"평소 가격보다 싸게 대량 주문이 들어왔을 때 받을지 정하는 문제예요. 남는 생산능력이 있으면 추가로 들어오는 수익이 추가로 드는 변동비보다 크면 수락해요. 고정비는 어차피 나가니 무시해요. 생산능력이 없으면 기존 고객 판매를 포기해야 하니 그 공헌이익(기회원가)을 원가로 더해요.\n\n예시: 정상가 100원, 변동비 60원. 개당 70원에 1,000개 특별주문. 유휴능력 있으면 (70−60)×1,000=10,000원 이익이라 수락. 유휴능력이 없어 기존 판매 1,000개를 포기해야 하면 기회원가 40,000원이라 거절.",
"ca-6-1":"부품을 직접 만들지 사올지 정할 때는 '외부에서 사면 사라지는 원가'만 비교해요. 변동비와 피할 수 있는 고정비(그 라인 감독자 급여)는 사라지지만, 공장 임차료처럼 어차피 나가는 고정비는 무관해요. 자가제조를 그만두면 그 설비를 다른 데 써서 벌 수 있는 돈(임대수익 등)은 외부구입 쪽의 이익이에요.\n\n예시: 자가제조 시 변동비 50원, 회피가능고정비 10,000원, 회피불능고정비 20,000원, 1,000개. 외부구입가 58원이면 자가 60,000 vs 외부 58,000 → 외부구입. 설비 임대수익 5,000원까지 있으면 차이가 더 벌어져요.",
"ca-6-2":"적자 부문을 없앨지 정할 때 그 부문 영업손실만 보면 틀려요. 없애면 사라지는 공헌이익과 없애서 절약되는 고정비(회피가능)를 비교해야 해요. 본사 임차료처럼 부문에 배부만 됐지 없애도 계속 나가는 공통고정비는 무관해요. 공헌이익이 회피가능고정비보다 크면 적자여도 유지하는 게 회사 전체에 이득이에요.\n\n예시: C부문 매출 100,000, 변동비 70,000, 고정비 40,000(회피가능 20,000) → 영업손실 10,000. 폐지하면 공헌이익 30,000이 사라지고 고정비 20,000만 절약돼 회사 이익이 10,000 줄어요. 유지가 정답.",
"ca-6-3":"기계시간이나 원재료가 부족해서 다 못 만들 때 무엇을 먼저 만들지의 문제예요. 개당 공헌이익이 큰 제품이 아니라 '부족한 자원 한 단위당' 공헌이익이 큰 제품부터 만들어요. 제약이 두 개 이상이면 선형계획법으로 풀어요.\n\n예시: A 공헌이익 40원(기계 4시간), B 공헌이익 30원(기계 2시간). 시간당 공헌이익은 A 10원, B 15원이라 B부터 생산. 개당 공헌이익만 보고 A를 고르면 틀려요.",
"ca-6-4":"같은 회사 안에서 부품을 넘길 때 가격을 얼마로 할지예요. 파는 부문은 최소한 변동원가에 기회원가(외부에 팔았으면 벌었을 공헌이익)를 더한 금액은 받아야 해요. 사는 부문은 외부에서 살 수 있는 가격 이상은 안 내요. 파는 부문에 남는 설비가 있으면 기회원가가 0이라 최소가격은 변동원가예요.\n\n예시: 변동원가 60원, 외부판매가 100원인 부품. 파는 부문이 풀가동이면 최소대체가격 100원, 유휴설비면 60원. 사는 부문 외부구입가 90원이면 풀가동 시 대체 불성립(100>90), 유휴 시 60~90원 사이에서 협상.",
"ca-7-0":"1년 계획을 숫자로 만드는 순서예요. 판매예산에서 시작해 얼마나 만들지(생산예산), 재료를 얼마나 살지(구입예산), 인건비·OH, 그다음 매출원가와 현금예산, 마지막으로 예산 재무제표까지 가요. 생산량=판매량+기말제품−기초제품, 구입량=사용량+기말재료−기초재료 두 식이 연달아 나와요.\n\n예시: 판매 1,000개, 기초제품 100, 기말제품 150 → 생산 1,050개. 개당 재료 2kg, 기초재료 300kg, 기말재료 400kg → 구입 1,050×2+400−300=2,200kg.",
"ca-7-1":"연초 계획(고정예산)은 판매량이 달라지면 비교 기준으로 쓸모가 없어요. 변동예산은 실제 판매량 기준으로 예산을 다시 짠 거예요. 고정예산과 실제의 차이는 두 조각으로 나뉘어요. 판매량이 달라서 생긴 매출조업도차이=(실제수량−예산수량)×예산 단위당 공헌이익, 그리고 나머지 변동예산차이예요. 고정비는 판매량과 무관하니 조업도차이가 없어요.\n\n예시: 예산 1,000개, 실제 1,200개, 예산 공헌이익 40원 → 매출조업도차이 8,000 유리. 변동예산은 1,200개 기준으로 다시 계산해 실제와 비교.",
"ca-7-2":"사업부장이 잘했는지 평가하는 지표예요. ROI는 투자 대비 이익률, 잔여이익(RI)은 이익에서 투자액×요구수익률을 뺀 금액, EVA는 세후이익에서 자본비용을 뺀 거예요. ROI로 평가하면 회사 전체에는 좋은데 사업부 ROI를 낮추는 투자를 거절하는 문제(준최적화)가 생겨요. RI는 이 문제가 없지만 규모가 다른 사업부 비교엔 ROI가 나아요.\n\n예시: 사업부 ROI 20%, 회사 요구수익률 10%. 수익률 15%짜리 신규투자를 ROI 기준이면 거절(20%→낮아짐), RI 기준이면 수락(15%>10%).",
"ca-7-3":"재무 숫자만으로 평가하면 단기 실적에 매달리니까 네 관점을 같이 봐요. 재무, 고객, 내부프로세스, 학습과 성장이에요. 직원 교육(학습)→업무 개선(프로세스)→고객 만족(고객)→매출 증가(재무)로 이어지는 인과관계를 전제로, 앞쪽 비재무지표를 선행지표로 써요.\n\n예시: 직원 교육시간(학습성장) → 불량률(내부프로세스) → 고객 재구매율(고객) → 매출성장률(재무). 순서를 묻는 문제가 자주 나와요.",
"ca-8-0":"품질에 드는 돈을 네 가지로 나눠요. 불량을 막는 예방원가(교육·설계), 불량을 찾는 평가원가(검사), 출하 전 발견된 불량 처리 내부실패원가(재작업·폐기), 고객에게 간 뒤 터진 외부실패원가(보증수리·반품·평판)예요. 예방과 평가에 돈을 쓰면 실패원가가 줄고, 외부실패가 가장 비싸요.\n\n예시: 검사원 급여는 평가원가, 불량품 재작업비는 내부실패, 리콜 비용은 외부실패, 품질교육비는 예방원가.",
"ca-8-1":"같은 일을 반복하면 숙련돼서 시간이 줄어드는 걸 수식으로 만든 거예요. 누적생산량이 2배가 될 때마다 단위당 누적평균시간이 일정 비율(학습률)로 줄어요. 80% 학습곡선이면 2배 생산 시 평균시간이 80%로, 4배면 64%로 줄어요.\n\n예시: 첫 1대에 100시간. 80% 학습곡선이면 2대 누적평균 80시간(총 160시간), 4대 누적평균 64시간(총 256시간). 3·4번째 두 대는 256−160=96시간에 만든 셈.",
"ca-8-2":"목표원가계산은 '시장이 받아줄 가격'에서 '원하는 이익'을 빼서 원가 목표를 먼저 정하고 설계 단계에서 그 안에 맞추는 방식이에요. 제품 원가의 대부분이 설계할 때 이미 결정되기 때문에 설계 단계가 중요해요. 카이젠원가계산은 이미 생산 중인 제품의 원가를 조금씩 계속 줄이는 거예요.\n\n예시: 시장가 100원, 목표이익 20원이면 목표원가 80원. 현재 설계로 90원이 든다면 부품 수를 줄이거나 공용 부품을 써서 설계 단계에서 10원을 깎아요."

"tx-0-0":"세법에서 날짜를 세는 법은 민법을 그대로 따라요. 신고 마감일이 토요일·공휴일·근로자의날이면 다음 평일까지 해도 돼요. 우편으로 신고하면 우체국 소인 날짜가 신고일이고(발송 기준), 전자신고는 홈택스에 입력이 완료된 때가 신고일이에요.\n\n예시: 부가세 신고 마감 1월 25일이 토요일이면 27일 월요일까지 유효. 25일 밤에 우체국에서 발송 소인을 받으면 기한 내 신고, 홈택스는 25일 23시 59분까지 전송 완료해야 해요.",
"tx-0-1":"납세의무가 '생기는' 시점이에요. 아직 얼마인지는 몰라도 의무 자체는 이때 생겨요. 소득세·법인세·부가세는 과세기간이 끝나는 순간(12월 31일 밤), 상속세는 사망한 때, 증여세는 재산을 받은 때, 원천징수는 돈을 지급하는 때, 인지세는 문서를 작성한 때예요. 부가세 예정신고분은 예정신고기간 끝나는 때, 종부세는 6월 1일이에요.\n\n예시: 2026년 소득세는 2026년 12월 31일에 성립. 3월에 아버지가 돌아가셨으면 상속세는 그날 성립. 급여를 4월 25일에 지급했으면 원천징수 소득세는 그날 성립.",
"tx-0-2":"의무가 생긴 뒤 '얼마'로 정해지는(확정) 방식이에요. 소득세·법인세·부가세는 납세자가 신고하면 그 금액으로 확정(신고납세), 상속세·증여세는 세무서가 결정해야 확정(정부부과)돼요. 원천징수 세금과 인지세는 신고도 결정도 없이 성립과 동시에 자동으로 확정돼요. 종합부동산세는 원칙은 정부부과지만 납세자가 신고를 선택할 수도 있어요.\n\n예시: 상속세를 신고했어도 그건 협력의무일 뿐, 세무서가 결정통지해야 확정. 반면 법인세는 신고서 제출 즉시 확정돼서 수정하려면 수정신고·경정청구가 필요해요.",
"tx-0-3":"원래 납세자가 못 내면 대신 내야 하는 사람들이에요. 회사가 청산됐으면 청산인과 남은 재산을 받은 사람(받은 재산 한도), 법인이 못 내면 무한책임사원이나 지분 50% 넘는 과점주주(지분비율만큼), 반대로 주주가 못 내면 법인이, 사업을 통째로 넘겨받았으면 사업양수인(양수한 재산 한도)이에요.\n\n예시: 지분 60% 과점주주 A는 법인 체납세 1,000만원 중 600만원까지 책임. 사업양수인 B는 양도일 전에 확정된 그 사업 관련 세금만, 양수한 재산 가액 한도로 책임.",
"tx-0-4":"체납자 재산을 팔았을 때 국세가 다른 빚보다 먼저 가져간다는 원칙이에요. 예외가 있어요. 세금의 법정기일보다 먼저 설정된 저당권·전세권이 있으면 그쪽이 먼저고, 소액 임차보증금과 최종 3개월 임금은 항상 국세보다 앞서요. 법정기일은 신고한 세금은 신고일, 고지된 세금은 고지서 발송일이에요. 다만 상속·증여·종부세 같은 당해세는 저당권 설정일과 상관없이 우선해요(2023년부터 임차보증금은 예외).\n\n예시: 3월 1일 은행 저당권 설정, 5월 1일 부가세 신고(법정기일)면 은행이 우선. 저당권이 6월 1일이었다면 국세가 우선.",
"tx-1-0":"세무서가 세금을 부과할 수 있는 기간이에요. 지나면 부과 자체가 불가능하고, 중단이나 정지도 없어요. 정상 신고 5년, 신고 안 하면 7년, 사기 등 부정행위면 10년(해외거래는 15년)이에요. 상속·증여세는 10년이고 부정행위면 15년이에요. 이미 확정된 세금을 걷을 수 있는 기간(징수권 소멸시효, 5년·5억 이상 10년)은 독촉·압류 등으로 중단되니 둘을 헷갈리면 안 돼요.\n\n예시: 2020년 귀속 소득세(신고기한 2021.5.31)를 정상 신고했으면 2026.5.31까지만 추가 부과 가능. 무신고였다면 2028.5.31까지.",
"tx-1-1":"신고 후 고치는 세 가지 방법이에요. 적게 신고했으면 수정신고(부과제척기간 내 언제든), 아예 안 했으면 기한후신고, 많이 냈으면 경정청구(신고기한 후 5년, 나중에 사유가 생기면 안 날부터 3개월)예요. 수정신고는 신고 즉시 확정력이 있지만, 경정청구는 세무서가 2개월 안에 결정해줘야 효력이 생기고, 기한후신고도 세무서 결정으로 확정돼요.\n\n예시: 2025년 소득세를 100만원 많이 냈다면 2031년 5월 31일까지 경정청구 가능. 반대로 100만원 적게 냈으면 수정신고하면서 가산세를 함께 내요.",
"tx-1-2":"스스로 빨리 고치면 가산세를 깎아줘요. 수정신고는 신고기한 후 1개월 내 90%, 3개월 75%, 6개월 50%, 1년 30%, 1년 6개월 20%, 2년 10%. 기한후신고는 1개월 내 50%, 3개월 30%, 6개월 20%예요. 감면되는 건 과소신고·무신고 가산세만이고, 늦게 낸 이자 성격인 납부지연가산세는 감면 안 돼요. 세무조사 통지를 받은 뒤 신고하면 감면이 없어요.\n\n예시: 과소신고가산세 100만원, 납부지연가산세 30만원인 상황에서 신고기한 후 2개월 만에 수정신고하면 과소신고가산세는 25만원(75% 감면), 납부지연은 30만원 그대로.",
"tx-1-3":"세금이 잘못됐다고 다툴 때의 순서예요. 이의신청은 선택이고, 그다음 심사청구(국세청)·심판청구(조세심판원)·감사원 심사청구 중 하나를 골라야 해요. 이 셋 중 하나를 거치지 않으면 법원에 행정소송을 낼 수 없어요(필요적 전치). 각 단계마다 처분을 안 날부터 90일 이내예요. 심판청구는 청구인에게 더 불리하게 바꿀 수 없고(불이익변경금지), 결정은 90일 이내예요.\n\n예시: 5월 1일 고지서 수령 → 7월 30일까지 심판청구 → 기각 결정 수령 후 90일 내 행정소송. 이의신청을 건너뛰고 바로 심판청구해도 돼요.",
"tx-1-4":"세무조사에도 규칙이 있어요. 같은 세목·같은 기간을 두 번 조사하면 안 되고(예외: 탈루 자료가 명백한 경우 등), 조사 15일 전에 미리 알려야 하고, 중소규모 사업자는 20일 안에 끝내는 게 원칙이에요. 조사 시작할 때 납세자권리헌장을 주고, 세무사 조력을 받을 권리가 있고, 조사 결과 통지를 받으면 30일 내에 과세전적부심사를 청구할 수 있어요.\n\n예시: 2024년 법인세 조사를 마쳤는데 2025년에 같은 2024년 법인세를 다시 조사하려면 새로운 탈루 증거가 명백해야 해요.",
"tx-2-0":"세금을 걷는 절차의 첫 단계예요. 납부고지서는 원칙적으로 납부기한 30일 전에 보내고, 안 내면 10일 안에 독촉장을 보내며 독촉기한은 20일이에요. 독촉을 하면 징수권 소멸시효가 중단돼서 다시 5년이 시작돼요. 납세자가 파산·강제집행·경매 같은 상황이면 납부기한 전이라도 바로 징수할 수 있어요(납기전징수).\n\n예시: 납부기한 6월 30일, 미납 → 7월 10일까지 독촉장 발송, 독촉기한 7월 30일 → 이후 압류 가능. 독촉장이 나간 순간 소멸시효는 새로 계산.",
"tx-2-1":"독촉기한이 지나도 안 내면 재산을 압류하고 공매로 팔아서 세금에 충당해요. 생활필수품, 급여 중 일정액(월 250만원 등) 같은 압류금지재산은 건드릴 수 없어요. 다른 기관이 이미 압류·경매 중이면 새로 압류하는 대신 '나도 배분해달라'고 교부청구하거나 참가압류를 해요.\n\n예시: 체납자 아파트를 은행이 먼저 경매 신청했으면 세무서는 교부청구로 배분에 참여. 체납자 월급 300만원이면 250만원은 압류 불가, 50만원만 압류 가능.",
"tx-2-2":"세금을 '사기 기타 부정한 행위'로 안 냈을 때 형사처벌하는 법이에요. 2년 이하 징역 또는 포탈세액 2배 이하 벌금이고, 포탈액이 크면 가중돼요. 핵심은 단순히 신고를 안 하거나 적게 한 건 부정행위가 아니라는 거예요. 이중장부, 가짜 증빙, 장부 파기, 재산 은닉처럼 적극적으로 속이는 행위가 있어야 해요.\n\n예시: 매출 일부를 누락 신고만 했으면 가산세 대상이지 조세포탈범은 아님. 매출을 숨기려고 차명계좌를 쓰고 이중장부를 만들었으면 조세포탈.",
"tx-3-0":"법인세를 내는 주체와 기간이에요. 국내 법인은 전 세계 소득에, 외국 법인은 국내에서 번 소득에만 내요. 학교·종교단체 같은 비영리법인은 수익사업(임대·판매)에서 번 소득만 과세해요. 사업연도는 정관에서 정하되 1년을 넘을 수 없고, 바꾸려면 직전 사업연도 끝난 뒤 3개월 안에 신고해야 하며 안 하면 예전 사업연도가 유지돼요.\n\n예시: 3월 결산 법인이 12월 결산으로 바꾸려면 6월 30일까지 변경신고. 사단법인이 회원 회비로 번 건 비과세지만, 건물을 빌려주고 받은 임대료는 과세.",
"tx-3-1":"세법상 '수익'에 해당하는 항목이에요. 물건을 판 금액, 공짜로 받은 자산(자산수증이익), 빚을 탕감받은 금액(채무면제이익), 예전에 손금으로 뺐던 게 다시 돌아온 환입액, 특수관계인과 거래해서 생긴 시가차익 등이에요. 다만 공짜로 받은 자산이나 탕감받은 빚을 이월결손금 메우는 데 썼으면 그만큼은 익금에서 빼줘요.\n\n예시: 대주주가 회사에 1억을 무상 출연했고 회사에 이월결손금 7천만원이 있으면, 7천만원은 익금불산입하고 3천만원만 익금.",
"tx-3-2":"수익처럼 보이지만 익금이 아닌 것들이에요. 주식을 액면보다 비싸게 발행한 차액(주식발행초과금), 감자차익, 합병차익은 주주와의 거래(자본거래)라 익금이 아니에요. 자산을 평가해서 오른 이익, 이미 과세된 걸 다시 잡은 이월익금, 부가세 매출세액, 국세 환급받으면서 붙은 이자(환급가산금)도 익금불산입이에요. 주의할 건 자기주식처분이익은 회계에서는 자본이지만 세법에서는 익금이라는 거예요.\n\n예시: 액면 5천원 주식을 1만원에 발행 → 5천원은 익금불산입. 자기주식을 장부 1만원에 사서 1.2만원에 팔면 2천원은 익금.",
"tx-3-3":"다른 회사 주식을 갖고 받은 배당은 그 회사가 이미 법인세를 낸 돈이라 다시 과세하면 이중과세예요. 그래서 지분율에 따라 일정 비율을 익금에서 빼줘요. 지분 50% 이상이면 100%, 20% 이상이면 80%, 20% 미만이면 30%예요. 배당 직전 3개월 안에 산 주식은 배당 목적 취득으로 보고 제외하고, 그 주식 사느라 빌린 돈의 이자만큼은 공제액에서 빼요.\n\n예시: 지분 30% 자회사에서 배당 1,000만원 받으면 800만원 익금불산입. 배당기준일 2개월 전에 산 주식 분은 공제 없음.",
"tx-3-4":"세무조정으로 익금에 넣은 금액이 결국 누구 주머니로 갔는지 정하는 거예요. 회사 밖으로 나갔으면 받은 사람에 따라 주주면 배당, 임직원이면 상여, 그 외 개인이면 기타소득, 법인이나 사업자면 기타사외유출이에요. 회사 안에 남아 있으면 유보(나중에 반대로 풀림)예요. 누가 가져갔는지 모르면 대표자 상여로 봐요. 접대비 한도초과액, 기부금 한도초과액, 벌금은 자동으로 기타사외유출이에요.\n\n예시: 감가상각 한도초과 100만원 → 유보(나중에 손금 추인). 대표이사가 법인카드로 개인 물품 100만원 → 상여. 교통 범칙금 → 기타사외유출.",
"tx-4-0":"직원 급여는 원칙 손금이지만 임원은 한도가 있어요. 임원 상여는 정관·주총·이사회에서 정한 지급기준 안에서만 손금이고, 이익잉여금을 처분해서 주는 상여는 손금이 아니에요. 임원 퇴직금은 정관에 정한 금액, 정관에 없으면 '퇴직 전 1년 총급여×10%×근속연수'까지만 손금이고 초과분은 그 임원의 상여로 처분해요.\n\n예시: 정관에 퇴직금 규정이 없는 대표이사, 총급여 1억, 근속 10년이면 한도 1억. 실제 1.5억을 줬으면 5천만원은 손금불산입하고 대표이사 상여.",
"tx-4-1":"세법은 회사가 장부에 계상한 감가상각비를 인정하되 상각범위액(한도)까지만 인정해요(결산조정, 임의상각). 건물은 정액법만, 기계 등은 정률법·정액법 중 신고하고 신고 안 하면 정률법이에요. 한도를 넘으면 손금불산입(유보)하고, 다음 해에 한도보다 적게 계상하면 그 부족분 범위에서 전에 부인된 금액을 손금으로 풀어줘요(추인). 자본적 지출을 수선비로 처리하면 감가상각한 것으로 봐요(즉시상각의제).\n\n예시: 1년차 회사계상 300, 한도 200 → 100 손금불산입(유보). 2년차 회사계상 150, 한도 200 → 부족 50만큼 유보 추인해 손금산입.",
"tx-4-2":"거래처 접대비는 한도 안에서만 손금이에요. 한도=기본금액(연 1,200만원, 중소기업 3,600만원)+수입금액×적용률(100억 이하 0.3%, 500억 이하 0.2%, 초과 0.03%)이에요. 그 전에, 건당 3만원(경조사비 20만원) 넘는데 법인카드·세금계산서 같은 적격증빙이 없으면 한도 계산에도 못 넣고 전액 손금불산입이에요. 한도초과액은 기타사외유출이에요.\n\n예시: 중소기업, 매출 50억이면 한도=3,600만원+50억×0.3%=5,100만원. 접대비 6,000만원 중 현금영수증 없는 5만원짜리 식사 100건(500만원)은 우선 제외, 남은 5,500만원 중 400만원 한도초과.",
"tx-4-3":"기부금은 종류에 따라 손금 한도가 달라요. 국가·지자체·이재민 구호 같은 특례기부금은 소득의 50%, 종교단체·사회복지법인 같은 일반기부금은 10%(사회적기업 20%)까지이고, 넘은 금액은 10년간 이월해서 공제해요. 한도 계산에 아예 안 들어가는 비지정기부금(동창회 등)은 전액 손금불산입이에요. 현물로 기부하면 특례·일반은 장부가액, 특수관계인에게 준 일반기부금이나 비지정은 시가로 평가해요.\n\n예시: 소득금액 1억, 특례기부금 6천만원 → 5천만원 손금, 1천만원 이월. 어음으로 기부했으면 실제 결제된 날이 지출일.",
"tx-4-4":"못 받게 된 채권(대손금)과 미리 쌓는 대손충당금이에요. 충당금 한도는 기말 채권잔액의 1%와 대손실적률 중 큰 비율이에요. 대손 사유 중 소멸시효 완성처럼 법적으로 확정된 건 장부에 안 적어도 손금(신고조정), 회수불능처럼 판단이 필요한 건 장부에 적어야 손금(결산조정)이에요. 특수관계인에게 업무와 무관하게 빌려준 가지급금은 대손 처리도, 충당금 설정도 안 돼요.\n\n예시: 채권 10억, 대손실적률 1.5% → 한도 1,500만원. 대표이사 가지급금 2억은 채권잔액에서 제외하고 계산.",
"tx-4-5":"빌린 돈의 이자 중 손금으로 인정 안 하는 것들이고, 여러 개가 겹치면 정해진 순서대로 부인해요. 1순위 채권자를 알 수 없는 사채이자, 2순위 실명 안 밝힌 채권·증권 이자, 3순위 공사 중인 자산에 대한 건설자금이자(자산 원가로), 4순위 업무무관자산이나 가지급금에 해당하는 이자예요. 1·2순위는 대표자 상여, 4순위는 기타사외유출로 처분해요.\n\n예시: 총 지급이자 1,000만원 중 채권자불분명 이자 200만원 먼저 부인(대표자 상여). 남은 800만원을 기준으로 업무무관 가지급금 비율만큼 추가 부인(기타사외유출).",
"tx-5-0":"재고와 유가증권을 어떻게 평가할지 세무서에 신고해야 해요. 재고는 신고한 방법을 쓰고, 신고 안 하면 선입선출법(부동산 매매업은 개별법)이에요. 유가증권은 원가법(총평균·이동평균)이고 평가손익은 원칙적으로 인정 안 해요. 신고한 방법과 다르게 임의로 바꾸면 신고한 방법과 선입선출법 중 큰 금액으로 평가해서 불이익을 줘요.\n\n예시: 총평균법 신고 후 임의로 후입선출법 적용 → 총평균법 평가액과 FIFO 평가액 중 큰 쪽으로 기말재고 계산(익금 증가).",
"tx-5-1":"특수관계인(대주주·임원·계열사)과 거래해서 세금을 부당하게 줄였으면 시가로 다시 계산해요. 시가와 거래가 차이가 3억 이상이거나 시가의 5% 이상일 때 적용해요. 특수관계 여부는 거래 당시 기준이에요. 대표이사에게 무이자로 빌려줬으면 적정이자율(가중평균차입이자율 또는 당좌대출이자율)로 인정이자를 계산해 익금에 넣고 상여 처분해요.\n\n예시: 시가 10억 토지를 대주주에게 8억에 팔면 차이 2억이 시가의 20%라 부인 대상 → 2억 익금산입, 배당 처분. 가지급금 1억, 이자율 4.6%면 인정이자 460만원.",
"tx-5-2":"적자(결손금)는 이후 15년간 이익에서 빼줘요(2020년 이후 발생분). 다만 한 해에 뺄 수 있는 건 그 해 소득의 80%(중소기업은 100%)까지예요. 중소기업은 반대로 작년에 낸 법인세를 돌려받는 소급공제도 가능해요. 여러 해 결손금이 있으면 오래된 것부터 써요. 세율은 과세표준 2억까지 9%, 200억까지 19%, 3,000억까지 21%, 초과 24%예요.\n\n예시: 일반법인, 소득 10억, 이월결손금 12억 → 8억만 공제, 과세표준 2억, 잔여 4억 이월. 중소기업이면 10억 전부 공제.",
"tx-5-3":"법인세는 사업연도가 끝난 달의 말일부터 3개월 안에 신고·납부해요. 외부감사 대상은 1개월 연장할 수 있어요. 사업연도가 6개월을 넘는 법인은 중간에 절반을 미리 내는 중간예납을 하는데, 작년 세액의 절반 또는 상반기 가결산 중 선택이에요. 낼 세금이 1천만원을 넘으면 1개월(중소기업 2개월) 나눠 낼 수 있어요.\n\n예시: 12월 결산 법인은 다음 해 3월 31일까지 신고. 중간예납은 8월 31일까지. 세액 3천만원이면 1천만원 초과분 2천만원까지 분납 가능.",
"tx-5-4":"각종 세액공제·감면을 다 받아도 최소한 이만큼은 내라는 하한선이에요. 감면 전 과세표준에 최저한세율(일반법인 10~17%, 중소기업 7%)을 곱한 금액보다 감면 후 세액이 적으면 그 차이만큼 감면을 취소해요. 외국납부세액공제와 재해손실세액공제는 최저한세 계산에 넣지 않아서(적용 배제) 그대로 다 받아요.\n\n예시: 중소기업 과세표준 10억, 산출세액 1.6억, 감면 1.2억이면 감면 후 0.4억. 최저한세 10억×7%=0.7억이라 감면을 0.3억 줄여 0.7억 납부.",
"tx-6-0":"국내에 주소가 있거나 183일 이상 거주하면 거주자예요. 거주자는 전 세계 소득에, 비거주자는 국내 소득에만 소득세를 내요. 해외 근무하는 공무원이나 국내 회사가 해외 지점·현지법인으로 보낸 임직원은 외국에 오래 있어도 거주자로 봐요. 과세기간은 무조건 1월 1일부터 12월 31일이고 바꿀 수 없어요.\n\n예시: 미국에서 2년째 사는 외국인이 한국에 200일 머물렀으면 거주자라 미국 소득까지 신고. 삼성 미국법인에 파견된 한국 직원은 미국에 살아도 거주자.",
"tx-6-1":"이자와 배당을 합쳐 연 2천만원이 넘으면 다른 소득과 합산해 누진세율로 과세해요. 2천만원 이하면 14% 원천징수로 끝이에요. 국내 법인 배당은 법인세를 이미 낸 돈이라 이중과세를 줄이려고 배당액의 10%를 더해서(Gross-up) 소득에 넣고 그만큼 세액공제해주는데, 2천만원 초과분에만 적용해요. 개인 간 대여 이자(비영업대금이익)는 25%로 원천징수해요.\n\n예시: 이자 1,500만원+배당 1,000만원=2,500만원. 초과분 500만원에 Gross-up 50만원 → 배당가산 후 종합과세, 배당세액공제 50만원.",
"tx-6-2":"장사·서비스·부동산임대로 번 소득이에요. 총수입에서 필요경비를 뺀 게 사업소득금액이고, 적자면 다른 종합소득과 합쳐 줄일 수 있어요. 단 부동산임대 결손금은 다른 소득과 통산 못 하고 임대소득끼리만 이월해요. 법인과 달리 개인사업자 본인 급여는 필요경비가 아니에요. 주택임대수입이 연 2천만원 이하면 14% 분리과세를 선택할 수 있어요.\n\n예시: 음식점 결손 3천만원, 근로소득 5천만원 → 종합소득 2천만원. 상가임대 결손 3천만원이었다면 통산 불가, 근로소득 5천만원 그대로.",
"tx-6-3":"월급·상여·수당을 합친 총급여에서 근로소득공제를 뺀 게 근로소득금액이에요. 식대 월 20만원, 자기 차로 업무 다니는 자가운전보조금 월 20만원, 6세 이하 자녀 보육수당 월 20만원 등은 비과세예요. 일용근로자는 하루 15만원을 빼고 6%로 원천징수하면 끝(분리과세)이에요. 회사가 다음 해 2월 급여 줄 때 연말정산으로 정산해요.\n\n예시: 총급여 5,000만원이면 근로소득공제 1,225만원 → 근로소득금액 3,775만원. 일용직 하루 20만원이면 (20−15)만원×6%×(1−55% 감면)=1,350원 원천징수.",
"tx-6-4":"일시적으로 생기는 강연료, 원고료, 상금, 위약금 같은 소득이에요. 강연료·원고료 등은 실제 경비 영수증 없어도 60%를 필요경비로 인정해줘요. 기타소득금액(경비 뺀 후)이 연 300만원 이하면 종합과세 대신 20% 분리과세를 선택할 수 있어요. 뇌물·알선수재는 무조건 종합과세예요. 계약금이 위약금으로 대체된 경우는 원천징수를 안 해요.\n\n예시: 강연료 500만원 → 필요경비 300만원(60%), 기타소득금액 200만원, 원천징수 200만원×20%=40만원. 300만원 이하라 종합과세 안 하고 끝낼 수 있음.",
"tx-6-5":"국민연금 같은 공적연금은 종합과세예요. 연금저축·퇴직연금에서 받는 사적연금은 연 1,500만원 이하면 나이에 따라 3~5% 저율 분리과세를 선택할 수 있고, 넘으면 종합과세하거나 15% 분리과세 중 고를 수 있어요. 넣을 때 연금계좌 세액공제 한도는 연 900만원(연금저축 단독 600만원)이고, 중간에 깨면 기타소득으로 15% 과세해요.\n\n예시: 65세, 연금저축 수령 1,200만원 → 5% 분리과세 선택 가능(60만원). 1,800만원이면 전액 종합과세 또는 15% 분리과세(270만원) 선택.",
"tx-7-0":"본인·배우자·부양가족 1인당 150만원을 소득에서 빼주는 게 기본공제예요. 조건은 연 소득금액 100만원 이하(근로소득만 있으면 총급여 500만원 이하)이고, 부모는 60세 이상, 자녀는 20세 이하여야 해요. 장애인은 나이 상관없어요. 추가로 70세 이상 경로우대 100만원, 장애인 200만원, 부녀자 50만원, 한부모 100만원을 더 빼주고, 부녀자와 한부모가 겹치면 한부모만 적용해요.\n\n예시: 본인, 배우자(소득 없음), 72세 아버지, 15세 자녀 → 기본공제 600만원+경로우대 100만원=700만원.",
"tx-7-1":"계산된 세금에서 직접 빼주는 항목이에요. 자녀세액공제(8세 이상), 연금계좌 납입액, 보험료(12%), 의료비(총급여의 3% 넘는 금액의 15%), 교육비(15%), 기부금(15%, 1천만원 초과 30%) 등이에요. 의료비는 부양가족의 나이나 소득 상관없이 공제되고, 교육비는 나이 제한은 없지만 소득 요건은 있어요.\n\n예시: 총급여 5,000만원, 의료비 400만원 → 3%인 150만원을 초과한 250만원×15%=37.5만원 세액공제. 소득 있는 30세 자녀 의료비도 공제 가능.",
"tx-7-2":"종합소득세율은 과세표준 1,400만원까지 6%, 5,000만원 15%, 8,800만원 24%, 1.5억 35%, 3억 38%, 5억 40%, 10억 42%, 초과 45%예요. 확정신고는 다음 해 5월 1일~31일이고, 성실신고확인 대상 사업자는 6월 30일까지예요. 회사에서 연말정산으로 끝난 근로소득만 있는 사람이나 분리과세로 끝난 소득은 신고 안 해도 돼요.\n\n예시: 과세표준 6,000만원 → 1,400×6%+3,600×15%+1,000×24%=84+540+240=864만원(누진공제 방식으로 6,000×24%−576=864).",
"tx-7-3":"팔 때 이익에 세금을 매기는 자산이에요. 토지·건물, 분양권·전세권 같은 부동산 권리, 대주주 상장주식과 비상장주식, 특정주식·영업권 같은 기타자산, 파생상품이에요. 소액주주가 상장주식을 장내에서 팔면 비과세예요. 영업권은 공장 같은 사업용 자산과 함께 팔면 양도소득이고, 영업권만 따로 팔면 기타소득이에요.\n\n예시: 일반 개인이 삼성전자 주식을 증권사 앱으로 팔면 양도세 없음. 지분 1% 이상 대주주면 과세. 부동산 없이 권리금만 받고 넘기면 기타소득.",
"tx-7-4":"양도가액에서 취득가액과 필요경비(취득세·중개수수료·자본적지출)를 빼면 양도차익이에요. 실제 거래가가 원칙이고, 옛날에 사서 취득가를 모르면 매매사례가액→감정가액→환산취득가액 순서로 정하고, 환산할 때 필요경비는 개산공제(취득가의 3% 등)로 대신해요. 3년 이상 보유하면 장기보유특별공제(연 2%, 최대 30%, 1세대1주택은 보유·거주 각 4%씩 최대 80%)를 빼고, 마지막에 연 250만원을 기본공제해요.\n\n예시: 양도 10억, 취득 6억, 경비 5천만원, 10년 보유 → 차익 3.5억, 장특공제 20%(7천만원) → 2.8억−250만원=양도소득금액.",
"tx-7-5":"한 세대가 집 한 채를 2년 이상 보유하고 팔면 양도세가 없어요(조정대상지역에서 산 집은 2년 거주도 필요). 양도가 12억을 넘는 고가주택은 12억 초과분에 해당하는 차익만 과세해요. 이사 때문에 잠깐 2주택이 되면 새 집 산 날부터 3년 안에 종전 집을 팔면 비과세예요. 판정은 양도일 기준이고, 예정신고는 양도한 달 말일부터 2개월 안에 해요.\n\n예시: 15억에 판 1주택(차익 5억) → 과세 차익=5억×(15−12)/15=1억. 3월 15일 양도 → 5월 31일까지 예정신고.",
"tx-8-0":"부가세는 사업자가 내요. 사업자란 돈 벌 목적이든 아니든 계속·반복적으로 독립해서 재화나 용역을 공급하는 사람이에요. 국가나 지자체도 사업자가 될 수 있어요. 면세사업자(병원·학원 등)는 부가세 납세의무가 없어요. 신탁재산으로 거래하면 위탁자가 아니라 수탁자가 납세의무자예요.\n\n예시: 비영리 단체가 바자회를 매년 열어 물건을 팔면 사업자. 개인이 중고 물건을 한 번 팔면 사업자 아님. 치과는 면세라 부가세 신고 의무 없음(진료 외 미용시술은 과세).",
"tx-8-1":"부가세 과세기간은 1기(1~6월), 2기(7~12월)이고, 각 기간 앞 3개월은 예정신고기간이에요. 사업 시작한 날부터 20일 안에 사업자등록을 해야 해요. 등록 전에 산 물건의 매입세액은 원칙적으로 공제 못 받지만, 그 물건을 산 과세기간이 끝난 뒤 20일 안에 등록하면 그 기간 매입분은 공제돼요.\n\n예시: 5월 10일 인테리어 비용 매입세액 300만원, 7월 15일 사업자등록 → 1기 종료(6/30) 후 20일 이내라 공제 가능. 7월 25일 등록이면 공제 불가.",
"tx-8-2":"실제로 판 게 아닌데도 판 것으로 보고 부가세를 매기는 경우예요. 과세사업용 물건을 면세사업에 쓰거나(자가공급), 사장이 개인적으로 가져가거나(개인적 공급), 거래처에 선물하거나(사업상 증여), 폐업할 때 남은 재고(잔존재화)예요. 처음 살 때 매입세액을 공제 못 받은 물건은 공급의제에서 제외예요. 견본품이나 광고선전용 무상 제공은 사업상 증여가 아니에요.\n\n예시: 가전 매장 사장이 매입세액 공제받은 TV를 집에 가져가면 시가로 과세. 골프장에서 손님에게 나눠주는 로고 볼은 광고선전용이라 과세 안 함.",
"tx-8-3":"세금계산서를 언제 끊고 어느 과세기간에 신고할지 정하는 기준이에요. 현금·외상 판매는 물건을 넘긴 때, 장기할부·완성도기준·중간지급조건부는 돈을 받기로 한 각 시점, 수출은 선적일, 위탁판매는 수탁자가 판 날이에요. 공급시기 전에 세금계산서를 미리 끊고 7일 안에 돈을 받으면 발급일이 공급시기가 돼요.\n\n예시: 3년 할부로 기계를 팔고 매달 100만원씩 받기로 했으면 매달 100만원씩 공급시기. 반품 조건부로 넘겼으면 조건이 확정된 날.",
"tx-8-4":"용역은 서비스 제공이 끝난 때, 시설을 빌려주면 이용하게 한 때가 공급시기예요. 공사처럼 완성도에 따라 받거나 중간지급조건부·장기할부·계속적 공급이면 돈을 받기로 한 각 시점이에요. 부동산 임대 보증금에 대한 간주임대료는 예정·확정신고기간이 끝나는 날이에요. 공짜로 해주는 용역은 원칙 과세 안 하지만, 특수관계인에게 부동산을 무상 임대하면 과세해요.\n\n예시: 6개월 컨설팅 계약, 매월 말 대금 청구 → 매월 말이 공급시기. 상가 보증금 1억에 대한 간주임대료는 6/30, 12/31 등 신고기간 종료일.",
"tx-9-0":"수출처럼 세율 0%를 적용하는 거예요. 매출세액은 0인데 매입세액은 전부 돌려받으니 세금이 완전히 빠져서 '완전면세'라고 해요. 직접 수출뿐 아니라 내국신용장·구매확인서로 수출업체에 납품한 것, 외국 항공·해운, 외국인 관광객 대상 일부 용역도 영세율이에요. 영세율이라도 부가세 신고 의무는 있어요.\n\n예시: 100만원어치 수출, 원재료 매입세액 5만원 → 매출세액 0, 환급 5만원. 국내 수출업체에 구매확인서 받고 납품해도 똑같이 영세율.",
"tx-9-1":"미가공 식료품, 병원 진료, 학원 교육, 금융·보험, 토지, 주택 임대, 도서·신문처럼 부가세를 안 매기는 거래예요. 매출세액이 없는 대신 매입세액도 공제 못 받아서 '부분면세'예요. 면세는 원칙적으로 포기 못 하지만 영세율 적용 대상이나 학술연구단체 등은 면세를 포기하고 과세사업자가 될 수 있고, 포기하면 3년간 다시 면세로 못 돌아가요. 미용 목적 성형·피부시술은 과세예요.\n\n예시: 쌀 판매는 면세, 즉석밥은 과세. 상가 임대는 과세, 주택 임대는 면세. 병원 쌍꺼풀 수술은 과세, 백내장 수술은 면세.",
"tx-9-2":"부가세를 매기는 기준 금액이에요. 돈으로 받으면 그 돈, 물건으로 받으면 내가 준 물건의 시가, 특수관계인에게 싸게 팔았으면 시가예요. 에누리·환입·할인, 연체이자, 국고보조금은 과세표준에 안 들어가요. 반대로 대손금, 현금으로 준 판매장려금, 하자보증금은 과세표준에서 빼주지 않아요. 장려금을 물건으로 주면 사업상 증여로 과세돼요.\n\n예시: 판매가 1,000만원, 조기결제 할인 50만원, 대손 100만원 → 과세표준 950만원(대손은 대손세액공제로 따로 처리).",
"tx-9-3":"매입세액인데 공제 안 해주는 것들이에요. 세금계산서를 안 받았거나 내용이 틀린 경우, 사업과 무관한 지출, 8인승 이하 승용차(비영업용) 구입·유지비, 접대비, 면세사업 관련, 토지 조성 비용이에요. 세금계산서를 늦게 받아도 그 과세기간 확정신고기한 안이면 공제되고 가산세만 붙어요. 9인승 이상 승합차, 화물차, 1,000cc 미만 경차는 공제돼요.\n\n예시: 영업용 아닌 5인승 승용차 리스료 매입세액 → 불공제. 배달용 1톤 트럭 → 공제. 거래처 접대 식사 → 불공제.",
"tx-9-4":"외상으로 팔고 부가세를 냈는데 거래처가 부도나서 못 받으면 낸 부가세를 돌려받는 제도예요. 대손금액의 10/110을 매출세액에서 빼요. 파산·소멸시효 완성 등 대손이 확정된 날이 속한 확정신고 때만 되고, 예정신고에서는 안 돼요. 공급일부터 10년 지난 날이 속한 과세기간의 확정신고기한까지 확정된 대손만 인정돼요. 물건 산 쪽은 그만큼 매입세액에서 빼야 해요.\n\n예시: 2024년 3월 공급가액 1,000만원(부가세 100만원 포함 1,100만원)이 2026년 5월 소멸시효 완성 → 2026년 1기 확정신고에서 100만원 공제.",
"tx-9-5":"작은 개인사업자를 위한 간편 제도예요. 직전연도 매출(공급대가)이 1억 400만원 미만이면 간이과세자예요. 세액은 매출×업종별 부가가치율×10%로 간단히 계산하고, 매출 4,800만원 미만이면 아예 납부 의무가 없어요. 대신 환급은 못 받아요. 매출 4,800만원 이상 간이과세자는 세금계산서를 발급해야 해요. 부동산임대업·유흥주점은 4,800만원 기준이에요.\n\n예시: 소매업(부가가치율 15%) 매출 8,000만원 → 8,000×15%×10%=120만원. 매출 4,000만원이면 납부면제.",
"tx-10-0":"세금계산서는 공급시기에 끊는 게 원칙이고, 한 달치를 모아서 다음 달 10일까지 끊는 월합계도 돼요. 법인과 직전연도 매출 8천만원 이상 개인은 전자세금계산서 의무예요. 공급자 등록번호·성명, 공급받는 자 등록번호, 공급가액과 세액, 작성연월일 이 네 가지가 필요적 기재사항이라 하나라도 빠지거나 틀리면 받는 쪽 매입세액이 공제 안 돼요.\n\n예시: 3월 한 달 거래를 4월 10일에 하나로 발급 → 적법. 공급받는 자 사업자번호를 잘못 적으면 매입세액 불공제.",
"tx-10-1":"예정신고·확정신고 모두 각 기간 끝난 뒤 25일 안에 해요. 개인 일반과세자는 예정신고 대신 세무서가 직전 세액의 절반을 고지하는데(예정고지), 50만원 미만이면 고지를 생략해요. 환급은 확정신고 후 30일 안에 주고, 영세율·시설투자·재무구조개선은 조기환급이라 15일 안에 주며 예정·확정뿐 아니라 월별로도 신청할 수 있어요.\n\n예시: 1기 확정신고 7월 25일 → 일반환급 8월 24일까지. 수출업체가 1월 매입세액 환급을 2월 25일 조기환급 신고 → 3월 12일까지 환급.",
"tx-10-2":"세금계산서 관련 가산세예요. 안 끊으면 공급가액의 2%, 늦게 끊으면 1%, 내용이 틀리면 1%, 전자세금계산서를 끊고 국세청에 전송 안 하면 0.5%(늦게 하면 0.3%)예요. 매출처별세금계산서합계표를 안 내면 0.5%예요. 실제 거래 없이 끊은 가공세금계산서는 3%, 남의 이름으로 끊은 위장은 2%예요. 같은 건에 여러 가산세가 걸리면 하나만 적용하는 중복배제 규정이 있어요.\n\n예시: 공급가액 1,000만원 거래의 세금계산서를 안 끊었으면 20만원. 거래 없이 끊어줬으면 30만원."

"pf-0-0":"파레토 효율은 '누군가를 나쁘게 만들지 않고는 아무도 더 좋게 만들 수 없는 상태'예요. 조건이 셋이에요. 소비자들끼리 물건을 더 바꿔도 이득이 없어야 하고(MRS 동일), 생산자들끼리 자원을 바꿔도 이득이 없어야 하고(MRTS 동일), 무엇을 얼마나 만들지가 소비자 취향과 맞아야 해요(MRS=MRT). 효율은 '낭비가 없다'는 뜻이지 '공평하다'는 뜻이 아니에요.\n\n예시: 빵 100개를 A가 다 가져도, B에게 옮기면 A가 나빠지니 파레토 효율이에요. 효율적이지만 전혀 공평하지 않죠.",
"pf-0-1":"제1정리는 '완전경쟁시장은 저절로 파레토 효율에 도달한다'는 보이지 않는 손의 수학적 표현이에요. 제2정리는 '어떤 파레토 효율점이든 처음 재산 배분을 적절히 바꾼 뒤 시장에 맡기면 도달할 수 있다'는 거예요. 즉 정부는 분배만 손보고 배분은 시장에 맡겨도 된다는 뜻인데, 그 재분배가 시장을 왜곡하지 않는 정액세로 가능하다는 비현실적 전제가 붙어요.\n\n예시: 부자에게 정액세 1억을 걷어 가난한 사람에게 주고 시장에 맡기면 새로운 효율점에 도달. 소득세로 걷으면 노동 유인이 바뀌어 비효율 발생.",
"pf-0-2":"시장에 맡기면 효율에 못 이르는 경우들이에요. 국방처럼 돈 안 낸 사람도 못 막는 공공재, 공해처럼 남에게 피해를 주는 외부성, 전력망처럼 한 회사가 하는 게 싼 자연독점, 중고차처럼 파는 쪽만 정보를 아는 정보 비대칭이에요. 소득이 불평등한 건 시장이 효율적이어도 생기는 문제라 시장실패가 아니라 '분배' 문제로 분류해요.\n\n예시: 중고차 시장에서 좋은 차가 안 팔리는 건 정보비대칭(역선택). 보험 가입 후 조심 안 하는 건 도덕적 해이.",
"pf-0-3":"사회 전체 후생을 개인 효용으로 어떻게 합칠지의 문제예요. 공리주의는 효용을 단순 합산해서 사회무차별곡선이 기울기 −1인 직선이고, 롤스는 가장 못사는 사람의 효용만 보니까 L자형이에요. 애로우의 불가능성 정리는 합리적인 5가지 조건을 모두 만족하는 사회적 선택 규칙은 존재하지 않는다는 거예요.\n\n예시: A 효용 100, B 효용 10인 상태와 A 60, B 40인 상태. 공리주의는 합이 큰 앞쪽(110), 롤스는 최소값이 큰 뒤쪽(40)을 선택.",
"pf-1-0":"공공재는 두 성질을 가져요. 한 사람이 더 소비해도 남의 소비가 안 줄고 추가 비용이 없는 비경합성, 돈 안 낸 사람을 못 막는 비배제성이에요. 둘 다 있으면 순수공공재(국방·등대), 배제는 되는데 경합이 없으면 클럽재(케이블TV), 경합은 되는데 배제가 안 되면 공유자원(바다 물고기)이에요. 무임승차는 비배제성 때문에 생기고, 비경합성은 배제하는 게 비효율적인 이유예요.\n\n예시: 고속도로는 톨게이트로 배제 가능하지만 한산할 땐 비경합 → 클럽재. 막히면 경합재.",
"pf-1-1":"공공재는 모두가 같은 양을 소비하니 최적 공급량은 '모든 사람의 한계편익을 합친 것'이 한계비용과 같아지는 지점이에요(ΣMRS=MRT). 사적재는 각자 다른 양을 사니 개별 한계편익이 가격과 같아지면 돼요(MRS=MRT). 그래서 공공재 수요곡선은 개별 수요곡선을 수직으로 더하고, 사적재는 수평으로 더해요.\n\n예시: 가로등 1개에 A는 30원, B는 50원 가치를 느끼고 설치비 70원이면 합 80원>70원이라 설치가 효율적. A나 B 혼자서는 안 만들어요.",
"pf-1-2":"공공재 비용을 각자 느끼는 한계편익만큼 나눠 내면(린달가격) 모두 동의하는 효율적 공급이 가능하다는 모형이에요. 세금 가격이 사람마다 다른 게 특징이에요. 문제는 자기 편익을 낮게 말하면 세금이 줄어드니 다들 거짓말할 유인이 있어서(무임승차) 현실에서는 잘 안 된다는 거예요.\n\n예시: 공원 조성비 100원, A 편익 60원, B 편익 40원이면 A가 60원, B가 40원 부담. B가 편익을 10원이라고 속이면 B 부담이 줄어요.",
"pf-1-3":"사람들이 공공재 선호를 솔직하게 말하게 만드는 장치예요. 클라크세는 '당신 때문에 결정이 바뀌어서 다른 사람들이 손해 본 만큼'만 세금으로 걷어요. 그러면 거짓말해서 얻을 게 없어져 진실을 말하는 게 최선이 돼요. 단점은 걷힌 세금이 필요한 비용과 안 맞아서 예산이 남고, 여러 명이 짜고 거짓말하면 무너져요.\n\n예시: 다리 건설에 A 찬성(편익 80), B·C 반대(각 30). A 때문에 결정이 찬성으로 바뀌면 A는 B·C 손해 합 60만큼 클라크세를 내요. A는 편익 80>60이라 여전히 찬성이 이득.",
"pf-2-0":"내 행동이 시장 거래 없이 남에게 영향을 주는 게 외부성이에요. 공장 매연은 외부불경제라 사회적 비용이 사적 비용보다 커서 시장은 너무 많이 생산하고, 예방접종은 외부경제라 너무 적게 해요. 최적 오염 수준은 0이 아니라 오염 줄이는 한계비용과 오염의 한계피해가 같아지는 지점이에요. 내 수요 증가로 가격이 올라 남이 손해 보는 건 금전적 외부성이라 시장실패가 아니에요.\n\n예시: 공장 생산 1단위당 사적비용 10원, 주민 피해 5원이면 사회적 한계비용 15원. 시장은 10원 기준으로 생산해 과잉.",
"pf-2-1":"피구세는 외부불경제 만드는 생산자에게 '사회적 최적 생산량에서의 외부한계비용'만큼 세금을 매겨서 생산을 최적 수준으로 줄이는 방법이에요. 세율은 시장 균형점이 아니라 최적점의 외부비용으로 정해요. 외부경제는 반대로 보조금을 줘요. 다만 보조금을 주면 그 산업에 새 기업이 몰려와 장기적으로 오염이 더 늘 수도 있어요.\n\n예시: 최적 생산량 100단위에서 단위당 주민 피해가 5원이면 피구세 5원/단위. 현재 150단위에서의 피해 8원을 쓰면 안 돼요.",
"pf-2-2":"재산권만 명확하고 협상 비용이 없으면 정부 개입 없이도 당사자끼리 협상해서 효율적 결과에 도달한다는 정리예요. 재산권을 공장에 주든 주민에게 주든 최종 오염량(효율)은 같아요. 다만 누가 누구에게 돈을 주느냐(소득분배)는 달라져요. 당사자가 많거나 협상 비용이 크면 성립하지 않아요.\n\n예시: 공장 이익 100원, 주민 피해 60원. 주민이 권리를 가지면 공장이 60~100원을 주고 가동, 공장이 권리를 가지면 주민이 못 막아 가동. 결과는 둘 다 가동으로 같음.",
"pf-2-3":"오염을 줄이는 방법으로 정부가 직접 '너는 얼마까지'라고 정하는 직접규제와, 세금이나 배출권 거래로 유인을 주는 방법이 있어요. 유인 방식은 오염 줄이기 쉬운(한계저감비용 낮은) 기업이 많이 줄이게 돼서 사회 전체 비용이 최소가 돼요. 피구세는 가격이 확실하고 총량이 불확실, 배출권 거래는 총량이 확실하고 가격이 불확실해요.\n\n예시: A기업 저감비용 톤당 10원, B기업 30원. 각각 50톤씩 줄이라는 규제보다 배출권을 거래하면 A가 100톤 다 줄이고 B가 A에게 돈을 줘서 비용이 2,000원 vs 1,000원으로 절약.",
"pf-3-0":"선호가 하나의 봉우리(단봉)이고 쟁점이 한 줄로 늘어설 때, 다수결로 정하면 딱 중간에 있는 사람(중위투표자)이 원하는 게 뽑혀요. 양 극단 사람들의 강한 선호는 무시되고, 그 결과가 효율적 공급량이라는 보장도 없어요. 누군가의 선호가 두 봉우리면 다수결이 빙빙 도는 투표의 역설이 생길 수 있어요.\n\n예시: 예산을 100·200·300으로 원하는 세 명이면 다수결 결과는 200. 300을 원하는 사람이 편익을 훨씬 크게 느껴도 반영 안 돼요.",
"pf-3-1":"콩도르세 역설은 개인 선호는 일관돼도 다수결 결과가 A>B, B>C, C>A로 돌고 도는 현상이에요. 이럴 땐 투표 순서를 정하는 사람이 결과를 마음대로 만들 수 있어요(의제 조작). 보르다 투표는 순위에 점수를 매기는 방식인데 관계없는 대안이 추가되면 결과가 바뀌는 문제가 있어요. 만장일치는 현상유지에 유리해요.\n\n예시: 갑(A>B>C), 을(B>C>A), 병(C>A>B). A vs B는 A 승, B vs C는 B 승, C vs A는 C 승 → 순환.",
"pf-3-2":"니스카넨 모형에서 관료는 자기 부서 예산을 최대한 키우려 하고, 의회는 정보가 부족해서 총편익이 총비용과 같아지는 수준까지 승인해요. 그 결과 효율적 수준의 2배를 공급해요. 지대추구는 기업이 생산 대신 정부 특혜(관세·면허)를 얻으려 로비에 자원을 쓰는 낭비예요. 로그롤링은 의원끼리 표를 주고받아 각자 지역 사업을 통과시켜 지출이 과다해지는 현상이에요.\n\n예시: 효율적 공급량이 50인데 관료는 총편익=총비용인 100까지 예산을 따내요.",
"pf-3-3":"정부가 시장실패를 고치려다 오히려 문제를 만드는 거예요. 정부도 정보가 부족하고, 정치인은 표를 좇고, 관료는 예산을 키우고, 규제가 규제 대상 산업에 포섭되고(규제 포획), 정책이 의도치 않은 부작용을 내요(파생적 외부성). 그렇다고 정부 개입이 무조건 나쁘다는 건 아니고, 시장실패 비용과 정부실패 비용을 비교해야 해요.\n\n예시: 임대료 상한제가 주택 공급을 줄여 오히려 주거난을 키우는 것. 금융 감독기관이 은행 출신으로 채워져 은행 편을 드는 것(포획).",
"pf-4-0":"세금을 누가 얼마나 내야 공평한지의 원칙이에요. 편익원칙은 정부 서비스를 받는 만큼 내는 것(유류세로 도로 건설), 능력원칙은 낼 능력만큼 내는 거예요. 능력원칙 안에서 같은 능력이면 같은 세금(수평적 공평), 능력이 크면 더 많은 세금(수직적 공평)이에요. 능력은 소득·소비·재산으로 잴 수 있어요.\n\n예시: 연봉 5천만원인 두 사람이 같은 세금을 내면 수평적 공평. 연봉 1억이 5천만원보다 더 내면 수직적 공평. 얼마나 더 내야 하는지는 원칙이 답을 안 줘요.",
"pf-4-1":"세금을 법적으로 누가 내든 실제 부담은 시장에서 결정돼요. 가격이 변해도 행동을 못 바꾸는 쪽(탄력성이 낮은 쪽)이 더 부담해요. 판매자에게 매기든 소비자에게 매기든 결과는 같아요. 공급이 완전탄력적이거나 수요가 완전비탄력적이면 소비자가 전부 부담해요.\n\n예시: 담배는 수요가 비탄력적이라 담뱃세를 회사에 매겨도 가격이 거의 그대로 올라 소비자가 대부분 부담. 종량세와 종가세도 같은 세수면 귀착이 같아요.",
"pf-4-2":"경쟁시장에선 단위당 세금만큼 가격이 오르지 않지만, 독점에서는 상황이 달라요. 수요곡선이 직선이면 독점가격은 세금의 절반만 오르는데, 수요의 가격탄력성이 일정한 곡선이면 가격이 세금보다 더 많이 오를 수 있어요(과잉전가). 독점기업이 세금을 다 소비자에게 넘기는 게 아니라, 수요곡선 모양에 따라 결정돼요.\n\n예시: 탄력성 2인 일정탄력성 수요에서 한계비용이 10원 오르면 독점가격은 20원 올라요.",
"pf-4-3":"법인세는 회사가 내지만 결국 누가 부담하는지를 일반균형으로 분석한 모형이에요. 법인 부문 자본에만 세금을 매기면 자본이 비법인 부문으로 옮겨가고, 그 결과 경제 전체의 자본 수익률이 떨어져요. 즉 법인 주주만이 아니라 모든 자본 소유자가 부담하게 돼요. 생산요소 대체 정도와 수요 탄력성에 따라 노동자에게도 일부 전가될 수 있어요.\n\n예시: 법인세 도입 → 법인 부문 투자 감소 → 자본이 농업·개인사업으로 이동 → 그쪽 수익률도 하락 → 모든 자본가 부담.",
"pf-5-0":"세금 때문에 사람들이 행동을 바꿔서 생기는 손실 중 정부가 걷은 세수로도 메워지지 않는 순손실이에요. 초과부담은 대략 ½×세율²×탄력성×가격×수량이라 세율의 제곱에 비례해요. 세율을 2배로 올리면 초과부담은 4배가 돼요. 탄력성이 클수록 커지고, 행동을 못 바꾸는 정액세는 초과부담이 0이에요.\n\n예시: 세율 10%에서 초과부담 100원이면 세율 20%에선 400원. 세수는 2배가 안 되는데 손실은 4배.",
"pf-5-1":"정해진 세수를 걷으면서 초과부담을 최소화하려면 어떤 물건에 얼마나 세금을 매길지의 규칙이에요. 답은 '모든 재화의 보상수요량이 같은 비율로 줄게' 세율을 정하는 거예요. 이를 단순화하면 수요가 비탄력적인 재화에 높은 세율을 매기라는 역탄력성 규칙이 돼요. 효율만 생각한 규칙이라 쌀·소금 같은 필수재에 중과하게 돼서 공평성에는 안 좋아요.\n\n예시: 쌀(탄력성 0.2)과 명품가방(탄력성 2)이면 램지 규칙은 쌀에 10배 높은 세율을 요구해요.",
"pf-5-2":"소득세 세율 구조를 어떻게 짜야 공평과 효율을 최적으로 맞추는지의 이론이에요. 에지워스는 노동 공급이 안 변한다고 보고 완전 균등(한계세율 100%)을 주장했고, 머리스는 노동 유인을 고려하면 최고소득자의 한계세율은 0이어야 한다고 했어요. 그 이상 세율을 매겨봤자 최고소득자가 일을 줄일 뿐 세수는 안 늘기 때문이에요. 스턴은 선형(비례) 소득세로 최적세율을 계산했어요.\n\n예시: 소득 최상위 1명에게 마지막 1원의 세율이 50%라면, 그걸 0%로 낮춰도 세수는 그대로고 그 사람이 더 일해 효율만 올라가요.",
"pf-5-3":"여가에는 세금을 못 매기니 여가와 같이 쓰이는 재화(보완재)에 높은 세금을 매기면 간접적으로 여가에 과세하는 효과가 나서 초과부담이 줄어요. 반대로 여가 대신 쓰이는 재화(대체재)는 낮게 매겨요. 램지 규칙을 여가까지 확장한 거예요.\n\n예시: 골프채·요트(여가 보완재)에 중과, 통근용 교통비·업무용품(여가 대체재)에 경과.",
"pf-6-0":"세금 매길 '소득'을 어떻게 정의할지의 문제예요. 헤이그-사이먼스 정의는 소득=그 해 소비+순자산 증가로, 아직 안 판 주식 값 오른 것(미실현 이득), 자기 집에 살아서 아낀 임대료(귀속소득), 상속·증여도 다 소득이에요. 이 포괄적 소득에 과세하면 저축한 돈은 벌 때 한 번, 이자 받을 때 또 과세돼서 이중과세라는 비판이 있고, 그래서 소비를 기준으로 하자는 지출세 주장이 나와요.\n\n예시: 연봉 5천만원에 보유 주식이 2천만원 올랐고 자기 집 귀속임대료 1천만원이면 H-S 소득은 8천만원.",
"pf-6-1":"소득세가 노동 공급에 미치는 영향은 두 힘이 반대예요. 세금으로 시간당 실수령이 줄면 일하는 게 덜 매력적이라 여가를 늘리고(대체효과), 동시에 가난해졌으니 더 일해야 해서 노동을 늘려요(소득효과). 비례세는 둘이 상쇄해서 방향이 불확실하고, 누진세는 한계세율이 높아 대체효과가 커서 노동을 줄일 가능성이 커요. 정액세는 소득효과만 있어서 노동이 늘어요.\n\n예시: 시급 2만원에 세율 30%면 실수령 1.4만원. 여가 1시간 값이 싸져서 덜 일하고 싶지만(대체), 목표 소득을 채우려 더 일해야 함(소득).",
"pf-6-2":"이자에 세금을 매기면 저축의 수익률이 떨어져요. 저축이 덜 매력적이라 현재 소비를 늘리고(대체효과), 미래 소득이 줄어 지금 더 저축해야 하는(소득효과) 두 힘이 부딪혀서 저축이 늘지 줄지는 이론으로 확정 못 해요. 소득세는 저축분에 이자소득세까지 붙어 이중과세지만, 소비세는 저축을 뺀 소비에만 과세해서 저축 결정에 중립적이에요.\n\n예시: 이자율 5%에 세율 20%면 세후 4%. 목표 노후자금이 정해져 있으면 더 저축(소득효과), 저축 대가가 줄었으니 지금 쓰자(대체효과).",
"pf-6-3":"물건 살 때 붙는 세금이에요. 부가세는 각 단계에서 부가가치에만 과세하니 유통 단계가 몇 개든 최종 세부담이 같고(중립적), 옛날 거래세는 단계마다 누적돼서 기업이 수직통합할 유인을 만들었어요. 소비세는 소득 대비로 보면 저소득층 부담 비율이 커서 역진적이에요. 개별소비세는 사치재 과세나 담배·술 같은 외부성 교정 목적이에요.\n\n예시: 제조→도매→소매 3단계든 제조→소매 2단계든 부가세 총액은 최종 판매가의 10%로 같아요.",
"pf-6-4":"법인에 따로 세금을 매기는 근거는 법인이 주주와 별개의 실체라는 법인실체설이에요. 반면 법인은 주주의 도구일 뿐이라는 법인의제설에서는 법인세+배당소득세가 이중과세라 통합해야 한다고 봐요. 통합 방법은 배당세액공제(우리나라 Gross-up, 부분통합)나 법인이익을 주주 소득으로 바로 잡는 완전통합이에요. 법인세는 이자는 비용이고 배당은 아니라서 부채 조달을 유리하게 만드는 왜곡이 있어요.\n\n예시: 법인이익 100, 법인세 20 후 배당 80에 소득세 → 이중과세. Gross-up으로 배당에 10% 가산 후 세액공제하면 일부 완화.",
"pf-7-0":"정부 사업이 할 만한지 따지는 방법이에요. 미래 편익과 비용을 할인율로 현재가치화해 차이(NPV)가 양수면 시행해요. 내부수익률(IRR)이나 편익/비용 비율(B/C)도 쓰지만, 사업 규모가 다르거나 둘 중 하나만 골라야 할 때 NPV와 다른 답을 줄 수 있어 NPV가 기본이에요. 할인율을 낮게 잡으면 먼 미래 편익이 커 보여서 장기 사업이 유리해져요.\n\n예시: A사업 NPV 100억(B/C 1.2), B사업 NPV 50억(B/C 2.0). B/C로는 B, NPV로는 A. 예산 제약 없으면 A 선택.",
"pf-7-1":"국채를 발행하면 미래 세대가 부담하느냐의 논쟁이에요. 러너는 국내에서 빌린 돈은 미래에 세금 걷어 미래 사람에게 갚는 거라 세대 간 이전일 뿐 부담이 없다고 봤어요. 부캐넌은 갚을 때 세금 내는 사람이 부담한다, 모딜리아니는 국채가 민간 저축을 흡수해 자본축적이 줄어 미래 소득이 줄기 때문에 부담이라고 했어요. 리카도 대등정리는 사람들이 미래 증세를 예상해 저축하므로 국채와 조세가 경제에 똑같은 효과를 낸다는 거고, 성립하면 재정정책은 효과가 없어요.\n\n예시: 정부가 100만원 감세하고 국채 발행 → 합리적 국민은 나중 증세에 대비해 100만원을 저축 → 소비 불변.",
"pf-7-2":"정부가 지출을 늘리려고 돈을 빌리면 이자율이 올라 민간 투자가 줄어드는 게 구축효과예요. 화폐수요가 이자율에 민감하면(탄력성 큼) 이자율이 조금만 올라도 되니 구축이 작고, 고전학파처럼 이자율에 둔감하면 완전 구축이에요. 케인즈의 유동성함정에서는 이자율이 안 올라 구축효과가 0이에요.\n\n예시: 정부지출 100조 증가 → 국채 발행 → 이자율 상승 → 기업 투자 60조 감소 → 순효과 40조. 고전학파면 투자가 100조 감소해 순효과 0.",
"pf-7-3":"주민이 자기 취향에 맞는 지방정부를 찾아 이사하면(발로 하는 투표) 지방공공재가 효율적으로 공급된다는 가설이에요. 이사가 자유롭고, 지자체가 많고, 지역 간 외부성이 없고, 정보가 완전해야 성립해요. 중앙집권보다 지방분권을 지지하는 논거로 쓰이지만, 부자는 부자끼리 가난한 사람은 가난한 사람끼리 모이는 거주 분리 문제가 생겨요.\n\n예시: 교육 예산 많고 세금 높은 A시와 세금 낮은 B시 중 자녀 있는 가정은 A로, 은퇴자는 B로 이사.",
"pf-7-4":"중앙정부가 지방에 주는 돈은 조건에 따라 효과가 달라요. 용도 제한 없는 정액보조금은 지방 소득이 늘어난 것과 같아 소득효과만 있고, 특정 사업비의 일정 비율을 지원하는 정률보조금은 그 사업의 가격을 낮추는 효과가 있어 해당 지출을 더 많이 늘려요. 끈끈이 효과는 보조금이 같은 액수의 주민 소득 증가보다 지방 지출을 더 늘리는 현상이에요. 다른 지역까지 혜택이 가는 사업은 정률보조가 정당해요.\n\n예시: 도서관 건립비 50% 정률보조 → 도서관 비용이 반값이라 더 많이 지음. 정액 10억 보조 → 도서관에 일부, 나머지는 다른 데.",
"pf-8-0":"연금 재원을 마련하는 두 방식이에요. 적립방식은 내가 낸 돈을 쌓아뒀다가 내가 받는 거라 저축을 늘리지만 인플레이션에 약해요. 부과방식은 지금 일하는 세대가 낸 돈으로 지금 은퇴 세대에게 주는 거라 처음 도입될 때 세대는 안 내고 받아 이득이고, 수익률이 인구증가율+임금상승률이라 고령화되면 유지가 어려워요.\n\n예시: 부과방식에서 근로자 10명이 은퇴자 1명을 부양하다 고령화로 2명이 1명을 부양하면 보험료가 5배 올라야 해요.",
"pf-8-1":"건강보험·실업보험을 정부가 강제로 운영하는 이유예요. 민간 보험은 건강한 사람은 안 들고 아픈 사람만 들어서(역선택) 보험료가 치솟아 시장이 무너지는데, 전 국민 강제가입이면 이 문제가 없어요. 사람들이 노후 대비를 게을리하는 근시안적 행동을 막는 온정적 간섭도 근거예요. 보험 들면 조심을 덜 하는 도덕적 해이는 본인부담금으로 줄이고, 실업급여는 구직 기간을 늘리는 부작용이 있어요.\n\n예시: 민간 암보험은 가족력 있는 사람이 몰려 보험료 상승. 국민건강보험은 전원 가입이라 위험이 섞여요.",
"pf-8-2":"저소득층에게 현금을 주면 본인이 원하는 데 써서 효용이 가장 크지만, 정부가 원하는 용도(식료품·교육)에 쓰라고 현물로 주기도 해요. 현물은 낙인 문제도 있어요. 부의 소득세(NIT)는 소득이 기준 이하면 정부가 거꾸로 돈을 주는 제도로, 급여=보장소득−세율×소득이에요. 이 세율이 높으면 벌수록 급여가 깎여 일할 유인이 줄어요. 근로장려세제(EITC)는 저소득 구간에서 벌수록 더 주니 노동 유인을 키워요.\n\n예시: NIT 보장소득 1,000만원, 세율 50%면 소득 1,000만원인 사람은 급여 500만원, 소득 2,000만원이면 0.",
"pf-8-3":"소득이 얼마나 고르게 분배됐는지 재는 도구예요. 로렌츠곡선은 하위 x%가 소득의 몇 %를 갖는지 그린 곡선이고, 대각선에서 멀수록 불평등해요. 지니계수는 그 면적을 0(완전평등)~1(완전불평등)로 숫자화한 거예요. 십분위분배율은 하위 40% 소득÷상위 20% 소득이라 클수록 평등해요. 로렌츠곡선이 서로 교차하면 지니계수로 비교가 안 돼서 사회의 불평등 혐오도를 반영한 앳킨슨 지수를 써요.\n\n예시: 하위 40%가 소득 20%, 상위 20%가 소득 40%면 십분위분배율 0.5. 이 값이 0.6이 되면 더 평등해진 것."

"cl-0-0":"상법상 회사는 다섯 종류이고 전부 법인이에요. 합명회사는 사원 모두가 회사 빚에 무한책임, 합자회사는 무한책임사원과 유한책임사원이 섞여 있어요. 주식회사·유한회사·유한책임회사는 출자한 만큼만 책임져요. 합명·합자회사는 사원이 2명 이상 있어야 하고, 나머지 셋은 혼자서도 만들 수 있어요.\n\n예시: 친구 둘이 무한책임을 지고 만들면 합명회사. 혼자 5천만원 출자해 만들면 1인 주식회사 가능. 합명회사를 혼자 만드는 건 불가.",
"cl-0-1":"회사가 주주와 별개라는 원칙을 악용해 빚을 피하는 경우, 법원이 그 사안에 한해서 '회사와 주주는 하나'로 보고 주주에게 책임을 묻는 법리예요. 회사 자체가 없어지는 게 아니고, 다른 거래에서는 여전히 별개예요. 우리 상법에 조문은 없고 판례로 인정돼요.\n\n예시: 사장이 회사 돈을 개인 통장처럼 쓰고 회사를 빈 껍데기로 만든 뒤 채권자에게 '회사 빚이라 나는 모른다'고 하면, 법원이 그 채권자에 대해서만 사장 개인 책임을 인정.",
"cl-0-2":"회사는 정관에 적힌 목적 범위 안에서 권리와 의무를 가져요. 다만 판례는 목적을 넓게 해석해서, 목적 달성에 필요하거나 유익한 행위(기부·보증)도 인정해요. 회사는 다른 회사의 무한책임사원이 될 수 없어요. 해산 후 청산 중인 회사는 청산 목적 범위 안에서만 능력이 있어요.\n\n예시: 제조업 목적 회사가 지역 장학재단에 기부하거나 거래처 대출에 보증을 서는 건 유효. 다른 회사의 합명회사 사원이 되는 건 불가.",
"cl-0-3":"회사 종류를 바꾸는 건 비슷한 것끼리만 돼요. 합명↔합자, 주식회사↔유한회사·유한책임회사예요. 합명회사를 주식회사로 바로 바꾸는 건 안 돼요. 총사원 동의나 총주주 동의가 필요하고, 법인격은 그대로 유지돼서 새 회사가 되는 게 아니에요. 주식회사가 유한회사로 바뀌려면 사채를 다 갚아야 해요(유한회사는 사채 발행 불가).\n\n예시: 사채 10억이 남은 주식회사는 상환 전까지 유한회사로 조직변경 불가.",
"cl-1-0":"정관에 반드시 적어야 하고 하나라도 빠지면 정관 전체가 무효인 항목이에요. 목적, 상호, 발행할 주식 총수, 1주 액면금액, 설립 시 발행 주식 수, 본점 소재지, 공고 방법, 발기인의 이름·주민번호·주소예요. 자본금 총액은 여기 안 들어가요. 무액면주식을 발행하는 회사는 1주 금액을 안 적어도 돼요.\n\n예시: 정관에 '공고는 회사 홈페이지에 한다'는 항목을 빠뜨렸으면 정관이 무효라 설립등기가 안 돼요.",
"cl-1-1":"설립 단계에서 발기인이 회사 재산을 빼먹을 수 있는 위험한 항목들이라 정관에 적어야만 효력이 있어요. 발기인이 받는 특별이익, 현금 대신 물건으로 내는 현물출자, 회사 성립 후 특정 재산을 사기로 미리 약속하는 재산인수, 설립비용과 발기인 보수예요. 현물출자와 재산인수는 법원이 선임한 검사인이 조사하는데, 공인 감정인 감정으로 대신할 수 있고 소액이거나 상장주식이면 조사를 생략해요.\n\n예시: 발기인이 자기 공장 건물을 10억으로 평가해 출자하면 정관 기재+검사인 조사(또는 감정) 필요. 정관에 없으면 그 출자는 무효.",
"cl-1-2":"발기설립은 발기인들이 주식을 전부 인수하고, 이사·감사도 발기인들이 의결권 과반수로 뽑아요. 모집설립은 발기인이 일부만 인수하고 나머지는 외부에서 모집하며, 창립총회를 열어 이사·감사를 뽑아요. 모집설립에서 인수인이 돈을 안 내면 2주 이상 기간을 정해 독촉한 뒤 권리를 잃게 하는 실권절차가 있는데, 발기설립에는 이 절차가 없어요.\n\n예시: 창업자 3명이 주식 전부 인수 → 발기설립. 3명이 60% 인수하고 40%를 지인들에게 모집 → 모집설립, 창립총회 필요.",
"cl-1-3":"발기인은 설립 과정을 책임져요. 인수 안 된 주식은 발기인이 공동으로 인수한 것으로 보고, 납입 안 된 돈은 발기인이 연대해서 내야 해요(인수·납입담보책임). 이건 과실이 없어도 지는 무과실책임이고 총주주가 동의해도 면제 못 해요. 회사에 손해를 끼친 경우의 손해배상책임은 과실책임이라 총주주 동의로 면제 가능해요. 회사가 아예 안 만들어지면 발기인이 모든 비용에 연대책임이에요. 설립무효 소송은 2년 안에 내야 하고 판결은 소급하지 않아요.\n\n예시: 1,000주 중 100주가 납입 안 됐으면 발기인들이 그 100주 대금을 연대 납입.",
"cl-1-4":"자본금은 발행한 주식의 액면 총액이에요. 무액면주식이면 발행가의 절반 이상에서 이사회가 정한 금액이에요. 최저자본금 제도는 없어져서 100원으로도 회사를 만들 수 있고, 액면가는 100원 이상이면 돼요. 정관에 적힌 발행예정주식총수 안에서는 주총 없이 이사회가 신주를 발행할 수 있어요. 액면주식과 무액면주식을 섞어 발행할 수는 없어요.\n\n예시: 액면 500원 주식 10,000주 발행 → 자본금 500만원. 발행예정총수 40,000주면 이사회가 30,000주까지 추가 발행 가능.",
"cl-2-0":"보통주와 다른 내용의 종류주식이에요. 배당을 더 주거나(이익배당 우선주), 의결권이 없거나 제한되거나, 회사가 되사거나(상환주식), 다른 주식으로 바꿀 수 있는(전환주식) 주식이에요. 의결권 없는 주식은 발행주식 총수의 4분의 1을 넘을 수 없어요. 상환주식은 배당 가능한 이익으로만 상환하고, 전환주식은 전환하면 주식이 그대로 남아요. 정관을 바꿔서 어떤 종류주주에게 손해가 생기면 그 종류주주총회 결의가 따로 필요해요.\n\n예시: 발행주식 10,000주면 무의결권주는 2,500주까지. 상환주식 상환은 이익이 없으면 못 해요.",
"cl-2-1":"주식은 자유롭게 팔 수 있는 게 원칙이에요. 정관에 정하면 이사회 승인을 받도록 제한할 수 있는데, 승인을 거부하면 주주는 회사에 다른 매수인을 지정하거나 회사가 사달라고 청구할 수 있어요. 정관이 아니라 주주 간 계약으로 양도를 막으면 당사자 사이엔 유효해도 회사에는 주장 못 해요. 주권이 발행되기 전에 양도하면 회사에 대항 못 하지만, 설립 후 6개월이 지나면 주권 없이도 양도가 유효해요.\n\n예시: 정관에 '주식 양도는 이사회 승인'이 있으면 승인 없이 판 주식은 회사에 명의개서 청구 불가. 승인 거부 시 회사에 매수청구 가능.",
"cl-2-2":"회사가 자기 주식을 사는 건 원래 자본 충실을 해치니 제한하는데, 배당할 수 있는 이익 범위 안에서는 주총 결의(정관으로 이사회 결의 가능)로 살 수 있어요. 합병·단주 처리 같은 특정 목적이면 제한 없이 살 수 있어요. 자기주식은 의결권이 없고, 처분은 이사회가 정해요. 사고 나서 그 해에 배당가능이익이 부족해질 것을 알았어야 했으면 이사가 회사에 배상해야 해요.\n\n예시: 배당가능이익 5억인 회사는 5억까지 자기주식 취득 가능. 취득한 주식은 주총에서 표를 못 던져요.",
"cl-2-3":"주식을 사도 회사 주주명부에 내 이름을 올려야(명의개서) 회사에 주주 권리를 주장할 수 있어요. 회사는 주주 확정을 위해 3개월 안의 기준일을 정하거나 명부를 3개월 이내로 폐쇄할 수 있어요. 2017년 전원합의체 판결로, 명부에 없는 실제 주주는 회사에 권리를 주장할 수 없고 회사도 그 사람을 주주로 인정할 수 없게 됐어요. 명부 기재가 기준이에요.\n\n예시: 3월 31일 기준일 → 그날 명부에 있는 사람이 정기주총 의결권. 4월에 산 사람은 그 주총에서 의결권 없음.",
"cl-2-4":"소각은 주식을 없애는 것으로, 자본금 감소 절차로 하거나 회사가 보유한 자기주식을 이익으로 소각해요. 병합은 여러 주식을 하나로 합치는 것으로 자본금 감소에 쓰이며 채권자보호절차와 단주 처리가 필요해요. 분할은 1주를 여러 주로 쪼개는 것으로 주총 특별결의가 필요하고 액면가는 100원 아래로 못 내려가며 자본금은 안 변해요.\n\n예시: 액면 5,000원 주식을 5주로 분할 → 액면 1,000원, 주식수 5배, 자본금 동일. 10주를 1주로 병합 → 자본금 감소.",
"cl-3-0":"주주총회는 이사회가 결의하고 대표이사가 소집해요. 총회 2주 전에 각 주주에게 통지해야 하고 전자통지도 돼요. 3% 이상 주주는 이사회에 소집을 청구할 수 있고, 안 열어주면 법원 허가를 받아 직접 소집할 수 있어요. 주주 전원이 동의하면 통지 절차 없이 열 수 있어요. 자본금 10억 미만 회사는 10일 전 통지면 되고, 총주주 동의로 서면결의도 가능해요.\n\n예시: 3월 30일 주총이면 3월 15일까지 통지 발송. 주주가 3명뿐이고 다 동의하면 통지 없이 당일 개최 가능.",
"cl-3-1":"보통결의는 출석 주주 의결권의 과반수이면서 발행주식 총수의 4분의 1 이상 찬성이에요. 특별결의는 출석의 3분의 2 이상이면서 발행주식 총수의 3분의 1 이상이에요. 특수결의는 총주주 동의예요. 정관 변경, 영업 양도, 자본금 감소, 해산, 합병, 이사 해임, 주식 분할이 특별결의 사항이고, 이사 선임은 보통결의예요.\n\n예시: 발행 10,000주, 출석 6,000주. 보통결의는 3,001주 이상(2,500주 요건도 충족), 특별결의는 4,000주 이상(3,334주 요건 충족).",
"cl-3-2":"1주에 1표가 원칙이에요. 대리인을 보내거나, 정관으로 정하면 서면투표, 이사회 결의로 전자투표를 할 수 있어요. 결의에 개인적 이해관계가 있는 주주는 그 안건에 표를 못 던지고, 회사끼리 서로 10% 넘게 주식을 갖고 있으면(상호주) 의결권이 없어요. 감사를 뽑을 때는 3%를 넘는 주식의 의결권이 제한돼요. 집중투표제는 정관으로 배제할 수 있어요.\n\n예시: 대주주 40%가 감사 선임 안건에서는 3%만 행사 가능. A사가 B사 15%, B사가 A사 12%를 보유하면 서로 의결권 없음.",
"cl-3-3":"주총 결의에 문제가 있을 때 다투는 세 가지 소송이에요. 소집 절차나 결의 방법이 법령·정관에 위반되거나 내용이 정관에 위반되면 취소소송(2개월 내, 주주·이사·감사만). 내용 자체가 법령에 위반되면 무효확인소송(기간 제한 없음, 누구나). 아예 총회가 없었거나 그에 준하는 중대한 하자면 부존재확인소송이에요. 판결은 모든 사람에게 효력이 있고 과거로 소급해요.\n\n예시: 통지를 1주 전에 한 하자 → 취소소송, 2개월 내. 주주평등에 반하는 배당 결의 → 무효확인소송, 언제든.",
"cl-3-4":"영업 양도, 합병, 분할합병, 주식교환처럼 회사가 근본적으로 바뀌는 특별결의에 반대하는 주주는 회사에 내 주식을 사달라고 할 수 있어요. 총회 전에 서면으로 반대 통지를 하고, 총회 후 20일 안에 청구해야 해요. 회사는 청구받은 날부터 2개월 안에 사야 하고, 가격은 협의하되 안 되면 법원이 정해요. 소규모합병에서 존속회사 주주와 간이합병에서 존속회사 주주는 청구권이 없어요.\n\n예시: 3월 25일 합병 승인 주총 → 3월 24일까지 반대 서면 통지 → 4월 14일까지 매수청구 → 회사는 6월 14일까지 매수.",
"cl-4-0":"이사는 주총 보통결의로 뽑고 3명 이상이어야 해요(자본금 10억 미만이면 1~2명 가능). 임기는 3년을 넘을 수 없어요. 해임은 특별결의로 언제든 할 수 있지만, 정당한 이유 없이 임기 중 해임하면 회사가 손해를 배상해야 해요. 이사가 잘못했는데 주총에서 해임이 부결되면 3% 주주가 1개월 안에 법원에 해임을 청구할 수 있어요. 상장회사는 사외이사가 4분의 1 이상이어야 해요.\n\n예시: 임기 3년 이사를 1년 만에 특별한 이유 없이 해임 → 해임은 유효하지만 남은 2년 보수 상당액 배상.",
"cl-4-1":"이사는 회사 일을 성실하게(선관주의), 회사 이익을 위해(충실의무) 해야 해요. 회사와 같은 업종의 사업을 하려면 이사회 승인이 필요하고, 위반하면 회사가 그 거래를 회사 것으로 가져올 수 있어요(개입권). 이사가 회사와 거래하려면 사전에 이사 3분의 2 이상 승인이 필요하고, 주요주주와 그 가족도 같은 규제를 받아요. 승인 없는 자기거래는 회사와의 관계에서 무효이고 선의의 제3자에게는 무효를 주장 못 해요. 회사 사업기회를 몰래 가로채는 것도 금지예요.\n\n예시: 이사가 자기 소유 건물을 회사에 임대 → 이사회 2/3 사전 승인 필요.",
"cl-4-2":"이사가 법령·정관 위반이나 임무 소홀로 회사에 손해를 끼치면 배상해야 하고, 총주주 동의로 면제할 수 있으며 정관으로 보수의 6배까지 감경할 수 있어요. 다만 충분한 정보로 합리적으로 판단한 경영 실패는 책임을 안 물어요(경영판단원칙). 고의나 중과실로 제3자에게 손해를 끼치면 제3자에게도 배상해요. 이사회에서 찬성한 이사는 연대책임이고, 회의록에 반대 기록이 없으면 찬성한 것으로 추정해요.\n\n예시: 충분히 검토하고 투자했는데 시장 급변으로 손실 → 경영판단원칙으로 면책. 검토 없이 지인 회사에 투자 → 배상책임.",
"cl-4-3":"회사가 이사에게 책임을 안 물을 때 주주가 회사 대신 소송하는 제도예요. 1% 이상(상장회사는 6개월 이상 0.01%) 주주가 먼저 회사에 서면으로 소송을 요구하고, 30일 안에 회사가 안 하면 직접 제소해요. 모회사 주주가 자회사 이사를 상대로 하는 다중대표소송도 인정돼요. 소송 중에 지분이 줄어도 계속할 수 있지만 0이 되면 안 돼요. 이기면 소송비용을 회사에 청구할 수 있어요.\n\n예시: 지분 2% 주주가 1월 5일 회사에 청구 → 2월 4일까지 회사가 제소 안 하면 2월 5일부터 직접 소송 가능.",
"cl-4-4":"대표이사는 회사 영업에 관한 모든 재판상·재판외 행위를 할 수 있어요. 대표이사가 아닌데 사장·부사장 같은 명칭을 회사가 허용했다면, 그 사람의 행위에 대해 회사가 선의의 제3자에게 책임져요(표현대표이사). 공동대표이사를 뒀으면 혼자 한 행위는 무효이지만 상대방 의사표시를 받는 건 각자 할 수 있어요. 대표이사가 자기 이익을 위해 대표권을 남용했을 때 상대방이 그걸 알았다면 무효예요.\n\n예시: 회사가 '부사장' 명함을 준 이사가 대표이사 없이 계약 → 상대방이 선의면 회사 책임.",
"cl-5-0":"감사는 주총 보통결의로 뽑되 대주주 견제를 위해 3%를 넘는 주식은 의결권을 못 써요. 임기는 '취임 후 3년 안에 오는 마지막 결산기의 정기주총이 끝날 때까지'라 3년보다 조금 길거나 짧을 수 있어요. 자본금 10억 미만 회사는 감사를 안 둬도 돼요. 감사는 이사나 지배인을 겸할 수 없고, 해임은 특별결의이며 해임 안건에 대해 주총에서 의견을 말할 권리가 있어요.\n\n예시: 2024년 6월 취임, 12월 결산 회사면 2027년 3월 정기주총 종결 시 임기 만료(약 2년 9개월).",
"cl-5-1":"감사는 회계뿐 아니라 업무 전반을 감사해요. 이사회에 출석해 의견을 말하고, 이사가 위법 행위를 하려 하면 중단을 청구하고, 회사가 이사를 상대로 소송할 때는 감사가 회사를 대표해요. 필요하면 자회사도 조사할 수 있어요. 이사회 소집을 청구하고 안 열어주면 직접 소집할 수 있고, 감사보고서는 정기주총 1주 전에 이사에게 내야 해요.\n\n예시: 대표이사가 회사 자금을 무단 대여하려 하면 감사가 유지청구. 회사가 그 대표이사를 상대로 손해배상 소송을 내면 감사가 소송 대표.",
"cl-5-2":"감사 대신 이사회 안에 감사위원회를 둘 수 있어요. 3명 이상 이사로 구성하고 3분의 2 이상이 사외이사여야 해요. 감사위원회를 두면 감사는 둘 수 없어요. 자산 2조 이상 상장회사는 의무예요. 대규모 상장회사는 감사위원 중 1명 이상을 다른 이사와 분리해서 처음부터 감사위원으로 뽑아야 하고(분리선출), 이때 3% 의결권 제한이 적용돼요.\n\n예시: 이사 7명 중 감사위원 3명(사외이사 2명 이상). 자산 3조 상장사는 감사위원 1명을 분리선출.",
"cl-6-0":"신주 발행은 이사회가 결정하는 게 원칙이고 정관으로 주총이 하도록 정할 수 있어요. 기존 주주가 지분 비율대로 먼저 살 권리(신주인수권)가 있어요. 제3자에게 주려면 정관에 근거가 있고 신기술 도입·재무구조 개선 같은 경영상 목적이 있어야 해요. 주주 권리를 침해한 발행은 6개월 안에 무효 소송을 낼 수 있고 판결은 소급하지 않아요. 납입기일 다음 날부터 주주가 돼요.\n\n예시: 경영권 방어만을 위한 우호세력 제3자배정 → 경영상 목적 없어 무효 사유. 신기술 보유 회사에 전략적 배정 → 유효.",
"cl-6-1":"신주 발행 과정의 책임이에요. 이사와 짜고 현저히 불공정한 가격으로 신주를 받은 사람은 공정한 가격과의 차액을 회사에 내야 하고, 이건 대표소송 대상이에요. 발행 후 인수 안 된 주식은 이사가 공동으로 인수한 것으로 봐요(인수담보책임). 위법하거나 불공정한 발행으로 손해를 볼 주주는 발행 전에 중단을 청구할 수 있어요(유지청구).\n\n예시: 시가 10,000원 주식을 이사와 통모해 3,000원에 인수 → 회사에 7,000원×주식수 지급 책임.",
"cl-6-2":"회사가 돈을 빌리는 채권이에요. 이사회가 결정하고 정관으로 대표이사에게 위임할 수도 있어요. 사채권자들의 이익을 위해 사채권자집회와 사채관리회사 제도가 있어요. 주식으로 바꿀 수 있는 전환사채(CB)와 신주를 살 권리가 붙은 신주인수권부사채(BW)는 신주 발행과 같은 효과라 주주에게 먼저 배정하고, 제3자에게 주려면 정관 근거와 경영상 목적이 필요해요. 전환 청구는 형성권이라 회사 승낙 없이 청구만으로 효력이 생겨요.\n\n예시: CB 보유자가 전환청구서를 보낸 순간 주주가 됨. 회사가 '지금은 안 된다'고 거부 못 함.",
"cl-6-3":"현금배당을 하면 그 10분의 1 이상을 이익준비금으로 쌓아야 하고 자본금의 절반이 될 때까지만이에요. 배당할 수 있는 이익은 순자산에서 자본금·준비금·미실현이익을 뺀 금액이에요. 준비금이 자본금의 1.5배를 넘으면 초과분을 줄여서 배당 재원으로 쓸 수 있어요. 중간배당은 정관에 근거가 있어야 하고 이사회 결의로 연 1회 가능해요. 주식배당은 비상장회사는 배당가능이익의 절반까지이고, 현물배당은 정관 근거가 필요해요.\n\n예시: 순자산 20억, 자본금 10억, 준비금 3억, 미실현이익 1억 → 배당가능이익 6억.",
"cl-6-4":"주주가 회사 장부를 들여다볼 권리예요. 재무제표는 회사가 비치해야 하고 주주 누구나 볼 수 있어요. 하지만 그 뒤의 회계장부와 서류를 보려면 3% 이상(상장회사는 6개월 이상 0.1%) 주주가 이유를 적은 서면으로 청구해야 하고, 회사는 그 청구가 부당하다는 걸 증명해야만 거부할 수 있어요.\n\n예시: 지분 0.5% 주주는 재무제표 열람 가능, 회계장부는 불가. 지분 5% 주주가 '특정 거래 의혹 확인'을 이유로 서면 청구하면 회사는 원칙적으로 보여줘야 함.",
"cl-7-0":"자본금을 줄이는 건 채권자에게 불리하니 특별결의와 채권자보호절차(1개월 이상 이의 제기 기간)가 필요해요. 다만 누적된 결손을 없애기 위한 감자는 회사 밖으로 돈이 안 나가니 보통결의로 되고 채권자보호절차도 필요 없어요. 방법은 액면 감소, 주식 병합, 주식 소각이에요. 감자무효 소송은 6개월 안에 내야 하고, 판결은 모든 사람에게 효력이 있고 과거로 소급해요(합병·설립무효와 달리 장래효가 아니에요).\n\n예시: 결손금 5억을 없애려 자본금 10억→5억 감자 → 보통결의, 채권자보호절차 불요. 주주에게 5억을 돌려주는 감자 → 특별결의+채권자보호절차.",
"cl-7-1":"두 회사가 하나로 합치는 거예요. 원칙은 양쪽 모두 특별결의와 채권자보호절차예요. 존속회사가 발행하는 신주가 발행주식의 10% 이하면 소규모합병이라 존속회사 주총을 생략하고, 존속회사가 소멸회사 주식 90% 이상을 갖고 있으면 간이합병이라 소멸회사 주총을 생략해요. 소규모합병에서 존속회사 주주는 매수청구권이 없지만, 간이합병에서 소멸회사 주주는 있어요. 합병무효 소송은 6개월 이내예요.\n\n예시: 대기업이 작은 회사를 흡수하며 신주 3%만 발행 → 소규모합병, 대기업 주총 생략, 대기업 주주 매수청구 불가.",
"cl-7-2":"한 회사를 둘 이상으로 나누는 거예요. 새 회사만 만들면 단순분할, 기존 다른 회사와 합치면 분할합병이고, 원래 회사가 남으면 존속분할, 없어지면 소멸분할이에요. 특별결의가 필요해요. 분할 후 회사들은 분할 전 빚에 연대책임을 지는 게 원칙이라 단순분할은 채권자보호절차가 필요 없어요. 정관으로 연대책임을 배제하고 각자 자기 몫만 지게 하려면 그때는 채권자보호절차가 필요해요.\n\n예시: A사가 사업부를 떼어 B사 신설. B사도 A사의 기존 빚에 연대책임 → 채권자 보호 불요. 'B사는 이전받은 빚만 진다'로 정하면 채권자보호절차 필요.",
"cl-7-3":"한 회사를 다른 회사의 100% 자회사로 만드는 방법이에요. 주식교환은 기존 회사가 자회사 주주의 주식을 전부 받고 자기 신주를 주는 것이고, 주식이전은 새 회사를 만들어 그 회사가 완전모회사가 되는 거예요. 특별결의가 필요하고 반대주주는 매수청구권이 있어요. 회사 재산이 나가는 게 아니라 주주가 바뀌는 거라 채권자보호절차는 필요 없어요. 소규모·간이 주식교환도 인정돼요.\n\n예시: 지주회사 설립을 위해 A사 주주들이 주식을 새 지주회사에 넘기고 지주회사 주식을 받음 → 주식이전.",
