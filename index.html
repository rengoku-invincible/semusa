  {t:"근본적 질적특성",s:"목적적합성(예측가치·확인가치·중요성)과 표현충실성(완전성·중립성·오류없음). 둘 다 갖춰야 유용한 정보.",p:"보강적 특성(비교가능성·검증가능성·적시성·이해가능성)은 ==근본적 특성을 대체할 수 없다==. 중요성은 기업 특유의 목적적합성."},
  {t:"재무제표 요소의 정의",s:"자산은 과거사건의 결과로 기업이 통제하는 현재의 경제적자원. 부채는 과거사건의 결과로 경제적자원을 이전해야 하는 현재의무.",p:"개정 개념체계는 ==유입 가능성 높음 요건을 정의에서 삭제==. 인식 여부는 목적적합성·표현충실성으로 판단."},
  {t:"측정기준",s:"역사적원가와 현행가치(공정가치·사용가치·이행가치·현행원가)로 구분.",p:"==사용가치는 기업 특유 가정==, 공정가치는 시장참여자 관점. 둘의 차이를 묻는 문제 반복 출제."},
  {t:"자본유지개념",s:"재무자본유지(명목·불변구매력)와 실물자본유지. 이익 측정의 출발점.",p:"실물자본유지 하에서는 ==자산 가격변동을 자본유지조정(자본)==으로 처리, 이익 아님."}
 ]},
 {name:"재고자산",cards:[
  {t:"취득원가의 범위",s:"매입가격+수입관세+운반비 등 취득 직접원가. 매입할인·리베이트는 차감.",p:"==보관원가·판매원가·비정상 낭비분은 원가 제외==하고 당기비용. 후속 생산단계 필요한 보관은 포함."},
  {t:"원가흐름 가정",s:"개별법·선입선출법·가중평균법 허용. 후입선출법(LIFO)은 IFRS에서 불허.",p:"물가 상승 시 ==FIFO가 기말재고 최대·매출원가 최소·이익 최대==. 계속기록 vs 실지재고 차이는 평균법에서만 발생."},
  {t:"저가법 평가",s:"기말재고는 취득원가와 순실현가능가치(NRV) 중 낮은 금액. 평가손실은 매출원가에 가산.",p:"==원재료는 완성품이 원가 이상 판매 가능하면 감액하지 않음==. 평가손실 환입은 당초 손실 범위 내로 한정."},
  {t:"감모손실과 평가손실 순서",s:"수량 차이는 감모손실, 단가 차이는 평가손실. 감모 먼저 계산 후 실제수량에 저가법 적용.",p:"정상감모는 매출원가, ==비정상감모는 영업외비용==. 계산문제는 항상 순서가 함정."},
  {t:"재고추정법",s:"매출총이익률법(재해 등 특수상황)과 소매재고법(전통·저가기준·FIFO)으로 기말재고 추정.",p:"==저가기준 소매재고법은 순인하액을 원가율 분모에서 제외==해 원가율을 낮게 계산."}
 ]},
 {name:"유형자산",cards:[
  {t:"취득원가 구성",s:"구입가격+관세+직접관련원가(설치·시운전·전문가수수료)+복구원가 추정치.",p:"==교육훈련비·광고비·관리비·시운전 산출물 판매수익은 원가에서 제외==. 복구충당부채는 현재가치로 가산."},
  {t:"교환거래",s:"상업적 실질이 있으면 제공한 자산의 공정가치로 측정(더 명확하면 취득자산 공정가치), 처분손익 인식.",p:"==상업적 실질이 없으면 제공자산 장부금액==으로 측정하고 손익 없음. 현금수수액은 가감."},
  {t:"차입원가 자본화",s:"적격자산 취득에 직접 관련된 차입원가는 자본화. 특정차입금 이자에서 일시투자수익 차감, 일반차입금은 자본화이자율 적용.",p:"==일반차입금 자본화액은 실제 발생 이자 한도==. 일반차입금의 일시투자수익은 차감하지 않음."},
  {t:"정부보조금",s:"자산관련 보조금은 자산차감법 또는 이연수익법. 수익관련 보조금은 당기손익.",p:"두 방법 모두 ==당기순이익 효과는 동일==, 자산 장부금액과 감가상각비 표시만 다름."},
  {t:"재평가모형",s:"재평가증가액은 기타포괄손익(재평가잉여금), 감소액은 당기손실. 이전에 반대 처리분이 있으면 먼저 상계.",p:"==재평가잉여금은 처분 시 이익잉여금으로 직접 대체==, 당기손익 재분류 아님. 사용 중 대체(이전초과상각액)도 선택 가능."},
  {t:"손상과 환입",s:"회수가능액=max(순공정가치, 사용가치). 장부금액 초과분 손상차손. 환입은 손상 없었을 경우 장부금액 한도.",p:"==영업권 손상은 환입 불가==. 재평가자산의 손상은 재평가잉여금 범위 내 OCI에서 먼저 차감."}
 ]},
 {name:"무형자산·투자부동산",cards:[
  {t:"연구단계 vs 개발단계",s:"연구단계 지출은 전액 비용. 개발단계는 기술적 실현가능성 등 6가지 요건 충족 시부터 자산화.",p:"==구분 불가능하면 전부 연구단계==로 본다. 요건 충족 이전 비용화한 지출은 소급 자산화 불가."},
  {t:"내부창출 무형자산",s:"내부창출 영업권, 브랜드, 고객목록, 출판표제 등은 자산 인식 불가.",p:"==사업결합으로 취득한 브랜드·고객관계는 인식 가능==. 내부창출과 외부취득 구분이 핵심."},
  {t:"무형자산 상각",s:"내용연수 유한: 상각(잔존가치 원칙 0). 비한정: 상각하지 않고 매년 손상검사.",p:"==영업권은 상각하지 않고 매년 손상검사==. 비한정 내용연수 판단은 매기 재검토."},
  {t:"투자부동산",s:"임대·시세차익 목적 부동산. 원가모형 또는 공정가치모형 선택, 전체 투자부동산에 일관 적용.",p:"==공정가치모형은 감가상각 없이 평가손익을 당기손익==. 자가사용→투자부동산(공정가치) 대체 시 차이는 재평가 회계처리 준용."}
 ]},
 {name:"금융자산",cards:[
  {t:"분류 기준",s:"사업모형(현금흐름 수취/수취·매도/기타)과 현금흐름 특성(SPPI)으로 AC·FVOCI·FVPL 분류.",p:"==지분상품은 SPPI 미충족이므로 원칙 FVPL==, 단기매매 아니면 FVOCI 선택 가능(취소 불가)."},
  {t:"지분상품 FVOCI 선택",s:"평가손익은 OCI. 처분 시 누적 OCI는 당기손익으로 재분류하지 않고 이익잉여금 대체 가능.",p:"==배당수익은 당기손익==으로 인식. 채무상품 FVOCI는 처분 시 재분류조정 O — 지분상품과 대비."},
  {t:"채무상품 AC·FVOCI",s:"유효이자율법으로 이자수익 인식. FVOCI 채무상품은 AC와 동일한 이자수익·손상 인식 후 공정가치 차이만 OCI.",p:"==FVOCI 채무상품의 당기순이익은 AC와 동일==. 처분손익도 결과적으로 동일해진다."},
  {t:"기대신용손실",s:"신용위험 유의적 증가 없으면 12개월 기대손실, 있으면 전체기간 기대손실. 매출채권은 간편법(전체기간) 적용 가능.",p:"==손상 발생 채무상품은 상각후원가에 유효이자율 적용== (총장부금액 아님)."},
  {t:"금융자산 제거",s:"현금흐름 권리 소멸 또는 위험·보상 대부분 이전 시 제거. 위험·보상 보유 시 계속 인식(차입 처리).",p:"==상환청구권 있는 매출채권 양도는 위험 보유==로 보아 담보차입 회계처리 — 매각 여부 판단 문제 빈출."}
 ]},
 {name:"금융부채(사채)",cards:[
  {t:"유효이자율법",s:"이자비용=기초장부금액×유효이자율. 할인발행이면 이자비용이 액면이자보다 크고 매년 증가.",p:"==할인발행 시 장부금액·이자비용 매년 증가==, 할증발행은 매년 감소. 총이자비용=액면이자 합계+할인액."},
  {t:"사채발행비",s:"발행금액에서 차감하여 유효이자율을 재계산. 비용처리 아님.",p:"==사채발행비가 있으면 유효이자율은 시장이자율보다 높다==. 발행 시점 장부금액 계산 함정."},
  {t:"조기상환",s:"상환금액과 상환일 장부금액(경과이자 반영)의 차이가 사채상환손익.",p:"이자지급일 사이 상환 시 ==미지급이자를 분리==하고 원금부분만 비교. 시장이자율 상승 시 상환이익 발생."},
  {t:"전환사채",s:"부채요소(일반사채 현재가치)와 자본요소(전환권대가) 분리. 상환할증금은 부채에 포함.",p:"==전환 시 손익 인식 없이== 부채 장부금액을 자본으로 대체. 신주인수권부사채는 행사 후 사채가 남는다."}
 ]},
 {name:"충당부채·자본",cards:[
  {t:"충당부채 인식요건",s:"현재의무(법적·의제) 존재, 자원유출 가능성 높음, 금액 신뢰성 있는 추정. 셋 다 필요.",p:"==미래 영업손실은 충당부채 아님==. 손실부담계약은 회피불가원가와 기대효익 중 작은 금액으로 인식."},
  {t:"우발부채·우발자산",s:"우발부채는 인식하지 않고 주석 공시(가능성 희박하면 공시도 생략). 우발자산은 인식 불가, 유입 가능성 높으면 주석.",p:"==우발자산은 실현이 거의 확실해야 자산 인식==. 제3자 변제는 거의 확실할 때만 별도 자산."},
  {t:"자기주식",s:"취득 시 자본에서 차감(원가법). 처분손익은 자본거래이므로 당기손익 아님 — 자기주식처분이익/손실.",p:"==자기주식 처분손실은 처분이익과 먼저 상계== 후 잔액을 이익잉여금에서 차감. 소각은 자본금 감소."},
  {t:"무상증자·주식배당·주식분할",s:"세 경우 모두 자본 총액 불변. 무상증자·주식배당은 자본금 증가, 주식분할은 자본금 불변.",p:"==주식분할은 액면가 감소·주식수 증가, 자본금 동일==. 주식배당은 이익잉여금→자본금."},
  {t:"이익잉여금 처분",s:"이익준비금은 금전배당액의 1/10 이상을 자본금 1/2에 달할 때까지 적립.",p:"==주식배당은 이익준비금 적립 대상 아님==(금전배당만). 처분 확정은 주총 결의일 회계연도."}
 ]},
 {name:"수익인식",cards:[
  {t:"수익인식 5단계",s:"계약 식별→수행의무 식별→거래가격 산정→수행의무에 배분→수행의무 이행 시 수익 인식.",p:"==거래가격 배분은 개별판매가격 비율==. 할인액은 관측 증거 없으면 모든 수행의무에 비례 배분."},
  {t:"변동대가",s:"기댓값 또는 가능성 높은 금액으로 추정하되, 유의적 환원 가능성이 매우 낮은 범위까지만 포함(제약).",p:"==반품권 있는 판매==: 예상 반품분은 수익 제외하고 환불부채·반환재고자산 인식."},
  {t:"본인 vs 대리인",s:"고객에게 이전 전 재화·용역을 통제하면 본인(총액 수익), 아니면 대리인(수수료 순액).",p:"==재고위험·가격결정권·주된 책임==이 판단 지표. 위탁판매 수탁자는 대리인."},
  {t:"보증의 구분",s:"확신유형 보증은 충당부채, 용역유형 보증(별도 구매 가능·추가 서비스)은 별도 수행의무.",p:"==고객이 보증을 별도 구매할 수 있으면 용역유형==으로 거래가격 배분해 이연."},
  {t:"기간에 걸친 이행",s:"고객이 동시에 효익 소비, 자산 통제, 대체용도 없고 지급청구권 있으면 진행률로 수익 인식.",p:"==진행률 측정 불가 시 발생원가 범위 내 수익== 인식(회수 가능 조건). 라이선스는 접근권(기간) vs 사용권(시점)."}
 ]},
 {name:"리스",cards:[
  {t:"리스이용자 단일모형",s:"모든 리스에 사용권자산과 리스부채 인식(단기·소액자산 예외). 리스부채=리스료 현재가치.",p:"==리스료에는 고정리스료·지수연동 변동리스료·잔존가치보증 예상지급액·행사확실한 매수선택권== 포함. 사용량 변동리스료는 제외."},
  {t:"사용권자산 측정",s:"리스부채+리스개시일 전 지급 리스료+리스개설직접원가+복구원가.",p:"==리스개설직접원가는 사용권자산에 가산==. 감가상각은 리스기간과 내용연수 중 짧은 기간(소유권 이전 시 내용연수)."},
  {t:"리스제공자 분류",s:"위험·보상 대부분 이전 시 금융리스, 아니면 운용리스. 소유권 이전·염가매수선택권·리스기간 대부분·현재가치 대부분 등이 지표.",p:"==판매형리스는 매출·매출원가 인식==. 리스개설직접원가는 판매형리스에서 비용처리(제조자·판매자)."},
  {t:"판매후리스",s:"이전이 판매(기준서 1115호)에 해당하면 보유 권리 부분만큼 차익 인식 제한. 판매 아니면 금융약정.",p:"==판매후리스 차익은 이전된 권리 부분만 인식==. 공정가치 초과 대가는 추가금융."}
 ]},
 {name:"법인세회계·주당이익",cards:[
  {t:"일시적차이",s:"자산·부채 장부금액과 세무기준액의 차이. 가산할 일시적차이→이연법인세부채, 차감할→이연법인세자산.",p:"==이연법인세자산은 미래 과세소득 실현가능성 높을 때만== 인식. 영구적차이는 이연법인세 없음."},
  {t:"적용세율과 표시",s:"차이 소멸 시점의 예상 세율(제정·실질적 제정) 적용. 이연법인세는 항상 비유동, 할인하지 않음.",p:"==자본에 직접 인식된 항목의 법인세는 자본에==, OCI 항목은 OCI에서 차감. 법인세비용=당기법인세±이연법인세 변동."},
  {t:"기본주당이익",s:"(당기순이익−우선주배당)/가중평균유통보통주식수. 누적적 우선주는 배당결의와 무관하게 차감.",p:"==무상증자·주식배당·주식분할은 기초 발행으로 소급== 조정. 자기주식은 취득일부터 차감."},
  {t:"희석주당이익",s:"잠재적보통주 전환 가정. 전환사채는 세후이자 가산·주식수 가산, 옵션은 자기주식법.",p:"==희석효과가 없는(반희석) 잠재적보통주는 제외==. 여러 개일 때 희석효과 큰 순서로 단계별 판단."}
 ]},
 {name:"현금흐름표·회계변경",cards:[
  {t:"활동 구분",s:"영업·투자·재무. 이자수입·배당수입·이자지급은 영업 또는 투자/재무 선택, 배당지급은 영업 또는 재무.",p:"==법인세 납부는 원칙 영업활동==. 현물출자·전환 등 비현금거래는 주석 공시, 표에서 제외."},
  {t:"간접법 조정",s:"당기순이익에서 비현금손익(감가상각·손상·처분손익) 가감, 영업 관련 자산·부채 증감 가감.",p:"==유형자산처분이익은 차감==(투자활동으로 이동), 매출채권 증가는 차감, 매입채무 증가는 가산."},
  {t:"회계정책 변경",s:"소급적용: 비교재무제표 재작성, 기초 이익잉여금 수정. 새 기준서 도입이나 더 신뢰성 있는 정보 제공 시만 허용.",p:"==정책변경과 추정변경 구분 불가 시 추정변경==(전진법). 감가상각방법·내용연수·잔존가치 변경은 추정변경."},
  {t:"오류수정",s:"중요한 전기오류는 소급재작성. 실무적으로 불가능하면 가능한 가장 이른 기간부터.",p:"==재고 기말오류는 자동조정오류==(2기 후 상쇄). 감가상각 누락은 비자동조정 — 기초 이익잉여금 수정."}
 ]},
 {name:"연결·지분법·기타",cards:[
  {t:"사업결합과 영업권",s:"영업권=이전대가−취득 순자산 공정가치(비지배지분 포함 시 조정). 음수이면 염가매수차익(당기이익).",p:"==취득관련원가는 비용==, 지분발행원가는 자본 차감. 비지배지분은 공정가치 또는 순자산 비례 지분 선택."},
  {t:"지분법",s:"유의적 영향력(20% 이상 추정) 시 적용. 취득 후 피투자자 순이익×지분율을 지분법이익, 배당은 투자주식 차감.",p:"==내부거래 미실현이익은 지분율만큼 제거==(상향·하향 모두). 순자산 공정가치 차이는 감가상각 조정."},
  {t:"확정급여제도",s:"확정급여채무 현재가치−사외적립자산 공정가치=순확정급여부채. 재측정요소는 OCI, 재분류 없음.",p:"==근무원가·순이자는 당기손익, 재측정요소(보험수리적손익·자산수익 차이)는 OCI==."},
  {t:"주식기준보상",s:"주식결제형은 부여일 공정가치로 측정해 가득기간에 배분, 후속 재측정 없음. 현금결제형은 매기 재측정.",p:"==비시장조건 미달 시 누적비용 조정==, 시장조건(주가)은 미달해도 비용 인식 유지."}
 ]}
]},
{id:"ca",name:"원가회계",chapters:[
 {name:"원가의 개념과 흐름",cards:[
  {t:"원가의 분류",s:"제조/비제조, 직접/간접, 변동/고정, 통제가능/불능. 매몰원가는 의사결정 무관, 기회원가는 포기한 대안의 최대효익.",p:"==기본원가=DM+DL, 가공원가=DL+OH==. 직접노무비는 두 분류에 모두 포함."},
  {t:"원가흐름 등식",s:"기초+당기투입=기말+대체. 원재료→재공품→제품→매출원가 각 단계에 동일 적용.",p:"==당기제품제조원가=기초재공품+당기총제조원가−기말재공품==. 역산 문제는 T계정을 그려라."},
  {t:"준변동·준고정원가",s:"준변동원가는 고정+변동(전기요금), 준고정(계단)원가는 일정 조업도 구간마다 증가.",p:"고저점법은 ==최고·최저 조업도(원가 아님)==로 변동비율 추정. 계산 함정."}
 ]},
 {name:"개별원가·부문별원가",cards:[
  {t:"제조간접비 예정배부",s:"예정배부율=예산OH/예정조업도. 배부차이=실제OH−예정배부액(과소배부 시 실제가 더 큼).",p:"==과소배부액 조정 시 매출원가 증가==. 비례배분법은 재공품·제품·매출원가 기말잔액(또는 배부액) 비율."},
  {t:"보조부문 원가배분",s:"직접배분법(보조부문 간 무시), 단계배분법(순서 중요), 상호배분법(연립방정식).",p:"==단계배분법은 배분 순서에 따라 결과 달라짐==. 상호배분법이 가장 정확. 이중배분율법은 변동·고정 분리."},
  {t:"정상원가계산",s:"DM·DL 실제, OH는 예정배부. 배부차이는 기말에 조정.",p:"==실제원가계산과의 차이는 OH 배부시점==. 표준원가는 세 요소 모두 표준."}
 ]},
 {name:"종합원가계산",cards:[
  {t:"완성품환산량",s:"물량×완성도. 재료비(투입시점)와 가공비(진행도)의 완성도가 다르므로 별도 계산.",p:"==FIFO는 기초재공품의 당기 완성분만 당기 환산량==에 포함, 평균법은 기초재공품 전부 포함."},
  {t:"평균법 vs 선입선출법",s:"평균법은 기초재공품원가+당기원가를 합쳐 단위원가 계산. FIFO는 당기원가만으로 당기 단위원가.",p:"==FIFO 환산량 = 평균법 환산량 − 기초재공품 환산량==. 기초재공품 없으면 두 방법 동일."},
  {t:"공손",s:"정상공손은 합격품(검사시점 통과 물량)에 배분, 비정상공손은 당기손실.",p:"==정상공손 허용량은 검사시점을 통과한 합격품 기준==. 기말재공품이 검사시점 미통과면 배분 제외."},
  {t:"결합원가 배분",s:"물량기준·분리점 판매가치·순실현가치(NRV)·균등이익률법. 부산물은 원칙 NRV로 결합원가 차감.",p:"==추가가공 의사결정은 결합원가 무관==(매몰원가). 증분수익 vs 추가가공원가만 비교."}
 ]},
 {name:"활동기준원가계산",cards:[
  {t:"ABC의 원가동인",s:"활동별로 원가집합 후 원가동인으로 제품에 배부. 단위·배치·제품·설비수준 활동으로 계층화.",p:"==전통적 배부는 소량·복잡 제품 원가를 과소, 대량 제품을 과대== 계산 — ABC 도입 시 반전."},
  {t:"활동 계층",s:"단위수준(기계시간), 배치수준(작업준비), 제품수준(설계), 설비수준(공장 관리).",p:"==설비수준 원가는 원가동인이 없어 임의배부==. 배치수준은 생산량이 아닌 배치 수에 비례."}
 ]},
 {name:"변동원가계산과 CVP",cards:[
  {t:"전부 vs 변동원가계산",s:"고정제조간접비를 전부원가는 제품원가(재고화), 변동원가는 기간비용 처리.",p:"==이익차이=고정OH배부율×(기말재고−기초재고)==. 생산>판매면 전부원가 이익이 크다."},
  {t:"초변동원가계산",s:"직접재료비만 제품원가, 나머지는 모두 기간비용. 재고 축적 유인 최소화.",p:"==재고 증가 시 이익: 전부 > 변동 > 초변동== 순서."},
  {t:"손익분기점",s:"BEP 수량=고정원가/단위당 공헌이익, BEP 매출액=고정원가/공헌이익률. 목표이익은 분자에 가산.",p:"==세후 목표이익은 세전으로 환산==(÷(1−t)) 후 계산. 법인세는 BEP 자체에는 영향 없음."},
  {t:"안전한계와 영업레버리지",s:"안전한계율=(매출−BEP매출)/매출. 영업레버리지도=공헌이익/영업이익=1/안전한계율.",p:"==고정원가 비중 클수록 DOL 크고 이익변동성 큼==. 매출 x% 증가 시 이익은 DOL×x% 증가."},
  {t:"복수제품 CVP",s:"매출배합이 일정하다고 가정. 가중평균 공헌이익(률)로 BEP 계산 후 배합비율로 배분.",p:"==배합 변동 시 BEP 변함==. 공헌이익률 높은 제품 비중 증가 시 BEP 하락."}
 ]},
 {name:"표준원가계산",cards:[
  {t:"직접재료비 차이",s:"가격차이=(AP−SP)×AQ, 능률(수량)차이=(AQ−SQ)×SP. 가격차이는 구입시점 또는 사용시점 분리 가능.",p:"==구입시점 가격차이 분리 시 AQ는 구입량==, 능률차이는 사용량 기준. 두 AQ가 다른 문제 주의."},
  {t:"변동제조간접비 차이",s:"소비차이=실제OH−AQ×SP, 능률차이=(AQ−SQ)×SP. 노무비 차이와 구조 동일.",p:"==변동OH 능률차이는 배부기준(노동시간)의 능률==에서 발생. 직접노무비 능률차이와 방향 일치."},
  {t:"고정제조간접비 차이",s:"예산차이=실제−예산(고정), 조업도차이=예산−배부액(SQ×SP). 능률차이는 존재하지 않음.",p:"==조업도차이는 기준조업도와 표준허용조업도 차이==. 실제조업도 기준 아님 — 3분법·4분법 구분 문제."},
  {t:"원가차이 조정",s:"매출원가조정법 또는 비례배분법. 비정상 차이가 크면 비례배분.",p:"==재료비 가격차이(구입시점)는 원재료 재고에도 배분==. 다른 차이는 재공품·제품·매출원가."}
 ]},
 {name:"관련원가와 의사결정",cards:[
  {t:"특별주문 수락",s:"유휴생산능력 있으면 증분수익>증분원가 시 수락. 없으면 기존판매 포기분 공헌이익(기회원가) 가산.",p:"==고정원가는 변동 없으면 무관==. 정규시장 가격 영향, 추가 고정비, 기회원가 유무를 확인."},
  {t:"자가제조 vs 외부구입",s:"자가제조 회피가능원가(변동비+회피가능고정비)+유휴설비 기회원가와 구입원가 비교.",p:"==회피불능 고정원가는 무관원가==. 유휴설비 임대수익은 외부구입 측 효익."},
  {t:"제품라인 폐지",s:"폐지 시 사라지는 공헌이익 vs 회피가능고정원가 비교. 공통고정비 배부액은 무관.",p:"==공헌이익>회피가능고정비면 유지==. 부문 영업손실만 보고 폐지하면 오답."},
  {t:"제약자원 배분",s:"제약자원 단위당 공헌이익이 큰 제품부터 우선 생산.",p:"==단위당 공헌이익 아닌 제약자원 단위당 공헌이익==으로 순위. 복수 제약이면 선형계획법."},
  {t:"대체가격",s:"최소대체가격(공급부문)=단위당 변동원가+기회원가. 최대대체가격(수요부문)=외부구입가격.",p:"==유휴설비 있으면 기회원가 0==이므로 최소대체가격=변동원가. 협상범위 안에 있어야 대체 성립."}
 ]},
 {name:"예산·성과평가",cards:[
  {t:"종합예산 순서",s:"판매예산→생산예산→재료구입예산→노무비·OH예산→매출원가·현금예산→예산재무제표.",p:"==생산량=판매량+기말제품−기초제품==, 재료구입량=사용량+기말재료−기초재료. 두 단계 연쇄 계산."},
  {t:"변동예산",s:"실제 조업도 기준으로 조정한 예산. 고정예산차이=변동예산차이+매출조업도차이.",p:"==매출조업도차이는 (실제수량−예산수량)×예산 단위당 공헌이익==. 고정원가는 조업도차이 없음."},
  {t:"투자중심점 성과평가",s:"ROI=영업이익/투자액, 잔여이익=영업이익−투자액×최저요구수익률, EVA=세후영업이익−투하자본×WACC.",p:"==ROI는 투자 회피 유인(준최적화) 문제==, 잔여이익이 목표일치성 우수. 규모 다른 부문 비교는 ROI."},
  {t:"균형성과표",s:"재무·고객·내부프로세스·학습성장 4관점. 비재무지표를 선행지표로 활용.",p:"==학습과 성장→내부프로세스→고객→재무==의 인과관계 순서."}
 ]},
 {name:"기타 관리회계",cards:[
  {t:"품질원가",s:"예방·평가(통제원가)와 내부실패·외부실패(실패원가). 통제원가 증가 시 실패원가 감소.",p:"==외부실패원가(보증·반품·이미지손실)가 가장 큼==. 재작업은 내부실패, 검사는 평가원가."},
  {t:"학습곡선",s:"누적생산량 2배 시 단위당 평균시간이 일정률로 감소. 누적평균시간모형과 증분단위시간모형.",p:"==80% 학습곡선: 누적량 2배마다 누적평균시간 80%==. 4배면 64%."},
  {t:"목표원가·카이젠",s:"목표원가=목표판매가−목표이익, 설계단계에서 원가절감. 카이젠은 제조단계 지속적 개선.",p:"==원가의 대부분은 설계단계에서 확정==(고착)되므로 목표원가계산이 효과적."}
 ]}
]},
{id:"tx",name:"세법",chapters:[
 {name:"국세기본법 총칙·납세의무",cards:[
  {t:"기간과 기한",s:"기간 계산은 민법 준용. 기한이 공휴일·토요일·근로자의날이면 다음날. 우편신고는 통신일부인 기준.",p:"==전자신고는 국세정보통신망에 입력된 때== 신고된 것. 우편은 발송주의, 전자는 도달 시점."},
  {t:"납세의무 성립시기",s:"소득세·법인세·부가세는 과세기간 끝나는 때. 상속세는 상속개시, 증여세는 재산취득, 원천징수는 지급하는 때.",p:"==부가세 예정신고분은 예정신고기간 끝나는 때==, 인지세는 문서 작성 시, 종부세는 과세기준일(6.1)."},
  {t:"납세의무 확정",s:"신고납세(소득·법인·부가·개별소비 등)는 신고 시 확정. 정부부과(상속·증여·종부세 원칙)는 결정 시 확정.",p:"==원천징수 소득세·인지세는 성립과 동시에 자동확정==. 종부세는 납세자가 신고 선택 가능."},
  {t:"제2차 납세의무",s:"청산인(분배재산 한도), 출자자(무한책임사원·과점주주 50% 초과), 법인(주주 체납, 무한책임사원·과점주주), 사업양수인(양수재산 한도).",p:"==사업양수인 2차 납세의무는 양도일 이전 확정된 국세== + 양수한 재산가액 한도. 과점주주는 지분비율만큼."},
  {t:"국세우선권",s:"국세는 원칙적으로 다른 채권에 우선. 예외: 법정기일 전 설정된 저당권 등, 소액임차보증금, 최종 3월 임금·재해보상금.",p:"==법정기일: 신고분은 신고일, 고지분은 고지서 발송일==. 당해세(상속·증여·종부세)는 설정일 관계없이 우선(2023년부터 임차보증금 예외)."}
 ]},
 {name:"국세기본법 부과·징수·불복",cards:[
  {t:"부과제척기간",s:"일반 5년, 무신고 7년, 사기 등 부정행위 10년(역외거래 15년). 상속·증여세는 10년/15년.",p:"==제척기간 만료 후 부과 불가==, 중단·정지 없음. 소멸시효(징수권, 5년·5억 이상 10년)는 중단·정지 있음."},
  {t:"수정신고·기한후신고·경정청구",s:"수정신고는 과소신고 시 제척기간 내. 기한후신고는 무신고자. 경정청구는 법정신고기한 후 5년 이내(후발적 사유 3개월).",p:"==경정청구는 확정력 없음==(세무서장이 2개월 내 결정). 기한후신고는 세무서장 결정으로 확정."},
  {t:"가산세 감면",s:"수정신고: 1개월 내 90%, 3개월 75%, 6개월 50%, 1년 30%, 1년6개월 20%, 2년 10%. 기한후신고: 1개월 50%, 3개월 30%, 6개월 20%.",p:"==과소·무신고 가산세만 감면==, 납부지연가산세는 감면 대상 아님. 세무조사 통지 후 신고는 감면 배제."},
  {t:"조세불복 절차",s:"이의신청(선택)→심사청구(국세청) 또는 심판청구(조세심판원) 또는 감사원 심사청구→행정소송. 각 90일 이내.",p:"==행정소송은 심사·심판 전치 필수==. 심판청구는 불이익변경금지 적용, 결정은 90일 이내."},
  {t:"세무조사 원칙",s:"재조사 금지(예외: 조세탈루 명백한 자료, 거래상대방 조사 필요 등). 사전통지 15일 전. 조사기간 20일 원칙(중소규모).",p:"==납세자권리헌장 교부==, 세무대리인 조력권, 조사결과 통지 후 과세전적부심사 30일."}
 ]},
 {name:"국세징수법·조세범처벌법",cards:[
  {t:"납부고지와 독촉",s:"납부고지서는 납부기한 30일 전(예외 있음). 체납 시 10일 이내 독촉장 발급, 독촉기한 20일.",p:"==독촉은 소멸시효 중단사유==. 납부기한 전 징수(납기전징수) 사유: 강제집행·파산·경매 등."},
  {t:"압류와 매각",s:"독촉기한 경과 시 압류. 압류금지재산(생계 필수품, 급여 일부 등). 매각은 공매 원칙, 낙찰자 매각결정 후 잔대금.",p:"==교부청구·참가압류==: 이미 강제징수 진행 중인 재산에 대해 배분 요구. 급여는 월 250만원 등 압류 제한."},
  {t:"조세범처벌법 조세포탈",s:"사기 기타 부정한 행위로 포탈 시 2년 이하 징역 또는 포탈세액 2배 이하 벌금(포탈액 큰 경우 가중).",p:"==단순 무신고·과소신고는 부정행위 아님==. 이중장부, 거짓증빙, 장부 파기 등이 부정행위."}
 ]},
 {name:"법인세법 총칙·익금",cards:[
  {t:"납세의무자와 사업연도",s:"내국법인은 국내외 모든 소득, 외국법인은 국내원천소득. 사업연도는 정관 등에 따르되 1년 초과 불가.",p:"==비영리법인은 수익사업소득만 과세==. 사업연도 변경은 종료일부터 3개월 내 신고, 미신고 시 변경 전 유지."},
  {t:"익금 항목",s:"자산 양도금액, 자산수증이익, 채무면제이익, 손금산입된 금액의 환입, 자산 임대료, 특수관계인 거래 시가차익 등.",p:"==이월결손금 보전에 충당한 자산수증이익·채무면제이익은 익금불산입==. 결손금 순서 무관하게 충당 가능."},
  {t:"익금불산입 항목",s:"주식발행액면초과액, 감자차익, 합병·분할차익, 이월익금, 자산평가차익(원칙), 부가세 매출세액, 국세환급가산금.",p:"==자기주식처분이익은 익금(회계와 차이)==. 감자차익은 익금불산입 — 자본거래 판단 문제 빈출."},
  {t:"수입배당금 익금불산입",s:"내국법인이 받은 배당은 지분율에 따라 일정률 익금불산입(지분 50% 이상 100%, 20% 이상 80%, 20% 미만 30%).",p:"==배당기준일 전 3개월 이내 취득 주식은 제외==. 차입금 이자 중 해당분 차감."},
  {t:"소득처분",s:"사외유출: 귀속에 따라 배당(주주)·상여(임직원)·기타소득(그 외)·기타사외유출. 사내유보: 유보/△유보. 기타.",p:"==귀속 불분명 시 대표자 상여==. 기업업무추진비 한도초과·기부금 한도초과·벌금은 기타사외유출."}
 ]},
 {name:"법인세법 손금",cards:[
  {t:"인건비",s:"임원 상여는 급여지급기준(정관·주총·이사회) 내만 손금. 임원 퇴직금은 정관 규정액 또는 총급여 10%×근속연수.",p:"==이익처분에 의한 상여는 손금불산입==. 임원 퇴직금 한도 초과액은 상여 처분."},
  {t:"감가상각",s:"결산조정 원칙(임의상각). 건축물은 정액법, 기타 유형자산은 정률·정액 선택(무신고 시 정률). 상각범위액 초과분 손금불산입.",p:"==시부인 계산: 회사계상액 vs 상각범위액==, 초과분 유보, 부족분은 전기 초과액 범위 내 추인. 즉시상각의제 주의."},
  {t:"기업업무추진비(접대비)",s:"한도=기본금액(1,200만원, 중소기업 3,600만원)+수입금액×적용률(100억 이하 0.3%, 500억 이하 0.2%, 초과 0.03%).",p:"==건당 3만원 초과 시 적격증빙 없으면 전액 손금불산입==(경조사비 20만원). 한도초과액은 기타사외유출."},
  {t:"기부금",s:"특례기부금 한도 50%, 일반기부금 10%(사회적기업 20%). 한도초과액 10년 이월. 비지정기부금은 전액 손금불산입.",p:"==현물기부: 특례·일반(특수관계 없음)은 장부가액, 그 외는 시가==. 기부금은 지출 시점 손금(어음은 결제일)."},
  {t:"대손금과 대손충당금",s:"충당금 한도=채권잔액×max(1%, 대손실적률). 대손 사유(신고조정: 소멸시효 완성 등, 결산조정: 회수불능 등).",p:"==특수관계인 업무무관 가지급금은 대손 불가·충당금 설정 대상 제외==. 소멸시효 완성 채권은 신고조정 대손."},
  {t:"지급이자 손금불산입 순서",s:"채권자불분명 사채이자→비실명 채권·증권이자→건설자금이자→업무무관자산 등 관련 지급이자.",p:"==채권자불분명·비실명 이자는 대표자 상여==(원천징수분은 기타사외유출). 업무무관자산 이자는 기타사외유출."}
 ]},
 {name:"법인세법 세액계산·기타",cards:[
  {t:"자산·부채 평가",s:"재고자산은 신고한 방법(무신고 시 선입선출, 매매목적 부동산 개별법). 유가증권은 원가법(총평균·이동평균).",p:"==평가방법 임의변경 시 FIFO와 당초 방법 중 큰 금액==. 유가증권 평가손익은 원칙 불인정."},
  {t:"부당행위계산 부인",s:"특수관계인과의 거래로 조세 부당 감소 시 시가 기준 재계산. 시가와 거래가 차이 3억 이상 또는 시가 5% 이상.",p:"==특수관계 판단은 행위 당시 기준==. 인정이자는 가지급금×이자율(가중평균 또는 당좌대출이자율)."},
  {t:"이월결손금과 세율",s:"결손금 15년 이월(2020년 이후 발생). 공제한도는 각 사업연도 소득 80%(중소기업 100%). 세율 9·19·21·24%.",p:"==중소기업은 결손금 소급공제 가능==(직전 사업연도 법인세 한도). 이월결손금은 먼저 발생분부터 공제."},
  {t:"신고와 납부",s:"사업연도 종료일 말일부터 3개월 이내 신고. 중간예납은 6개월 초과 법인, 직전 실적 또는 가결산 기준.",p:"==납부세액 1천만원 초과 시 1개월 분납==(중소 2개월). 외부감사 대상은 1개월 연장 가능."},
  {t:"최저한세",s:"각종 감면 후 세액이 과세표준×최저한세율(일반 10~17%, 중소 7%) 미만이면 그 금액까지 감면 배제.",p:"==외국납부세액공제·재해손실세액공제는 최저한세 적용 대상 아님==. 적용 순서 문제 반복."}
 ]},
 {name:"소득세법 총칙·종합소득",cards:[
  {t:"거주자 판정",s:"국내 주소 또는 183일 이상 거소. 거주자는 전세계 소득, 비거주자는 국내원천소득만 과세.",p:"==국외근무 공무원·해외현지법인 파견 임직원은 거주자 의제==. 과세기간은 1.1~12.31, 변경 불가."},
  {t:"금융소득 종합과세",s:"이자+배당 합계 2천만원 초과 시 종합과세. 2천만원 이하는 14% 분리과세(원천징수)로 종결.",p:"==Gross-up: 내국법인 배당(법인세 과세소득)에 10% 가산==, 2천만원 초과분에만 적용. 비영업대금이익 원천징수 25%."},
  {t:"사업소득",s:"사업소득금액=총수입금액−필요경비. 부동산임대소득도 사업소득. 결손금은 다른 소득과 통산(부동산임대 결손금은 제외).",p:"==주택임대 2천만원 이하는 분리과세 선택 가능==. 사업소득 대표자 급여는 필요경비 불산입(법인세와 차이)."},
  {t:"근로소득",s:"총급여−근로소득공제=근로소득금액. 비과세: 식대 월 20만원, 자가운전보조금 월 20만원, 출산·보육수당 등.",p:"==일용근로자는 일 15만원 공제 후 6% 원천징수로 분리과세==. 연말정산은 다음해 2월분 급여 지급 시."},
  {t:"기타소득",s:"일시적 인적용역·강연료·원고료 등은 필요경비 60% 의제. 기타소득금액 300만원 이하 분리과세 선택.",p:"==원천징수 20%(복권 3억 초과 30%)==. 계약금이 위약금으로 대체된 경우 원천징수 없음. 뇌물·알선수재는 무조건 종합과세."},
  {t:"연금소득",s:"공적연금은 종합과세. 사적연금(연금저축·퇴직연금)은 1,500만원 이하 분리과세 선택(3~5%), 초과 시 종합과세 또는 15% 분리 선택.",p:"==연금계좌 세액공제 한도 900만원==(연금저축 600만원). 중도해지는 기타소득 15%."}
 ]},
 {name:"소득세법 공제·세액·양도",cards:[
  {t:"인적공제",s:"기본공제 1인 150만원(연소득금액 100만원 이하, 근로소득만 있으면 총급여 500만원). 추가공제: 경로 100만원(70세), 장애인 200만원, 부녀자 50만원, 한부모 100만원.",p:"==직계존속 나이 60세, 직계비속 20세 이하==. 장애인은 나이 요건 없음. 부녀자와 한부모 중복 시 한부모."},
  {t:"세액공제",s:"근로소득세액공제, 자녀세액공제(8세 이상), 연금계좌, 보험료(12%), 의료비(15%, 총급여 3% 초과분), 교육비(15%), 기부금(15%/30%).",p:"==의료비는 나이·소득 요건 없이== 공제 가능. 교육비는 나이 요건 없음, 소득 요건은 있음."},
  {t:"세율과 신고",s:"6~45% 8단계 초과누진. 확정신고 5.1~5.31. 성실신고확인대상은 6.30까지.",p:"==분리과세 소득은 확정신고 대상 아님==. 근로소득만 있는 자는 연말정산으로 종결."},
  {t:"양도소득 과세대상",s:"부동산·부동산에 관한 권리·주식(대주주·비상장)·기타자산(특정주식, 영업권 등)·파생상품.",p:"==사업용 고정자산과 함께 양도하는 영업권은 양도소득==, 별도 양도는 기타소득. 소액주주 상장주식 장내 양도는 비과세."},
  {t:"양도차익 계산",s:"양도가액−취득가액(실지거래가 원칙)−필요경비=양도차익. 장기보유특별공제(3년 이상 6%~30%, 1세대1주택 최대 80%)−기본공제 250만원.",p:"==취득가액 불분명 시 매매사례가액→감정가액→환산취득가액== 순. 환산 시 필요경비는 개산공제."},
  {t:"1세대1주택 비과세",s:"2년 이상 보유(조정대상지역 취득은 2년 거주). 고가주택은 12억 초과분 과세. 일시적 2주택 3년 이내 종전주택 양도.",p:"==양도일 현재 1세대 1주택== 판정. 예정신고는 양도일 속하는 달 말일부터 2개월 이내."}
 ]},
 {name:"부가가치세 총칙·과세거래",cards:[
  {t:"납세의무자",s:"사업상 독립적으로 재화·용역을 공급하는 자(영리목적 불문). 국가·지자체도 납세의무 있음.",p:"==면세사업자는 부가세 납세의무 없음==. 신탁재산 관련 거래는 수탁자가 납세의무자."},
  {t:"과세기간과 사업자등록",s:"1기(1.1~6.30), 2기(7.1~12.31), 예정신고기간 각 3개월. 사업개시일부터 20일 내 등록.",p:"==등록 전 매입세액은 불공제==, 단 공급시기 속한 과세기간 끝난 후 20일 내 등록 시 그 기간 내 매입분 공제."},
  {t:"재화의 공급의제",s:"자가공급(면세전용·비영업용 소형승용차·판매목적 타사업장 반출), 개인적 공급, 사업상 증여, 폐업 시 잔존재화.",p:"==매입세액 불공제된 재화는 공급의제 제외==. 견본품·광고선전용 무상제공은 사업상 증여 아님."},
  {t:"재화 공급시기",s:"현금·외상: 인도되는 때. 장기할부·완성도·중간지급조건부: 대가 각 부분을 받기로 한 때. 수출: 선적일. 위탁판매: 수탁자 공급일.",p:"==공급시기 전 세금계산서 발급 후 7일 내 대가 수령 시 발급일이 공급시기==. 반환조건부는 조건 성취일."},
  {t:"용역 공급시기",s:"역무 제공 완료 또는 시설물 이용 시. 완성도·중간지급·장기할부·계속적 공급은 대가 각 부분 받기로 한 때.",p:"==부동산 임대 간주임대료는 예정·확정 신고기간 종료일==. 무상 용역은 원칙 과세 안 함(특수관계인 부동산 임대 제외)."}
 ]},
 {name:"부가가치세 영세율·면세·세액",cards:[
  {t:"영세율",s:"수출재화, 국외제공용역, 외국항행용역 등. 매출세액 0, 매입세액 공제·환급 가능(완전면세).",p:"==내국신용장·구매확인서에 의한 공급도 영세율==. 영세율 사업자도 신고의무 있음."},
  {t:"면세",s:"기초생활필수품(미가공식료품·수돗물), 의료·교육·금융보험·토지·주택임대·인적용역·도서신문 등. 매입세액 불공제(부분면세).",p:"==면세포기 가능 대상: 영세율 적용 재화·학술연구단체 공급 등==, 포기 후 3년간 면세 불가. 미용·성형 의료는 과세."},
  {t:"과세표준",s:"금전 대가 → 그 금전, 금전 외 → 자기가 공급한 재화 시가. 특수관계인 부당 저가 → 시가. 포함 X: 매출에누리·환입·할인, 연체이자, 국고보조금.",p:"==대손금·판매장려금(금전)·하자보증금은 과세표준에서 차감하지 않음==. 장려금을 재화로 주면 사업상 증여."},
  {t:"매입세액 불공제",s:"세금계산서 미수취·부실기재, 사업무관, 비영업용 소형승용차 구입·유지, 기업업무추진비, 면세사업 관련, 토지 관련 자본적 지출.",p:"==공급시기 후 확정신고기한 내 발급받은 세금계산서는 공제(가산세 있음)==. 9인승 이상·화물차·경차는 공제 가능."},
  {t:"대손세액공제",s:"공급 후 대손 확정 시 대손금액×10/110을 매출세액에서 차감. 공급일부터 10년 지난 날 속하는 과세기간 확정신고기한까지.",p:"==예정신고 시 공제 불가, 확정신고에서만==. 공급받은 자는 대손처분받은 세액을 매입세액에서 차감."},
  {t:"간이과세",s:"직전연도 공급대가 1억 400만원 미만 개인. 납부세액=공급대가×업종별 부가가치율×10%. 4,800만원 미만 납부의무 면제.",p:"==간이과세자는 환급 없음==, 세금계산서 발급 의무(4,800만원 이상). 부동산임대·유흥주점은 4,800만원 기준."}
 ]},
 {name:"세금계산서·신고납부",cards:[
  {t:"세금계산서 발급",s:"공급시기에 발급 원칙. 월합계 세금계산서는 다음달 10일까지. 법인·직전연도 공급가액 8천만원 이상 개인은 전자세금계산서 의무.",p:"==필요적 기재사항: 공급자 등록번호·성명, 공급받는 자 등록번호, 공급가액과 세액, 작성연월일==. 누락 시 매입세액 불공제."},
  {t:"신고·납부와 환급",s:"예정신고·확정신고 각 종료 후 25일 이내. 일반환급 30일, 조기환급(영세율·시설투자·재무개선) 15일.",p:"==개인 일반과세자는 예정신고 없이 예정고지==(직전 납부세액 1/2, 50만원 미만 생략). 조기환급은 예정·확정·월별 신고 가능."},
  {t:"가산세",s:"세금계산서 미발급 2%, 지연발급 1%, 부실기재 1%, 전자발급 미전송 0.5%(지연 0.3%). 매출처별합계표 미제출 0.5%.",p:"==가공세금계산서(실물거래 없음) 3%==, 위장(타인명의) 2%. 중복적용 배제 규정 확인."}
 ]}
]},
{id:"pf",name:"재정학",chapters:[
 {name:"후생경제학과 시장실패",cards:[
  {t:"파레토 효율 조건",s:"교환의 효율(MRS 동일), 생산의 효율(MRTS 동일), 종합적 효율(MRS=MRT). 세 조건 모두 충족 시 파레토 최적.",p:"==파레토 효율은 분배의 공평성과 무관==. 효용가능곡선 위 모든 점이 효율적."},
  {t:"후생경제학 기본정리",s:"제1정리: 완전경쟁 균형은 파레토 효율. 제2정리: 초기부존 재분배로 원하는 파레토 효율 배분을 시장으로 달성 가능.",p:"==제2정리는 정액세(lump-sum)로 재분배 가능함을 전제==. 효율과 공평의 분리 가능성."},
  {t:"시장실패 원인",s:"공공재, 외부성, 불완전경쟁(자연독점), 정보 비대칭(역선택·도덕적 해이), 불완전 정보.",p:"==소득분배 불공평은 시장실패가 아님==(시장이 효율적이어도 발생). 정부실패와 구분."},
  {t:"사회후생함수",s:"공리주의(효용 합), 롤스(최소 효용 극대화), 평등주의, 내쉬. 무차별곡선 형태로 구분.",p:"==롤스 사회무차별곡선은 L자형==, 공리주의는 직선(−1 기울기). 애로우 불가능성 정리: 5조건 동시 만족 불가."}
 ]},
 {name:"공공재",cards:[
  {t:"공공재의 특성",s:"비경합성(추가 소비 한계비용 0)과 비배제성. 순수공공재는 둘 다, 클럽재는 배제 가능·비경합, 공유자원은 경합·비배제.",p:"==비배제성이 무임승차의 원인==, 비경합성은 배제가 비효율적인 이유. 둘을 구분해서 묻는다."},
  {t:"사무엘슨 조건",s:"공공재 최적 공급: ΣMRS=MRT(개별 한계편익 합=한계비용). 사적재는 MRS=MRT.",p:"==공공재 수요곡선은 개별 수요의 수직 합==, 사적재는 수평 합."},
  {t:"린달 균형",s:"각 개인이 한계편익만큼 조세 부담(린달가격)에 동의하면 효율적 공급 달성. 선호 표출이 진실해야 성립.",p:"==린달 모형은 무임승차 가능성으로 실현 곤란==. 조세가격이 개인마다 다름."},
  {t:"선호표출 메커니즘",s:"클라크-그로브즈 조세: 자신의 선호 표출이 타인에게 미치는 순효과만큼 과세해 진실표출 유도.",p:"==클라크세는 예산 균형 보장 안 됨==(잉여 발생), 담합에 취약."}
 ]},
 {name:"외부성",cards:[
  {t:"외부성과 자원배분",s:"외부불경제(생산 과다), 외부경제(생산 과소). 사회적 한계비용=사적 한계비용+외부 한계비용.",p:"==최적 오염 수준은 0이 아님== — 한계저감비용=한계피해 지점. 금전적 외부성은 시장실패 아님."},
  {t:"피구세와 보조금",s:"피구세=최적 생산량에서 외부 한계비용. 외부경제는 보조금. 세율은 사회적 최적점 기준.",p:"==피구세는 시장 균형점이 아닌 최적점의 외부한계비용==으로 설정. 피구보조금은 진입 유발 문제."},
  {t:"코즈 정리",s:"재산권이 명확하고 거래비용이 없으면 당사자 협상으로 효율적 해결. 재산권 귀속과 무관하게 효율 달성.",p:"==재산권 귀속에 따라 소득분배는 달라짐==, 자원배분(효율)은 동일. 거래비용·다수 당사자 시 한계."},
  {t:"직접규제 vs 경제적 유인",s:"오염배출권 거래제는 한계저감비용이 낮은 기업이 많이 감축 → 총비용 최소. 직접규제는 비용 비효율.",p:"==배출권 거래와 피구세는 모두 한계저감비용 균등화==, 배출권은 총량 확실·가격 불확실, 세금은 반대."}
 ]},
 {name:"공공선택이론",cards:[
  {t:"중위투표자 정리",s:"단봉선호·1차원 쟁점에서 다수결 결과는 중위투표자의 선호. 극단 선호는 무시됨.",p:"==중위투표자 결과는 효율적 공급을 보장하지 않음==. 다봉선호가 있으면 투표의 역설 발생 가능."},
  {t:"투표의 역설",s:"콩도르세 역설: 다수결이 이행성 위반(순환). 의제 순서 조작(agenda control)이 결과 좌우.",p:"==보르다 투표는 무관한 대안의 영향을 받음==. 만장일치는 현상유지 편향."},
  {t:"관료와 지대추구",s:"니스카넨: 관료는 예산 극대화 → 공공재 과다공급. 지대추구는 특혜를 위한 로비로 자원 낭비.",p:"==니스카넨 모형에서 공급량은 효율 수준의 2배==(총편익=총비용점). 로그롤링은 표거래로 과다지출."},
  {t:"정부실패",s:"불완전 정보, 정치적 유인, 관료 비효율, 파생적 외부성, 규제 포획.",p:"==정부실패가 있어도 시장실패 교정 정당성이 사라지는 건 아님==. 최선 vs 차선 비교."}
 ]},
 {name:"조세의 원칙과 귀착",cards:[
  {t:"조세원칙",s:"편익원칙(받는 만큼 부담)과 능력원칙(수평적·수직적 공평). 애덤 스미스 4원칙, 바그너 원칙.",p:"==수평적 공평: 같은 능력 같은 부담==, 수직적: 큰 능력 더 큰 부담. 능력 척도로 소득·소비·재산."},
  {t:"조세귀착의 원리",s:"법적 귀착≠경제적 귀착. 탄력성이 낮은 쪽이 더 많이 부담. 과세 대상(공급자/수요자)과 무관하게 결과 동일.",p:"==공급 완전탄력 → 소비자 전부 부담==, 수요 완전비탄력 → 소비자 전부 부담. 종량세·종가세 귀착 동일 조건."},
  {t:"독점시장 조세 귀착",s:"독점에서 종량세는 가격을 세액보다 적게(선형수요) 또는 많이(일정탄력성 수요) 상승시킬 수 있음.",p:"==일정 탄력성 수요곡선에서는 가격이 세액 이상 상승== 가능(과잉전가)."},
  {t:"하버거 법인세 귀착",s:"일반균형: 법인부문 자본 과세 → 자본이 비법인부문으로 이동 → 경제 전체 자본 수익률 하락.",p:"==장기적으로 법인세는 모든 자본 소유자가 부담==(생산요소 대체탄력성·수요탄력성에 따라 노동에도 전가)."}
 ]},
 {name:"초과부담과 최적조세",cards:[
  {t:"초과부담",s:"조세로 인한 후생 손실 중 세수를 초과하는 부분. ≈½×t²×탄력성×가격×수량. 세율 제곱에 비례.",p:"==세율 2배 → 초과부담 4배==. 탄력성 클수록 초과부담 큼. 정액세는 초과부담 0."},
  {t:"램지 규칙",s:"세수 일정 시 초과부담 최소화: 각 재화 보상수요량 감소율 동일. 역탄력성 규칙: 탄력성 낮은 재화에 높은 세율.",p:"==역탄력성 규칙은 효율성만 고려==, 필수재 중과로 공평성 저해. 재화 간 독립 가정."},
  {t:"최적소득세",s:"에지워스: 완전균등(한계세율 100%). 머리스: 최고소득자 한계세율 0, 비선형 최적세율은 낮게. 스턴: 선형소득세 최적세율.",p:"==머리스 모형에서 최고소득 한계세율 0==인 이유: 그 이상 세율은 세수 없이 노동유인만 저해."},
  {t:"콜렛-헤이그 규칙",s:"여가와 보완적인 재화에 높은 세율 부과 → 여가에 과세하는 효과로 초과부담 감소.",p:"==여가와 보완재 중과, 대체재 경과==. 램지 규칙의 여가 관련 확장."}
 ]},
 {name:"소득세·소비세·법인세 이론",cards:[
  {t:"소득의 정의",s:"헤이그-사이먼스: 소득=소비+순자산 증가. 미실현 이득·귀속소득·이전소득도 포함.",p:"==포괄적 소득세는 저축에 이중과세== 논란 → 지출세(소비세) 주장의 근거."},
  {t:"소득세와 노동공급",s:"비례소득세는 대체효과(여가↑)와 소득효과(노동↑) 상충. 누진세는 대체효과가 상대적으로 커 노동 감소 가능.",p:"==정액세는 소득효과만==(노동 증가). 후방굴절 노동공급곡선 구간에서는 과세로 노동 증가."},
  {t:"이자소득세와 저축",s:"이자소득 과세는 대체효과(저축↓)와 소득효과(저축↑) 상충 → 이론적으로 불확정.",p:"==소득세는 이자소득세 포함으로 저축 이중과세==, 소비세는 저축 중립적."},
  {t:"소비세",s:"부가가치세는 최종소비자 부담, 다단계 거래 중립. 소비세는 역진적(소득 대비). 개별소비세는 사치재·외부성 교정.",p:"==부가세는 생산 단계 수와 무관==(누적효과 없음), 거래세는 수직통합 유인."},
  {t:"법인세 이론",s:"법인세 존재 근거: 법인실체설(독립 납세능력) vs 법인의제설(이중과세 → 통합 필요). 통합방식: 배당세액공제, 완전통합.",p:"==우리나라 배당세액공제(Gross-up)는 부분통합==. 법인세는 투자·자금조달(부채 편향)에 왜곡."}
 ]},
 {name:"재정지출·공채·지방재정",cards:[
  {t:"비용편익분석",s:"NPV(순현재가치)가 기본 기준. IRR·B/C 비율은 규모·상호배타 사업에서 오류 가능.",p:"==사회적 할인율 낮을수록 장기 사업 유리==. B/C 비율은 비용을 편익 차감으로 처리 시 값 달라짐."},
  {t:"공채의 부담",s:"러너: 내국채는 미래세대 부담 없음(이전). 부캐넌: 상환 시 납세자가 부담. 모딜리아니: 자본축적 감소로 미래세대 부담.",p:"==리카도 대등정리: 공채=조세==, 합리적 기대·유산 동기 전제. 성립 시 재정정책 효과 없음."},
  {t:"재정정책과 구축효과",s:"정부지출 증가 → 이자율 상승 → 민간투자 감소. 화폐수요 이자율탄력성 클수록 구축효과 작음.",p:"==고전학파: 완전구축==, 케인즈: 유동성함정에서 구축효과 0."},
  {t:"티부 가설",s:"주민이 발로 투표: 선호에 맞는 지방정부로 이동 → 지방공공재 효율 공급. 완전이동성·다수 지자체·외부성 없음 등 전제.",p:"==티부 모형은 중앙집권보다 분권을 지지==, 소득별 거주분리 문제 발생."},
  {t:"정부간 보조금",s:"정액(무조건)보조금은 소득효과만, 정률(조건부)보조금은 가격효과 → 해당 공공재 지출 더 증가.",p:"==끈끈이 효과: 보조금이 주민 소득증가보다 지출을 더 늘림==. 외부성 있는 공공재는 정률보조 정당."}
 ]},
 {name:"사회보장과 소득재분배",cards:[
  {t:"공적연금 방식",s:"적립방식(자기 부담 축적, 인플레 취약)과 부과방식(현세대 부담, 인구구조 취약). 부과방식 수익률=인구증가율+임금상승률.",p:"==부과방식은 도입 세대에 이득==, 고령화 시 지속 곤란. 적립방식은 저축 증가 효과."},
  {t:"사회보험의 근거",s:"역선택(민간보험 시장 실패), 도덕적 해이, 온정적 간섭, 근시안적 행동. 강제가입으로 역선택 해결.",p:"==건강보험 본인부담금은 도덕적 해이 완화== 수단. 실업보험은 구직기간 연장 효과."},
  {t:"소득재분배 정책",s:"현금 vs 현물 급여(현금이 수혜자 효용 높음, 현물은 온정적 간섭·낙인). 부의 소득세(NIT): 급여=보장소득−t×소득.",p:"==NIT 한계세율이 높으면 노동유인 저해==. 근로장려세제(EITC)는 저소득 구간 노동유인 강화."},
  {t:"불평등 지표",s:"로렌츠곡선, 지니계수(0~1), 십분위분배율(하위 40%/상위 20%, 클수록 평등), 앳킨슨 지수.",p:"==로렌츠곡선 교차 시 지니계수로 비교 불가 시 앳킨슨==. 십분위분배율은 값이 클수록 평등."}
 ]}
]},
{id:"cl",name:"상법(회사편)",chapters:[
 {name:"회사법 총설",cards:[
  {t:"회사의 종류와 특징",s:"합명(무한책임사원), 합자(무한+유한), 유한책임회사, 주식회사, 유한회사 5종. 모두 법인.",p:"==합명·합자회사는 사원 2인 이상 필요==, 주식·유한·유한책임회사는 1인 설립 가능."},
  {t:"법인격 부인",s:"회사 형태가 남용된 경우 특정 사안에서 법인격을 부인하고 배후 주주에게 책임. 회사 존재 자체는 유지.",p:"==법인격 부인은 해당 법률관계에 한정==, 회사 해산·설립무효와 다름. 판례로 인정."},
  {t:"회사의 능력",s:"권리능력은 정관 목적 범위 내(판례는 넓게 해석). 다른 회사의 무한책임사원 불가.",p:"==회사는 정관 목적과 관련 있으면 기부·보증 가능==. 청산 중 회사는 청산 목적 범위 내 능력."},
  {t:"회사의 조직변경",s:"합명↔합자, 주식↔유한·유한책임 사이만 가능. 총사원 동의 또는 총주주 동의 필요.",p:"==주식회사→유한회사 변경 시 사채 전액 상환 필요==. 조직변경은 법인격 동일성 유지."}
 ]},
 {name:"주식회사 설립",cards:[
  {t:"정관 절대적 기재사항",s:"목적, 상호, 발행예정주식총수, 1주 금액(액면), 설립 시 발행주식수, 본점소재지, 공고방법, 발기인 성명·주민번호·주소.",p:"==하나라도 누락 시 정관 무효==. 자본금 총액은 절대적 기재사항 아님. 무액면주식 발행 시 1주 금액 기재 불요."},

/* ===================== 키워드 색인 ===================== */
const TERMS={};
(function(){
  const add=(term,ref)=>{term=term.trim(); if(term.length<3) return; (TERMS[term]||(TERMS[term]=[])).push(ref);};
  DATA.forEach(s=>s.chapters.forEach((ch,ci)=>ch.cards.forEach((card,i)=>{
    const ref={sid:s.id,ci,i};
    add(card.t,ref);
    card.t.replace(/\([^)]*\)/g,"").split(/·| vs |과 |와 |의 /).forEach(part=>{ if(part!==card.t) add(part,ref); });
  })));
})();
const TERM_LIST=Object.keys(TERMS).sort((a,b)=>b.length-a.length);
const TERM_RE=new RegExp(TERM_LIST.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
const refKey=r=>`${r.sid}-${r.ci}-${r.i}`;
function linkify(html,selfId){
  if(!TERM_LIST.length) return html;
  const sid=(selfId||"").split("-")[0];
  return html.replace(TERM_RE,m=>{const rs=TERMS[m]; if(!rs) return m; const r=rs.find(x=>x.sid===sid)||rs[0]; if(refKey(r)===selfId) return m; return `<a class="kw" data-ref="${refKey(r)}">${m}</a>`;});
}
const cardHTML=(card,selfId)=>({s:linkify(esc(card.s),selfId),p:linkify(hl(card.p),selfId)});
function findCard(key){const [sid,ci,i]=key.split("-");const s=DATA.find(d=>d.id===sid);return {sub:s,ci:+ci,i:+i,card:s.chapters[+ci].cards[+i],chName:s.chapters[+ci].name};}

/* 모든 단어를 탭 가능하게 */
const SEP=/([\s·,.()\/:;~—\-"'“”‘’…?!+=×÷−<>→←↑↓%]+)/;
const PARTICLES=/(으로부터|에서는|에서도|에서|으로|로는|로서|로도|처럼|까지|부터|이나|이며|이고|이면|이란|에게|에는|에도|보다|마다|조차|밖에|은|는|이|가|을|를|의|에|과|와|도|만|로|면|서|나|며)$/;
function stripParticle(w){ if(w.length<=2) return w; const s=w.replace(PARTICLES,""); return s.length>=2?s:w; }
function wrapWords(root){
  if(!root) return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(n.parentElement.closest(".kw,.ask,button,textarea,.w,.easy")) return NodeFilter.FILTER_REJECT;
    return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const nodes=[];while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment();
    n.nodeValue.split(SEP).forEach((tok,k)=>{
      if(k%2===1||tok.length<2){ if(tok) frag.appendChild(document.createTextNode(tok)); return; }
      const sp=document.createElement("span");sp.className="w";sp.textContent=tok;frag.appendChild(sp);
    });
    n.parentNode.replaceChild(frag,n);
  });
}
document.addEventListener("click",e=>{
  if(e.target.closest(".sheet")) return;
  const kw=e.target.closest(".kw"); if(kw){e.preventDefault();openCardSheet(kw.dataset.ref);return;}
  const w=e.target.closest(".w"); if(w){openTermSheet(stripParticle(w.textContent.trim()));}
});

const KEY="semusa-1cha-progress";
let state={learned:{},again:{},pos:{},quiz:{},days:{}}; // days[YYYY-MM-DD]={n,r,q,done}
const GOAL={n:10,r:5};
const todayKey=(d=new Date())=>{const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;};
function dayRec(){const k=todayKey();state.days=state.days||{};return state.days[k]||(state.days[k]={n:0,r:0,q:null,done:false});}
function dayStatus(){
  const d=dayRec(); const againCnt=Object.keys(state.again).length;
  const rGoal=Math.min(GOAL.r,againCnt+d.r);
  const s={n:d.n>=GOAL.n,r:d.r>=rGoal,q:d.q!==null,rGoal};
  s.all=s.n&&s.r&&s.q; if(s.all&&!d.done) d.done=true; return s;
}
function streak(){
  const days=state.days||{}; let n=0; const d=new Date();
  if(!(days[todayKey(d)]||{}).done) d.setDate(d.getDate()-1);
  while((days[todayKey(d)]||{}).done){n++;d.setDate(d.getDate()-1);}
  return n;
}
function bump(field,val){const d=dayRec(); if(field==="q") d.q=Math.max(d.q||0,val); else d[field]++; dayStatus();}
function nextUnlearned(){
  const order=[view.subj,...DATA.map(d=>d.id).filter(x=>x!==view.subj)];
  for(const sid of order){const s=DATA.find(d=>d.id===sid);
    for(let ci=0;ci<s.chapters.length;ci++)for(let i=0;i<s.chapters[ci].cards.length;i++) if(!state.learned[cid(sid,ci,i)]) return {sid,ci,i};}
  return null;
}

/* ===================== 테스트 문제 생성 ===================== */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const firstMark=p=>{const m=p.match(/==(.+?)==/);return m?m[1]:null;};
function makeQuiz(sub,chIdxs,n){
  const pool=[];
  chIdxs.forEach(ci=>sub.chapters[ci].cards.forEach((card,i)=>pool.push({ci,i,card})));
  const allCards=[];sub.chapters.forEach((ch,ci)=>ch.cards.forEach((card,i)=>allCards.push({ci,i,card})));
  const picked=shuffle(pool).slice(0,n||pool.length);
  return picked.map(item=>{
    const {ci,i,card}=item;
    const mark=firstMark(card.p);
    // 같은 챕터 우선, 부족하면 같은 과목에서 오답 보기 추출
    const others=key=>{
      const same=shuffle(allCards.filter(o=>o.ci===ci&&!(o.i===i)).map(key).filter(v=>v&&v!==key(item)));
      const rest=shuffle(allCards.filter(o=>o.ci!==ci).map(key).filter(v=>v&&v!==key(item)));
      const seen=new Set([key(item)]);const out=[];
      for(const v of same.concat(rest)){if(!seen.has(v)){seen.add(v);out.push(v);}if(out.length===3)break;}
      return out;
    };
    if(mark&&Math.random()<0.5){
      const ans=mark;
      const ch=others(o=>firstMark(o.card.p));
      const body=card.p.replace(/==(.+?)==/,"\u0000").replace(/==(.+?)==/g,"$1");
      return {type:"blank",ci,i,card,body,answer:ans,choices:shuffle([ans,...ch])};
    }
    const ans=card.t;const ch=others(o=>o.card.t);
    return {type:"concept",ci,i,card,body:card.s,answer:ans,choices:shuffle([ans,...ch])};
  });
}

function attachAsk(container,id,sub,chName,card){
  const box=document.createElement("div");box.className="ask";
  box.innerHTML=`<div class="chips">${CHIPS.map(c=>`<button class="chip" type="button">${c}</button>`).join("")}</div>
   <div class="in"><textarea rows="1" placeholder="${getKey()?"이해 안 되는 부분을 물어보세요":"질문하면 Claude 앱으로 넘어가요"}"></textarea><button class="send" type="button">${getKey()?"질문":"Claude"}</button></div>
   <div class="log"></div>`;
  container.appendChild(box);
  const ta=box.querySelector("textarea"),send=box.querySelector(".send"),log=box.querySelector(".log");
  const hist=askHist[id]||(askHist[id]=[]);
  const draw=()=>{log.innerHTML=hist.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}${m.err?" err":""}${m.wait?" wait":""}">${esc(m.content)}</div>`).join("");};
  draw();
  ta.oninput=()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,120)+"px";};
  const go=async(text)=>{
    text=(text||ta.value).trim(); if(!text||send.disabled) return;
    if(!getKey()){ window.open(claudeLink(`${ctxLine({sub,chName,card})}\n기출 포인트: ${card.p.replace(/==/g,"")}\n\n질문: ${text}`),"_blank"); return; }
    ta.value="";ta.style.height="auto";
    hist.push({role:"user",content:text});
    const waiting={role:"assistant",content:"생각 중…",wait:true}; hist.push(waiting); draw(); send.disabled=true;
    try{
      const msgs=hist.filter(m=>!m.wait&&!m.err).map(m=>({role:m.role,content:m.content}));
      const text=await claude(askSystem(sub,chName,card),msgs);
      hist.pop(); hist.push(text?{role:"assistant",content:text}:{role:"assistant",content:"답변을 받지 못했어요. 다시 시도해 주세요.",err:true});
    }catch(e){ hist.pop(); hist.push({role:"assistant",content:e.message==="NOKEY"?NOKEY_MSG:"연결에 실패했어요. API 키와 네트워크를 확인해 주세요.",err:true}); }
    send.disabled=false; draw();
    const last=log.lastElementChild; if(last) last.scrollIntoView({block:"end",behavior:"smooth"});
  };
  send.onclick=()=>go();
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();go();}};
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>go(c.textContent));
}

const KEYKEY="semusa-api-key";
const getKey=()=>{try{return LS.getItem(KEYKEY)||"";}catch(e){return "";}};
const setKey=k=>{try{ if(k) LS.setItem(KEYKEY,k.trim()); else LS.removeItem(KEYKEY);}catch(e){}};
async function claude(system,messages){
  const key=getKey(); if(!key) throw new Error("NOKEY");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system,messages})});
  const d=await r.json();
  if(d.error) throw new Error(d.error.message||"API error");
  return (d.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n").trim();
}

  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,"");

function importCode(code){

  (o.l||[]).forEach(k=>s.learned[k]=1);(o.a||[]).forEach(k=>s.again[k]=1);

}

  return `<div class="daily">
    <div class="dh"><h2>오늘의 학습지</h2><span class="streak"><b>${sk}</b>일 연속</span></div>
    ${row("n","새 카드 "+GOAL.n+"장",`${Math.min(d.n,GOAL.n)} / ${GOAL.n} 완료`,st.n,"시작")}
    ${row("r","복습 "+(st.rGoal||0)+"장",st.rGoal?`${Math.min(d.r,st.rGoal)} / ${st.rGoal} — 다시 볼 카드`:"다시 볼 카드가 없어요",st.r,"복습")}
    ${row("q","확인 테스트 5문제",d.q!==null?`오늘 점수 ${d.q}%`:"오늘 본 챕터에서 출제",st.q,"테스트")}
    <div class="cal">${cal.join("")}</div>
    ${st.all?`<div class="alldone">오늘 학습지 완료. 내일 또 만나요.</div>`:""}
  </div>`;
}
function tabsHTML(){
  return `<div class="tabs" role="tablist">`+DATA.map(d=>{
    const st=stats(d);
    return `<button class="tab${d.id===view.subj?" on":""}" role="tab" data-subj="${d.id}">${d.name}<small>${Math.round(st.done/st.tot*100)}%</small></button>`;
  }).join("")+`</div>`;
}

function renderList(){
  const sub=subj(); const rv=reviewList(sub).length;
  const cur=state.pos[sub.id];
  app.innerHTML=`
   <div class="top" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h1>세무사 1차 핵심개념</h1><div class="sub">기출에 반복되는 개념을 과목·챕터 순서로. 2027년 4월 1차 대비</div></div>
     <button data-act="backup" style="flex:0 0 auto;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;border:1.5px solid ${storageOK?"var(--line)":"var(--again)"};color:${storageOK?"var(--muted)":"var(--again)"};background:var(--surface);white-space:nowrap">${storageOK?"설정":"저장 안 됨"}</button></div>
   ${dailyHTML()}
   ${tabsHTML()}
   <div class="list">
    <div class="head"><h2>${sub.name}</h2><div class="tools">${rv?`<button class="rv" data-act="review">다시 볼 ${rv}장</button>`:""}<button data-act="subjquiz">과목 랜덤 10문제</button></div></div>
    ${sub.chapters.map((ch,ci)=>{
      const st=chapterStats(sub,ci); const pct=st.done/st.tot*100;
      const qz=state.quiz[sub.id+"-"+ci];
      const qcls=qz?(qz.last>=80?" good":qz.last<60?" bad":""):"";
      return `<div class="chrow"><button class="ch${st.done===st.tot?" done":""}${cur&&cur.ch===ci?" cur":""}" data-ch="${ci}">
        <span class="n">${ci+1}</span><span class="name">${esc(ch.name)}</span><span class="cnt">${st.done}/${st.tot}</span>
        <span class="bar" style="width:${pct}%"></span></button>
        <button class="qz${qcls}" data-qz="${ci}" aria-label="${esc(ch.name)} 테스트">${qz?`<b>${qz.last}%</b>테스트`:`테스트`}</button></div>`;
    }).join("")}
    <p class="note">${sub.id==="tx"?"세법의 숫자·한도는 2026년 기준입니다. 2027년 시험 개정사항은 인강 개정세법 특강으로 반드시 확인하세요.":"카드 안의 단어는 어떤 것이든 누르면 설명이 뜹니다. 점선 밑줄 단어는 관련 카드로 연결돼요. 카드를 다 보면 '테스트'로 확인하세요."}</p>
   </div>`;
  app.querySelector('[data-act="backup"]').onclick=openBackupSheet;
  app.querySelector('[data-daily="n"]').onclick=()=>{const nx=nextUnlearned(); if(!nx) return; view.subj=nx.sid;view.ch=nx.ci;view.idx=nx.i;view.review=false;view.screen="card";render();};
  app.querySelector('[data-daily="r"]').onclick=()=>{ if(!reviewList(sub).length){const s2=DATA.find(d=>reviewList(d).length); if(!s2) return; view.subj=s2.id;} view.review=true;view.rIdx=0;view.screen="card";render();};
  app.querySelector('[data-daily="q"]').onclick=()=>{
    // 오늘 본 카드가 있는 챕터 위주로 5문제
    const s=subj(); const cur=state.pos[s.id]; const chs=cur?[cur.ch]:[0];
    startQuiz(s,chs,5);
  };
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view.subj=b.dataset.subj;renderList();});
  app.querySelectorAll(".qz").forEach(b=>b.onclick=()=>startQuiz(sub,[+b.dataset.qz],null));
  app.querySelector('[data-act="subjquiz"]').onclick=()=>startQuiz(sub,sub.chapters.map((_,i)=>i),10);
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.ch; const st=chapterStats(sub,ci);
    view.ch=ci; view.review=false;
    // 이어하기: 아직 안 본 첫 카드로
    let start=0; for(let i=0;i<sub.chapters[ci].cards.length;i++){ if(!state.learned[cid(sub.id,ci,i)]){start=i;break;} if(i===sub.chapters[ci].cards.length-1) start=0; }
    view.idx=st.done===st.tot?0:start;
    view.screen="card"; render();
  });
  const rb=app.querySelector('[data-act="review"]'); if(rb) rb.onclick=()=>{view.review=true;view.rIdx=0;view.screen="card";render();};
}

function currentCard(){
  const sub=subj();
  if(view.review){
    const l=reviewList(sub); if(!l.length) return null;
    if(view.rIdx>=l.length) view.rIdx=l.length-1;
    const {ci,i}=l[view.rIdx]; return {sub,ci,i,card:sub.chapters[ci].cards[i],n:view.rIdx+1,tot:l.length,name:"다시 볼 카드",chName:sub.chapters[ci].name};
  }
  const ch=sub.chapters[view.ch];
  return {sub,ci:view.ch,i:view.idx,card:ch.cards[view.idx],n:view.idx+1,tot:ch.cards.length,name:ch.name,chName:ch.name};
}

function renderCard(){
  const c=currentCard();
  if(!c){renderList();return;}
  const id=cid(c.sub.id,c.ci,c.i);
  const learned=!!state.learned[id], again=!!state.again[id];
  const ch_=cardHTML(c.card,id); sheetCtx={sub:c.sub,chName:c.chName,card:c.card};
  const first=view.review?view.rIdx===0:view.idx===0;
  const last=view.review?view.rIdx===c.tot-1:view.idx===c.tot-1;
  app.innerHTML=`
   <div class="study">
    <div class="crumb"><button data-act="back">‹ ${c.sub.name}</button><span class="where">${c.n} / ${c.tot}</span></div>
    <div class="prog"><i style="width:${c.n/c.tot*100}%"></i></div>
    <div class="card" tabindex="0">
      <div class="ch-name">${esc(view.review?c.chName:c.name)}</div>
      <h3>${esc(c.card.t)}</h3>
      <div class="s">${ch_.s}</div>
      <div class="pt"><div class="lbl">기출 포인트</div><p>${ch_.p}</p></div>
      ${easyHTML(id,false)}
      ${learned?`<div class="state ok">학습 완료</div>`:again?`<div class="state again">다시 볼 카드로 표시됨</div>`:""}
      <div class="askhost"></div>
    </div>
    <div class="acts"><div class="row">
      <button class="nav" data-act="prev" ${first?"disabled":""} aria-label="이전">‹</button>
      <button class="again" data-act="again">${again?"다시 해제":"다시"}</button>
      <button class="ok" data-act="ok">${learned?"다음 ›":"알겠음 ›"}</button>
      <button class="nav" data-act="next" ${last?"disabled":""} aria-label="다음">›</button>
    </div></div>
   </div>`;
  if(!c.sub.chapters[view.ch] && !view.review){}
  if(!view.review) state.pos[c.sub.id]={ch:view.ch,idx:view.idx};
  wrapWords(app.querySelector(".card .s")); wrapWords(app.querySelector(".card .pt p")); bindEasy(app);
  attachAsk(app.querySelector(".askhost"),id,c.sub,c.chName,c.card);
  app.querySelector('[data-act="back"]').onclick=()=>{view.screen="list";render();};
  app.querySelector('[data-act="prev"]').onclick=()=>{view.review?view.rIdx--:view.idx--;render();};
  app.querySelector('[data-act="next"]').onclick=()=>{view.review?view.rIdx++:view.idx++;render();};
  app.querySelector('[data-act="again"]').onclick=async()=>{
    if(again) delete state.again[id]; else { state.again[id]=1; delete state.learned[id]; }
    await save();
    if(view.review && again){ /* 해제 시 목록에서 빠짐 */ if(view.rIdx>0) view.rIdx--; }
    render();
  };
  app.querySelector('[data-act="ok"]').onclick=async()=>{
    bump(view.review?"r":"n",1);
    state.learned[id]=1; delete state.again[id]; await save();
    if(view.review){ if(reviewList(c.sub).length===0){view.screen="end";view.endKind="review";} else if(view.rIdx>0) view.rIdx--; render(); return; }
    if(view.idx<c.tot-1){view.idx++;} else {view.screen="end";view.endKind="chapter";}
    render();
  };
}

function renderEnd(){
  const sub=subj();
  const nextCh=view.ch+1<sub.chapters.length;
  const isRv=view.endKind==="review";
  app.innerHTML=`<div class="end">
    <h3>${isRv?"다시 볼 카드를 모두 정리했어요":esc(sub.chapters[view.ch].name)+" 완료"}</h3>
    <p>${isRv?"헷갈렸던 개념이 남지 않았습니다.":nextCh?"다음 챕터로 이어갈까요?":"이 과목 마지막 챕터입니다."}</p>
    ${!isRv?`<button data-act="quiz">이 챕터 테스트</button>`:""}
    ${!isRv&&nextCh?`<button class="ghost" data-act="nextch">다음 챕터</button>`:""}
    <button class="ghost" data-act="back">챕터 목록</button>
  </div>`;
  const n=app.querySelector('[data-act="nextch"]'); if(n) n.onclick=()=>{view.ch++;view.idx=0;view.screen="card";render();};
  const q=app.querySelector('[data-act="quiz"]'); if(q) q.onclick=()=>startQuiz(sub,[view.ch],null);
  app.querySelector('[data-act="back"]').onclick=()=>{view.screen="list";render();};
}

/* ===================== 테스트 화면 ===================== */
function startQuiz(sub,chIdxs,n){
  const qs=makeQuiz(sub,chIdxs,n);
  const key=chIdxs.length===1?sub.id+"-"+chIdxs[0]:null;
  const label=chIdxs.length===1?sub.chapters[chIdxs[0]].name:sub.name+" 랜덤";
  quiz={sub,label,key,qs,idx:0,answers:[],chosen:null};
  view.screen="quiz";render();
}
function renderQuiz(){
  const q=quiz.qs[quiz.idx]; const n=quiz.idx+1,tot=quiz.qs.length;
  const chosen=quiz.chosen; const qh=cardHTML(q.card,cid(quiz.sub.id,q.ci,q.i)); sheetCtx={sub:quiz.sub,chName:quiz.sub.chapters[q.ci].name,card:q.card};
  const body=q.type==="blank"
    ?esc(q.body).replace("\u0000",`<span class="blank" aria-label="빈칸"></span>`)
    :esc(q.body);
  app.innerHTML=`
   <div class="study">
    <div class="crumb"><button data-act="quit">‹ 그만두기</button><span class="where">${n} / ${tot}</span></div>
    <div class="prog"><i style="width:${n/tot*100}%"></i></div>
    <div class="q">
      <div class="kind">${esc(quiz.label)} — ${q.type==="blank"?"빈칸에 들어갈 내용은?":"다음 설명에 해당하는 개념은?"}</div>
      <div class="body">${body}</div>
      <div class="opts">${q.choices.map((c,k)=>{
        let cls="";
        if(chosen!==null){ if(c===q.answer) cls=" right"; else if(c===chosen) cls=" wrong"; }
        return `<button class="opt${cls}" data-opt="${k}" ${chosen!==null?"disabled":""}><span class="k">${k+1}</span><span>${esc(c)}</span></button>`;
      }).join("")}</div>
      ${chosen!==null?`<div class="expl">
        <div class="verdict ${chosen===q.answer?"ok":"no"}">${chosen===q.answer?"정답":"오답 — 다시 볼 카드에 추가됨"}</div>
        <b>${esc(q.card.t)}</b>${qh.s}<br>${qh.p}${easyHTML(cid(quiz.sub.id,q.ci,q.i),chosen!==q.answer)}<div class="askhost"></div></div>`:""}
    </div>
    <div class="acts"><button class="single" data-act="next" ${chosen===null?"disabled":""}>${chosen===null?"보기를 고르세요":n<tot?"다음 문제 ›":"결과 보기"}</button></div>
   </div>`;
  if(chosen!==null){ wrapWords(app.querySelector(".expl")); bindEasy(app); attachAsk(app.querySelector(".askhost"),cid(quiz.sub.id,q.ci,q.i),quiz.sub,quiz.sub.chapters[q.ci].name,q.card); }
  app.querySelector('[data-act="quit"]').onclick=()=>{quiz=null;view.screen="list";render();};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{
    const c=q.choices[+b.dataset.opt]; const ok=c===q.answer;
    quiz.chosen=c; quiz.answers.push({q,chosen:c,ok});
    if(!ok){ const id=cid(quiz.sub.id,q.ci,q.i); state.again[id]=1; delete state.learned[id]; await save(); }
    render();
  });
  app.querySelector('[data-act="next"]').onclick=()=>{
    if(quiz.idx<tot-1){quiz.idx++;quiz.chosen=null;render();}
    else finishQuiz();
  };
}
async function finishQuiz(){
  const right=quiz.answers.filter(a=>a.ok).length; const tot=quiz.qs.length;
  const pct=Math.round(right/tot*100);
  bump("q",pct);
  if(quiz.key){ const prev=state.quiz[quiz.key]||{best:0}; state.quiz[quiz.key]={best:Math.max(prev.best,pct),last:pct}; }
  await save();
  quiz.result={right,tot,pct};
  view.screen="quizresult";render();
}
function renderQuizResult(){
  const {right,tot,pct}=quiz.result; const wrongs=quiz.answers.filter(a=>!a.ok);
  const msg=pct===100?"완벽해요. 다음 챕터로 넘어가도 됩니다.":pct>=80?"잘 잡혀 있어요. 틀린 것만 다시 보면 됩니다.":pct>=60?"핵심은 알지만 디테일이 흔들려요. 틀린 카드를 오늘 한 번 더 보세요.":"이 챕터는 카드부터 다시 한 번 돌리는 게 좋겠어요.";
  app.innerHTML=`
   <div class="score"><div class="big">${pct}<small>%</small></div><p>${esc(quiz.label)} · ${right}/${tot} 정답</p><p>${msg}</p></div>
   <div class="wrongs">
    ${wrongs.length?`<h4>틀린 문제 ${wrongs.length}개 — 다시 볼 카드에 넣어뒀어요</h4>`+wrongs.map(a=>`<div class="w"><b>${esc(a.q.card.t)}</b><span>내 답: ${esc(a.chosen)}</span><br>${hl(a.q.card.p)}</div>`).join(""):""}
   </div>
   <div class="end" style="padding-top:0">
    <button data-act="retry">다시 풀기</button>
    ${wrongs.length?`<button class="ghost" data-act="review">틀린 카드 복습</button>`:""}
    <button class="ghost" data-act="back">챕터 목록</button>
   </div>`;
  app.querySelector('[data-act="retry"]').onclick=()=>{const chs=[...new Set(quiz.qs.map(q=>q.ci))];const n=quiz.key?null:10;startQuiz(quiz.sub,quiz.key?[quiz.qs[0].ci]:quiz.sub.chapters.map((_,i)=>i),n);};
  const rv=app.querySelector('[data-act="review"]'); if(rv) rv.onclick=()=>{view.subj=quiz.sub.id;view.review=true;view.rIdx=0;view.screen="card";quiz=null;render();};
  app.querySelector('[data-act="back"]').onclick=()=>{quiz=null;view.screen="list";render();};
}

function render(){
  if(view.screen==="list") renderList();
  else if(view.screen==="card") renderCard();
  else if(view.screen==="quiz") renderQuiz();
  else if(view.screen==="quizresult") renderQuizResult();
  else renderEnd();
  window.scrollTo(0,0);
}

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
(async()=>{ await load(); render(); })();
</script>
</body>
</html>
