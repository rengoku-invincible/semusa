(function(){
  const CV={"id": "cv", "name": "민법총칙", "chapters": [{"name": "민법 총설과 권리", "cards": [{"t": "민법의 법원(法源)", "s": "민사에 관하여 법률에 규정이 없으면 관습법, 관습법이 없으면 조리에 의한다(제1조). 관습법은 법원이 직권으로 확인하되 법적 확신이 있어야 하고, 헌법·전체 법질서에 반하면 효력 없음.", "p": "==관습법은 법률에 대해 보충적 효력==(대등·개폐적 효력 X, 판례). ==사실인 관습==은 법률행위 해석 기준(제106조)이라 당사자 의사가 불분명할 때 적용, 법원(法源) 아님. 판례: 종중 여성 회원 관습법 부정, 명인방법·분묘기지권은 관습법.", "e": "민법 문제를 풀 때 법률 → 관습법 → 조리(상식·조리) 순서로 적용해요. 관습법은 사회에서 '이건 법이다'라고 믿어지는 관행인데 법률을 뒤집지는 못하고 빈틈만 메워요. '사실인 관습'은 그보다 약해서 계약 해석에만 쓰여요.\n예시: 산에 있는 소나무를 팔 때 등기 대신 나무에 표시(명인방법)로 소유권 이전 → 관습법으로 인정. 성인 여성을 종중원에서 배제하는 관습 → 헌법 평등에 반해 관습법 효력 부정(2005 전합). 상거래에서 '월말 결제'가 통용되는 지역 관행 → 사실인 관습, 계약에 명시 없으면 그에 따름."}, {"t": "신의성실의 원칙과 권리남용", "s": "권리 행사와 의무 이행은 신의에 좇아 성실히 해야 하고(제2조 1항), 권리남용은 금지(2항). 파생원칙: 실효의 원칙, 모순행위 금지(금반언), 사정변경의 원칙. 강행규정이므로 법원이 직권으로 판단.", "p": "권리남용 요건은 ==객관적으로 권리 행사가 사회질서 위반==, 주관적 가해의사는 필수 아님(판례는 객관적 요건 중시). ==강행규정 위반을 스스로 주장하는 것은 신의칙 위반 아님==(원칙). 실효: 장기간 불행사 + 상대방의 정당한 신뢰.", "e": "법대로만 하면 되는 게 아니라 상식과 신뢰를 지키며 권리를 써야 해요. 오랫동안 권리를 안 쓰다가 갑자기 행사하거나(실효), 앞뒤 다른 말을 하거나(금반언), 남을 괴롭히려고만 권리를 쓰면(권리남용) 법원이 막아요. 당사자가 주장 안 해도 법원이 스스로 판단해요.\n예시: 자기 땅에 옆집 건물이 몇 cm 넘어왔다고 건물 철거를 청구, 철거하면 상대는 수억 손해이고 자기는 이익이 거의 없음 → 권리남용, 철거 불가(손해배상만). 해고 후 10년간 아무 말 없다가 해고무효 주장 → 실효. 단 '이 계약은 강행법규 위반이라 무효'라고 스스로 주장하는 건 신의칙 위반이 아니에요."}, {"t": "권리의 종류와 충돌", "s": "내용에 따라 재산권·인격권·가족권·사원권, 작용에 따라 지배권·청구권·형성권·항변권. 형성권은 일방적 의사표시로 법률관계 변동(취소권·해제권·상계권·추인권 등), 행사기간은 제척기간. 권리 충돌 시 물권 상호간은 순위, 물권과 채권은 물권 우선, 채권 상호간은 평등.", "p": "==형성권의 행사기간은 소멸시효가 아닌 제척기간==(중단 없음). 항변권은 상대방 청구를 저지하는 권리(동시이행항변권·최고검색항변권). ==채권자평등의 원칙==: 먼저 성립한 채권이 우선하지 않음.", "e": "권리의 성격을 나누면 여러 규정이 이해돼요. 특히 '형성권'은 내가 '취소한다', '해제한다'고 말하기만 하면 효과가 생기는 강력한 권리라서 행사 기간을 정해두고(제척기간) 그 기간은 멈추거나 늘어나지 않아요. 여러 사람의 채권끼리는 순서 없이 평등하고, 물권(담보권)이 채권보다 우선해요.\n예시: 사기당해 계약을 취소할 권리 → 형성권, 안 날부터 3년(제척기간). 채무자 재산 1억에 A 채권 1억(먼저 발생), B 채권 1억 → 안분 5천만원씩(채권자평등). B가 저당권을 설정했다면 B가 먼저 1억 전액 회수(물권 우선). 상대방이 '너도 아직 이행 안 했잖아' → 동시이행항변권."}]}, {"name": "권리의 주체 — 자연인", "cards": [{"t": "권리능력의 시기와 종기, 태아", "s": "사람은 출생한 때(전부노출설)부터 사망 시까지 권리능력. 태아는 원칙적으로 권리능력 없으나 불법행위 손해배상청구, 상속, 유증, 인지 등 개별 규정에서 '이미 출생한 것으로 본다'(개별적 보호주의). 판례는 정지조건설(살아서 태어나야 소급 취득).", "p": "==태아에게 인정: 손해배상청구·상속·대습상속·유증·인지==. 인정 안 됨: ==증여(계약)·사인증여==(판례). 정지조건설 → 태아인 동안 법정대리인 없음, 태아 상태에서 한 합의는 무효. 동시사망 추정(제30조).", "e": "권리능력은 태어나서 죽을 때까지예요. 배 속의 태아는 아직 사람이 아니지만, 아버지가 사고로 죽었을 때 상속을 못 받으면 억울하니 몇 가지 경우엔 태어난 것으로 봐줘요. 판례는 '살아서 태어나야 그때 소급해서' 인정하는 입장이라 태아 상태에선 대리인도 없어요.\n예시: 임신 중 남편이 교통사고로 사망 → 태아는 상속인이자 위자료 청구권자(출생 후 소급). 사고 후 어머니가 태아를 대리해 가해자와 합의 → 태아는 권리능력 없어 합의 무효, 출생 후 다시 청구 가능. 할아버지가 태아에게 '증여한다'고 계약 → 태아는 증여 못 받음(판례)."}, {"t": "미성년자의 행위능력", "s": "19세 미만. 법률행위에 법정대리인 동의 필요, 없으면 취소 가능(본인·법정대리인). 단독 가능: 권리만 얻거나 의무만 면하는 행위, 범위를 정해 처분 허락받은 재산의 처분, 허락받은 영업에 관한 행위, 대리행위, 유언(17세), 임금 청구.", "p": "==부담부 증여·채무면제 승낙은 '권리만 얻는 행위' 아님==(동의 필요). 영업허락 취소는 ==선의 3자에게 대항 불가==. 처분허락은 ==사용 목적을 정해도 목적 외 사용 유효==(판례). 법정대리인이 동의 후 미성년자가 한 행위는 유효.", "e": "만 19세 전에는 부모 동의 없이 한 계약을 나중에 취소할 수 있어요(미성년자 보호). 하지만 공짜로 받기만 하는 것, 용돈처럼 '이 돈은 네 마음대로 써'라고 허락받은 재산을 쓰는 것, 허락받은 장사는 혼자서도 유효해요.\n예시: 17세가 부모 몰래 200만원 노트북 할부 계약 → 부모나 본인이 취소 가능. 부모가 준 용돈 10만원으로 옷 구입 → 처분 허락 재산, 유효. 삼촌이 '이 차 줄게, 대신 세금은 네가 내' → 부담부 증여라 동의 필요. 부모 허락으로 카페 운영 중 원두 구입 계약 → 유효."}, {"t": "피성년후견인·피한정후견인·피특정후견인", "s": "성년후견: 정신적 제약으로 사무처리 능력이 지속적으로 결여 → 법률행위 원칙 취소 가능(일용품 구입 등 일상행위와 법원이 정한 범위는 유효). 한정후견: 능력 부족 → 원칙 유효, 법원이 동의 필요 범위를 정하면 그 행위만 취소 가능. 특정후견: 일시적·특정 사무 후원, 행위능력 제한 없음.", "p": "==피성년후견인은 후견인 동의를 받아도 취소 가능==(동의권 없음, 대리권만). ==피한정후견인은 원칙 행위능력 있음==. 개시 심판은 ==본인·배우자·4촌 이내 친족·검사·지자체장== 청구. 성년후견 개시 시 기존 한정후견 종료.", "e": "어른이라도 치매 등으로 판단력이 부족하면 법원 심판으로 보호해요. 성년후견은 가장 강해서 혼자 한 계약은 거의 다 취소할 수 있고(후견인이 대신 함), 한정후견은 원칙적으로 혼자 할 수 있되 법원이 정한 중요 행위(부동산 처분 등)만 후견인 동의가 필요해요. 특정후견은 능력 제한이 없어요.\n예시: 중증 치매 어머니(성년후견)가 혼자 아파트 매매계약 → 후견인이 취소 가능. 후견인이 '동의한다'고 해줬어도 본인이 직접 한 계약은 취소 가능(후견인이 대리해야 유효). 마트에서 반찬 구입 → 일상행위라 유효. 경도 인지장애(한정후견, 법원이 '부동산 처분은 동의 필요'로 정함) → 부동산 외 계약은 혼자 유효."}, {"t": "제한능력자 상대방의 보호", "s": "상대방은 ① 최고권: 1개월 이상 기간 정해 추인 여부 확답 촉구, 무응답 시 능력자·법정대리인에게는 추인 간주, 특별절차 필요 시 취소 간주 ② 철회권(계약, 선의 상대방)·거절권(단독행위) ③ 제한능력자가 속임수를 써서 능력자로 믿게 하거나 동의 있는 것으로 믿게 하면 취소권 배제.", "p": "==최고에 무응답 시: 능력 회복한 본인·법정대리인 → 추인 간주, 후견감독인 동의 등 특별절차 필요 → 취소 간주==. 철회는 ==추인 전, 선의==일 때만. 속임수는 ==적극적 기망== 필요(단순히 능력자라고 말한 것만으로는 부족, 판례).", "e": "미성년자와 계약한 상대방은 취소당할지 몰라 불안하니 보호 장치가 있어요. '취소할 거야 말 거야' 물어볼 수 있고(최고), 몰랐다면 먼저 계약을 없던 걸로 할 수 있고(철회), 미성년자가 위조 신분증 같은 속임수를 썼다면 아예 취소를 못 하게 해요.\n예시: 판매자가 미성년자 부모에게 '1개월 내 추인 여부 알려달라' 최고 → 무응답 시 추인된 것으로 봄. 미성년자인 줄 몰랐던 판매자 → 추인 전에 철회 가능. 미성년자가 형의 주민등록증을 제시해 성인으로 믿게 함 → 취소 불가. 그냥 '저 스무 살이에요'라고 말만 한 경우 → 속임수 아님, 취소 가능."}, {"t": "부재자와 실종선고", "s": "부재자 재산관리: 법원이 관리인 선임, 관리인은 보존·이용·개량 행위(처분은 법원 허가). 실종선고: 생사불명 5년(보통), 1년(전쟁·선박·항공기 등 특별실종) 경과 후 이해관계인·검사 청구로 선고 → 기간 만료 시 사망으로 간주(추정 아님). 취소 시 선의로 한 행위는 유효, 반환은 현존이익(선의)/이자+손해(악의).", "p": "==실종선고 효과는 '기간 만료 시' 사망 간주==(선고 시 아님). 사망 '간주'라 반증만으로 못 뒤집고 ==취소 심판== 필요. 취소 시 ==쌍방 선의==인 행위만 유효. 생존 확인되어도 취소 전까지는 법률관계 유지.", "e": "사람이 오래 사라지면 남은 가족이 상속도 재혼도 못 하니, 5년(재난이면 1년) 지나면 법원이 '죽은 것으로 본다'고 선고해요. 사망 시점은 선고일이 아니라 5년이 끝난 날. 나중에 살아 돌아와도 자동으로 되돌아가지 않고 취소 심판을 받아야 하고, 그 사이 선의로 한 재혼·매매는 유효해요.\n예시: 2020.3.1 실종, 2026년 선고 → 2025.3.1 사망 간주, 그 시점 기준 상속. 배우자가 선의로 재혼, 상속받은 집을 선의 매수인에게 매도 → 실종자 귀환·취소 후에도 재혼·매매 유효. 상속인이 상속재산 1억 중 5천만원을 써버림(선의) → 현존이익 5천만원만 반환."}]}, {"name": "권리의 주체 — 법인", "cards": [{"t": "법인의 설립과 종류", "s": "비영리 사단법인(사원 있음, 정관 작성)과 재단법인(출연재산, 정관 = 기부행위). 주무관청 허가 + 설립등기(성립요건)로 성립. 재단법인 출연재산은 생전처분 시 법인 성립 시, 유언 시 유언 효력 발생 시 귀속(단 제3자에 대하여는 등기 필요, 판례).", "p": "==설립등기는 성립요건==, 그 외 등기(이사 변경 등)는 ==대항요건==. 재단법인 ==정관에 없는 목적 변경은 원칙 불가==(목적 달성 불능 시 주무관청 허가로 변경). 사단법인 정관변경은 총사원 2/3 + 주무관청 허가.", "e": "법인은 사람이 모인 사단법인과 재산이 중심인 재단법인이 있어요. 관청 허가를 받고 등기해야 생겨요(등기가 없으면 법인 자체가 없음). 재단법인은 내놓은 재산이 언제 법인 것이 되는지, 목적을 바꿀 수 있는지가 시험 포인트예요.\n예시: 동창회가 사단법인 설립 → 정관 작성, 교육부 허가, 등기 완료 시 성립. A가 100억을 출연해 장학재단 설립(생전) → 재단 성립 시 재산 귀속, 단 부동산은 등기해야 제3자에게 주장. 유언으로 출연 → A 사망 시 귀속. 장학재단이 정관을 바꿔 수익사업 법인으로 → 목적 변경 불가."}, {"t": "법인의 능력", "s": "권리능력: 성질상·법률상 제한 외에 정관 목적 범위 내(판례는 목적 수행에 필요한 행위까지 넓게 인정). 행위능력: 대표기관이 행위. 불법행위능력(제35조): 대표기관이 직무에 관하여 타인에게 손해를 가하면 법인이 배상, 대표기관도 연대책임.", "p": "'직무에 관하여'는 ==외형상 직무행위로 보이면 족함==(외형이론), 상대방이 직무 아님을 알았거나 중과실이면 법인 책임 X. ==대표기관 아닌 피용자 행위는 제756조 사용자책임==. 목적 외 행위로 손해 시 관여 이사·사원이 연대책임.", "e": "법인은 사람이 아니니 실제 행동은 이사(대표기관)가 하고, 이사가 업무 중 남에게 손해를 끼치면 법인이 책임져요. '업무 중'인지는 겉으로 봐서 직무처럼 보이면 인정하되, 상대방이 이사의 개인 일탈임을 알았으면 법인은 책임 없어요.\n예시: 사단법인 이사장이 법인 명의로 보증서를 위조해 은행에서 대출 → 외형상 직무행위, 법인이 은행에 배상(이사장도 연대). 은행 직원이 위조를 알고도 대출해줬다면 → 법인 면책. 법인의 경리직원(대표기관 아님)이 회비를 횡령 → 제35조가 아닌 사용자책임(제756조)."}, {"t": "법인의 기관", "s": "이사: 필수기관, 대외 대표(각자대표 원칙)·대내 업무집행, 대표권 제한은 정관 기재 + 등기해야 제3자 대항(제60조, 선악 불문). 이사가 없거나 결원 시 임시이사, 이해상반 시 특별대리인. 감사: 임의기관. 사원총회: 사단법인 필수·최고기관(재단은 없음), 정관 변경·해산 등.", "p": "==대표권 제한은 등기 없으면 악의의 제3자에게도 대항 불가==(판례). ==이사의 대표권 남용==: 상대방이 알았거나 알 수 있었으면 무효(비진의표시 유추). 총회 결의는 ==사원 과반수 출석·과반 찬성==, 정관변경은 2/3.", "e": "이사는 법인의 손발이라 각자가 법인을 대표해요. '큰 계약은 이사회 승인 필요'처럼 대표권을 제한하려면 정관에 쓰고 등기까지 해야 제3자에게 주장할 수 있고, 등기 안 하면 상대가 알았더라도 못 막아요(회사법과 다른 점). 사원총회는 사단법인에만 있고 재단법인엔 없어요.\n예시: 정관에 '5억 이상 계약은 이사회 승인'이 있는데 등기 안 함. 이사가 승인 없이 10억 계약, 상대방이 정관 내용을 알았음 → 등기 없으므로 법인은 계약 무효 주장 불가. 등기했다면 상대방 선악 불문 대항 가능. 이사가 법인 돈으로 자기 빚을 갚으려 법인 명의 차용, 상대가 알 수 있었음 → 대표권 남용, 무효."}, {"t": "권리능력 없는 사단과 재단", "s": "사단의 실체(조직·대표·총회·규약)는 갖췄으나 법인 등기가 없는 단체(종중·교회·아파트 입주자대표회의 등). 재산은 사원의 총유(지분 없음, 처분은 총회 결의), 소송 당사자능력·부동산 등기능력 있음(단체 명의). 사단법인 규정 중 법인격 전제 규정 외에는 유추적용.", "p": "==총유물 처분·관리는 총회 결의== 없으면 무효(대표자 단독 처분 무효), 보존행위도 총회 결의 필요(판례). 채무는 ==단체 재산으로만 책임==, 사원 개인은 책임 없음. 교회 분열 시 재산 귀속: 2/3 이상 결의로 탈퇴 시 새 단체에 귀속 가능(2006 전합).", "e": "종중이나 교회처럼 조직은 있지만 법인 등기를 안 한 단체예요. 재산은 구성원 전체의 '총유'라서 개인 지분이 없고, 팔려면 총회 결의가 필요해요. 단체 이름으로 등기하고 소송도 할 수 있어요. 단체 빚에 회원 개인은 책임지지 않아요.\n예시: 종중 회장이 총회 없이 종중 땅을 매도 → 무효(매수인이 선의여도). 종중이 땅 소유권 소송 → 종중 명의로 원고 가능. 교회 교인 2/3 이상이 결의로 교단 탈퇴 → 교회 재산은 탈퇴 교회 소속(2/3 미만이면 잔류 교회에 귀속). 종중 채무 → 종중 재산으로만, 종원에게 청구 불가."}]}, {"name": "권리의 객체", "cards": [{"t": "물건과 부동산·동산", "s": "물건 = 유체물 및 전기 기타 관리할 수 있는 자연력. 부동산 = 토지와 그 정착물(건물은 토지와 별개 부동산, 수목은 원칙 토지 일부이나 명인방법·입목등기 시 독립), 그 외는 동산. 토지 소유권은 정당한 이익 범위 내 지상·지하에 미침.", "p": "==건물은 토지와 별개==, 미등기 건물도 독립 부동산. ==농작물은 경작자 소유==(정당한 권원 없어도, 판례). 명인방법 갖춘 수목·미분리 과실은 독립 거래 가능. 금전은 특수 동산(점유 = 소유).", "e": "땅과 건물은 우리 법에서 각각 별개의 부동산이에요(외국과 다름). 땅에 심은 나무는 원칙 땅의 일부지만, '이 나무는 내 것'이라고 표시(명인방법)하면 따로 팔 수 있어요. 농작물은 특이하게 남의 땅에 몰래 심어도 심은 사람 것이에요.\n예시: A 땅 위 B 건물 → 땅 매수인은 건물 소유권을 못 얻음(별개 부동산). 과수원 사과(미분리)를 '수확 전 판매'하며 팻말 설치 → 명인방법, 매수인 소유. C가 D 땅에 무단으로 배추를 심음 → 배추는 C 소유(D는 토지 인도·손배 청구만). 아직 등기 안 된 신축 건물 → 독립 부동산, 소유권 인정."}, {"t": "주물과 종물", "s": "종물은 주물의 상용에 이바지하기 위해 부속시킨 독립한 물건으로 소유자가 같아야 함. 종물은 주물의 처분에 따름(제100조 2항, 임의규정). 주된 권리와 종된 권리에도 유추(저당권 효력이 종물·종된 권리에 미침).", "p": "==종물은 독립한 물건==(주물의 구성부분은 종물 아님). ==소유자 동일== 요건: 타인 소유 물건은 종물 아님. 저당권 설정 후 부속된 종물에도 저당권 효력. 주물 처분 시 종물 제외 ==특약 가능==(임의규정). 건물 저당권은 ==대지 임차권·지상권==(종된 권리)에 미침.", "e": "주유소 건물을 팔면 주유기도 따라가고, 집을 팔면 그 집 전용 창고도 따라가요. 이렇게 '주된 물건을 위해 붙여둔 독립한 물건'이 종물인데, 소유자가 같아야 하고 특약으로 뺄 수도 있어요. 건물에 저당권을 잡으면 종물과 대지 이용권까지 효력이 미쳐요.\n예시: 주유소 건물 매매 → 주유기·저장탱크는 종물, 함께 이전(특약 없으면). 세입자가 자기 돈으로 설치한 에어컨 → 건물주 소유 아니므로 종물 X. 건물에 저당권 설정 후 건물주가 창고를 지음 → 저당권 효력이 창고에도 미침. 남의 땅을 빌려(임차권) 지은 건물의 저당권 실행 → 낙찰자는 임차권도 취득."}, {"t": "원물과 과실", "s": "천연과실(과일·가축 새끼·광물 등 자연적 산출물)은 원물에서 분리하는 때에 수취할 권리자에게 귀속. 법정과실(임대료·이자 등 사용 대가)은 수취할 권리의 존속기간 일수 비율로 취득. 과실수취권자: 소유자, 선의점유자, 지상권자, 전세권자, 임차인, 저당권자(압류 후) 등.", "p": "==천연과실은 분리 시점 기준==(원물 매도 후 수확 전 사과는 매수인이 수취권자). ==법정과실은 일수 비율== 안분. ==선의점유자는 과실 취득==(제201조), 악의점유자는 반환. 저당권은 ==압류 후 과실==에만 효력.", "e": "사과나무의 사과(천연과실)는 '따는 순간' 그때 권리 있는 사람 것이고, 월세(법정과실)는 날짜로 나눠 가져요. 소유자뿐 아니라 세입자, 선의로 점유한 사람도 과실을 가져갈 수 있고, 저당권은 경매 압류 후부터만 과실에 손을 뻗어요.\n예시: 과수원을 9월 1일 매도(소유권 이전), 10월 사과 수확 → 분리 시 소유자인 매수인 것. 임대 건물 매매, 월세 300만원(매월 1일~말일), 매매일 9월 21일 → 9월 월세는 20:10으로 나눠 매도인 200, 매수인 100. 저당권 설정된 건물의 월세 → 경매 압류 전까지는 소유자, 압류 후엔 저당권자 몫."}]}, {"name": "법률행위의 목적", "cards": [{"t": "법률행위의 요건과 목적", "s": "성립요건(당사자·목적·의사표시), 효력요건(능력, 목적의 확정·가능·적법·사회적 타당성, 의사와 표시 일치·하자 없음). 원시적 불능은 무효(계약체결상 과실책임), 후발적 불능은 유효하게 성립한 후 채무불이행·위험부담 문제. 강행규정 위반은 무효, 단속규정 위반은 유효(처벌만).", "p": "==원시적 전부불능 → 무효==, 후발적 불능 → 유효. ==강행규정(효력규정) vs 단속규정== 구별: 부동산 중개수수료 한도, 이자제한법 초과이자는 효력규정(초과분 무효), 무허가 음식점 영업계약은 단속규정(유효). 탈법행위도 무효.", "e": "계약이 효력을 가지려면 내용이 정해질 수 있고, 실현 가능하고, 법과 사회질서에 어긋나지 않아야 해요. 처음부터 불가능한 계약은 무효이지만 계약 후 불가능해진 건 유효하게 성립한 다음 손해배상 등의 문제가 돼요. 법을 어긴 계약도 '그 법이 효력까지 막는 법'인지 '처벌만 하는 법'인지에 따라 무효/유효가 갈려요.\n예시: 이미 불타 없어진 집을 매매 → 원시적 불능, 무효. 계약 후 화재 → 후발적 불능, 위험부담·손배 문제. 이자율 연 30% 약정 → 이자제한법(효력규정) 초과분 무효. 무허가 식당이 식자재 구입 계약 → 단속규정 위반이라 계약은 유효, 행정처벌만."}, {"t": "반사회질서 법률행위(제103조)", "s": "선량한 풍속 기타 사회질서에 위반한 사항을 내용으로 하는 법률행위는 무효. 유형: 정의관념 위반(범죄 대가·이중매매 적극 가담), 인륜 위반(첩 계약), 자유 심한 제한(과도한 경업금지), 생존 기초 재산 처분, 사행행위. 동기가 표시되거나 상대방이 알면 동기의 불법도 포함. 절대적 무효(추인 불가, 선의 3자에게도 무효).", "p": "==부동산 이중매매는 제2매수인이 배임행위에 적극 가담해야 무효==(단순 악의는 유효). 무효 시 ==제1매수인은 매도인을 대위해 제2매수인 명의 등기 말소== 청구. ==불법원인급여(제746조)==: 준 것을 돌려달라 못 함, 단 불법이 수익자에게만 있으면 반환 청구 가능. 변호사 아닌 자의 소송 성공보수, 도박채무 담보 제공 등.", "e": "내용이 사회 상식에 반하는 계약은 무효예요. 시험 단골은 이중매매: 집을 A에게 팔기로 하고 B에게 또 팔아 등기해줬을 때, B가 그 사정을 알고 적극적으로 부추겼으면 B와의 매매가 무효이고, A는 매도인의 권리를 대신 행사해서 B 등기를 말소시킬 수 있어요. 단순히 알기만 했으면 B가 유효하게 소유.\n예시: 매도인이 A와 계약 후 B에게 '더 줄 테니 팔라'는 B의 요구로 이중매매·등기 → B 적극 가담 → 무효, A는 매도인 대위로 B 등기 말소 후 자기 앞으로 이전. B가 A와의 계약을 그냥 알기만 한 경우 → 유효, A는 매도인에게 손해배상만. 도박 빚 담보로 준 집 → 반환 청구 불가(불법원인급여), 단 도박 채권자만 불법이면 반환 가능."}, {"t": "불공정한 법률행위(제104조)", "s": "당사자의 궁박·경솔·무경험을 이용하여 현저하게 공정을 잃은 법률행위는 무효. 요건: 객관적(급부 간 현저한 불균형) + 주관적(피해자의 궁박·경솔·무경험 중 하나 + 폭리자의 이용 의사). 무효 주장자가 모두 입증. 무상행위(증여)에는 적용 없음.", "p": "==궁박·경솔·무경험은 하나만 있으면 족함==, 대리인이 한 경우 궁박은 본인, 경솔·무경험은 대리인 기준. ==증여 등 무상행위·경매에는 적용 X==. 무효행위 전환(제138조)은 인정(적정 가격 매매로 유효 가능, 판례). 절대적 무효, 추인 불가.", "e": "상대가 급한 사정이나 무지를 이용해 터무니없이 싸게 사거나 비싸게 판 계약은 무효예요. 단 가격 차이만 크다고 안 되고, 상대의 약점을 '알고 이용'했어야 해요. 공짜로 주는 증여는 원래 불공정할 수가 없으니 적용 안 되고, 경매는 법원 절차라 제외.\n예시: 아들 수술비가 급한 사람(궁박)의 시가 10억 땅을 이를 안 상대가 2억에 매수 → 무효, 단 판례상 당사자가 '적정가면 팔았을 것'이라면 정당 가격 매매로 전환 가능. 시가 10억을 2억에 판 것뿐이고 매수인이 사정을 몰랐음 → 유효. 급한 사정으로 자기 땅을 헐값에 '증여' → 제104조 적용 없음(다른 사유로 다툼)."}]}, {"name": "의사표시", "cards": [{"t": "비진의표시와 통정허위표시", "s": "비진의표시(제107조): 진의 아님을 스스로 알고 한 표시는 유효, 상대방이 알았거나 알 수 있었으면 무효(선의 3자에게 대항 불가). 통정허위표시(제108조): 상대방과 짜고 한 거짓 표시는 무효, 선의의 제3자에게 대항 불가(제3자의 무과실 불요, 선의 추정). 은닉행위는 그 요건 갖추면 유효.", "p": "'진의'는 ==표의자가 진정으로 원한 것이 아니라 '그 표시를 하려는 생각'==(사직서를 내기 싫었어도 내기로 했으면 진의, 판례). 제108조 제3자: ==가장매매 목적물의 매수인·저당권자·가압류채권자·파산관재인== O, ==채권 가장양도 시 채무자==·상속인 X. 3자로부터의 전득자는 3자가 악의여도 선의면 보호.", "e": "속마음과 다른 말을 했을 때: 혼자 그런 거면(비진의) 상대가 몰랐으면 유효, 알았으면 무효. 상대와 짜고 한 거짓 계약(허위표시, 채권자 피하려는 가장매매)은 둘 사이엔 무효지만, 그걸 진짜로 믿고 거래한 제3자는 보호돼요. 사직서를 내라는 압박에 마지못해 낸 사직은 '내기로 마음먹고 낸 것'이라 진의예요.\n예시: 채권자를 피하려고 친구에게 집을 판 것처럼 등기(가장매매) → 둘 사이 무효, 집 돌려받을 수 있음. 그런데 친구가 이를 모르는 C에게 팔아 등기 → C 소유 확정(C의 과실 유무 불문). 회사 요구로 '재입사 약속'을 믿고 사직서 제출 → 사직 의사 있으니 유효(비진의 아님). 증여를 매매로 위장 → 매매는 무효, 증여(은닉행위)는 유효."}, {"t": "착오에 의한 의사표시", "s": "법률행위 내용의 중요부분에 착오가 있으면 취소 가능, 단 표의자에게 중대한 과실이 있으면 취소 불가(상대방이 착오를 알고 이용한 경우는 중과실 있어도 취소 가능). 동기의 착오는 동기가 표시되어 내용이 된 경우 또는 상대방이 유발한 경우 취소 가능. 취소해도 선의 3자에게 대항 불가.", "p": "==중요부분: 주관적(그 사람이면 안 했을 것) + 객관적(일반인도 안 했을 것)==. 중과실 입증은 상대방. ==착오 취소한 표의자는 상대방에게 손해배상책임 없음==(판례, 불법행위 아님). 매매 목적물의 시가 착오는 원칙 동기 착오. 계약서 오기(표시상 착오), 법률 착오(법률효과)도 착오.", "e": "잘못 알고 계약했을 때 취소할 수 있는 조건: '중요한 부분'이고, '내 큰 실수'가 아니어야 해요. 왜 사려 했는지(동기)를 잘못 안 건 원칙 취소 불가인데, 그 동기를 계약에 드러냈거나 상대가 잘못 알려줬으면 취소돼요. 취소해도 손해배상은 안 물어요.\n예시: 골동품을 진품으로 알고 산 경우, 매도인도 진품이라 설명 → 상대방 유발 동기 착오, 취소 가능. 그냥 '값이 오를 것 같아서' 샀는데 안 오름 → 동기, 취소 불가. 계약서에 100평을 1,000평으로 잘못 기재 → 표시상 착오, 취소. 공장 부지로 산 땅이 공장 건축 불가 지역, 매수 목적을 매도인에게 말함 → 표시된 동기, 취소 가능."}, {"t": "사기·강박에 의한 의사표시", "s": "사기(기망으로 착오 유발)·강박(해악 고지로 공포 유발)에 의한 의사표시는 취소 가능. 제3자의 사기·강박은 상대방이 알았거나 알 수 있었을 때만 취소. 취소는 선의의 제3자에게 대항 불가. 사기·강박은 불법행위이므로 손해배상 청구 가능(취소와 별개, 선택 가능).", "p": "==상대방의 대리인·이행보조자 사기는 '상대방 사기'==(제3자 아님). 강박이 극심해 ==의사결정 자유가 완전 박탈되면 무효==. 사기 취소와 손해배상 ==선택적 행사==, 취소 안 하고 손배만도 가능. 침묵도 고지의무 있으면 기망(아파트 앞 쓰레기장 건립 예정 등).", "e": "속아서(사기) 또는 협박당해서(강박) 한 계약은 취소할 수 있고, 손해배상도 따로 청구할 수 있어요. 계약 상대가 아닌 남이 속였다면 상대방이 그 사실을 알았을 때만 취소돼요. 중요한 사실을 알면서 말 안 한 것도 사기가 될 수 있어요.\n예시: 분양회사가 인근 쓰레기소각장 건립 계획을 알면서 숨김 → 침묵에 의한 기망, 분양계약 취소 또는 손배. 매도인의 중개인(대리인)이 거짓말 → 상대방 사기로 취소. 친구(제3자)가 속여서 은행 보증 → 은행이 몰랐으면 취소 불가. 사기로 산 땅을 취소 전에 모르는 사람에게 팔았으면 그 사람은 보호."}, {"t": "의사표시의 효력발생", "s": "상대방 있는 의사표시는 도달주의(상대방의 지배권 내에 들어가 알 수 있는 상태). 발신 후 표의자 사망·능력 상실해도 효력 유지. 상대방이 제한능력자면 그 법정대리인이 도달을 안 후에야 대항 가능(단 제한능력자가 도달을 알면 대항 가능). 소재 불명 시 공시송달. 격지자 간 계약 승낙은 발신주의(제531조).", "p": "==도달 = 요지 가능 상태==(등기우편 반송·수취 거절도 도달 인정 가능, 판례). ==발신 후 사망해도 유효==. 예외적 발신주의: 격지자 승낙, 최고에 대한 확답, 사원총회 소집통지 등. 도달 전 철회 가능, 도달 후 철회 불가.", "e": "편지로 계약 해제를 통지하면 '보낸 때'가 아니라 '상대방이 받아볼 수 있는 상태가 된 때'부터 효력이에요. 상대가 일부러 안 받아도 도달로 봐요. 보낸 뒤 내가 죽어도 통지는 유효하고, 상대에게 닿기 전이면 취소할 수 있어요. 계약 승낙은 예외로 보낸 때 효력.\n예시: 해제 통지서를 우편 발송 → 상대방 우편함에 들어간 때 도달(읽지 않았어도). 상대방이 수취 거절 → 도달 인정. 통지 발송 후 표의자 사망 → 해제 유효. 상대방이 미성년자, 부모가 모르고 미성년자만 봄 → 원칙 대항 불가(미성년자가 도달 안 것을 알면 가능). 이메일 → 서버 수신 시 도달."}]}, {"name": "대리", "cards": [{"t": "대리권의 범위와 제한", "s": "수권행위(임의대리)나 법률(법정대리)로 발생. 범위 불분명 시 보존행위, 성질 변하지 않는 범위의 이용·개량행위만(제118조). 자기계약·쌍방대리 금지(본인 허락·채무이행은 예외). 공동대리는 공동으로. 대리권 소멸: 본인 사망, 대리인 사망·성년후견개시·파산, 임의대리는 수권 원인관계 종료·철회.", "p": "==매매 대리권은 대금 수령 권한 포함==, 계약 해제·연기 권한은 원칙 불포함(판례). ==자기계약·쌍방대리 위반은 무권대리==(무효 아님, 추인 가능). 본인 사망 시 대리권 소멸하나 ==상대방 선의·무과실이면 대리행위 유효==(제129조 아닌 제127조 해석 논점, 다수설).", "e": "대리인은 본인이 맡긴 범위 안에서만 대신할 수 있어요. 범위가 애매하면 재산을 지키고(보존) 활용하는(이용·개량) 정도만 가능하고 팔거나 담보 잡는 건 안 돼요. 대리인이 자기와 계약하거나 양쪽을 다 대리하면 이해가 충돌하니 원칙 금지예요.\n예시: '집을 팔아달라'는 대리권 → 매매계약·대금 수령 가능, 계약 후 해제는 별도 수권 필요. '재산 관리'만 위임받은 대리인이 본인 땅을 팔면 → 범위 초과, 무권대리. 대리인이 본인 집을 자기가 삼 → 자기계약, 본인이 추인하지 않으면 효력 없음(본인이 미리 허락했으면 유효). 빚 갚는 것(채무이행)은 쌍방대리 가능."}, {"t": "대리행위의 방식과 하자", "s": "대리인은 본인을 위한 것임을 표시(현명)해야 하고, 현명 없으면 대리인 자신을 위한 것으로 봄(상대방이 알았거나 알 수 있었으면 본인에게 효력). 의사표시의 하자(착오·사기·강박)와 선의·악의는 대리인 기준으로 판단(본인이 특정 행위를 지시했으면 본인이 아는 사정을 대리인이 몰랐다고 주장 불가). 대리인은 행위능력자 아니어도 됨.", "p": "==대리인은 제한능력자여도 가능==(본인이 취소 불가). 착오·사기 여부는 ==대리인 기준==, 취소권은 ==본인==에게 귀속. 상행위에서는 현명 없어도 본인에게 효력(상법 제48조). 본인의 이름을 직접 쓰는 서명대리도 현명으로 인정.", "e": "대리인은 '누구를 대신해서' 한다는 걸 밝혀야 하고, 안 밝히면 대리인 본인의 계약이 돼요. 대리인이 속았거나 착오했는지는 대리인을 기준으로 보고, 그 결과 생긴 취소권은 본인이 가져요. 미성년자도 대리인이 될 수 있어요(효과가 본인에게 가니까).\n예시: 대리인 B가 'A 대리인 B'라고 밝히고 계약 → A에게 효력. 그냥 'B'로 서명 → B 자신의 계약(상대가 A를 위한 것임을 알았으면 A). B가 상대방에게 속아 A 땅을 헐값에 매도 → 사기 여부는 B 기준, 취소권은 A. A가 '저 땅은 하자 있어도 사라'고 지시했다면 A는 B의 선의를 주장 못 함."}, {"t": "표현대리", "s": "대리권 없지만 외관을 믿은 상대방 보호. ① 대리권 수여 표시(제125조): 본인이 대리권 줬다고 표시 ② 권한 초과(제126조): 기본대리권 + 상대방의 정당한 이유(선의·무과실) ③ 대리권 소멸 후(제129조): 상대방 선의·무과실. 효과: 본인에게 유효, 단 상대방만 주장 가능(본인이 표현대리 주장 불가), 무권대리 규정도 병행 적용.", "p": "제126조 기본대리권: ==법정대리권·복대리권·다른 종류 대리권·공법상 대리권(등기신청)도 가능==, 단 ==사실행위 위임(인감 보관)==만으로는 X. 정당한 이유 판단은 ==대리행위 당시== 기준. ==표현대리 성립해도 상대방은 무권대리로 취급해 철회 가능==. 강행법규 위반 행위엔 표현대리 적용 X.", "e": "대리권이 없는데도 '있는 것처럼 보이게 한 책임'이 본인에게 있으면, 그걸 믿은 상대방을 보호해서 본인에게 효력을 인정해요. 가장 자주 나오는 게 권한 초과(126조): 뭔가 대리권은 있었는데 그 이상을 한 경우, 상대방이 믿을 만한 정당한 이유가 있으면 본인이 책임져요.\n예시: A가 B에게 '전세 계약' 대리권을 주며 인감·등기권리증을 맡김, B가 집을 매도 → 기본대리권(전세) + 서류 보유로 상대방 정당한 이유 → 126조 표현대리, A에게 유효. A가 B에게 인감도장만 보관시켰는데 B가 매도 → 사실행위 위임뿐이라 기본대리권 X. 대리권 해지 후 B가 이를 모르는 거래처와 계약 → 129조. 상대방이 표현대리 대신 '무권대리니 철회'를 택할 수도 있음."}, {"t": "무권대리", "s": "대리권 없는 자의 대리행위는 본인이 추인하지 않으면 본인에게 효력 없음(유동적 무효). 본인: 추인권(소급효, 상대방·무권대리인에게), 추인거절권. 상대방: 최고권(상당 기간, 무응답 시 거절 간주), 철회권(선의, 추인 전). 무권대리인은 상대방 선택에 따라 이행 또는 손해배상 책임(무과실책임, 제135조), 단 상대방이 악의·과실이거나 대리인이 제한능력자면 면책.", "p": "==추인은 상대방에게 해야 대항==(무권대리인에게 한 추인은 상대방이 알기 전까지 대항 불가). ==최고는 악의 상대방도 가능==, 철회는 선의만. ==무권대리인이 본인을 단독 상속하면 추인 거절 못 함==(신의칙, 판례). 본인이 무권대리인을 상속하면 추인 거절 가능(다수설). 일부 추인·조건부 추인은 상대방 동의 필요.", "e": "권한 없이 남을 대리한 계약은 본인이 '인정'(추인)하면 처음부터 유효, 거절하면 무효예요. 그 사이 상대방은 '인정할 거냐' 물을 수 있고(최고), 몰랐다면 계약을 물릴 수 있어요(철회). 본인이 거절하면 무권대리인이 상대방에게 계약 이행이나 손해배상을 해야 하고 과실이 없어도 책임져요.\n예시: 아들이 아버지 몰래 아버지 땅을 C에게 매도 → 아버지가 추인하면 유효, 거절하면 아들이 C에게 손해배상(또는 다른 방법으로 이행). C가 아버지에게 '2주 내 답하라' 최고, 무응답 → 거절 간주. 아버지가 사망해 아들이 단독상속 → 아들은 이제 본인 지위이나 자기가 한 무권대리를 거절 못 함(C에게 이전등기 해줘야). C가 아들에게 대리권 없음을 알고 계약했다면 → 아들 책임 면제."}]}, {"name": "무효·취소·조건·기한·소멸시효", "cards": [{"t": "무효와 취소의 비교", "s": "무효: 처음부터 효력 없음, 누구나 주장, 기간 제한 없음, 추인해도 소급효 없음(새 행위로 간주, 당사자가 무효 알고 추인). 취소: 취소권자(제한능력자·착오·사기·강박 표의자, 대리인, 승계인)가 취소해야 소급 무효, 취소 전까지 유효, 3년/10년 제척기간. 취소권자가 추인하면 확정 유효(취소 원인 종료 후). 법정추인 사유(이행·이행청구·경개·담보제공·양도·강제집행).", "p": "==무효행위 추인은 소급 X==(단 당사자 약정으로 소급 가능, 3자 해치지 않는 범위). ==취소 후에도 무효행위 추인 가능==(판례). 법정추인 중 ==이행청구는 취소권자가 청구한 경우만==(상대방 청구 받은 것 X). ==일부무효는 전부무효 원칙==(나머지만으로도 했을 것이면 일부 유효). 제한능력자의 반환은 현존이익만.", "e": "무효는 아예 처음부터 없는 것, 취소는 '취소한다'고 해야 없어지는 것이에요. 무효는 누구나 언제든 주장하지만 추인해도 과거로 살아나지 않고, 취소는 정해진 사람만 3년 안에 해야 하고 취소하면 처음부터 무효가 돼요. 취소할 수 있는데 이행하거나 담보를 주면 추인한 것으로 봐요(법정추인).\n예시: 미성년자 계약(취소 가능) → 성년 후 대금 지급 → 법정추인, 이제 취소 불가. 사기당한 걸 안 지 3년 지남 → 취소 불가. 반사회질서 계약(무효)을 나중에 추인 → 여전히 무효(103조는 추인 자체 불가). 허위표시 매매(무효)를 당사자가 알고 추인 → 그때부터 새 매매로 유효. 미성년자가 받은 돈 100만원 중 50만원 유흥에 씀 → 현존이익 50만원만 반환(생활비 사용은 현존 인정)."}, {"t": "조건과 기한", "s": "조건: 장래 불확실한 사실에 효력 의존(정지조건 → 성취 시 효력 발생, 해제조건 → 성취 시 소멸). 조건부 권리는 침해 금지·처분·상속·담보 가능. 조건 성취를 신의칙에 반해 방해하면 성취 간주, 부정하게 성취시키면 불성취 간주. 기성조건·불능조건·불법조건 규칙. 기한: 장래 확실한 사실, 기한의 이익은 채무자에게 있는 것으로 추정, 포기 가능(상대방 이익 해치지 못함), 상실 사유(담보 손상·제공 불이행·파산).", "p": "==정지조건 성취 여부 입증은 권리 주장자==, 해제조건은 소멸 주장자. 불법조건은 ==법률행위 전부 무효==. 기성조건: 정지조건이면 무조건, 해제조건이면 무효. 불능조건: 정지조건이면 무효, 해제조건이면 무조건. ==조건·기한에 친하지 않은 행위==: 혼인·입양·상계·취소·해제 등 단독행위(상대방 동의 시 가능).", "e": "'시험에 붙으면 차를 사준다'는 조건(불확실), '내년 1월 1일에 사준다'는 기한(확실). 정지조건은 이뤄지면 효력 시작, 해제조건은 이뤄지면 효력 끝. 상대가 조건 성취를 일부러 막으면 이뤄진 것으로 봐요. 기한은 채무자에게 유리한 것으로 보고 채무자가 포기할 수 있어요.\n예시: '합격하면 1억 증여'(정지조건) → 합격 시 효력, 합격 입증은 수증자. 아버지가 시험 응시를 방해 → 성취 간주. '올해 안에 태양이 서쪽에서 뜨면'(불능 정지조건) → 무효. '이미 합격한 사실을 조건으로'(기성 정지조건) → 조건 없는 증여. 대출 만기 전 채무자가 담보 건물을 훼손 → 기한이익 상실, 즉시 변제 청구 가능."}, {"t": "소멸시효의 요건과 기간", "s": "권리를 행사할 수 있는 때부터 진행(이행기 도래, 정지조건 성취, 부작위채권은 위반 시). 기간: 일반 채권·판결 확정 채권 10년, 상사채권 5년, 3년(이자·부양료·급료·사용료 등 1년 이내 정기급부, 의사·변호사 채권, 도급공사 채권, 생산자·상인의 상품대가), 1년(여관·음식·입장료, 의복·침구 사용료, 노역인 임금, 학생 교육비). 소유권은 시효 X, 채권 아닌 재산권 20년.", "p": "==판결로 확정된 채권은 단기시효라도 10년==. ==부동산 매수인이 인도·사용 중이면 등기청구권 시효 진행 X==(판례). 채권자가 권리 존재를 몰랐어도 진행(법률상 장애만 고려). ==정기급부 3년==: 월세·이자·연금. 시효는 법원이 직권 판단 X, 당사자 원용 필요.", "e": "권리를 오래 안 쓰면 사라져요. 기간은 원칙 10년이지만 자주 생기는 생활채권은 3년·1년으로 짧아요. 시작점은 '받을 수 있게 된 때'(만기)이고, 권리자가 그 존재를 몰랐어도 흘러가요. 단 판결로 확정되면 무조건 10년으로 늘어나요.\n예시: 친구에게 2016.3.1 만기로 빌려준 돈 → 2026.3.1 시효 완성. 월세 미납분 → 3년. 식당 외상값 → 1년. 병원 진료비 → 3년. 외상값 1년 시효 전에 소송해서 판결 확정 → 그때부터 10년. 땅을 사서 등기 없이 20년 살고 있음 → 등기청구권 시효 안 걸림. 시효 완성 후에도 채무자가 주장 안 하면 법원은 알아서 고려 안 함."}, {"t": "소멸시효의 중단·정지·완성 효과", "s": "중단 사유: 청구(재판상 청구·지급명령·파산신청·최고 — 최고는 6개월 내 재판상 청구 등 해야 효력), 압류·가압류·가처분, 승인. 중단 시 그때까지 경과한 기간은 무효, 중단 사유 종료 시 새로 진행. 정지: 완성 직전 장애(제한능력자에게 법정대리인 없음, 부부간, 상속재산, 천재)로 일정 기간 완성 유예. 완성 효과: 기산일에 소급 소멸(절대적 소멸설·판례), 시효이익 포기는 완성 후에만 가능(완성 전 포기 무효), 포기 후 다시 진행.", "p": "==최고만으로는 중단 X==, 6개월 내 재판상 청구 필요. ==일부 청구 소송은 일부만 중단==(전부 청구 취지 명시 시 전부). 소 각하·취하 시 중단 효력 없음(6개월 내 재청구 시 최초 소 제기 시 중단). ==승인은 채무자가 채권 존재를 인정==(이자 지급·일부 변제·기한 유예 요청). 시효 완성 후 일부 변제·변제 약속은 ==시효이익 포기==로 봄(판례). 시효 완성 채무를 모르고 변제한 것은 반환 청구 불가.", "e": "시효는 채권자가 소송·압류하거나 채무자가 '빚 있는 거 맞다'고 인정(승인)하면 처음부터 다시 세요(중단). 그냥 독촉장(최고)만 보내면 6개월 안에 소송을 해야 효과가 있어요. 시효가 다 됐는데 채무자가 일부라도 갚거나 갚겠다고 하면 시효 이익을 포기한 걸로 봐요. 미리 '시효 주장 안 하겠다'는 약속은 무효.\n예시: 2025.12 만기 채권 10년 시효, 2030년 채무자가 이자 100만원 지급 → 승인, 2030년부터 다시 10년. 2035.11 내용증명(최고) 발송 후 2036.4 소 제기(6개월 내) → 2035.11 중단. 소 제기 후 취하 → 중단 없던 것, 단 6개월 내 다시 제소하면 유지. 시효 완성 후 채무자가 '다음 달에 갚겠다' → 포기, 다시 10년 진행. 대출계약서에 '시효 주장 포기' 조항 → 무효."}]}]};

})();

/* ===================== 키워드 색인 ===================== */
const TERMS={};
(function(){
  const add=(term,ref)=>{term=term.trim(); if(term.length<3) return; (TERMS[term]||(TERMS[term]=[])).push(ref);};
  DATA.forEach(s=>s.chapters.forEach((ch,ci)=>ch.cards.forEach((card,i)=>{
    const ref={sid:s.id,ci,i};
    add(card.t,ref);
    card.t.replace(/\([^)]*\)/g,"").split(/·| vs |과 |와 |의 /).forEach(part=>{ if(part!==card.t) add(part,ref); });
  })));
})();
const TERM_LIST=Object.keys(TERMS).sort((a,b)=>b.length-a.length);
const TERM_RE=new RegExp(TERM_LIST.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
const refKey=r=>`${r.sid}-${r.ci}-${r.i}`;
function linkify(html,selfId){
  if(!TERM_LIST.length) return html;
  const sid=(selfId||"").split("-")[0];
  return html.replace(TERM_RE,m=>{const rs=TERMS[m]; if(!rs) return m; const r=rs.find(x=>x.sid===sid)||rs[0]; if(refKey(r)===selfId) return m; return `<a class="kw" data-ref="${refKey(r)}">${m}</a>`;});
}
const cardHTML=(card,selfId)=>({s:linkify(esc(card.s),selfId),p:linkify(hl(card.p),selfId)});
function findCard(key){const [sid,ci,i]=key.split("-");const s=DATA.find(d=>d.id===sid);return {sub:s,ci:+ci,i:+i,card:s.chapters[+ci].cards[+i],chName:s.chapters[+ci].name};}

/* 모든 단어를 탭 가능하게 */
const SEP=/([\s·,.()\/:;~—\-"'“”‘’…?!+=×÷−<>→←↑↓%]+)/;
const PARTICLES=/(으로부터|에서는|에서도|에서|으로|로는|로서|로도|처럼|까지|부터|이나|이며|이고|이면|이란|에게|에는|에도|보다|마다|조차|밖에|은|는|이|가|을|를|의|에|과|와|도|만|로|면|서|나|며)$/;
function stripParticle(w){ if(w.length<=2) return w; const s=w.replace(PARTICLES,""); return s.length>=2?s:w; }
function wrapWords(root){
  if(!root) return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(n.parentElement.closest(".kw,.ask,button,textarea,.w,.easy")) return NodeFilter.FILTER_REJECT;
    return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const nodes=[];while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment();
    n.nodeValue.split(SEP).forEach((tok,k)=>{
      if(k%2===1||tok.length<2){ if(tok) frag.appendChild(document.createTextNode(tok)); return; }
      const sp=document.createElement("span");sp.className="w";sp.textContent=tok;frag.appendChild(sp);
    });
    n.parentNode.replaceChild(frag,n);
  });
}
document.addEventListener("click",e=>{
  if(e.target.closest(".sheet")) return;
  const kw=e.target.closest(".kw"); if(kw){e.preventDefault();openCardSheet(kw.dataset.ref);return;}
  const w=e.target.closest(".w"); if(w){openTermSheet(stripParticle(w.textContent.trim()));}
});

const KEY="semusa-1cha-progress";
let state={learned:{},again:{},pos:{},quiz:{},days:{},plan:null}; // days[YYYY-MM-DD]={n,r,q,done}
const GOAL={n:10,r:5};
const todayKey=(d=new Date())=>{const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;};
function dayRec(){const k=todayKey();state.days=state.days||{};return state.days[k]||(state.days[k]={n:0,r:0,q:null,done:false});}
function dayStatus(){
  const d=dayRec(); const againCnt=Object.keys(state.again).length;
  const rGoal=Math.min(GOAL.r,againCnt+d.r);
  const s={n:d.n>=GOAL.n,r:d.r>=rGoal,q:d.q!==null,rGoal};
  s.all=s.n&&s.r&&s.q; if(s.all&&!d.done) d.done=true; return s;
}
function streak(){
  const days=state.days||{}; let n=0; const d=new Date();
  if(!(days[todayKey(d)]||{}).done) d.setDate(d.getDate()-1);
  while((days[todayKey(d)]||{}).done){n++;d.setDate(d.getDate()-1);}
  return n;
}
function bump(field,val){const d=dayRec(); if(field==="q") d.q=Math.max(d.q||0,val); else d[field]++; dayStatus();}
function nextUnlearned(){
  const order=[view.subj,...DATA.map(d=>d.id).filter(x=>x!==view.subj)];
  for(const sid of order){const s=DATA.find(d=>d.id===sid);
    for(let ci=0;ci<s.chapters.length;ci++)for(let i=0;i<s.chapters[ci].cards.length;i++) if(!state.learned[cid(sid,ci,i)]) return {sid,ci,i};}
  return null;
}

/* ===================== 테스트 문제 생성 ===================== */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const firstMark=p=>{const m=p.match(/==(.+?)==/);return m?m[1]:null;};
function makeQuiz(sub,chIdxs,n){
  const pool=[];
  chIdxs.forEach(ci=>sub.chapters[ci].cards.forEach((card,i)=>pool.push({ci,i,card})));
  const allCards=[];sub.chapters.forEach((ch,ci)=>ch.cards.forEach((card,i)=>allCards.push({ci,i,card})));
  const picked=shuffle(pool).slice(0,n||pool.length);
  return picked.map(item=>{
    const {ci,i,card}=item;
    const mark=firstMark(card.p);
    // 같은 챕터 우선, 부족하면 같은 과목에서 오답 보기 추출
    const others=key=>{
      const same=shuffle(allCards.filter(o=>o.ci===ci&&!(o.i===i)).map(key).filter(v=>v&&v!==key(item)));
      const rest=shuffle(allCards.filter(o=>o.ci!==ci).map(key).filter(v=>v&&v!==key(item)));
      const seen=new Set([key(item)]);const out=[];
      for(const v of same.concat(rest)){if(!seen.has(v)){seen.add(v);out.push(v);}if(out.length===3)break;}
      return out;
    };
    if(mark&&Math.random()<0.5){
      const ans=mark;
      const ch=others(o=>firstMark(o.card.p));
      const body=card.p.replace(/==(.+?)==/,"\u0000").replace(/==(.+?)==/g,"$1");
      return {type:"blank",ci,i,card,body,answer:ans,choices:shuffle([ans,...ch])};
    }
    const ans=card.t;const ch=others(o=>o.card.t);
    return {type:"concept",ci,i,card,body:card.s,answer:ans,choices:shuffle([ans,...ch])};
  });
}

}
function attachAsk(container,id,sub,chName,card){
  const box=document.createElement("div");box.className="ask";
  box.innerHTML=`<div class="chips">${CHIPS.map(c=>`<button class="chip" type="button">${c}</button>`).join("")}</div>
   <div class="in"><textarea rows="1" placeholder="${getKey()?"이해 안 되는 부분을 물어보세요":"질문하면 Claude 앱으로 넘어가요"}"></textarea><button class="send" type="button">${getKey()?"질문":"Claude"}</button></div>
   <div class="log"></div>`;
  container.appendChild(box);
  const ta=box.querySelector("textarea"),send=box.querySelector(".send"),log=box.querySelector(".log");
  const hist=askHist[id]||(askHist[id]=[]);
  const draw=()=>{log.innerHTML=hist.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}${m.err?" err":""}${m.wait?" wait":""}">${esc(m.content)}</div>`).join("");};
  draw();
  ta.oninput=()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,120)+"px";};
  const go=async(text)=>{
    text=(text||ta.value).trim(); if(!text||send.disabled) return;
    if(!getKey()){ window.open(claudeLink(`${ctxLine({sub,chName,card})}\n기출 포인트: ${card.p.replace(/==/g,"")}\n\n질문: ${text}`),"_blank"); return; }
    ta.value="";ta.style.height="auto";
    hist.push({role:"user",content:text});
    const waiting={role:"assistant",content:"생각 중…",wait:true}; hist.push(waiting); draw(); send.disabled=true;
    try{
      const msgs=hist.filter(m=>!m.wait&&!m.err).map(m=>({role:m.role,content:m.content}));
      const text=await claude(askSystem(sub,chName,card),msgs);
      hist.pop(); hist.push(text?{role:"assistant",content:text}:{role:"assistant",content:"답변을 받지 못했어요. 다시 시도해 주세요.",err:true});
    }catch(e){ hist.pop(); hist.push({role:"assistant",content:e.message==="NOKEY"?NOKEY_MSG:"연결에 실패했어요. API 키와 네트워크를 확인해 주세요.",err:true}); }
    send.disabled=false; draw();
    const last=log.lastElementChild; if(last) last.scrollIntoView({block:"end",behavior:"smooth"});
  };
  send.onclick=()=>go();
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();go();}};
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>go(c.textContent));
}

  catch(e){ storageOK=false; if(mem) state=mem; }

const KEYKEY="semusa-api-key";
const getKey=()=>{try{return LS.getItem(KEYKEY)||"";}catch(e){return "";}};
const setKey=k=>{try{ if(k) LS.setItem(KEYKEY,k.trim()); else LS.removeItem(KEYKEY);}catch(e){}};
async function claude(system,messages){
  const key=getKey(); if(!key) throw new Error("NOKEY");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system,messages})});
  const d=await r.json();
  if(d.error) throw new Error(d.error.message||"API error");
  return (d.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n").trim();
}

function exportCode(){
  const o={l:Object.keys(state.learned),a:Object.keys(state.again),q:state.quiz||{},p:state.pos||{},d:state.days||{},pl:state.plan||null};
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,"");

function importCode(code){
  const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));

  (o.l||[]).forEach(k=>s.learned[k]=1);(o.a||[]).forEach(k=>s.again[k]=1);

}

  }

  return {sub,ci:view.ch,i:view.idx,card:ch.cards[view.idx],n:view.idx+1,tot:ch.cards.length,name:ch.name,chName:ch.name};

function startQuiz(sub,chIdxs,n){
  const qs=makeQuiz(sub,chIdxs,n);
  const key=chIdxs.length===1?sub.id+"-"+chIdxs[0]:null;
  const label=chIdxs.length===1?sub.chapters[chIdxs[0]].name:sub.name+" 랜덤";
  quiz={sub,label,key,qs,idx:0,answers:[],chosen:null};
  view.screen="quiz";render();
}
function renderQuiz(){
  const q=quiz.qs[quiz.idx]; const n=quiz.idx+1,tot=quiz.qs.length;
  const chosen=quiz.chosen; const qh=cardHTML(q.card,cid(quiz.sub.id,q.ci,q.i)); sheetCtx={sub:quiz.sub,chName:quiz.sub.chapters[q.ci].name,card:q.card};
  const body=q.type==="blank"
    ?esc(q.body).replace("\u0000",`<span class="blank" aria-label="빈칸"></span>`)
    :esc(q.body);
  app.innerHTML=`
   <div class="study">
    <div class="crumb"><button data-act="quit">‹ 그만두기</button><span class="where">${n} / ${tot}</span></div>
    <div class="prog"><i style="width:${n/tot*100}%"></i></div>
    <div class="q">
      <div class="kind">${esc(quiz.label)} — ${q.type==="blank"?"빈칸에 들어갈 내용은?":"다음 설명에 해당하는 개념은?"}</div>
      <div class="body">${body}</div>
      <div class="opts">${q.choices.map((c,k)=>{
        let cls="";
        if(chosen!==null){ if(c===q.answer) cls=" right"; else if(c===chosen) cls=" wrong"; }
        return `<button class="opt${cls}" data-opt="${k}" ${chosen!==null?"disabled":""}><span class="k">${k+1}</span><span>${esc(c)}</span></button>`;
      }).join("")}</div>
      ${chosen!==null?`<div class="expl">
        <div class="verdict ${chosen===q.answer?"ok":"no"}">${chosen===q.answer?"정답":"오답 — 다시 볼 카드에 추가됨"}</div>
        <b>${esc(q.card.t)}</b>${qh.s}<br>${qh.p}${easyHTML(cid(quiz.sub.id,q.ci,q.i),chosen!==q.answer)}<div class="askhost"></div></div>`:""}
    </div>
    <div class="acts"><button class="single" data-act="next" ${chosen===null?"disabled":""}>${chosen===null?"보기를 고르세요":n<tot?"다음 문제 ›":"결과 보기"}</button></div>
   </div>`;
  if(chosen!==null){ wrapWords(app.querySelector(".expl")); bindEasy(app); attachAsk(app.querySelector(".askhost"),cid(quiz.sub.id,q.ci,q.i),quiz.sub,quiz.sub.chapters[q.ci].name,q.card); }
  app.querySelector('[data-act="quit"]').onclick=()=>{quiz=null;view.screen="list";render();};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{
    const c=q.choices[+b.dataset.opt]; const ok=c===q.answer;
    quiz.chosen=c; quiz.answers.push({q,chosen:c,ok});
    if(!ok){ const id=cid(quiz.sub.id,q.ci,q.i); state.again[id]=1; delete state.learned[id]; await save(); }
    render();
  });
  app.querySelector('[data-act="next"]').onclick=()=>{
    if(quiz.idx<tot-1){quiz.idx++;quiz.chosen=null;render();}
    else finishQuiz();
  };
}
async function finishQuiz(){
  const right=quiz.answers.filter(a=>a.ok).length; const tot=quiz.qs.length;
  const pct=Math.round(right/tot*100);
  bump("q",pct);
  if(quiz.key){ const prev=state.quiz[quiz.key]||{best:0}; state.quiz[quiz.key]={best:Math.max(prev.best,pct),last:pct}; }
  await save();
  quiz.result={right,tot,pct};
  view.screen="quizresult";render();
}
function renderQuizResult(){
  const {right,tot,pct}=quiz.result; const wrongs=quiz.answers.filter(a=>!a.ok);
  const msg=pct===100?"완벽해요. 다음 챕터로 넘어가도 됩니다.":pct>=80?"잘 잡혀 있어요. 틀린 것만 다시 보면 됩니다.":pct>=60?"핵심은 알지만 디테일이 흔들려요. 틀린 카드를 오늘 한 번 더 보세요.":"이 챕터는 카드부터 다시 한 번 돌리는 게 좋겠어요.";
  app.innerHTML=`
   <div class="score"><div class="big">${pct}<small>%</small></div><p>${esc(quiz.label)} · ${right}/${tot} 정답</p><p>${msg}</p></div>
   <div class="wrongs">
    ${wrongs.length?`<h4>틀린 문제 ${wrongs.length}개 — 다시 볼 카드에 넣어뒀어요</h4>`+wrongs.map(a=>`<div class="w"><b>${esc(a.q.card.t)}</b><span>내 답: ${esc(a.chosen)}</span><br>${hl(a.q.card.p)}</div>`).join(""):""}
   </div>
   <div class="end" style="padding-top:0">
    <button data-act="retry">다시 풀기</button>
    ${wrongs.length?`<button class="ghost" data-act="review">틀린 카드 복습</button>`:""}
    <button class="ghost" data-act="back">챕터 목록</button>
   </div>`;
  app.querySelector('[data-act="retry"]').onclick=()=>{const chs=[...new Set(quiz.qs.map(q=>q.ci))];const n=quiz.key?null:10;startQuiz(quiz.sub,quiz.key?[quiz.qs[0].ci]:quiz.sub.chapters.map((_,i)=>i),n);};
  const rv=app.querySelector('[data-act="review"]'); if(rv) rv.onclick=()=>{view.subj=quiz.sub.id;view.review=true;view.rIdx=0;view.screen="card";quiz=null;render();};
  app.querySelector('[data-act="back"]').onclick=()=>{quiz=null;view.screen="list";render();};
}

function render(){
  if(view.screen==="list"&&view.from==="plan"){view.from=null;view.screen="plan";}
  if(view.screen==="list") renderList();
  else if(view.screen==="plan") renderPlan();
  else if(view.screen==="card") renderCard();
  else if(view.screen==="quiz") renderQuiz();
  else if(view.screen==="quizresult") renderQuizResult();
  else renderEnd();
  window.scrollTo(0,0);
}

function taskStatus(dk,t,tk){
  const P0=PL();
  if(t.info) return null;
  if(P0.since&&dk<P0.since) return null;
  if(P0.busy&&P0.busy[dk]&&!t.core) return null;
  if(t.auto){
    if(dk===tk){const st=dayStatus(); if(t.auto==="r") return st.rGoal?st.r:null; return st[t.auto];}
    const d=(state.days||{})[dk];
    if(t.auto==="n") return !!(d&&d.n>=GOAL.n);
    if(t.auto==="q") return !!(d&&d.q!==null&&d.q!==undefined);
    return d&&(d.r>0||d.done)?true:null;
  }
  return !!(P0.done&&P0.done[dk+"|"+t.key]);
}
function weekProgress(wn){
  const tk=todayKey(); let tot=0,done=0;
  for(let i=0;i<7;i++){
    const d=weekStart(wn); d.setDate(d.getDate()+i); const dk=todayKey(d); if(dk>tk) continue;
    tasksFor(d).tasks.forEach(t=>{const s=taskStatus(dk,t,tk); if(s===null) return; tot++; if(s) done++;});
  }
  return {tot,done,pct:tot?Math.round(done/tot*100):null};
}

function runAct(a){
  if(!a) return;

  if(a.t==="try"){openTrySheet();return;}
  if(a.t==="cards"){
    if(!a.sid||!a.chs||!a.chs.length){const nx=nextUnlearned(); if(nx) openCardsAt(nx.sid,nx.ci,nx.i); return;}
    const s=DATA.find(d=>d.id===a.sid); let found=null;

  if(a.t==="quiz"){const s=DATA.find(d=>d.id===a.sid); if(!s) return; view.from="plan"; startQuiz(s,a.chs&&a.chs.length?a.chs:s.chapters.map((_,i)=>i),a.n||null); return;}

}
function openTrySheet(){
  const sh=openSheet(`<div class="from">선택과목 맛보기</div><h4>세 과목을 1챕터씩</h4><div class="s" style="font-size:14px">각 과목 첫 챕터 카드를 보고, 이해가 잘 되고 테스트 점수가 잘 나오는 과목으로 정하세요.</div>
   <div class="row" style="flex-direction:column"><button data-s="cl">상법(회사편) 시작</button><button data-s="cv">민법총칙 시작</button><button data-s="al">행정소송법 시작</button></div>`);
  sh.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{closeSheet();runAct({t:"cards",sid:b.dataset.s,chs:[0]});});
}
function openPlanSettings(){
  const P0=PL();
  const sh=openSheet(`<div class="from">학습 계획</div><h4>시험일 · 선택과목</h4>
   <div class="s" style="font-size:14px">시험일이 공고되면 날짜를 바꿔 주세요. D-day만 바뀌고 주차 계획(9/28~4/25)은 그대로예요.</div>
   <input type="date" class="pdate" value="${P0.exam}" style="width:100%;font:15px inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)">
   <div class="s" style="margin-top:16px;font-weight:700">선택과목</div>
   <select class="pelec" style="width:100%;font:15px inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)">
     <option value="">미정 (12월 말 맛보기 후 확정)</option><option value="cl">상법(회사편)</option><option value="cv">민법총칙</option><option value="al">행정소송법</option></select>
   <div class="row"><button data-act="close">닫기</button><button class="pri" data-act="save">저장</button></div>`);
  sh.querySelector(".pelec").value=P0.elective||"";
  sh.querySelector('[data-act="close"]').onclick=closeSheet;
  sh.querySelector('[data-act="save"]').onclick=async()=>{const v=sh.querySelector(".pdate").value; if(v) P0.exam=v; P0.elective=sh.querySelector(".pelec").value||null; await save(); closeSheet(); renderPlan();};
}

/* ---- 화면 ---- */
const goLabel=t=>({cards:"카드",quiz:"테스트",review:"복습",backlog:"이어하기",weak:"복습",settings:"설정",try:"맛보기"}[t.act.t]||"열기");
function todayTab(tk){
  const dk=view.planDate, sel=pd(dk), isToday=dk===tk, P0=PL();
  const {W,tasks,wn}=tasksFor(sel);
  const head=`<div class="datenav"><button data-p="dprev" aria-label="전날">‹</button><div style="text-align:center"><b>${sel.getMonth()+1}월 ${sel.getDate()}일 (${WD[(sel.getDay()+6)%7]})</b>${isToday?"":`<div><button class="tl" data-p="dtoday">오늘로</button></div>`}</div><button data-p="dnext" aria-label="다음날">›</button></div>`;
  if(!W) return head+`<div class="wkban">이 날짜는 계획 기간(9/28~4/25) 밖이에요.</div>`;
  const ev=resolveSel(W.eve), th=W.try?null:resolveSel(W.th), en=new Date(weekStart(wn).getFullYear(),weekStart(wn).getMonth(),weekStart(wn).getDate()+6);
  const ban=`<div class="wkban"><b>W${wn} · ${fmtD(weekStart(wn))}–${fmtD(en)}${W.buffer?" · 예비주":""}</b><br>
    <span class="lb">저녁</span>${esc(selText(ev))}<br><span class="lb">이론</span>${W.try?"선택과목 맛보기":esc(selText(th))}<br><span class="lb">목표</span>${esc(autoGoal(W))}
    ${W.note?`<div class="note">${esc(W.note)}</div>`:""}</div>`;
  const busy=!!(P0.busy&&P0.busy[dk]);
  const rows=tasks.map((t,i)=>{
    const st=taskStatus(dk,t,tk), done=st===true;
    return `<div class="ptask${done?" done":""}${st===null&&!t.info?" exempt":""}${t.info?" info":""}" data-i="${i}">
      <span class="ck">${t.info?"":done?"✓":""}</span>
      <div style="flex:1;min-width:0"><div class="tm">${esc(t.time)}${t.auto?" · 자동 체크":""}${st===null&&!t.info?(P0.since&&dk<P0.since?" · 시작 전":" · 야근 모드로 건너뜀"):""}</div><div class="tt">${esc(t.title)}</div>${t.sub?`<div class="ss">${esc(t.sub)}</div>`:""}</div>
      ${t.act?`<button class="go" data-go="${i}">${goLabel(t)}</button>`:""}</div>`;
  }).join("");
  return head+ban+rows+`<button class="busy${busy?" on":""}" data-p="busy">${busy?"야근·약속 모드 켜짐 — 새 카드 10장만 하면 돼요":"오늘 야근·약속이에요 (최소 규칙으로)"}</button>`;
}
function weekTab(tk){
  const wn=clampW(view.planWeek||weekNo(pd(view.planDate))); view.planWeek=wn;
  const W=WEEKS[wn-1], st=weekStart(wn), en=new Date(st.getFullYear(),st.getMonth(),st.getDate()+6);
  const ev=resolveSel(W.eve), th=W.try?null:resolveSel(W.th);
  const bar=(r,lab)=>{const p=chapProg(r); return p?`<div class="ss" style="font-size:13px;margin-top:6px"><b>${lab}</b> ${esc(selText(r))}</div><div class="pb"><i style="width:${Math.round(p.d/p.t*100)}%"></i></div><span class="pbn">카드 ${p.d}/${p.t}</span>`:`<div class="ss" style="font-size:13px;margin-top:6px"><b>${lab}</b> ${W.try&&lab==="이론"?"선택과목 맛보기":esc(selText(r))}</div>`;};
  const wp=weekProgress(wn);
  const head=`<div class="datenav"><button data-p="wprev" aria-label="지난주">‹</button><div style="text-align:center"><b>W${wn} · ${fmtD(st)}–${fmtD(en)}</b><div class="pbn">${PHASES[W.ph]}${W.buffer?" · 예비주":""}${wp.pct!==null?" · 달성 "+wp.pct+"%":""}</div></div><button data-p="wnext" aria-label="다음주">›</button></div>`;
  const ban=`<div class="wkban">${bar(ev,"저녁")}${bar(th,"이론")}<div class="ss" style="font-size:13px;margin-top:8px"><b>목표</b> ${esc(autoGoal(W))}</div>${W.note?`<div class="note">${esc(W.note)}</div>`:""}</div>`;
  const rows=[0,1,2,3,4,5,6].map(i=>{
    const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i), dk=todayKey(d), {tasks}=tasksFor(d);
    const main=tasks.find(t=>/^(e1|s1|u1|f|x)$/.test(t.key))||tasks[0];
    let tot=0,dn=0; tasks.forEach(t=>{const s=taskStatus(dk,t,tk); if(s===null) return; tot++; if(s) dn++;});
    const past=dk<=tk, label=past?(tot===0?`<span class="st">–</span>`:dn===tot?`<span class="st ok">완료</span>`:`<span class="st">${dn}/${tot}</span>`):`<span class="st">예정</span>`;
    return `<button class="wrow${dk===tk?" today":""}" data-day="${dk}"><span class="dt"><b>${d.getDate()}</b>${WD[i]}</span><span class="tx">${main?esc(main.title):"학습지"}</span>${label}</button>`;
  }).join("");
  return head+ban+rows;
}
function monthTab(tk){
  const wnT=weekNo(pd(tk));
  const out=MONTHS.map(m=>{
    const cur=wnT>=m.w[0]&&wnT<=m.w[1]; let chips="";
    for(let w=m.w[0];w<=m.w[1];w++){
      const W=WEEKS[w-1], st=weekStart(w), en=new Date(st.getFullYear(),st.getMonth(),st.getDate()+6);
      const past=w<wnT, now=w===wnT, wp=(past||now)?weekProgress(w):null;
      chips+=`<button class="chip${W.buffer?" buf":""}${now?" now":""}${past&&wp&&wp.pct>=80?" ok":""}" data-w="${w}">W${w}${W.buffer?" 예비":""}<small>${fmtD(st)}–${fmtD(en)}${wp&&wp.pct!==null?" · "+wp.pct+"%":""}</small></button>`;
    }
    return `<div class="mcard${cur?" cur":""}"><h4>${m.name}<small>W${m.w[0]}–W${m.w[1]}</small></h4><div class="t">${esc(m.title)}</div><div class="g">목표: ${esc(m.goal)}</div><div class="chips">${chips}</div></div>`;
  }).join("");
  const phases=`<div class="phase"><b>단계별 흐름</b><br>1단계 기본 1회독 (9/28~1/31) → 2단계 문제풀이 2회독 (2/1~3/14) → 3단계 기출·모의 (3/15~4/18) → 4단계 마무리 (4/19~시험일)<br>점선 칩은 <b>예비주</b> — 밀린 진도와 월말 점검에 써요.</div>`;
  return phases+out;
}
function renderPlan(){
  const tk=todayKey(), P0=PL(); view.planTab=view.planTab||"today"; view.planDate=view.planDate||tk;
  const wnT=clampW(weekNo(pd(tk))), WT=WEEKS[wnT-1];
  const ex=P0.exam.split("-").map(Number), t3=tk.split("-").map(Number);
  const dd=Math.round((Date.UTC(ex[0],ex[1]-1,ex[2])-Date.UTC(t3[0],t3[1]-1,t3[2]))/86400000);
  const wp=weekProgress(wnT), tab=view.planTab;
  const body=tab==="today"?todayTab(tk):tab==="week"?weekTab(tk):monthTab(tk);
  app.innerHTML=`
   <div class="crumb"><button data-p="back">‹ 목록</button><span class="where">학습 계획</span></div>
   <div class="plan-hero"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div><div class="dd">${dd>0?"D-"+dd:dd===0?"D-DAY":"D+"+(-dd)}</div><div class="meta">W${wnT}/${PLAN_TOTAL} · ${PHASES[WT.ph]}${WT.buffer?" · 예비주":""}</div></div><button class="hset" data-p="set">시험일·선택과목</button></div>
     <div class="meta" style="margin-top:10px">이번 주 달성 ${wp.pct===null?"–":wp.pct+"%"} · ${P0.elective?"선택 "+esc(subName(P0.elective)):"선택과목 미정"}</div><div class="bar"><i style="width:${wp.pct||0}%"></i></div></div>
   <div class="seg"><button data-tab="today" class="${tab==="today"?"on":""}">오늘</button><button data-tab="week" class="${tab==="week"?"on":""}">주간</button><button data-tab="month" class="${tab==="month"?"on":""}">월간</button></div>
   <div class="pbody">${body}</div>`;
  const q=s=>app.querySelector(s), qa=s=>app.querySelectorAll(s);
  q('[data-p="back"]').onclick=()=>{view.screen="list";render();};
  q('[data-p="set"]').onclick=openPlanSettings;
  qa("[data-tab]").forEach(b=>b.onclick=()=>{view.planTab=b.dataset.tab; if(view.planTab==="week") view.planWeek=clampW(weekNo(pd(view.planDate))); renderPlan();});
  const shift=n=>{const d=pd(view.planDate); d.setDate(d.getDate()+n); view.planDate=todayKey(d); renderPlan();};
  const bind=(sel,fn)=>{const e=q(sel); if(e) e.onclick=fn;};
  bind('[data-p="dprev"]',()=>shift(-1)); bind('[data-p="dnext"]',()=>shift(1)); bind('[data-p="dtoday"]',()=>{view.planDate=tk;renderPlan();});
  bind('[data-p="wprev"]',()=>{view.planWeek=clampW(view.planWeek-1);renderPlan();}); bind('[data-p="wnext"]',()=>{view.planWeek=clampW(view.planWeek+1);renderPlan();});
  bind('[data-p="busy"]',async()=>{P0.busy=P0.busy||{}; if(P0.busy[view.planDate]) delete P0.busy[view.planDate]; else P0.busy[view.planDate]=1; await save(); renderPlan();});
  qa("[data-day]").forEach(b=>b.onclick=()=>{view.planDate=b.dataset.day; view.planTab="today"; renderPlan();});
  qa("[data-w]").forEach(b=>b.onclick=()=>{view.planWeek=+b.dataset.w; view.planTab="week"; renderPlan();});
  if(tab==="today"){
    const list=tasksFor(pd(view.planDate)).tasks;
    qa(".ptask").forEach(row=>row.onclick=async e=>{
      if(e.target.closest(".go")) return; const t=list[+row.dataset.i]; if(!t||t.auto||t.info) return;
      P0.done=P0.done||{}; const k=view.planDate+"|"+t.key; if(P0.done[k]) delete P0.done[k]; else P0.done[k]=1; await save(); renderPlan();});
    qa("[data-go]").forEach(b=>b.onclick=e=>{e.stopPropagation(); runAct(list[+b.dataset.go].act);});
  }
  window.scrollTo(0,0);
}

(async()=>{ await load(); render(); })();
</script>
</body>
</html>
